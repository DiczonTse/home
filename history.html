<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡迪遜網頁版本更新 v3.2 - 多標籤支援</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS Variables (Light & Dark) ===== */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --bg-timeline-line: linear-gradient(to bottom, #3498db, #2c3e50);
            --text-primary: #2c3e50;
            --text-secondary: #555555;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
            --shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.12);
            --input-bg: #f8f9fa;
            --input-border: #ddd;
            --modal-overlay: rgba(0, 0, 0, 0.5);
            --tag-bg: #f1f8ff;
            --tag-color: #3498db;
            --current-indicator-bg: rgba(52, 152, 219, 0.08);
            --btn-primary: #3498db;
            --btn-primary-hover: #2980b9;
            --btn-danger: #e74c3c;
            --btn-danger-hover: #c0392b;
            --transition: 0.3s ease;
            --radius: 12px;
            --font: 'Noto Sans SC', sans-serif;
        }

        [data-theme="dark"] {
            --bg-body: #1a1d23;
            --bg-card: #252a32;
            --bg-header: #1e2229;
            --bg-timeline-line: linear-gradient(to bottom, #4a9eff, #6c5ce7);
            --text-primary: #e8edf5;
            --text-secondary: #b0b8c4;
            --text-muted: #8892a0;
            --border-color: #3a4050;
            --shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.5);
            --input-bg: #2d3440;
            --input-border: #4a5260;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --tag-bg: #1e2a3a;
            --tag-color: #5b9aff;
            --current-indicator-bg: rgba(74, 158, 255, 0.12);
            --btn-primary: #4a9eff;
            --btn-primary-hover: #6aafff;
            --btn-danger: #e74c3c;
            --btn-danger-hover: #ff6b5a;
        }

        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: background-color var(--transition), color var(--transition);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ===== Header ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px 24px;
            background: var(--bg-header);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            transition: background var(--transition), box-shadow var(--transition);
        }

        .header-left h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-primary);
            transition: color var(--transition);
        }
        .header-left h1 a {
            text-decoration: none;
            color: inherit;
        }
        .header-left .sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== Buttons ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            background: var(--input-bg);
            color: var(--text-primary);
            border: 2px solid var(--input-border);
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--btn-primary);
            color: #fff;
            border-color: var(--btn-primary);
        }
        .btn-primary:hover {
            background: var(--btn-primary-hover);
            border-color: var(--btn-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
        .btn-danger {
            background: var(--btn-danger);
            color: #fff;
            border-color: var(--btn-danger);
        }
        .btn-danger:hover {
            background: var(--btn-danger-hover);
            border-color: var(--btn-danger-hover);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--input-border);
            color: var(--text-primary);
        }
        .btn-outline:hover {
            background: var(--input-bg);
            border-color: var(--text-muted);
        }
        .btn-outline-danger {
            background: transparent;
            border: 2px solid var(--btn-danger);
            color: var(--btn-danger);
        }
        .btn-outline-danger:hover {
            background: var(--btn-danger);
            color: #fff;
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 0.78rem;
        }

        /* ===== Theme Toggle ===== */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 40px;
            padding: 4px 12px 4px 16px;
            cursor: pointer;
            transition: background var(--transition), border var(--transition);
            font-size: 0.85rem;
            color: var(--text-primary);
            font-weight: 500;
            user-select: none;
        }
        .theme-toggle i {
            font-size: 1rem;
        }
        .theme-toggle .toggle-track {
            width: 36px;
            height: 20px;
            background: var(--border-color);
            border-radius: 40px;
            position: relative;
            transition: background var(--transition);
            flex-shrink: 0;
        }
        .theme-toggle .toggle-track::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: transform var(--transition), background var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        [data-theme="dark"] .theme-toggle .toggle-track {
            background: #4a9eff;
        }
        [data-theme="dark"] .theme-toggle .toggle-track::after {
            transform: translateX(16px);
            background: #fff;
        }

        /* ===== Stats Bar ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 32px;
            padding: 10px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            transition: background var(--transition), box-shadow var(--transition);
            align-items: center;
        }
        .stats-bar .stat {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .stats-bar .stat strong {
            color: var(--text-primary);
            font-weight: 700;
        }
        .stats-bar .stat i {
            margin-right: 6px;
            color: var(--btn-primary);
        }

        /* ===== Controls ===== */
        .controls-top {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .filter-btn {
            padding: 5px 14px;
            border-radius: 40px;
            border: 2px solid var(--input-border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }
        .filter-btn:hover {
            background: var(--input-bg);
            border-color: var(--btn-primary);
            color: var(--btn-primary);
        }
        .filter-btn.active {
            background: var(--btn-primary);
            color: #fff;
            border-color: var(--btn-primary);
        }
        .filter-btn .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            padding: 0 8px;
            font-size: 0.65rem;
            margin-left: 4px;
        }
        .filter-btn.active .badge {
            background: rgba(255, 255, 255, 0.3);
        }

        .controls-right {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-wrap: wrap;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            background: var(--input-bg);
            border-radius: 40px;
            padding: 4px;
            border: 2px solid var(--input-border);
        }
        .view-toggle button {
            background: transparent;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .view-toggle button.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .view-toggle button:hover:not(.active) {
            color: var(--text-primary);
        }

        /* ===== Timeline ===== */
        .timeline-container {
            position: relative;
            padding: 12px 0 12px 40px;
        }
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 16px;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--bg-timeline-line);
            border-radius: 4px;
            transition: background var(--transition);
        }

        .timeline-item {
            display: flex;
            padding-left: 32px;
            position: relative;
            margin-bottom: 18px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }
        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 18px;
            width: 18px;
            height: 18px;
            background: var(--bg-card);
            border: 4px solid #3498db;
            border-radius: 50%;
            z-index: 1;
            transition: background var(--transition), border-color var(--transition);
        }

        /* 颜色根据第一个标签决定 */
        .timeline-item[data-primary-tag="launch"]::before { border-color: #2ecc71; }
        .timeline-item[data-primary-tag="design"]::before { border-color: #e67e22; }
        .timeline-item[data-primary-tag="feature"]::before { border-color: #9b59b6; }
        .timeline-item[data-primary-tag="growth"], [data-primary-tag="cafe"]::before { border-color: #e74c3c; }
        .timeline-item[data-primary-tag="dice"]::before { border-color: #1abc9c; }
        .timeline-item[data-primary-tag="cafe"]::before { border-color: #e91e63; }
        .timeline-item[data-primary-tag="game"]::before { border-color: #f39c12; }
        .timeline-item[data-primary-tag="tool"]::before { border-color: #1abc9c; }
        .timeline-item[data-primary-tag=""]::before { border-color: #3498db; }

        .timeline-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 18px;
            box-shadow: var(--shadow);
            width: 100%;
            transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
            position: relative;
        }
        .timeline-content:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .timeline-content .date {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--btn-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .timeline-content .title {
            font-size: 1.0rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .timeline-content .desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-bottom: 8px;
        }
        .timeline-content .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }
        /* ---- 多标签显示 ---- */
        .timeline-content .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
        }
        .timeline-content .tag-item {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-color);
            padding: 1px 12px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 600;
            transition: background var(--transition), color var(--transition);
            cursor: default;
        }
        .timeline-content .tag-item i {
            margin-right: 3px;
            font-size: 0.6rem;
        }
        /* ---- 里程碑 ---- */
        .timeline-content .milestone-tag {
            display: inline-block;
            background: var(--tag-bg);
            color: #e67e22;
            padding: 1px 12px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 600;
            border: 1px solid #e67e2244;
            transition: background var(--transition), color var(--transition);
        }
        .timeline-content .milestone-tag i {
            margin-right: 3px;
        }

        .timeline-content .actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }
        .timeline-content .actions .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all var(--transition);
            font-size: 0.85rem;
        }
        .timeline-content .actions .btn-icon:hover {
            background: var(--input-bg);
            color: var(--text-primary);
        }
        .timeline-content .actions .btn-icon.danger:hover {
            color: var(--btn-danger);
        }

        /* ===== Compact mode ===== */
        .compact .timeline-item {
            margin-bottom: 10px;
        }
        .compact .timeline-content {
            padding: 10px 14px;
        }
        .compact .timeline-content .title {
            font-size: 0.88rem;
        }
        .compact .timeline-content .desc {
            font-size: 0.78rem;
            margin-bottom: 4px;
        }
        .compact .timeline-content .date {
            font-size: 0.72rem;
        }
        .compact .timeline-content .tag-item {
            font-size: 0.62rem;
            padding: 0 10px;
        }
        .compact .timeline-content .milestone-tag {
            font-size: 0.62rem;
            padding: 0 10px;
        }
        .compact .timeline-item::before {
            width: 14px;
            height: 14px;
            left: -10px;
            top: 14px;
            border-width: 3px;
        }
        .compact .timeline-container {
            padding-left: 30px;
        }
        .compact .timeline-container::before {
            left: 10px;
            width: 3px;
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: background var(--transition);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal h2 {
            font-size: 1.4rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        .modal .sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .modal .form-group input,
        .modal .form-group textarea,
        .modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 0.9rem;
            transition: border var(--transition), background var(--transition), color var(--transition);
        }
        .modal .form-group input:focus,
        .modal .form-group textarea:focus,
        .modal .form-group select:focus {
            outline: none;
            border-color: var(--btn-primary);
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .modal .form-row .form-group {
            flex: 1;
            min-width: 120px;
        }

        /* ---- 多标签复选框 ---- */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            padding: 8px 12px;
            background: var(--input-bg);
            border-radius: 8px;
            border: 2px solid var(--input-border);
            transition: border var(--transition), background var(--transition);
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color var(--transition);
            user-select: none;
        }
        .checkbox-group label:hover {
            color: var(--text-primary);
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--btn-primary);
            cursor: pointer;
            flex-shrink: 0;
        }
        .checkbox-group label.checked {
            color: var(--btn-primary);
        }

        .modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 2px solid var(--input-border);
        }

        /* ===== Footer ===== */
        footer {
            text-align: center;
            padding: 20px 0 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 2px solid var(--input-border);
            margin-top: 24px;
            transition: border var(--transition);
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
                padding: 14px 16px;
            }
            .header-left h1 {
                font-size: 1.3rem;
            }
            .header-actions {
                justify-content: flex-start;
                gap: 8px;
            }
            .btn {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .controls-top {
                flex-direction: column;
                align-items: stretch;
            }
            .controls-right {
                margin-left: 0;
                justify-content: flex-start;
            }
            .filter-group {
                gap: 4px;
            }
            .filter-btn {
                font-size: 0.68rem;
                padding: 4px 10px;
            }
            .timeline-container {
                padding-left: 28px;
            }
            .timeline-item {
                padding-left: 22px;
            }
            .timeline-item::before {
                width: 14px;
                height: 14px;
                left: -8px;
                top: 16px;
                border-width: 3px;
            }
            .timeline-content {
                padding: 12px 14px;
            }
            .timeline-content .title {
                font-size: 0.9rem;
            }
            .modal {
                padding: 20px 16px;
            }
            .checkbox-group {
                gap: 6px 10px;
                padding: 6px 10px;
            }
            .checkbox-group label {
                font-size: 0.75rem;
            }
            .compact .timeline-container {
                padding-left: 22px;
            }
            .compact .timeline-item {
                padding-left: 16px;
            }
            .compact .timeline-item::before {
                width: 10px;
                height: 10px;
                left: -6px;
                top: 12px;
                border-width: 2px;
            }
            .stats-bar {
                flex-direction: column;
                gap: 6px;
                padding: 10px 14px;
            }
            .theme-toggle {
                font-size: 0.75rem;
                padding: 4px 10px 4px 14px;
            }
            .theme-toggle .toggle-track {
                width: 30px;
                height: 18px;
            }
            .theme-toggle .toggle-track::after {
                width: 14px;
                height: 14px;
            }
            [data-theme="dark"] .theme-toggle .toggle-track::after {
                transform: translateX(12px);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .filter-btn {
                font-size: 0.6rem;
                padding: 3px 8px;
            }
            .header-left h1 {
                font-size: 1.1rem;
            }
            .btn {
                font-size: 0.68rem;
                padding: 4px 10px;
                gap: 4px;
            }
            .btn-sm {
                padding: 3px 8px;
                font-size: 0.65rem;
            }
            .checkbox-group label {
                font-size: 0.7rem;
            }
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-left">
            <h1><a href="index.html">💡迪遜網頁版本更新</a></h1>
            <div class="sub">📌 多標籤管理 · 一覽無遺 · 深色護眼</div>

    // ============================================================

    const STORAGE_KEY = 'diczon_updates_data_v32';

	function parseDateToNumber(dateStr) {
		const match = dateStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
		if (match) {
			const y = parseInt(match[1]);
			const m = String(parseInt(match[2])).padStart(2, '0');
			const d = String(parseInt(match[3])).padStart(2, '0');
			return parseInt(`${y}${m}${d}`);
		}
		return 0;
	}

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    // 資料遷移：若舊格式只有 category，轉為 tags 陣列
                    const migrated = parsed.map(item => {
                        if (item.category && !item.tags) {
                            return { ...item, tags: [item.category], category: undefined };
                        }
                        if (!item.tags || !Array.isArray(item.tags)) {
                            return { ...item, tags: [] };
                        }
                        return { ...item };
                    });
                    return migrated;
                }
            }
        } catch (_) { /* ignore */ }

        // 首次使用，保存預設數據
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
        return DEFAULT_DATA.map(item => ({ ...item }));
    }

    function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ============================================================
    //  格式化壓縮匯出
    // ============================================================
    function formatCompact(data, indent = 2) {
        const space = ' '.repeat(indent);

        function stringify(value, depth) {
            const currentIndent = space.repeat(depth);
            const nextIndent = space.repeat(depth + 1);

            if (value === null) return 'null';
            if (typeof value === 'boolean') return value ? 'true' : 'false';
            if (typeof value === 'number') return String(value);
            if (typeof value === 'string') return JSON.stringify(value);

            if (Array.isArray(value)) {
                if (value.length === 0) return '[]';
                const items = value.map(item => stringify(item, depth + 1));
                const isSimple = value.every(item => typeof item !== 'object' || item === null);
                if (isSimple) {
                    return '[' + items.join(', ') + ']';
                } else {
                    return '[\n' + items.join(', ') + '\n' + currentIndent + ']';
                }
            }

            if (typeof value === 'object') {
                const keys = Object.keys(value);
                if (keys.length === 0) return '{}';
                const pairs = keys.map(key => {
                    const valStr = stringify(value[key], depth + 1);
                    return `${nextIndent}"${key}": ${valStr}`;
                });
                return '{\n' + pairs.join(',\n') + '\n' + currentIndent + '}';
            }

            return String(value);
        }

        return stringify(data, 0);
    }

    // ============================================================
    //  RENDER
    // ============================================================
    function render() {
        let filtered = updates;
        if (currentFilter !== 'all') {
            // 篩選：包含該標籤的資料
            filtered = updates.filter(item => item.tags && item.tags.includes(currentFilter));
        }

        const sorted = [...filtered].sort((a, b) => {
			const da = parseDateToNumber(a.date);
			const db = parseDateToNumber(b.date);
			return isReversed ? db - da : da - db;
		});

        container.innerHTML = '';
        if (sorted.length === 0) {
            container.innerHTML =
                `<div style="padding:40px;text-align:center;color:var(--text-muted);background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);">
                        <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:12px;"></i>
                        目前沒有更新紀錄，點擊「新增更新」來添加第一筆！
                    </div>`;
        } else {
            sorted.forEach((item) => {
                const realIndex = updates.indexOf(item);
                const primaryTag = (item.tags && item.tags.length > 0) ? item.tags[0] : '';
                const div = document.createElement('div');
                div.className = `timeline-item visible`;
                div.dataset.primaryTag = primaryTag;
                div.dataset.category = primaryTag;

                // 建立標籤 HTML
                let tagsHtml = '';
                if (item.tags && item.tags.length > 0) {
                    const tagItems = item.tags.map(tid => {
                        const icon = TAG_ICON_MAP[tid] || '🏷️';
                        const label = TAG_LABEL_MAP[tid] || tid;
                        return `<span class="tag-item"><i class="fas fa-tag"></i>${icon} ${label}</span>`;
                    }).join('');
                    tagsHtml = `<div class="tag-list">${tagItems}</div>`;
                }

                // 里程碑
                let milestoneHtml = '';
                if (item.milestone) {
                    milestoneHtml =
                        `<span class="milestone-tag"><i class="fas fa-flag"></i> ${item.milestone}</span>`;
                }

                div.innerHTML = `
                        <div class="timeline-content">
                            <div class="date"><i class="fas fa-calendar-alt"></i> ${item.date}</div>
                            <div class="title">${item.title}</div>
                            <div class="desc">${item.description}</div>
                            <div class="meta">
                                ${tagsHtml}
                                ${milestoneHtml}
                                <div class="actions">
                                    <button class="btn-icon" data-action="edit" data-index="${realIndex}" title="編輯"><i class="fas fa-edit"></i></button>
                                    <button class="btn-icon danger" data-action="delete" data-index="${realIndex}" title="刪除"><i class="fas fa-trash-alt"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                container.appendChild(div);
            });
        }

        updateStats();
        updateBadges();

        container.querySelectorAll('[data-action="edit"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = parseInt(this.dataset.index);
                openEditModal(idx);
            });
        });
        container.querySelectorAll('[data-action="delete"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = parseInt(this.dataset.index);
                if (confirm(`確定要刪除「${updates[idx].title}」嗎？`)) {
                    updates.splice(idx, 1);
                    saveData(updates);
                    render();
                }
            });
        });

        if (isCompact) {
            container.closest('.container')?.classList.add('compact');
        } else {
            container.closest('.container')?.classList.remove('compact');
        }
    }

    function updateStats() {
        totalCount.textContent = updates.length;
        // 計算所有出現過的標籤種類
        const allTags = new Set();
        updates.forEach(item => {
            if (item.tags) item.tags.forEach(t => allTags.add(t));
        });
        tagCount.textContent = allTags.size;
        if (updates.length > 0) {
			const sorted = [...updates].sort((a, b) => parseDateToNumber(a.date) - parseDateToNumber(b.date));
			latestDate.textContent = sorted[sorted.length - 1].date || '—';
		} else {
            latestDate.textContent = '—';
        }
    }

    function updateBadges() {
        const counts = {};
        updates.forEach(item => {
            if (item.tags) {
                item.tags.forEach(t => {
                    counts[t] = (counts[t] || 0) + 1;
                });
            }
        });
        counts.all = updates.length;
        for (const [key, id] of Object.entries(badgeIds)) {
            const el = document.getElementById(id);
            if (el) el.textContent = counts[key] || 0;
        }
    }

            viewBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            isCompact = this.dataset.view === 'compact';
            render();
        });
    });

    // ============================================================
    //  SORT
    // ============================================================
    sortBtn.addEventListener('click', function() {
        isReversed = !isReversed;
        sortLabel.textContent = isReversed ? '最新優先' : '最早優先';
        this.querySelector('i').className = isReversed ? 'fas fa-sort-amount-down' : 'fas fa-sort-amount-up';
        render();
    });

    // ============================================================
    //  MODAL
    // ============================================================
    function openModal(title, sub, data, index) {
        modalTitle.textContent = title;
        modalSub.textContent = sub;
        editIndexInput.value = index !== undefined ? index : -1;

        // 先渲染複選框
        renderTagCheckboxes(data && data.tags ? data.tags : []);

        if (data) {
            document.getElementById('inputDate').value = data.date || '';
            document.getElementById('inputTitle').value = data.title || '';
            document.getElementById('inputDesc').value = data.description || '';
            document.getElementById('inputMilestone').value = data.milestone || '';
            if (data.tags) setSelectedTags(data.tags);
            btnSubmit.textContent = '💾 更新';
        } else {
            document.getElementById('inputDate').value = new Date().toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputMilestone').value = '新增功能';
            setSelectedTags([]);
            btnSubmit.textContent = '💾 儲存更新';
        }
        modalOverlay.classList.add('open');
    }

    function closeModal() {
        modalOverlay.classList.remove('open');
    }

    function openEditModal(index) {
        const item = updates[index];
        if (!item) return;
        openModal('✏️ 編輯更新', '修改這筆更新紀錄（可調整多個標籤）', item, index);
    }

    btnAdd.addEventListener('click', function() {
        openModal('📝 新增更新', '填寫以下資料，新增一筆更新紀錄（可選多個標籤）', null);
    });

    btnCancel.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const date = document.getElementById('inputDate').value.trim();
        const title = document.getElementById('inputTitle').value.trim();
        const description = document.getElementById('inputDesc').value.trim();
        const milestone = document.getElementById('inputMilestone').value.trim() || '里程碑';
        const tags = getSelectedTags();
        const index = parseInt(editIndexInput.value);

        if (!title) { alert('請輸入標題'); return; }
        if (!date) { alert('請輸入日期'); return; }
        if (tags.length === 0) { alert('請至少選擇一個標籤'); return; }

        const newItem = { date, title, description, tags, milestone };

        if (index >= 0 && index < updates.length) {
            updates[index] = newItem;
        } else {
            updates.push(newItem);
        }

        saveData(updates);
        closeModal();
        render();
    });

    // ============================================================
    //  EXPORT TXT
    // ============================================================
    btnExport.addEventListener('click', function() {
        if (updates.length === 0) {
            alert('目前沒有任何更新紀錄可匯出。');
            return;
        }
        const result = formatCompact(updates, 2);
        const blob = new Blob([result], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        const now = new Date();
        const dateStr =
            `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        link.download = `diczon_updates_${dateStr}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    });

    // ============================================================
    //  CLEAR DATA
    // ============================================================
    btnClear.addEventListener('click', function() {
        if (updates.length === 0) {
            alert('目前已經是空狀態，無需清除。');
            return;
        }
        const confirmMsg =
            '⚠️ 確定要清除所有瀏覽器儲存的更新紀錄嗎？\n\n此操作將會：\n• 刪除所有您透過「新增更新」加入的紀錄\n• 恢復為初始預設數據\n• 此操作無法復原！\n\n確定繼續？';
        if (!confirm(confirmMsg)) return;

        updates = DEFAULT_DATA.map(item => ({ ...item }));
        saveData(updates);
        currentFilter = 'all';
        filterBtns.forEach(b => b.classList.remove('active'));
        document.querySelector('.filter-btn[data-filter="all"]')?.classList.add('active');
        render();
        alert('✅ 已清除所有自訂紀錄，恢復為初始數據。');
    });

    // ============================================================
    //  THEME
    // ============================================================
    function getPreferredTheme() {
        const stored = localStorage.getItem('diczon_theme');
        if (stored === 'dark' || stored === 'light') return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('diczon_theme', theme);
    }

    themeToggle.addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        setTheme(current === 'dark' ? 'light' : 'dark');
    });

    setTheme(getPreferredTheme());

    // ============================================================
    //  INIT
    // ============================================================
    render();

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    console.log('💡 迪遜網頁版本更新 v3.2 載入完成！（支援多標籤）');
    console.log(`📦 共有 ${updates.length} 筆更新紀錄`);
    const allTags = new Set();
    updates.forEach(item => { if (item.tags) item.tags.forEach(t => allTags.add(t)); });
    console.log('🏷️ 標籤種類:', [...allTags].join(', '));
    console.log('💡 每筆資料可選擇多個標籤，點擊過濾按鈕可篩選。');
</script>
</body>
