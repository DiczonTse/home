<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📥 YouTube 預覽圖下載</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .youtube-wrapper {
            width: 100%;
            max-width: 800px;
        }
        .url-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        #youtube-url {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        #fetch-btn {
            padding: 12px 20px;
            background: var(--button-bg);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #fetch-btn:hover {
            background: var(--button-hover);
        }
        .examples {
            font-size: 0.9em;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 15px;
        }
        .error-message {
            display: none;
            background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid var(--close-btn-bg);
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            color: var(--text-color);
        }
        .thumbnails-section {
            display: none;
            margin-top: 20px;
        }
        .section-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: var(--button-bg);
            text-align: center;
        }
        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .thumbnail-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: transform 0.2s;
        }
        .thumbnail-card:hover {
            transform: translateY(-2px);
        }
        .thumbnail-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }
        .thumbnail-info {
            padding: 10px;
        }
        .thumbnail-quality {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--button-bg);
            font-size: 0.9em;
        }
        .thumbnail-dimensions {
            font-size: 0.8em;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 10px;
        }
        .download-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background: var(--utility-bg);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.9em;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            text-align: center;
        }
        .download-btn:hover {
            background: #1565C0;
        }
    </style>
</head>
<body>
    <div class="youtube-wrapper">
        <h2 style="text-align:center; color: var(--text-color);">📥 YouTube 預覽圖下載</h2>
        <div class="url-input-container">
            <input type="text" id="youtube-url" placeholder="貼上 YouTube 影片網址...">
            <button id="fetch-btn" onclick="fetchYoutubeThumbnails()">預覽圖下載</button>
        </div>
        <p class="examples">例子：https://www.youtube.com/watch?v=VIDEO_ID 或 https://youtu.be/VIDEO_ID</p>
        <div id="error-message" class="error-message">地址有問題！</div>
        
        <div id="thumbnails-section" class="thumbnails-section">
            <h3 class="section-title">可供下載預覽圖</h3>
            <div id="thumbnails-grid" class="thumbnails-grid"></div>
        </div>
    </div>

    <script>
        // YouTube 缩略图下载逻辑
        function fetchYoutubeThumbnails() {
            const youtubeUrl = document.getElementById('youtube-url').value.trim();
            const videoId = extractVideoId(youtubeUrl);
            const errorMessage = document.getElementById('error-message');
            const thumbnailsSection = document.getElementById('thumbnails-section');
            const thumbnailsGrid = document.getElementById('thumbnails-grid');

            if (videoId) {
                errorMessage.style.display = 'none';
                displayThumbnails(videoId);
            } else {
                errorMessage.style.display = 'block';
                thumbnailsSection.style.display = 'none';
            }
        }

        function extractVideoId(url) {
            // 匹配各种 YouTube 链接格式
            const regExp1 = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const regExp2 = /^.*(youtube.com\/shorts\/)([^#\&\?]*).*/;
            let match = url.match(regExp1);
            if (match && match[2].length === 11) return match[2];
            match = url.match(regExp2);
            if (match && match[2].length === 11) return match[2];
            return null;
        }

        function displayThumbnails(videoId) {
            const thumbnailsGrid = document.getElementById('thumbnails-grid');
            thumbnailsGrid.innerHTML = '';
            
            const thumbnailQualities = [
                { quality: 'Max Resolution', suffix: 'maxresdefault', width: 1280, height: 720 },
                { quality: 'High Quality', suffix: 'hqdefault', width: 480, height: 360 },
                { quality: 'Medium Quality', suffix: 'mqdefault', width: 320, height: 180 },
                { quality: 'Standard Definition', suffix: 'sddefault', width: 640, height: 480 },
                { quality: 'Default', suffix: 'default', width: 120, height: 90 }
            ];
            
            thumbnailQualities.forEach(quality => {
                const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/${quality.suffix}.jpg`;
                const card = document.createElement('div');
                card.className = 'thumbnail-card';
                card.innerHTML = `
                    <img src="${thumbnailUrl}" alt="${quality.quality} thumbnail" class="thumbnail-img" onerror="this.style.display='none'">
                    <div class="thumbnail-info">
                        <div class="thumbnail-quality">${quality.quality}</div>
                        <div class="thumbnail-dimensions">${quality.width} × ${quality.height} pixels</div>
                        <a href="${thumbnailUrl}" target="_blank" class="download-btn">下載</a>
                    </div>
                `;
                thumbnailsGrid.appendChild(card);
            });
            
            document.getElementById('thumbnails-section').style.display = 'block';
        }
    </script>
</body>
</html>
