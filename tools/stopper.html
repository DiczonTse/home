<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏱️ 秒錶</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .stopper-wrapper {
            width: 100%;
            max-width: 500px;
        }
        .stopper-container {
            text-align: center;
            margin: 20px 0;
        }
        .time-display {
            font-size: 2.5em;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
            color: var(--button-bg);
        }
        .stopper-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stopper-controls button {
            padding: 10px 20px;
            background: var(--button-bg);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .stopper-controls button:hover {
            background: var(--button-hover);
        }
        .lap-times {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            padding: 10px;
            background: var(--bg-color);
            border-radius: 4px;
            text-align: left;
        }
        .lap-time {
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="stopper-wrapper">
        <h2 style="text-align:center; color: var(--text-color);">⏱️ 秒錶</h2>
        <div class="stopper-container">
            <div class="time-display" id="stopperDisplay">00:00:00.000</div>
            <div class="stopper-controls">
                <button onclick="startStopper()">▶️ 開始</button>
                <button onclick="pauseStopper()">⏸️ 暫停</button>
                <button onclick="resetStopper()">⏹️ 重置</button>
                <button onclick="recordLap()">⏱️ 計圈</button>
            </div>
            <div class="lap-times" id="lapTimes"></div>
        </div>
    </div>

    <script>
        // 秒表逻辑
        let stopperInterval = null;
        let stopperMilliseconds = 0;
        let stopperSeconds = 0;
        let stopperMinutes = 0;
        let stopperHours = 0;
        let isStopperRunning = false;
        let lapTimes = [];
        let lastStopperTime = 0;

        function startStopper() {
            if (!isStopperRunning) {
                isStopperRunning = true;
                lastStopperTime = performance.now();
                stopperInterval = requestAnimationFrame(updateStopper);
            }
        }

        function pauseStopper() {
            isStopperRunning = false;
            if (stopperInterval) cancelAnimationFrame(stopperInterval);
        }

        function resetStopper() {
            isStopperRunning = false;
            if (stopperInterval) cancelAnimationFrame(stopperInterval);
            stopperHours = 0;
            stopperMinutes = 0;
            stopperSeconds = 0;
            stopperMilliseconds = 0;
            lapTimes = [];
            document.getElementById('stopperDisplay').textContent = '00:00:00.000';
            document.getElementById('lapTimes').innerHTML = '';
        }

        function updateStopper(timestamp) {
            if (!isStopperRunning) return;
            
            const elapsed = timestamp - lastStopperTime;
            lastStopperTime = timestamp;
            
            stopperMilliseconds += elapsed;
            
            if (stopperMilliseconds >= 1000) {
                stopperSeconds += Math.floor(stopperMilliseconds / 1000);
                stopperMilliseconds = stopperMilliseconds % 1000;
                
                if (stopperSeconds >= 60) {
                    stopperMinutes += Math.floor(stopperSeconds / 60);
                    stopperSeconds = stopperSeconds % 60;
                    
                    if (stopperMinutes >= 60) {
                        stopperHours += Math.floor(stopperMinutes / 60);
                        stopperMinutes = stopperMinutes % 60;
                    }
                }
            }
            
            const displayHours = String(stopperHours).padStart(2, '0');
            const displayMinutes = String(stopperMinutes).padStart(2, '0');
            const displaySeconds = String(stopperSeconds).padStart(2, '0');
            const displayMilliseconds = Math.floor(stopperMilliseconds).toString().padStart(3, '0');
            
            document.getElementById('stopperDisplay').textContent = 
                `${displayHours}:${displayMinutes}:${displaySeconds}.${displayMilliseconds}`;
            
            stopperInterval = requestAnimationFrame(updateStopper);
        }

        function recordLap() {
            if (isStopperRunning) {
                const lapTime = document.getElementById('stopperDisplay').textContent;
                lapTimes.push(lapTime);
                
                const lapTimesContainer = document.getElementById('lapTimes');
                const lapElement = document.createElement('div');
                lapElement.className = 'lap-time';
                lapElement.textContent = `圈 ${lapTimes.length}: ${lapTime}`;
                lapTimesContainer.prepend(lapElement);
            }
        }

        // 清理动画帧
        window.addEventListener('beforeunload', function() {
            if (stopperInterval) cancelAnimationFrame(stopperInterval);
        });
    </script>
</body>
</html>
