<title>我的書籤卡片</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: #e6ecf7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(99,102,241,.28), transparent 60%),
      radial-gradient(700px 500px at 96% 0%, rgba(139,92,246,.18), transparent 55%),
      #0b1020;
  }

  header { max-width: 1180px; margin: 0 auto; padding: 44px 20px 6px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
  .sub { margin: 8px 0 0; font-size: 14px; color: #93a1bb; }

  form { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

  #urlInput {
    flex: 1 1 280px;
    min-width: 0;
    padding: 14px 16px;
    font-size: 15px;
    color: #e6ecf7;
    background: #0f1626;
    border: 1px solid #26314d;
    border-radius: 12px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #urlInput::placeholder { color: #5c6b88; }
  #urlInput:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.22); }
  #urlInput.invalid {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239,68,68,.2);
    animation: shake .35s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  form button {
    padding: 14px 26px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 8px 20px -8px rgba(99,102,241,.9);
    transition: transform .15s, filter .15s;
  }
  form button:hover { filter: brightness(1.08); }
  form button:active { transform: scale(.97); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .tool-btn {
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: #e6ecf7;
    background: #0f1626;
    border: 1px solid #26314d;
    border-radius: 10px;
    cursor: pointer;
    transition: background .18s, border-color .18s, transform .12s;
  }
  .tool-btn:hover {
    background: #16203a;
    border-color: #6366f1;
  }
  .tool-btn:active { transform: scale(.97); }
  .tool-danger:hover {
    border-color: #ef4444;
    background: rgba(239,68,68,.12);
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px 20px 70px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
    align-content: start;
  }

  .empty {
    grid-column: 1 / -1;
    padding: 70px 20px;
    text-align: center;
    color: #93a1bb;
    font-size: 15px;
    line-height: 1.9;
    border: 1px dashed #26314d;
    border-radius: 18px;
  }

  .card {
    position: relative;
    display: block;
    aspect-ratio: 4 / 3;
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    background: #141b2d;
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: 0 10px 30px -14px rgba(0,0,0,.9);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(139,92,246,.55);
    box-shadow: 0 18px 40px -16px rgba(0,0,0,.95);
  }
  .card:active { transform: translateY(-1px) scale(.99); }

  .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1c2743 0%, #101728 60%, #0b1120 100%);
  }
  .ph::after {
    content: "";
    position: absolute;
    width: 150px; height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,.35), transparent 70%);
    filter: blur(8px);
  }

  .fav {
    position: relative;
    z-index: 1;
    width: 60px; height: 60px;
    padding: 8px;
    object-fit: contain;
    border-radius: 14px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }

  .fi {
    position: relative;
    z-index: 1;
    display: none;
    width: 56px; height: 56px;
    color: #7f8db0;
  }
  .fi.show { display: block; }

  .shade {
    position: absolute; inset: 0;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(to top,
      rgba(4,8,18,.92) 0%,
      rgba(4,8,18,.55) 32%,
      rgba(4,8,18,0) 62%);
  }
  .info {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    padding: 14px 16px;
    pointer-events: none;
  }
  .title {
    font-size: 15px; font-weight: 600; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 4px rgba(0,0,0,.85);
  }
  .host {
    margin-top: 3px;
    font-size: 12px;
    color: #b8c4dc;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 4px rgba(0,0,0,.85);
  }

  .del {
    position: absolute;
    top: 8px; right: 8px;
    z-index: 4;
    display: grid; place-items: center;
    width: 28px; height: 28px;
    font-size: 18px; line-height: 1;
    color: #fff;
    border-radius: 50%;
    background: rgba(10,14,26,.62);
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(6px);
    cursor: pointer;
    opacity: 0;
    transform: scale(.85);
    transition: opacity .18s, transform .18s, background .18s, border-color .18s;
  }
  .card:hover .del,
  .del:focus-visible { opacity: 1; transform: scale(1); }
  .del:hover { background: #ef4444; border-color: #ef4444; }

  @media (hover: none) {
    .del { opacity: 1; transform: scale(1); }
  }

  .card.flash { animation: flash .8s ease; }
  @keyframes flash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
    50%      { box-shadow: 0 0 0 4px rgba(99,102,241,.85); }
  }
</style>
</head>
<body>

<header>
  <h1>🗂️ 我的書籤</h1>
  <p class="sub">輸入網址後按「加入」，書籤會保存在這台瀏覽器。</p>

  <form id="addForm" autocomplete="off">
    <input id="urlInput" type="text" spellcheck="false"
           placeholder="例如：https://www.github.com" />
    <button type="submit">加入</button>
  </form>

  <div class="toolbar">
    <button type="button" id="btnExport" class="tool-btn">💾 儲存 .txt</button>
    <button type="button" id="btnImport" class="tool-btn">📂 載入 .txt</button>
    <button type="button" id="btnReset"  class="tool-btn tool-danger">🗑️ 重設</button>
    <input type="file" id="fileInput" accept=".txt,text/plain" hidden />
  </div>
</header>

<main id="grid"></main>

  var grid  = document.getElementById('grid');
  var form  = document.getElementById('addForm');
  var input = document.getElementById('urlInput');
  var btnExport = document.getElementById('btnExport');
  var btnImport = document.getElementById('btnImport');
  var btnReset  = document.getElementById('btnReset');
  var fileInput = document.getElementById('fileInput');

  var cards = [];

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function normalizeUrl(raw) {
    var s = (raw || '').trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s;
    var u;
    try { u = new URL(s); } catch (e) { return null; }
    if (!/^https?:$/.test(u.protocol)) return null;
    if (!u.hostname || u.hostname.indexOf('.') === -1) return null;
    return u.href;
  }

  /* ---------- localStorage ---------- */
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }

    if (raw === null) {
      cards = PRESET_URLS.map(function (u) {
        return { id: uid(), url: normalizeUrl(u) || u };
      });
      save();
      return;
    }

    var arr = [];
    try { arr = JSON.parse(raw); } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];

    cards = arr
      .filter(function (c) {
        return c && typeof c.url === 'string' && /^https?:\/\//i.test(c.url);
      })
      .map(function (c) {
        return { id: c.id || uid(), url: c.url };
      });
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); } catch (e) {}
  }

  /* ---------- 卡片 ---------- */
  function buildCard(item) {
    var urlObj = new URL(item.url);
    var host = urlObj.hostname;
    var displayHost = host.replace(/^www\./, '');

    var card = document.createElement('a');
    card.className = 'card';
    card.href = item.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.dataset.id = item.id;
    card.dataset.url = item.url;
    card.title = item.url;

    var ph = document.createElement('div');
    ph.className = 'ph';
    ph.innerHTML =
      '<img class="fav" alt="" referrerpolicy="no-referrer">' +
      '<svg class="fi" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>' +
      '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>' +
      '</svg>';
    var fav = ph.querySelector('.fav');
    var fi  = ph.querySelector('.fi');

    var shade = document.createElement('div');
    shade.className = 'shade';

    var info = document.createElement('div');
    info.className = 'info';
    var titleEl = document.createElement('div');
    titleEl.className = 'title';
    titleEl.textContent = displayHost;
    var hostEl = document.createElement('div');
    hostEl.className = 'host';
    hostEl.textContent = item.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    info.appendChild(titleEl);
    info.appendChild(hostEl);

    var del = document.createElement('span');
    del.className = 'del';
    del.setAttribute('role', 'button');
    del.setAttribute('tabindex', '0');
    del.setAttribute('aria-label', '刪除書籤');
    del.textContent = '×';

    function doDelete(e) {
      e.preventDefault();
      e.stopPropagation();
      removeCard(item.id);
    }
    del.addEventListener('click', doDelete);
    del.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') doDelete(e);
    });

    card.appendChild(ph);
    card.appendChild(shade);
    card.appendChild(info);
    card.appendChild(del);

    /* Favicon 三源備援，全失敗 → font icon */
    var favSources = [
      urlObj.origin + '/favicon.ico',
      'https://icons.duckduckgo.com/ip3/' + host + '.ico',
      'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=64'
    ];
    var favIdx = 0;

    function tryNextFav() {
      if (favIdx >= favSources.length) {
        fav.style.display = 'none';
        fi.classList.add('show');
        return;
      }
      fav.src = favSources[favIdx++];
    }

    fav.addEventListener('error', tryNextFav);
    tryNextFav();

    return card;
  }

  /* ---------- 渲染 ---------- */
  function showEmpty() {
    if (grid.querySelector('.empty')) return;
    var div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML =
      '還沒有任何書籤 🗂️<br>' +
      '<span style="font-size:13px;opacity:.75">在上方輸入網址，按「加入」開始收藏。</span>';
    grid.appendChild(div);
  }

  function addCardToDom(item, prepend) {
    var empty = grid.querySelector('.empty');
    if (empty) empty.remove();
    var el = buildCard(item);
    if (prepend) grid.prepend(el);
    else grid.appendChild(el);
  }

  function renderAll() {
    grid.innerHTML = '';
    if (!cards.length) { showEmpty(); return; }
    cards.forEach(function (c) { addCardToDom(c, false); });
  }

  function removeCard(id) {
    var idx = -1;
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].id === id) { idx = i; break; }
    }
    if (idx === -1) return;

    cards.splice(idx, 1);
    save();

    var el = grid.querySelector('.card[data-id="' + id + '"]');
    if (el) {
      el.style.transition = 'opacity .18s, transform .18s';
      el.style.opacity = '0';
      el.style.transform = 'scale(.92)';
      setTimeout(function () { el.remove(); }, 180);
    }

    if (!cards.length) setTimeout(showEmpty, 190);
  }

  /* ---------- 加入 ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var url = normalizeUrl(input.value);
    if (!url) {
      input.classList.remove('invalid');
      void input.offsetWidth;
      input.classList.add('invalid');
      input.focus();
      return;
    }
    input.classList.remove('invalid');

    var dup = null;
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].url === url) { dup = cards[i]; break; }
    }
    if (dup) {
      var el = grid.querySelector('.card[data-id="' + dup.id + '"]');
      if (el) {
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      input.value = '';
      return;
    }

    var item = { id: uid(), url: url };
    cards.unshift(item);
    save();
    addCardToDom(item, true);

    input.value = '';
    input.focus();
  });

  input.addEventListener('input', function () {
    input.classList.remove('invalid');
  });

  /* ---------- 儲存 .txt ---------- */
  btnExport.addEventListener('click', function () {
    if (!cards.length) { alert('目前沒有書籤可儲存。'); return; }
    var text = cards.map(function (c) { return c.url; }).join('\n') + '\n';
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });

    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var filename = 'bookmarks-' +
      d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' +
      pad(d.getHours()) + pad(d.getMinutes()) + '.txt';

    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  /* ---------- 載入 .txt ---------- */
  btnImport.addEventListener('click', function () {
    fileInput.click();
  });

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '');
      var lines = text.split(/\r?\n/);
      var seen = new Set();
      var list = [];

      for (var i = 0; i < lines.length; i++) {
        var raw = lines[i].trim();
        if (!raw) continue;
        var u = normalizeUrl(raw);
        if (!u || seen.has(u)) continue;
        seen.add(u);
        list.push({ id: uid(), url: u });
      }

      if (!list.length) {
        alert('檔案中沒有找到有效網址。');
        fileInput.value = '';
        return;
      }

      var msg = '將載入 ' + list.length + ' 個書籤';
      if (cards.length) msg += '，並取代目前的 ' + cards.length + ' 個書籤';
      msg += '。要繼續嗎？';
      if (!confirm(msg)) { fileInput.value = ''; return; }

      cards = list;
      save();
      renderAll();
      fileInput.value = '';
    };
    reader.onerror = function () {
      alert('讀取檔案失敗。');
      fileInput.value = '';
    };
    reader.readAsText(file, 'utf-8');
  });

  /* ---------- 重設 ---------- */
  btnReset.addEventListener('click', function () {
    if (!confirm('確定要清除所有書籤，並恢復為預設的 3 個網頁嗎？')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    cards = PRESET_URLS.map(function (u) {
      return { id: uid(), url: normalizeUrl(u) || u };
    });
    save();
    renderAll();
  });

  /* ---------- 啟動 ---------- */
  load();
  renderAll();
})();
</script>
