<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黃大仙靈籤</title>
    <style>
        /* ===== 全局重置與字體 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: '楷體', 'KaiTi', 'STKaiti', '華文楷體', 'Noto Serif SC', 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #3d1a0e 0%, #1a0a05 100%);
            padding: 20px;
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 560px;
            width: 100%;
            background: linear-gradient(145deg, #f7efe2 0%, #e8dccc 100%);
            border-radius: 48px 48px 32px 32px;
            padding: 30px 28px 40px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.8),
                0 0 0 2px #b8915c,
                0 0 0 6px #6b3f1e,
                inset 0 0 30px rgba(180, 120, 60, 0.2);
            position: relative;
            transition: all 0.3s;
        }

        /* ===== 裝飾邊角 ===== */
        .container::before,
        .container::after {
            content: '◆';
            position: absolute;
            font-size: 22px;
            color: #b8915c;
            text-shadow: 0 0 8px #d4a854;
        }
        .container::before {
            top: 12px;
            left: 24px;
        }
        .container::after {
            top: 12px;
            right: 24px;
        }

        /* ===== 頂部標題 ===== */
        .header {
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 3px double #b8915c;
            margin-bottom: 20px;
            position: relative;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 700;
            color: #4a1f0e;
            letter-spacing: 12px;
            text-shadow: 0 2px 4px rgba(180, 120, 60, 0.3);
            font-family: inherit;
        }
        .header .sub {
            font-size: 14px;
            color: #7a5a3a;
            letter-spacing: 6px;
            margin-top: 2px;
            font-style: italic;
        }
        .header .deco {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
            font-size: 18px;
            color: #b8915c;
        }

        /* ===== 籤筒區域 ===== */
        .lottery-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 6px;
            position: relative;
        }

        /* 籤筒容器 */
        .cylinder-wrapper {
            position: relative;
            width: 160px;
            height: 200px;
            margin: 0 auto 18px;
            perspective: 600px;
        }

        /* 籤筒本體 */
        .cylinder {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: bottom center;
            transition: transform 0.1s;
        }

        /* 搖晃動畫 */
        .cylinder.shake {
            animation: shakeCylinder 0.12s infinite alternate;
        }

        @keyframes shakeCylinder {
            0% {
                transform: rotateZ(-8deg) rotateX(2deg);
            }
            100% {
                transform: rotateZ(8deg) rotateX(-2deg);
            }
        }

        /* 籤筒身體 (無蓋，但用 clip-path 讓上部透明) */
        .cylinder-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 170px;
            background: radial-gradient(ellipse at 30% 20%, #c49a6c, #8b5e3c 70%, #5a341a);
            border-radius: 8px 8px 40px 40px;
            box-shadow:
                inset -8px -12px 30px rgba(0, 0, 0, 0.5),
                inset 8px 8px 30px rgba(255, 220, 160, 0.3),
                0 12px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid #6b3f1e;
            border-top: 4px solid #a87a4a;
            overflow: hidden;
            /* 關鍵：讓頂部透明，露出籤枝 */
            clip-path: inset(28px 0 0 0 round 0 0 40px 40px);
            z-index: 4;  /* 覆蓋籤枝 */
        }
        /* 籤筒紋理 */
        .cylinder-body::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 18px,
                    rgba(0, 0, 0, 0.06) 18px,
                    rgba(0, 0, 0, 0.06) 20px);
            border-radius: 50%;
        }
        .cylinder-body::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 10px;
            background: radial-gradient(ellipse, rgba(255, 200, 120, 0.25), transparent);
            border-radius: 50%;
            filter: blur(4px);
        }

        /* ===== 籤枝 (在筒內，露出上半部) ===== */
        .sticks-container {
            position: absolute;
            top: -20px;  /* 讓籤枝從筒口伸出 */
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 110px;
            z-index: 3;  /* 低於 .cylinder-body */
            pointer-events: none;
            overflow: visible;
        }

        .stick {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 10px;
            height: 80px;
            background: linear-gradient(180deg, #f5e6c8, #dbb48a 40%, #b8875a);
            border-radius: 2px 2px 4px 4px;
            transform-origin: bottom center;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.15), inset 0 2px 6px rgba(255, 220, 160, 0.3);
            border: 1px solid #a87a4a;
            transition: transform 0.3s;
        }
        .stick::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 6px;
            background: radial-gradient(ellipse, #f5e6c8, #dbb48a);
            border-radius: 50% 50% 0 0;
            border: 1px solid #a87a4a;
            border-bottom: none;
        }
        /* 不同籤枝的偏移 */
        .stick:nth-child(1) {
            transform: translateX(-32px) rotate(-6deg);
            height: 76px;
        }
        .stick:nth-child(2) {
            transform: translateX(-18px) rotate(-2deg);
            height: 82px;
        }
        .stick:nth-child(3) {
            transform: translateX(-4px) rotate(1deg);
            height: 78px;
        }
        .stick:nth-child(4) {
            transform: translateX(10px) rotate(4deg);
            height: 84px;
        }
        .stick:nth-child(5) {
            transform: translateX(24px) rotate(7deg);
            height: 74px;
        }
        .stick:nth-child(6) {
            transform: translateX(-26px) rotate(-9deg);
            height: 80px;
        }
        .stick:nth-child(7) {
            transform: translateX(16px) rotate(10deg);
            height: 72px;
        }
        .stick:nth-child(8) {
            transform: translateX(-8px) rotate(-4deg);
            height: 86px;
        }

        /* 搖晃時籤枝晃動 */
        .cylinder.shake .stick {
            animation: stickWiggle 0.15s infinite alternate;
        }
        @keyframes stickWiggle {
            0% {
                transform: var(--stick-transform, translateX(0)) rotate(var(--stick-rotate, 0deg));
            }
            100% {
                transform: var(--stick-transform, translateX(0)) rotate(var(--stick-rotate, 0deg) + 3deg);
            }
        }
        .stick:nth-child(1) {
            --stick-transform: translateX(-32px);
            --stick-rotate: -6deg;
        }
        .stick:nth-child(2) {
            --stick-transform: translateX(-18px);
            --stick-rotate: -2deg;
        }
        .stick:nth-child(3) {
            --stick-transform: translateX(-4px);
            --stick-rotate: 1deg;
        }
        .stick:nth-child(4) {
            --stick-transform: translateX(10px);
            --stick-rotate: 4deg;
        }
        .stick:nth-child(5) {
            --stick-transform: translateX(24px);
            --stick-rotate: 7deg;
        }
        .stick:nth-child(6) {
            --stick-transform: translateX(-26px);
            --stick-rotate: -9deg;
        }
        .stick:nth-child(7) {
            --stick-transform: translateX(16px);
            --stick-rotate: 10deg;
        }
        .stick:nth-child(8) {
            --stick-transform: translateX(-8px);
            --stick-rotate: -4deg;
        }

        /* ===== 飛出的籤枝 ===== */
        .flying-stick {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%) rotate(0deg) scale(1);
            width: 14px;
            height: 100px;
            background: linear-gradient(180deg, #f5e6c8, #dbb48a 40%, #b8875a);
            border-radius: 3px 3px 6px 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), inset 0 2px 8px rgba(255, 220, 160, 0.3);
            border: 1px solid #a87a4a;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: none;
        }
        .flying-stick::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 8px;
            background: radial-gradient(ellipse, #f5e6c8, #dbb48a);
            border-radius: 50% 50% 0 0;
            border: 1px solid #a87a4a;
            border-bottom: none;
        }
        .flying-stick.show {
            opacity: 1;
            animation: flyStick 0.9s cubic-bezier(0.22, 0.68, 0.35, 1.1) forwards;
        }
        @keyframes flyStick {
            0% {
                top: 10px;
                transform: translateX(-50%) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            30% {
                opacity: 1;
                transform: translateX(-50%) rotate(-15deg) scale(1.1);
            }
            60% {
                transform: translateX(-50%) rotate(8deg) scale(1);
            }
            100% {
                top: -80px;
                transform: translateX(-50%) rotate(-2deg) scale(1);
                opacity: 1;
            }
        }

        /* ===== 求籤按鈕 ===== */
        .btn-draw {
            position: relative;
            padding: 16px 48px;
            font-size: 24px;
            font-weight: 700;
            color: #f7efe2;
            background: linear-gradient(145deg, #b53b1a, #7a1f0a);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow:
                0 6px 0 #4a1206,
                0 12px 30px rgba(0, 0, 0, 0.4),
                inset 0 2px 8px rgba(255, 200, 120, 0.3);
            transition: all 0.08s linear;
            letter-spacing: 6px;
            font-family: inherit;
            margin-top: 6px;
            z-index: 5;
        }
        .btn-draw:hover:not(:disabled) {
            background: linear-gradient(145deg, #c9451e, #8a2610);
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #4a1206, 0 18px 40px rgba(0, 0, 0, 0.5);
        }
        .btn-draw:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4a1206, 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .btn-draw:disabled {
            opacity: 0.6;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4a1206, 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor: not-allowed;
        }
        .btn-draw .icon {
            display: inline-block;
            margin-right: 8px;
            font-size: 28px;
        }

        /* ===== 結果顯示區 ===== */
        .result-area {
            margin-top: 24px;
            padding: 0 4px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.22, 0.68, 0.35, 1.1);
            max-height: 0;
            overflow: hidden;
        }
        .result-area.show {
            opacity: 1;
            transform: translateY(0);
            max-height: 2000px;
            padding: 4px 4px 0;
        }

        .result-card {
            background: linear-gradient(160deg, #fcf6ed, #efe4d4);
            border-radius: 24px;
            padding: 24px 22px 28px;
            border: 2px solid #b8915c;
            box-shadow: inset 0 0 30px rgba(180, 120, 60, 0.1), 0 8px 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .result-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            right: 20%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #d4a854, transparent);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* 籤號 */
        .result-number {
            text-align: center;
            font-size: 20px;
            color: #6b3f1e;
            letter-spacing: 2px;
        }
        .result-number .num {
            font-size: 40px;
            font-weight: 700;
            color: #8b1a0a;
            display: inline-block;
            margin: 0 8px;
            font-family: inherit;
        }

        /* 吉凶 */
        .result-fortune {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 6px 0 12px;
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-block;
            background: rgba(180, 120, 60, 0.12);
            border: 1px solid #d4a854;
        }
        .result-fortune.great {
            color: #c0392b;
        }
        .result-fortune.good {
            color: #d4761a;
        }
        .result-fortune.medium {
            color: #7a7a3a;
        }
        .result-fortune.poor {
            color: #5a6a7a;
        }
        .result-fortune.bad {
            color: #6a4a4a;
        }

        /* 籤詩 */
        .result-poem {
            text-align: center;
            font-size: 20px;
            line-height: 1.9;
            color: #3d1a0e;
            padding: 14px 8px 10px;
            margin: 8px 0 12px;
            background: rgba(255, 248, 235, 0.5);
            border-radius: 16px;
            border-left: 4px solid #b8915c;
            border-right: 4px solid #b8915c;
            font-style: italic;
            letter-spacing: 2px;
        }
        .result-poem .line {
            display: block;
        }

        /* 解籤 */
        .result-interpretation {
            margin-top: 14px;
            padding: 16px 18px;
            background: rgba(255, 248, 235, 0.6);
            border-radius: 16px;
            border: 1px solid #dcc8b0;
            font-size: 16px;
            line-height: 1.8;
            color: #3d2a1a;
        }
        .result-interpretation strong {
            color: #7a3a1a;
            font-size: 17px;
            display: block;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        .result-interpretation .label {
            display: inline-block;
            background: #b8915c;
            color: #f7efe2;
            padding: 0 12px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 2px;
            margin-right: 6px;
        }

        /* ===== 底部資訊 ===== */
        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #9a8a7a;
            letter-spacing: 2px;
            border-top: 1px solid #dcc8b0;
            padding-top: 16px;
            line-height: 1.8;
        }
        .footer .copyright {
            font-size: 11px;
            color: #b09a8a;
            letter-spacing: 1px;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 480px) {
            .container {
                padding: 20px 16px 28px;
                border-radius: 32px 32px 24px 24px;
            }
            .header h1 {
                font-size: 28px;
                letter-spacing: 6px;
            }
            .cylinder-wrapper {
                width: 130px;
                height: 170px;
            }
            .cylinder-body {
                width: 110px;
                height: 145px;
                clip-path: inset(24px 0 0 0 round 0 0 40px 40px);
            }
            .sticks-container {
                width: 72px;
                height: 90px;
                top: -16px;
            }
            .stick {
                width: 8px;
                height: 66px;
            }
            .stick:nth-child(1) {
                transform: translateX(-26px) rotate(-6deg);
                height: 62px;
            }
            .stick:nth-child(2) {
                transform: translateX(-14px) rotate(-2deg);
                height: 68px;
            }
            .stick:nth-child(3) {
                transform: translateX(-2px) rotate(1deg);
                height: 64px;
            }
            .stick:nth-child(4) {
                transform: translateX(10px) rotate(4deg);
                height: 70px;
            }
            .stick:nth-child(5) {
                transform: translateX(20px) rotate(7deg);
                height: 60px;
            }
            .stick:nth-child(6) {
                transform: translateX(-20px) rotate(-9deg);
                height: 66px;
            }
            .stick:nth-child(7) {
                transform: translateX(14px) rotate(10deg);
                height: 58px;
            }
            .stick:nth-child(8) {
                transform: translateX(-4px) rotate(-4deg);
                height: 72px;
            }
            .flying-stick {
                width: 11px;
                height: 80px;
            }
            .btn-draw {
                padding: 14px 32px;
                font-size: 20px;
                letter-spacing: 4px;
            }
            .result-poem {
                font-size: 18px;
            }
            .result-interpretation {
                font-size: 15px;
                padding: 14px;
            }
            .result-number .num {
                font-size: 32px;
            }
            .result-fortune {
                font-size: 18px;
            }
            .container::before,
            .container::after {
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 14px 10px 20px;
            }
            .header h1 {
                font-size: 22px;
                letter-spacing: 4px;
            }
            .cylinder-wrapper {
                width: 110px;
                height: 150px;
            }
            .cylinder-body {
                width: 92px;
                height: 125px;
                clip-path: inset(20px 0 0 0 round 0 0 40px 40px);
            }
            .sticks-container {
                width: 60px;
                height: 76px;
                top: -14px;
            }
            .stick {
                width: 6px;
                height: 56px;
            }
            .stick:nth-child(1) {
                transform: translateX(-20px) rotate(-6deg);
                height: 52px;
            }
            .stick:nth-child(2) {
                transform: translateX(-10px) rotate(-2deg);
                height: 58px;
            }
            .stick:nth-child(3) {
                transform: translateX(0px) rotate(1deg);
                height: 54px;
            }
            .stick:nth-child(4) {
                transform: translateX(10px) rotate(4deg);
                height: 60px;
            }
            .stick:nth-child(5) {
                transform: translateX(18px) rotate(7deg);
                height: 50px;
            }
            .stick:nth-child(6) {
                transform: translateX(-16px) rotate(-9deg);
                height: 56px;
            }
            .stick:nth-child(7) {
                transform: translateX(12px) rotate(10deg);
                height: 48px;
            }
            .stick:nth-child(8) {
                transform: translateX(-2px) rotate(-4deg);
                height: 62px;
            }
            .btn-draw {
                padding: 12px 24px;
                font-size: 18px;
                letter-spacing: 2px;
            }
            .result-poem {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- 標題 -->
        <div class="header">
            <h1>黃大仙靈籤</h1>
            <div class="sub">— 誠心所求 · 有求必應 —</div>
            <div class="deco">
                <span>✧</span>
                <span>❀</span>
                <span>✧</span>
            </div>
        </div>

        <!-- 籤筒區域 -->
        <div class="lottery-area">
            <div class="cylinder-wrapper">
                <div class="cylinder" id="cylinder">
                    <!-- 籤筒身體 (無蓋，clip-path 使上部透明) -->
                    <div class="cylinder-body"></div>
                    <!-- 籤枝 (在筒內，上半部露出) -->
                    <div class="sticks-container" id="sticksContainer">
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                    </div>
                    <!-- 飛出的籤 -->
                    <div class="flying-stick" id="flyingStick"></div>
                </div>
            </div>

            <!-- 求籤按鈕 -->
            <button class="btn-draw" id="drawBtn">
                <span class="icon">🙏</span> 求 籤
            </button>
        </div>

        <!-- 結果顯示 -->
        <div class="result-area" id="resultArea">
            <div class="result-card">
                <div class="result-number" id="resultNumber">
                    第 <span class="num" id="lotteryNum">--</span> 籤
                </div>
                <div style="text-align:center;">
                    <span class="result-fortune" id="fortuneTag">—</span>
                </div>
                <div class="result-poem" id="poemDisplay">
                    <span class="line">—</span>
                </div>
                <div class="result-interpretation" id="interpretationDisplay">
                    <strong>📖 解籤</strong>
                    <span id="interpretationText">誠心求籤，靜待佳音。</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <div>— 心誠則靈 · 諸事吉祥 —</div>
            <div class="copyright">v1.0 © <span id="yearSpan">2026</span> ☕迪遜咖啡廳，版權所有。</div>
        </div>
    </div>

    <script>
        // ============================================================
        //  籤詩數據庫 (32支籤)
        // ============================================================
        const LOTTERY_DATA = [{
            id: 1,
            number: "第一籤",
            fortune: "上上",
            poem: "龍潛深淵待時飛，\n鳳棲高梧望朝暉。\n一朝雲雨風雷動，\n萬里鵬程任我歸。",
            interpretation: "此籤大吉，萬事亨通。時運將至，如龍得水，如鳳翔天。事業可成，姻緣美滿，求財得利，病患康復。宜把握良機，奮發向上。"
        }, {
            id: 2,
            number: "第二籤",

        // ============================================================
        //  DOM 參考與狀態
        // ============================================================
        const cylinder = document.getElementById('cylinder');
        const drawBtn = document.getElementById('drawBtn');
        const resultArea = document.getElementById('resultArea');
        const lotteryNum = document.getElementById('lotteryNum');
        const fortuneTag = document.getElementById('fortuneTag');
        const poemDisplay = document.getElementById('poemDisplay');
        const interpretationText = document.getElementById('interpretationText');
        const flyingStick = document.getElementById('flyingStick');
        const yearSpan = document.getElementById('yearSpan');

        // 動態設定年份
        yearSpan.textContent = new Date().getFullYear();

        let isDrawing = false;
        let currentResult = null;

        // ============================================================
        //  核心功能
        // ============================================================

        // 取得隨機籤
        function getRandomLottery() {
            const idx = Math.floor(Math.random() * LOTTERY_DATA.length);
            return LOTTERY_DATA[idx];
        }

        // 顯示結果
        function displayResult(data) {
            // 籤號
            lotteryNum.textContent = data.id;

            // 吉凶
            fortuneTag.textContent = data.fortune;
            fortuneTag.className = 'result-fortune';
            const fortuneMap = {
                '上上': 'great',
                '上中': 'good',
                '中上': 'good',
                '中平': 'medium',
                '中下': 'poor',
                '下下': 'bad'
            };
            if (fortuneMap[data.fortune]) {
                fortuneTag.classList.add(fortuneMap[data.fortune]);
            }

            // 籤詩 (分行)
            const lines = data.poem.split('\n').filter(line => line.trim() !== '');
            poemDisplay.innerHTML = lines.map(line => `<span class="line">${line}</span>`).join('');

            // 解籤
            interpretationText.textContent = data.interpretation;

            // 顯示結果區
            resultArea.classList.add('show');
        }

        // 重置結果
        function resetResult() {
            resultArea.classList.remove('show');
        }

        // ============================================================
        //  動畫流程
        // ============================================================

        function startDraw() {
            if (isDrawing) return;
            isDrawing = true;
            drawBtn.disabled = true;
            resetResult();

            // 重置飛籤
            flyingStick.classList.remove('show');
            flyingStick.style.opacity = '0';

            // 1. 搖晃籤筒 (1.8秒)
            cylinder.classList.add('shake');

            // 2. 震動結束，飛出籤
            setTimeout(() => {
                cylinder.classList.remove('shake');

                // 顯示飛籤動畫
                flyingStick.style.opacity = '1';
                flyingStick.classList.add('show');

                // 3. 飛籤動畫結束後顯示結果
                setTimeout(() => {
                    // 抽籤
                    const data = getRandomLottery();
                    currentResult = data;

                    // 顯示結果
                    displayResult(data);

                    // 隱藏飛籤 (慢慢消失)
                    setTimeout(() => {
                        flyingStick.classList.remove('show');
                        flyingStick.style.opacity = '0';
                    }, 300);

                    // 恢復按鈕
                    isDrawing = false;
                    drawBtn.disabled = false;

                }, 900); // 飛籤動畫時長

            }, 1800); // 搖晃時長
        }

        // ============================================================
        //  事件綁定
        // ============================================================

        drawBtn.addEventListener('click', startDraw);

        // 鍵盤快捷鍵 (空格求籤)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                startDraw();
            }
        });
