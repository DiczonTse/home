<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>📝每日任務</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 基礎重置 & 變數 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* 淺色主題 */
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #fafafa;
            --bg-header: linear-gradient(135deg, #4361ee, #7209b7);
            --bg-footer: linear-gradient(135deg, #4361ee, #7209b7);
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --text-inverse: #ffffff;
            --border-color: #e9ecef;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --gray: #6c757d;
            --border-radius: 14px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-bg: #ffffff;
            --nav-shadow: 0 -2px 15px rgba(0, 0, 0, 0.08);
            --toast-bg: #212529;
            --toast-text: #ffffff;
            --overlay-bg: rgba(0, 0, 0, 0.5);
            --filter-bg: #ffffff;
            --filter-text: #6c757d;
            --filter-active-bg: #4361ee;
            --filter-active-text: #ffffff;
            --priority-high-bg: #ffe6e6;
            --priority-high-text: #d63031;
            --priority-medium-bg: #fff9e6;
            --priority-medium-text: #f39c12;
            --priority-low-bg: #e6f7ff;
            --priority-low-text: #3498db;
            --completed-color: #adb5bd;
            --scrollbar-track: #f1f1f1;
            --scrollbar-thumb: #c1c1c1;
            --move-btn-color: #6c757d;
            --move-btn-hover-bg: rgba(67, 97, 238, 0.08);
            --move-btn-hover-color: #4361ee;
        }

        /* 暗色主題 */
        [data-theme="dark"] {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-card: #252525;
            --bg-input: #2a2a2a;
            --bg-header: linear-gradient(135deg, #1a1a2e, #16213e);
            --bg-footer: linear-gradient(135deg, #1a1a2e, #16213e);
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-inverse: #e8e8e8;
            --border-color: #333333;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
            --primary: #5a7aff;
            --primary-dark: #4a6ae8;
            --secondary: #9b3dd9;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --gray: #888888;
            --nav-bg: #1e1e1e;
            --nav-shadow: 0 -2px 15px rgba(0, 0, 0, 0.4);
            --toast-bg: #333333;
            --toast-text: #e8e8e8;
            --overlay-bg: rgba(0, 0, 0, 0.7);
            --filter-bg: #2a2a2a;
            --filter-text: #a0a0a0;
            --filter-active-bg: #5a7aff;
            --filter-active-text: #ffffff;
            --priority-high-bg: #3d1a1a;
            --priority-high-text: #ff6b6b;
            --priority-medium-bg: #3d2e1a;
            --priority-medium-text: #f7c948;
            --priority-low-bg: #1a2a3d;
            --priority-low-text: #6bb5ff;
            --completed-color: #555555;
            --scrollbar-track: #2a2a2a;
            --scrollbar-thumb: #444444;
            --move-btn-color: #a0a0a0;
            --move-btn-hover-bg: rgba(90, 122, 255, 0.12);
            --move-btn-hover-color: #5a7aff;
        }

        /* ===== 全域樣式 ===== */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 8px;
        }

        /* ===== Header ===== */
        header {
            background: var(--bg-header);
            color: white;
            padding: 1rem 1rem 0.8rem 1rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s ease;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .app-title a {
            text-decoration: none;
            color: #ffb347;
            transition: var(--transition);
        }
        .app-title a:hover {
            color: #ffa500;
        }

        .date-display {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 0.1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .header-btn:active {
            transform: scale(0.92);
        }

        /* ===== Main Container ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem 1rem 6rem 1rem;
            flex: 1;
            width: 100%;
            transition: var(--transition);
        }

        /* ===== 移動端表單（彈出式） ===== */
        .mobile-form-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--overlay-bg);
            z-index: 200;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .mobile-form-overlay.open {
            display: block;
            opacity: 1;
        }

        .mobile-form-container {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            padding: 1.5rem 1.5rem 2rem 1.5rem;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 201;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.2);
            will-change: transform;
        }

        .mobile-form-container.open {
            display: block;
            transform: translateY(0);
        }

        .mobile-form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .mobile-form-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .form-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.1rem;
        }

        .close-mobile-form {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .close-mobile-form:hover {
            background: var(--border-color);
        }

        /* ===== 表單元件 ===== */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            transition: var(--transition);
            background-color: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 50px;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--gray);
            color: white;
            width: 48%;
        }

        .btn-secondary:hover {
            opacity: 0.85;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
            width: 48%;
        }

        .btn-success:hover {
            opacity: 0.85;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.85;
        }

        .form-buttons {
            display: flex;
            gap: 4%;
            justify-content: space-between;
        }

        .form-buttons .btn {
            flex: 1;
        }

        /* ===== 過濾按鈕 ===== */
        .task-filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            overflow-x: auto;
            padding: 0.25rem 0 0.5rem 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .task-filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 20px;
            background-color: var(--filter-bg);
            color: var(--filter-text);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            box-shadow: var(--shadow);
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background-color: var(--filter-active-bg);
            color: var(--filter-active-text);
            box-shadow: 0 2px 12px rgba(67, 97, 238, 0.25);
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        /* ===== 任務容器 ===== */
        .tasks-container {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 1.5rem;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .tasks-header {
            padding: 1rem 1.25rem;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .task-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .task-list {
            list-style-type: none;
        }

        /* ===== 任務項目 ===== */
        .task-item {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 0.9rem;
            transition: background 0.2s ease;
            position: relative;
            background: var(--bg-card);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:hover {
            background: var(--bg-secondary);
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
            margin-top: 0.15rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            background: var(--bg-input);
        }

        .task-checkbox.checked {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .task-checkbox:active {
            transform: scale(0.85);
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-weight: 600;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            word-break: break-word;
            color: var(--text-primary);
        }

        .task-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .task-priority {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .priority-high {
            background-color: var(--priority-high-bg);
            color: var(--priority-high-text);
        }

        .priority-medium {
            background-color: var(--priority-medium-bg);
            color: var(--priority-medium-text);
        }

        .priority-low {
            background-color: var(--priority-low-bg);
            color: var(--priority-low-text);
        }

        .task-actions {
            display: flex;
            gap: 0.15rem;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background-color: var(--border-color);
        }

        .action-btn:active {
            transform: scale(0.88);
        }

        .move-btn {
            color: var(--move-btn-color);
            font-size: 0.8rem;
        }

        .move-btn:hover {
            color: var(--move-btn-hover-color);
            background-color: var(--move-btn-hover-bg);
        }

        .move-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        .edit-btn:hover {
            color: var(--primary);
            background-color: rgba(67, 97, 238, 0.1);
        }

        .delete-btn:hover {
            color: var(--danger);
            background-color: rgba(247, 37, 133, 0.1);
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .task-item.completed .task-description {
            color: var(--completed-color);
        }

        .task-item.completed .task-priority {
            opacity: 0.5;
        }

        /* ===== 空狀態 ===== */
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3.5rem;
            margin-bottom: 0.8rem;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
        }

        .empty-subtext {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ===== 底部導航 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            display: flex;
            padding: 0.5rem 0.5rem env(safe-area-inset-bottom, 0.5rem) 0.5rem;
            box-shadow: var(--nav-shadow);
            z-index: 100;
            border-top: 1px solid var(--border-color);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            padding: 0.4rem 0;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border-radius: 10px;
            font-family: inherit;
            position: relative;
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .nav-btn:active {
            transform: scale(0.92);
        }

        .nav-icon {
            font-size: 1.3rem;
            line-height: 1;
        }

        .nav-text {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .nav-badge {
            position: absolute;
            top: 2px;
            right: 50%;
            transform: translateX(calc(50% + 18px));
            background: var(--danger);
            color: white;
            font-size: 0.6rem;
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
        }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 5rem;
            right: 1.2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: 0 4px 16px rgba(67, 97, 238, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            z-index: 99;
            transition: var(--transition);
        }

        .fab:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 24px rgba(67, 97, 238, 0.45);
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 5.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 0.7rem 1.8rem;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease;
            font-weight: 600;
            font-size: 0.95rem;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ===== Footer ===== */
        footer {
            background: var(--bg-footer);
            color: white;
            padding: 2rem 1rem calc(2rem + 90px) 1rem;
            margin-top: auto;
            transition: background 0.3s ease;
        }

        .footer-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .footer-subtitle {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-bottom: 1.2rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .footer-link {
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.85;
            transition: var(--transition);
        }

        .footer-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .footer-info {
            font-size: 0.75rem;
            opacity: 0.7;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .footer-info a {
            color: #4cc9f0;
            text-decoration: none;
        }
        .footer-info a:hover {
            text-decoration: underline;
        }

        /* ===== 工具選單（彈出） ===== */
        .tools-menu {
            position: fixed;
            bottom: 5.5rem;
            right: 1rem;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            padding: 0.5rem;
            z-index: 150;
            min-width: 180px;
            transform: scale(0.9) translateY(10px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.25s ease;
            border: 1px solid var(--border-color);
        }

        .tools-menu.open {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .tools-menu-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            width: 100%;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            font-family: inherit;
        }

        .tools-menu-item:hover {
            background: var(--border-color);
        }

        .tools-menu-item:active {
            transform: scale(0.97);
        }

        .tools-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--primary);
        }

        /* ===== 隱藏檔案輸入 ===== */
        .file-input-hidden {
            display: none;
        }

        /* ===== 動畫 ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item.new {
            animation: fadeInUp 0.3s ease;
        }

        /* ===== 響應式 ===== */
        @media (min-width: 768px) {
            .container {
                padding: 1.5rem 2rem 7rem 2rem;
            }

            .task-filters {
                justify-content: center;
                gap: 0.7rem;
            }

            .filter-btn {
                padding: 0.7rem 1.6rem;
                font-size: 0.95rem;
            }

            .task-item {
                padding: 1.2rem 1.5rem;
            }

            .mobile-form-container {
                max-width: 500px;
                left: 50%;
                right: auto;
                transform: translateX(-50%) translateY(100%);
                border-radius: var(--border-radius);
                bottom: 10vh;
                max-height: 80vh;
            }

            .mobile-form-container.open {
                transform: translateX(-50%) translateY(0);
            }

            .mobile-form-overlay.open {
                display: block;
            }

            .fab {
                right: 2rem;
                bottom: 6rem;
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
            }

            .toast {
                bottom: 6.5rem;
                font-size: 1rem;
                padding: 0.8rem 2rem;
            }

            .bottom-nav {
                padding: 0.6rem 1rem env(safe-area-inset-bottom, 0.6rem) 1rem;
            }

            .nav-btn {
                padding: 0.5rem 0;
            }

            .nav-icon {
                font-size: 1.4rem;
            }
            .nav-text {
                font-size: 0.75rem;
            }

            .tools-menu {
                right: 2rem;
                bottom: 6.5rem;
                min-width: 200px;
            }

            footer {
                padding: 2rem 1rem calc(2rem + 100px) 1rem;
            }

            .task-actions {
                gap: 0.25rem;
            }
            .action-btn {
                width: 36px;
                height: 36px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .header-content {
                flex-direction: row;
                align-items: center;
            }

            .app-title {
                font-size: 1.2rem;
            }

            .date-display {
                font-size: 0.75rem;
            }

            .header-btn {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }

            .task-item {
                padding: 0.8rem 0.9rem;
                gap: 0.6rem;
            }

            .task-title {
                font-size: 0.95rem;
            }

            .task-checkbox {
                width: 22px;
                height: 22px;
            }

            .mobile-form-container {
                padding: 1.2rem 1.2rem 1.5rem 1.2rem;
            }

            .btn {
                min-height: 44px;
                font-size: 0.95rem;
                padding: 0.7rem 1rem;
            }

            .action-btn {
                width: 30px;
                height: 30px;
                font-size: 0.75rem;
            }

            .task-actions {
                gap: 0.1rem;
            }
        }

        body,
        .bg-card,
        .bg-secondary,
        .bg-primary,
        .tasks-container,
        .task-item,
        .mobile-form-container,
        .tools-menu,
        .bottom-nav,
        header,
        footer {
            transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        ::selection {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-content">
            <div class="header-left">
                <h1 class="app-title"><a href="#" style="text-decoration:none; color:#ffb347;">📝每日任務</a></h1>
                <div class="date-display" id="currentDate"></div>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="themeToggle" title="切換暗色模式" aria-label="切換暗色模式">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="header-btn" id="toolsToggle" title="工具" aria-label="工具">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container" id="mainContainer">

        <!-- ===== 過濾器 ===== -->
        <section class="task-filters">
            <button class="filter-btn active" data-filter="all">📋 所有</button>
            <button class="filter-btn" data-filter="active">⏳ 處理中</button>
            <button class="filter-btn" data-filter="completed">✅ 已完成</button>
            <button class="filter-btn" data-filter="high">⭐ 優先</button>
        </section>

        <!-- ===== 任務列表 ===== -->
        <section class="tasks-container">
            <div class="tasks-header">
                <span>📌 今日任務</span>
                <span class="task-count" id="taskCount">0 個任務</span>
            </div>
            <ul class="task-list" id="taskList"></ul>
        </section>

        <div style="height: 0.5rem;"></div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="footer-content">
            <h2 class="footer-title">📝每日任務</h2>
            <p class="footer-subtitle">您的個人任務管理助手</p>
            <div class="footer-links">
                <a href="../index.html" class="footer-link">首頁</a>
                <a href="../index.html" class="footer-link">關於我們</a>
                <a href="../index.html" class="footer-link">隱私政策</a>
                <a href="../index.html" class="footer-link">使用條款</a>
                <a href="mailto:tsedkn@gmail.com" class="footer-link">聯繫我們</a>
            </div>
            <div class="footer-info">
                <p>v2.0 © <span id="currentYear"></span> ☕迪遜咖啡廳，版權所有。</p>
                <p>每日任務管理工具 · 任務每日自動重置 · 保持專注，完成每日任務！ <a href="mailto:tsedkn@gmail.com">支援團隊</a></p>
            </div>
        </div>
    </footer>

    <!-- ===== 工具選單 ===== -->
    <div class="tools-menu" id="toolsMenu">
        <button class="tools-menu-item" id="exportTxtBtn">
            <i class="fas fa-file-export"></i> 匯出 TXT
        </button>
        <button class="tools-menu-item" id="importTxtBtn">
            <i class="fas fa-file-import"></i> 匯入 TXT
        </button>
        <button class="tools-menu-item" id="clearAllBtn" style="color: var(--danger);">
            <i class="fas fa-trash-alt" style="color: var(--danger);"></i> 清除所有任務
        </button>
    </div>

    <!-- ===== 移動端表單（彈出） ===== -->
    <div class="mobile-form-overlay" id="mobileFormOverlay"></div>
    <div class="mobile-form-container" id="mobileFormContainer" style="display: none;">
        <div class="mobile-form-header">
            <div>
                <h2 class="mobile-form-title" id="mobileFormTitle">📝 新增任務</h2>
                <p class="form-subtitle" id="mobileFormSubtitle">請輸入任務詳細資料</p>
            </div>
            <button class="close-mobile-form" id="closeMobileForm">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="mobileTaskForm">
            <input type="hidden" id="mobileTaskId" value="">
            <div class="form-group">
                <label for="mobileTaskTitle">📌 任務名稱</label>
                <input type="text" id="mobileTaskTitle" placeholder="要完成的任務" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="mobileTaskDescription">📄 任務內容</label>
                <textarea id="mobileTaskDescription" placeholder="詳細內容（可選）"></textarea>
            </div>
            <div class="form-group">
                <label for="mobileTaskPriority">⚡ 次序</label>
                <select id="mobileTaskPriority">
                    <option value="low">瑣事</option>
                    <option value="medium">次要</option>
                    <option value="high" selected>優先</option>
                </select>
            </div>
            <div class="form-buttons">
                <button type="button" class="btn btn-secondary" id="mobileCancelEditBtn" style="display:none;">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button type="submit" class="btn btn-primary" id="mobileSubmitBtn">
                    <i class="fas fa-plus"></i> 新增任務
                </button>
            </div>
        </form>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 底部導航 ===== -->
    <nav class="bottom-nav">
        <button class="nav-btn active" id="navHome">
            <i class="fas fa-home nav-icon"></i>
            <span class="nav-text">首頁</span>
        </button>
        <button class="nav-btn" id="navCompleted">
            <i class="fas fa-check-circle nav-icon"></i>
            <span class="nav-text">已完成</span>
        </button>
        <button class="nav-btn" id="navAdd">
            <i class="fas fa-plus-circle nav-icon"></i>
            <span class="nav-text">新增</span>
        </button>
        <button class="nav-btn" id="navTools">
            <i class="fas fa-tools nav-icon"></i>
            <span class="nav-text">工具</span>
        </button>
    </nav>

    <!-- ===== FAB ===== -->
    <button class="fab" id="fabButton" aria-label="新增任務">
        <i class="fas fa-plus"></i>
    </button>

    <!-- ===== 隱藏檔案輸入 ===== -->
    <input type="file" id="fileInput" class="file-input-hidden" accept=".txt">

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. 每日重置
            // ============================================================
            const RESET_KEY = 'dailyTasks_lastReset';
            const TASKS_KEY = 'dailyTasks';
            const THEME_KEY = 'dailyTasks_theme';

            function getTodayString() {
                const now = new Date();
                return `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
            }

            function performDailyReset() {
                const today = getTodayString();
                const lastReset = localStorage.getItem(RESET_KEY);
                if (lastReset !== today) {
                    const saved = localStorage.getItem(TASKS_KEY);
                    if (saved) {
                        try {
                            let tasks = JSON.parse(saved);
                            tasks = tasks.map(t => ({ ...t, completed: false, updatedAt: new Date().toISOString() }));
                            localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
                            console.log(`[每日重置] 已重置 ${tasks.length} 個任務`);
                        } catch (e) { console.error(e); }
                    }
                    localStorage.setItem(RESET_KEY, today);
                    return true;
                }
                return false;
            }
            performDailyReset();

            // ============================================================
            //  2. 狀態 & DOM 引用
            // ============================================================
            let tasks = JSON.parse(localStorage.getItem(TASKS_KEY)) || [];
            let currentFilter = 'all';
            let editingTaskId = null;
            let isDark = localStorage.getItem(THEME_KEY) === 'dark';

            // DOM
            const taskList = document.getElementById('taskList');
            const taskCount = document.getElementById('taskCount');
            const currentDateEl = document.getElementById('currentDate');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const fab = document.getElementById('fabButton');
            const toast = document.getElementById('toast');

            // 導航
            const navHome = document.getElementById('navHome');
            const navCompleted = document.getElementById('navCompleted');
            const navAdd = document.getElementById('navAdd');
            const navTools = document.getElementById('navTools');

            // 工具選單
            const toolsMenu = document.getElementById('toolsMenu');
            const toolsToggle = document.getElementById('toolsToggle');
            const exportBtn = document.getElementById('exportTxtBtn');
            const importBtn = document.getElementById('importTxtBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const fileInput = document.getElementById('fileInput');

            // 暗色模式
            const themeToggle = document.getElementById('themeToggle');

            // 移動端表單
            const mobileFormOverlay = document.getElementById('mobileFormOverlay');
            const mobileFormContainer = document.getElementById('mobileFormContainer');
            const closeMobileForm = document.getElementById('closeMobileForm');
            const mobileTaskForm = document.getElementById('mobileTaskForm');
            const mobileTaskId = document.getElementById('mobileTaskId');
            const mobileTaskTitle = document.getElementById('mobileTaskTitle');
            const mobileTaskDesc = document.getElementById('mobileTaskDescription');
            const mobileTaskPriority = document.getElementById('mobileTaskPriority');
            const mobileSubmitBtn = document.getElementById('mobileSubmitBtn');
            const mobileCancelBtn = document.getElementById('mobileCancelEditBtn');
            const mobileFormTitle = document.getElementById('mobileFormTitle');
            const mobileFormSubtitle = document.getElementById('mobileFormSubtitle');

            // ============================================================
            //  3. 日期
            // ============================================================
            function updateDate() {
                const now = new Date();
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                currentDateEl.textContent =
                    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
            }
            updateDate();

            document.getElementById('currentYear').textContent = new Date().getFullYear();

            // ============================================================
            //  4. 暗色模式
            // ============================================================
            function applyTheme(dark) {
                isDark = dark;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
                const icon = themeToggle.querySelector('i');
                icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
            }

            if (isDark) applyTheme(true);
            else applyTheme(false);

            const media = window.matchMedia('(prefers-color-scheme: dark)');
            if (!localStorage.getItem(THEME_KEY)) {
                applyTheme(media.matches);
            }
            media.addEventListener('change', (e) => {
                if (!localStorage.getItem(THEME_KEY)) {
                    applyTheme(e.matches);
                }
            });

            themeToggle.addEventListener('click', () => {
                applyTheme(!isDark);
            });

            // ============================================================
            //  5. 儲存 & 渲染
            // ============================================================
            function saveTasks() {
                localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
                render();
            }

            // ---- 上下移動函數 ----
            function moveTaskUp(id) {
                const idx = tasks.findIndex(t => t.id === id);
                if (idx <= 0) {
                    showToast('⬆️ 已經是最上方的任務了');
                    return;
                }
                // 交換位置
                [tasks[idx - 1], tasks[idx]] = [tasks[idx], tasks[idx - 1]];
                saveTasks();
                showToast('⬆️ 任務已上移');
            }

            function moveTaskDown(id) {
                const idx = tasks.findIndex(t => t.id === id);
                if (idx === -1 || idx >= tasks.length - 1) {
                    showToast('⬇️ 已經是最下方的任務了');
                    return;
                }
                // 交換位置
                [tasks[idx], tasks[idx + 1]] = [tasks[idx + 1], tasks[idx]];
                saveTasks();
                showToast('⬇️ 任務已下移');
            }

            // ---- 渲染 ----
            function render() {
                const filtered = tasks.filter(task => {
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    if (currentFilter === 'high') return task.priority === 'high';
                    return true;
                });

                if (filtered.length === 0) {
                    taskList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <p class="empty-text">沒有任務</p>
                            <p class="empty-subtext">點擊下方「+」新增任務吧！</p>
                        </div>
                    `;
                } else {
                    // 在「所有」視圖下顯示上下按鈕，其他視圖隱藏
                    const showMoveBtns = (currentFilter === 'all');

                    taskList.innerHTML = filtered.map((task, idx) => {
                        const totalFiltered = filtered.length;
                        const taskIdx = tasks.findIndex(t => t.id === task.id);
                        const isFirst = (taskIdx === 0);
                        const isLast = (taskIdx === tasks.length - 1);

                        return `
                        <li class="task-item ${task.completed ? 'completed' : ''} ${idx === filtered.length-1 && !editingTaskId ? 'new' : ''}" data-id="${task.id}">
                            <div class="task-checkbox ${task.completed ? 'checked' : ''}">
                                ${task.completed ? '<i class="fas fa-check" style="font-size:12px;"></i>' : ''}
                            </div>
                            <div class="task-content">
                                <div class="task-title">
                                    ${escapeHtml(task.title)}
                                    <span class="task-priority priority-${task.priority}">
                                        <i class="fas fa-${task.priority === 'high' ? 'exclamation-circle' : task.priority === 'medium' ? 'minus-circle' : 'info-circle'}"></i>
                                        ${task.priority === 'high' ? '優先' : task.priority === 'medium' ? '次要' : '瑣事'}
                                    </span>
                                </div>
                                ${task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : ''}
                            </div>
                            <div class="task-actions">
                                ${showMoveBtns ? `
                                    <button class="action-btn move-btn move-up" title="上移" ${isFirst ? 'disabled' : ''}>
                                        <i class="fas fa-chevron-up"></i>
                                    </button>
                                    <button class="action-btn move-btn move-down" title="下移" ${isLast ? 'disabled' : ''}>
                                        <i class="fas fa-chevron-down"></i>
                                    </button>
                                ` : ''}
                                <button class="action-btn edit-btn" title="編輯"><i class="fas fa-edit"></i></button>
                                <button class="action-btn delete-btn" title="刪除"><i class="fas fa-trash"></i></button>
                            </div>
                        </li>
                    `}).join('');

                    // ---- 事件綁定 ----
                    // checkbox
                    document.querySelectorAll('.task-checkbox').forEach(el => {
                        el.addEventListener('click', function() {
                            const id = this.closest('.task-item').dataset.id;
                            toggleTask(id);
                        });
                    });

                    // 上移
                    document.querySelectorAll('.move-up').forEach(el => {
                        el.addEventListener('click', function() {
                            const id = this.closest('.task-item').dataset.id;
                            moveTaskUp(id);
                        });
                    });

                    // 下移
                    document.querySelectorAll('.move-down').forEach(el => {
                        el.addEventListener('click', function() {
                            const id = this.closest('.task-item').dataset.id;
                            moveTaskDown(id);
                        });
                    });

                    // 編輯
                    document.querySelectorAll('.edit-btn').forEach(el => {
                        el.addEventListener('click', function() {
                            const id = this.closest('.task-item').dataset.id;
                            openEditForm(id);
                        });
                    });

                    // 刪除
                    document.querySelectorAll('.delete-btn').forEach(el => {
                        el.addEventListener('click', function() {
                            const id = this.closest('.task-item').dataset.id;
                            deleteTask(id);
                        });
                    });
                }

                const total = tasks.length;
                const done = tasks.filter(t => t.completed).length;
                taskCount.textContent = `${done}/${total} 個任務`;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
            }

            // ============================================================
            //  6. CRUD
            // ============================================================
            function addTask(title, desc, priority) {
                const task = {
                    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    title: title.trim(),
                    description: desc.trim(),
                    priority: priority || 'high',
                    completed: false,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                tasks.push(task);
                saveTasks();
                showToast('✅ 任務已新增！');
                closeMobileFormHandler();
            }

            function updateTask(id, title, desc, priority) {
                tasks = tasks.map(t => {
                    if (t.id === id) {
                        return { ...t, title: title.trim(), description: desc.trim(), priority, updatedAt: new Date()
                                .toISOString() };
                    }
                    return t;
                });
                saveTasks();
                showToast('✏️ 任務已更新！');
                closeMobileFormHandler();
            }

            function toggleTask(id) {
                tasks = tasks.map(t => {
                    if (t.id === id) {
                        const completed = !t.completed;
                        showToast(completed ? '🎉 任務完成！' : '🔄 任務已重啟');
                        return { ...t, completed, updatedAt: new Date().toISOString() };
                    }
                    return t;
                });
                saveTasks();
            }

            function deleteTask(id) {
                if (!confirm('確定要刪除此任務嗎？')) return;
                tasks = tasks.filter(t => t.id !== id);
                if (editingTaskId === id) resetForm();
                saveTasks();
                showToast('🗑️ 任務已刪除');
            }

            function clearAllTasks() {
                if (tasks.length === 0) { showToast('沒有任務可清除'); return; }
                if (!confirm('確定要清除所有任務嗎？此操作無法復原！')) return;
                tasks = [];
                saveTasks();
                showToast('🗑️ 已清除所有任務');
                closeToolsMenu();
            }

            // ============================================================
            //  7. 表單（移動端彈出）
            // ============================================================

            function openForm() {
                mobileFormContainer.style.display = 'block';
                mobileFormOverlay.classList.add('open');
                requestAnimationFrame(() => {
                    mobileFormContainer.classList.add('open');
                    document.body.style.overflow = 'hidden';
                    setTimeout(() => mobileTaskTitle.focus(), 350);
                });
            }

            function closeMobileFormHandler() {
                mobileFormContainer.classList.remove('open');
                mobileFormOverlay.classList.remove('open');
                document.body.style.overflow = '';
                setTimeout(() => {
                    mobileFormContainer.style.display = 'none';
                }, 350);
                resetForm();
            }

            function resetForm() {
                editingTaskId = null;
                mobileTaskId.value = '';
                mobileTaskTitle.value = '';
                mobileTaskDesc.value = '';
                mobileTaskPriority.value = 'high';
                mobileFormTitle.textContent = '📝 新增任務';
                mobileFormSubtitle.textContent = '請輸入任務詳細資料';
                mobileSubmitBtn.innerHTML = '<i class="fas fa-plus"></i> 新增任務';
                mobileCancelBtn.style.display = 'none';
            }

            function openEditForm(id) {
                const task = tasks.find(t => t.id === id);
                if (!task) return;

                editingTaskId = id;
                mobileTaskId.value = id;
                mobileTaskTitle.value = task.title;
                mobileTaskDesc.value = task.description || '';
                mobileTaskPriority.value = task.priority;
                mobileFormTitle.textContent = '✏️ 編輯任務';
                mobileFormSubtitle.textContent = '修改任務資料';
                mobileSubmitBtn.innerHTML = '<i class="fas fa-save"></i> 更新任務';
                mobileCancelBtn.style.display = 'flex';

                openForm();
            }

            mobileTaskForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const title = mobileTaskTitle.value.trim();
                if (!title) { showToast('請輸入任務名稱！'); return; }
                const desc = mobileTaskDesc.value.trim();
                const priority = mobileTaskPriority.value;
                const id = mobileTaskId.value;

                if (id) {
                    updateTask(id, title, desc, priority);
                } else {
                    addTask(title, desc, priority);
                }
            });

            mobileCancelBtn.addEventListener('click', function() {
                resetForm();
                closeMobileFormHandler();
                showToast('已取消編輯');
            });

            closeMobileForm.addEventListener('click', closeMobileFormHandler);
            mobileFormOverlay.addEventListener('click', closeMobileFormHandler);

            // ============================================================
            //  8. 過濾器
            // ============================================================
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    render();
                    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
                    if (currentFilter === 'all') navHome.classList.add('active');
                    else if (currentFilter === 'completed') navCompleted.classList.add('active');
                    else if (currentFilter === 'active') navHome.classList.add('active');
                    else if (currentFilter === 'high') navHome.classList.add('active');
                });
            });

            // ============================================================
            //  9. 底部導航
            // ============================================================
            navHome.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                filterBtns.forEach(b => b.classList.remove('active'));
                document.querySelector('[data-filter="all"]').classList.add('active');
                currentFilter = 'all';
                render();
                closeToolsMenu();
                if (mobileFormContainer.classList.contains('open')) closeMobileFormHandler();
            });

            navCompleted.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                filterBtns.forEach(b => b.classList.remove('active'));
                document.querySelector('[data-filter="completed"]').classList.add('active');
                currentFilter = 'completed';
                render();
                closeToolsMenu();
                if (mobileFormContainer.classList.contains('open')) closeMobileFormHandler();
            });

            navAdd.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                resetForm();
                openForm();
                closeToolsMenu();
            });

            navTools.addEventListener('click', function(e) {
                e.stopPropagation();
                toolsMenu.classList.toggle('open');
                if (mobileFormContainer.classList.contains('open')) closeMobileFormHandler();
            });

            // ============================================================
            //  10. 工具選單
            // ============================================================
            function closeToolsMenu() {
                toolsMenu.classList.remove('open');
            }

            toolsToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                toolsMenu.classList.toggle('open');
            });

            document.addEventListener('click', function(e) {
                if (!toolsMenu.contains(e.target) && e.target !== toolsToggle && !e.target.closest('.header-actions')) {
                    closeToolsMenu();
                }
            });

            // ============================================================
            //  11. 匯出 TXT
            // ============================================================
            function exportTxt() {
                if (tasks.length === 0) {
                    showToast('沒有任務可匯出');
                    return;
                }

                let lines = [];
                lines.push('=== 📝 每日任務匯出 ===');
                lines.push(`匯出時間: ${new Date().toLocaleString('zh-TW')}`);
                lines.push(`總任務數: ${tasks.length}`);
                lines.push('');

                tasks.forEach((task, idx) => {
                    lines.push(`--- 任務 ${idx + 1} ---`);
                    lines.push(`標題: ${task.title}`);
                    lines.push(`內容: ${task.description || '(無)'}`);
                    const priorityMap = { high: '優先', medium: '次要', low: '瑣事' };
                    lines.push(`優先級: ${priorityMap[task.priority] || task.priority}`);
                    lines.push(`狀態: ${task.completed ? '已完成' : '處理中'}`);
                    lines.push(`建立: ${new Date(task.createdAt).toLocaleString('zh-TW')}`);
                    lines.push(`更新: ${new Date(task.updatedAt).toLocaleString('zh-TW')}`);
                    lines.push('');
                });

                const content = lines.join('\n');
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `每日任務_${new Date().toISOString().slice(0,10)}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('📤 匯出成功！');
                closeToolsMenu();
            }

            exportBtn.addEventListener('click', exportTxt);

            // ============================================================
            //  12. 匯入 TXT
            // ============================================================
            function importTxt(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const text = e.target.result;
                        const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
                        if (lines.length < 3) {
                            showToast('⚠️ 檔案格式無效');
                            return;
                        }

                        if (!lines[0].includes('每日任務匯出')) {
                            showToast('⚠️ 不支援的檔案格式');
                            return;
                        }

                        const imported = [];
                        let current = null;
                        let reading = false;

                        for (const line of lines) {
                            if (line.startsWith('--- 任務')) {
                                if (current && current.title) {
                                    imported.push(current);
                                }
                                current = { title: '', description: '', priority: 'high', completed: false };
                                reading = true;
                                continue;
                            }
                            if (!reading || !current) continue;

                            if (line.startsWith('標題:')) {
                                current.title = line.replace('標題:', '').trim();
                            } else if (line.startsWith('內容:')) {
                                current.description = line.replace('內容:', '').trim();
                                if (current.description === '(無)') current.description = '';
                            } else if (line.startsWith('優先級:')) {
                                const p = line.replace('優先級:', '').trim();
                                const map = { '優先': 'high', '次要': 'medium', '瑣事': 'low' };
                                current.priority = map[p] || 'high';
                            } else if (line.startsWith('狀態:')) {
                                const s = line.replace('狀態:', '').trim();
                                current.completed = s === '已完成';
                            }
                        }

                        if (current && current.title) {
                            imported.push(current);
                        }

                        if (imported.length === 0) {
                            showToast('⚠️ 沒有找到有效的任務資料');
                            return;
                        }

                        const choice = confirm(
                            `找到 ${imported.length} 個任務。\n\n點擊「確定」覆蓋所有現有任務\n點擊「取消」合併到現有任務中`
                        );

                        if (choice) {
                            tasks = imported.map(t => ({
                                ...t,
                                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            }));
                        } else {
                            for (const t of imported) {
                                tasks.push({
                                    ...t,
                                    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                                    createdAt: new Date().toISOString(),
                                    updatedAt: new Date().toISOString()
                                });
                            }
                        }

                        saveTasks();
                        showToast(`📥 成功匯入 ${imported.length} 個任務！`);
                        closeToolsMenu();
                        filterBtns.forEach(b => b.classList.remove('active'));
                        document.querySelector('[data-filter="all"]').classList.add('active');
                        currentFilter = 'all';
                        render();

                    } catch (err) {
                        console.error(err);
                        showToast('⚠️ 匯入失敗：' + err.message);
                    }
                };
                reader.readAsText(file, 'UTF-8');
            }

            importBtn.addEventListener('click', function() {
                fileInput.click();
                closeToolsMenu();
            });

            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    importTxt(this.files[0]);
                }
                this.value = '';
            });

            // ============================================================
            //  13. 清除所有任務
            // ============================================================
            clearAllBtn.addEventListener('click', function() {
                clearAllTasks();
            });

            // ============================================================
            //  14. FAB
            // ============================================================
            fab.addEventListener('click', function() {
                resetForm();
                openForm();
                closeToolsMenu();
            });

            // ============================================================
            //  15. Toast
            // ============================================================
            let toastTimer = null;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2600);
            }

            // ============================================================
            //  16. 鍵盤快速鍵
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (mobileFormContainer.classList.contains('open')) {
                        closeMobileFormHandler();
                    }
                    if (toolsMenu.classList.contains('open')) {
                        closeToolsMenu();
                    }
                }
                if (e.key === 'D' && e.ctrlKey && e.shiftKey) {
                    e.preventDefault();
                    applyTheme(!isDark);
                }
            });

            // ============================================================
            //  17. 初始化
            // ============================================================
            render();

            resetForm();
            mobileFormContainer.classList.remove('open');
            mobileFormContainer.style.display = 'none';
            mobileFormOverlay.classList.remove('open');
            document.body.style.overflow = '';

            console.log('📝 每日任務已載入，任務數:', tasks.length);
            console.log('🌓 暗色模式:', isDark ? '開啟' : '關閉');
            console.log('💡 快捷鍵: Ctrl+Shift+D 切換暗色模式');
            console.log('⬆️⬇️ 在「所有」視圖下可使用上下按鈕調整任務順序');

        })();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
