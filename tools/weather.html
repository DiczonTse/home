<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港實時天氣預報</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .weather-box {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-sizing: border-box;
        }
        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="weather-box">
    <div class="title">☀️ 香港天文台實時天氣</div>
    
    <!-- 直接呼叫官方天氣簡報小工具，100% 不會發生 CORS 跨域封鎖 -->
    <iframe 
        src="https://hko.gov.hk" 
        width="300" 
        height="320" 
        frameborder="0" 
        scrolling="no" 
        allowtransparency="true">
    </iframe>
</div>

</body>
</html>
