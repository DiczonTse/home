<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時香港天氣預報 (國際備用源)</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .weather-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .location {
            font-size: 1.4rem;
            font-weight: bold;
        }
        .update-time {
            font-size: 0.8rem;
            color: var(--text-sub);
        }
        .main-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }
        .temp-box {
            font-size: 3.5rem;
            font-weight: 300;
            display: flex;
        }
        .unit {
            font-size: 1.5rem;
            margin-top: 8px;
            margin-left: 2px;
        }
        .weather-icon-text {
            font-size: 4rem;
            line-height: 1;
        }
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #f7f9fa;
            padding: 15px;
            border-radius: 12px;
        }
        .detail-item {
            font-size: 0.9rem;
            color: var(--text-sub);
        }
        .detail-item span {
            display: block;
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
            margin-top: 4px;
        }
        .loading {
            text-align: center;
            color: var(--text-sub);
            padding: 40px 0;
        }
    </style>
</head>
<body>

<div class="weather-card" id="weather-card">
    <div class="loading">正在連線備用氣象數據庫...</div>
</div>

<script>
    // 經緯度定位為香港中心區域 (尖沙咀/中環附近)
    const backupApiUrl = 'https://open-meteo.com';

    // 國際標準 WMO 天氣代碼轉換為中文描述與表情符號
    function getWeatherDesc(code) {
        const mapping = {
            0: { desc: '天色晴朗', icon: '☀️' },
            1: { desc: '大體天晴', icon: '🌤️' },
            2: { desc: '短暫陽光', icon: '⛅' },
            3: { desc: '多雲密佈', icon: '☁️' },
            45: { desc: '有霧', icon: '🌫️' },
            48: { desc: '霧淞現象', icon: '🌫️' },
            51: { desc: '微毛毛雨', icon: '🌧️' },
            53: { desc: '毛毛雨', icon: '🌧️' },
            55: { desc: '密集毛毛雨', icon: '🌧️' },
            61: { desc: '局部地區有雨', icon: '🌦️' },
            63: { desc: '有幾陣驟雨', icon: '🌧️' },
            65: { desc: '大雨', icon: '🌧️' },
            71: { desc: '有微雪', icon: '❄️' },
            73: { desc: '有雪', icon: '❄️' },
            75: { desc: '大雪', icon: '❄️' },
            80: { desc: '陣雨', icon: '🌦️' },
            81: { desc: '有大驟雨', icon: '🌧️' },
            82: { desc: '狂風暴雨', icon: '⛈️' },
            95: { desc: '局部地區有雷暴', icon: '⛈️' },
            96: { desc: '雷暴伴隨冰雹', icon: '⛈️' }
        };
        return mapping[code] || { desc: '一般天氣', icon: '🌤️' };
    }

    async function fetchWeather() {
        try {
            const response = await fetch(backupApiUrl);
            if (!response.ok) throw new Error('網絡連線逾時');
            const data = await response.json();
            renderWeather(data);
        } catch (error) {
            document.getElementById('weather-card').innerHTML = `
                <div class="loading" style="color: #ff3b30;">
                    <strong>⚠️ 無法獲取氣象數據</strong><br>
                    <small style="color: #999; display:block; margin-top:5px;">請檢查你的網絡是否開啟了代理或防火牆限制。</small>
                </div>
            `;
        }
    }

    function renderWeather(data) {
        const current = data.current;
        const temp = Math.round(current.temperature_2m * 10) / 10;
        const humidity = current.relative_humidity_2m;
        const windSpeed = current.wind_speed_10m;
        const weatherInfo = getWeatherDesc(current.weather_code);
        
        // 格式化當前系統時間
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

        document.getElementById('weather-card').innerHTML = `
            <div class="header">
                <div>
                    <div class="location">香港 (國際源)</div>
                    <div class="update-time">系統實時 ${timeStr} 更新</div>
                </div>
            </div>
            
            <div class="main-info">
                <div class="temp-box">
                    ${temp}<span class="unit">°C</span>
                </div>
                <div class="weather-icon-text">${weatherInfo.icon}</div>
            </div>

            <div class="details">
                <div class="detail-item">
                    相對濕度
                    <span>${humidity}%</span>
                </div>
                <div class="detail-item">
                    風速
                    <span>${windSpeed} km/h</span>
                </div>
            </div>

            <div style="font-size: 0.9rem; line-height: 1.5; color: var(--text-sub); border-top: 1px solid #eee; padding-top: 15px; margin-top: 15px;">
                <strong>現時天氣狀況：</strong>${weatherInfo.desc}
            </div>
        `;
    }

    fetchWeather();
    // 每 5 分鐘自動刷新
    setInterval(fetchWeather, 300000);
</script>

</body>
</html>
