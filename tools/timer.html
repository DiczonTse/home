        function chStopAll() {
            if (chess.timerId) {
                clearInterval(chess.timerId);
                chess.timerId = null;
            }
            chess.left.running = false;
            chess.right.running = false;
            chess.left.active = false;
            chess.right.active = false;
            chess.started = false;
        }

        function chStartSide(side) {
            if (!chess.started) {
                chess.started = true;
                chess.left.time = chess.left.total;
                chess.right.time = chess.right.total;
                chess.left.paused = false;
                chess.right.paused = false;
            }
            if (side === 'left' && chess.left.paused) {
                chess.left.paused = false;
                chess.left.running = true;
                chess.left.active = true;
                chess.right.active = false;
                if (chess.timerId) clearInterval(chess.timerId);
                chess.timerId = setInterval(() => {
                    if (chess.left.active) {
                        chess.left.time -= 0.1;
                        if (chess.left.time <= 0) {
                            chess.left.time = 0;
                            chStopAll();
                            chUpdateUI();
                            beep();
                            setTimeout(() => beep(), 400);
                            chSub.textContent = '🏆 白棋時間用盡！';
                            return;
                        }
                        chUpdateUI();
                    }
                }, 100);
                chUpdateUI();
                chSub.textContent = '⚪ 白棋計時中...';
                return;
            }
            if (side === 'right' && chess.right.paused) {
                chess.right.paused = false;
                chess.right.running = true;
                chess.right.active = true;
                chess.left.active = false;
                if (chess.timerId) clearInterval(chess.timerId);
                chess.timerId = setInterval(() => {
                    if (chess.right.active) {
                        chess.right.time -= 0.1;
                        if (chess.right.time <= 0) {
                            chess.right.time = 0;
                            chStopAll();
                            chUpdateUI();
                            beep();
                            setTimeout(() => beep(), 400);
                            chSub.textContent = '🏆 黑棋時間用盡！';
                            return;
                        }
                        chUpdateUI();
                    }
                }, 100);
                chUpdateUI();
                chSub.textContent = '⚫ 黑棋計時中...';
                return;
            }

            if (side === 'left') {
                if (chess.left.running && chess.left.active) {
                    chess.left.running = false;
                    chess.left.active = false;
                    chess.left.paused = true;
                    if (chess.timerId) clearInterval(chess.timerId);
                    chUpdateUI();
                    chSub.textContent = '⏸ 白棋暫停';
                    return;
                }
                chStopAll();
                chess.left.running = true;
                chess.left.active = true;
                chess.left.paused = false;
                chess.right.active = false;
                chess.right.running = false;
                chess.started = true;
                if (chess.left.time <= 0) chess.left.time = chess.left.total;
                chess.timerId = setInterval(() => {
                    if (chess.left.active) {
                        chess.left.time -= 0.1;
                        if (chess.left.time <= 0) {
                            chess.left.time = 0;
                            chStopAll();
                            chUpdateUI();
                            beep();
                            setTimeout(() => beep(), 400);
                            chSub.textContent = '🏆 白棋時間用盡！';
                            return;
                        }
                        chUpdateUI();
                    }
                }, 100);
                chUpdateUI();
                chSub.textContent = '⚪ 白棋計時中...';
            } else if (side === 'right') {
                if (chess.right.running && chess.right.active) {
                    chess.right.running = false;
                    chess.right.active = false;
                    chess.right.paused = true;
                    if (chess.timerId) clearInterval(chess.timerId);
                    chUpdateUI();
                    chSub.textContent = '⏸ 黑棋暫停';
                    return;
                }
                chStopAll();
                chess.right.running = true;
                chess.right.active = true;
                chess.right.paused = false;
                chess.left.active = false;
                chess.left.running = false;
                chess.started = true;
                if (chess.right.time <= 0) chess.right.time = chess.right.total;
                chess.timerId = setInterval(() => {
                    if (chess.right.active) {
                        chess.right.time -= 0.1;
                        if (chess.right.time <= 0) {
                            chess.right.time = 0;
                            chStopAll();
                            chUpdateUI();
                            beep();
                            setTimeout(() => beep(), 400);
                            chSub.textContent = '🏆 黑棋時間用盡！';
                            return;
                        }
                        chUpdateUI();
                    }
                }, 100);
                chUpdateUI();
                chSub.textContent = '⚫ 黑棋計時中...';
            }
        }

        chLeft.addEventListener('click', () => {
            if (chess.left.time <= 0 || chess.right.time <= 0) { chResetTimer(); return; }
            chStartSide('left');
        });
        chRight.addEventListener('click', () => {
            if (chess.left.time <= 0 || chess.right.time <= 0) { chResetTimer(); return; }
            chStartSide('right');
        });
        chLeftStart.addEventListener('click', (e) => {
            e.stopPropagation();
            if (chess.left.time <= 0 || chess.right.time <= 0) { chResetTimer(); return; }
            chStartSide('left');
        });
        chRightStart.addEventListener('click', (e) => {
            e.stopPropagation();
            if (chess.left.time <= 0 || chess.right.time <= 0) { chResetTimer(); return; }
            chStartSide('right');
        });

        function chResetTimer() {
            chStopAll();
            chess.left.time = chess.left.total;
            chess.right.time = chess.right.total;
            chess.left.paused = false;
            chess.right.paused = false;
            chess.left.active = false;
            chess.right.active = false;
            chess.started = false;
            chUpdateUI();
            chSub.textContent = '已重置，點擊任一側開始';
        }

        chReset.addEventListener('click', chResetTimer);
        chUpdateUI();
        chSub.textContent = '點擊任一側開始計時，再點擊切換';

        // ============================================================
        //  鍵盤快捷鍵
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                const activePanel = document.querySelector('.panel.active');
                if (!activePanel) return;
                const id = activePanel.id;
                const map = {
                    'panel-countdown': { start: cdStart, pause: cdPause },
                    'panel-pomodoro': { start: pomoStart, pause: pomoPause },
                    'panel-stopwatch': { start: swStart, pause: swPause },
                    'panel-hourglass': { start: hgStart, pause: hgPause },
                    'panel-visual': { start: visStart, pause: visPause },
                    'panel-chess': { start: null, pause: null },
                };
                const ctrl = map[id];
                if (!ctrl) return;
                if (ctrl.pause && !ctrl.pause.disabled) {
                    ctrl.pause.click();
                } else if (ctrl.start && !ctrl.start.disabled) {
                    ctrl.start.click();
                }
            }
            if (e.key === 'r' || e.key === 'R') {
                const activePanel = document.querySelector('.panel.active');
                if (!activePanel) return;
                const id = activePanel.id;
                const map = {
                    'panel-countdown': cdReset,
                    'panel-pomodoro': pomoReset,
                    'panel-stopwatch': swReset,
                    'panel-hourglass': hgReset,
                    'panel-visual': visReset,
                    'panel-chess': chReset,
                };
                if (map[id]) map[id].click();
            }
        });

        // ============================================================
        //  頁腳年份
        // ============================================================
        const footer = document.querySelector('.footer');
        const year = new Date().getFullYear();
        footer.textContent = `v1.0 ${year} ☕ 迪遜咖啡廳，版權所有。`;

        console.log('⏱️ 多用途計時器 v1.0 已載入 (沙漏採用全新繪製)');
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/sw.js').catch(() => {});
		}
    </script>
</body>
</html>
