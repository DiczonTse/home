<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多用途計時器</title>
    <style>
        /* ===== CSS 變數 & 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        :root {
            --bg-primary: #f5f7fb;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-tab: #eef1f5;
            --bg-tab-active: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888aa;
            --border: #dce0e8;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #eef2ff;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --radius-sm: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --transition: 0.25s ease;
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #1e1e36;
            --bg-tab: #2a2a44;
            --bg-tab-active: #1e1e36;
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0d0;
            --text-muted: #6a6a8a;
            --border: #2e2e4a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --accent-light: #1e1e3a;
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        /* ===== 應用容器 ===== */
        .app {
            max-width: 820px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px 16px;
            display: flex;
            flex-direction: column;
            height: fit-content;
            min-height: 92vh;
        }

        /* ===== 頂部標頭 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .theme-toggle {
            background: var(--bg-tab);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: var(--border);
        }

        .theme-toggle .icon {
            font-size: 18px;
        }

        /* ===== 標籤導航 ===== */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 16px 0 18px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: var(--bg-tab);
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        /* ===== 計時器內容區 ===== */
        .timer-panels {
            flex: 1;
            position: relative;
        }

        .panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 計時器通用卡片 ===== */
        .timer-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 24px 24px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .timer-display {
            font-size: 64px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            text-align: center;
            padding: 8px 0 4px;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .timer-display.small {
            font-size: 48px;
        }

        .timer-display.large {
            font-size: 72px;
        }

        .timer-sub {
            text-align: center;
            font-size: 15px;
            color: var(--text-muted);
            margin-top: 2px;
            min-height: 24px;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .timer-controls .btn {
            padding: 10px 26px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-tab);
            color: var(--text-secondary);
            min-width: 80px;
        }

        .timer-controls .btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .timer-controls .btn.primary {
            background: var(--accent);
            color: #fff;
        }

        .timer-controls .btn.primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }

        .timer-controls .btn.success {
            background: var(--success);
            color: #fff;
        }

        .timer-controls .btn.success:hover {
            filter: brightness(1.1);
        }

        .timer-controls .btn.danger {
            background: var(--danger);
            color: #fff;
        }

        .timer-controls .btn.danger:hover {
            filter: brightness(1.1);
        }

        .timer-controls .btn.warning {
            background: var(--warning);
            color: #1a1a2e;
        }

        .timer-controls .btn.warning:hover {
            filter: brightness(1.08);
        }

        .timer-controls .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== 輸入群組 ===== */
        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0 6px;
            flex-wrap: wrap;
        }

        .input-group label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .input-group input[type="number"] {
            width: 64px;
            padding: 8px 4px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        .input-group input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .input-group .colon {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* ===== 蕃茄鐘特殊 ===== */
        .pomodoro-status {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            padding: 6px 0 2px;
            color: var(--accent);
        }

        .pomodoro-count {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .pomodoro-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 12px 0 6px;
            flex-wrap: wrap;
        }

        .pomodoro-settings label {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pomodoro-settings input {
            width: 52px;
            padding: 4px 2px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
        }

        .pomodoro-settings input:focus {
            border-color: var(--accent);
        }

        /* ===== 碼錶 ===== */
        .lap-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 16px;
            padding-right: 6px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .lap-list::-webkit-scrollbar {
            width: 4px;
        }

        .lap-list::-webkit-scrollbar-track {
            background: var(--bg-tab);
            border-radius: 8px;
        }

        .lap-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 8px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 4px;
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .lap-item:last-child {
            border-bottom: none;
        }

        .lap-item .lap-num {
            font-weight: 600;
            color: var(--text-muted);
        }

        .lap-item .lap-time {
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .lap-item .lap-best {
            color: var(--success);
            font-weight: 600;
        }

        /* ===== 沙漏 Canvas ===== */
        .hourglass-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 6px 0 4px;
        }

        .hourglass-container canvas {
            border-radius: var(--radius-sm);
            background: radial-gradient(ellipse at 50% 30%, #2a2a4a, #0d0d1a);
            max-width: 100%;
            height: auto;
            width: 100%;
            aspect-ratio: 400 / 480;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5), 0 8px 32px rgba(0, 0, 0, 0.4);
            touch-action: none;
        }

        .hourglass-time {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-top: 8px;
            color: var(--text-primary);
        }

        /* ===== 視覺計時器 (圓環) ===== */
        .radial-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px 0 2px;
        }

        .radial-container svg {
            display: block;
            max-width: 200px;
            width: 100%;
            height: auto;
            transform: rotate(-90deg);
        }

        .radial-container .radial-bg {
            fill: none;
            stroke: var(--bg-tab);
            stroke-width: 8;
        }

        .radial-container .radial-progress {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.15s linear, stroke 0.3s ease;
        }

        .radial-container .radial-center {
            transform: rotate(90deg);
            font-size: 26px;
            font-weight: 700;
            fill: var(--text-primary);
            text-anchor: middle;
            dominant-baseline: central;
        }

        .radial-container .radial-label {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ===== 國際象棋雙面計時鐘 ===== */
        .chess-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 8px 0 4px;
        }

        .chess-side {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 20px 12px 16px;
            border: 3px solid var(--border);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .chess-side.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: var(--accent-light);
        }

        .chess-side.paused {
            border-color: var(--warning);
        }

        .chess-side .chess-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .chess-side .chess-time {
            font-size: 40px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .chess-side .chess-status {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            min-height: 20px;
        }

        .chess-side .chess-controls {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .chess-side .chess-controls .btn {
            padding: 6px 16px;
            font-size: 13px;
            min-width: 60px;
        }

        .chess-reset-btn {
            grid-column: 1 / -1;
            justify-self: center;
            margin-top: 6px;
        }

        /* ===== 頁腳 ===== */
        .footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            padding: 18px 0 6px;
            border-top: 1px solid var(--border);
            margin-top: 20px;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 700px) {
            .app {
                padding: 16px 14px 10px;
                min-height: 96vh;
            }

            .header h1 {
                font-size: 20px;
            }

            .timer-display {
                font-size: 48px;
            }
            .timer-display.large {
                font-size: 56px;
            }
            .timer-display.small {
                font-size: 38px;
            }

            .tab-btn {
                font-size: 12px;
                padding: 6px 14px;
            }

            .timer-controls .btn {
                padding: 8px 18px;
                font-size: 13px;
                min-width: 64px;
            }

            .chess-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .chess-side .chess-time {
                font-size: 32px;
            }

            .radial-container svg {
                max-width: 160px;
            }

            .timer-card {
                padding: 18px 14px 16px;
            }

            .input-group input[type="number"] {
                width: 52px;
                font-size: 16px;
            }

            .pomodoro-settings {
                gap: 12px;
            }
        }

        @media (max-width: 420px) {
            .timer-display {
                font-size: 38px;
            }
            .timer-display.large {
                font-size: 44px;
            }
            .timer-display.small {
                font-size: 30px;
            }
            .header h1 {
                font-size: 17px;
            }
            .tab-btn {
                font-size: 11px;
                padding: 5px 10px;
            }
            .timer-controls .btn {
                padding: 6px 12px;
                font-size: 12px;
                min-width: 52px;
            }
            .chess-side .chess-time {
                font-size: 26px;
            }
        }

        /* ===== 工具類 ===== */
        .mt-2 {
            margin-top: 8px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .gap-2 {
            gap: 8px;
        }
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 閃爍提示 */
        .blink-warning {
            animation: blink 0.5s ease-in-out 3;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* 沙漏完成徽章 */
        .complete-badge {
            display: none;
            text-align: center;
            font-size: 14px;
            color: #f6c977;
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 1px;
            animation: pulse-glow 1.2s ease-in-out infinite;
        }
        .complete-badge.show {
            display: block;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* 沙漏的預設按鈕群組 */
        .hg-presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        .hg-presets button {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--bg-tab);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .hg-presets button:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        .hg-presets button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ===== 標頭 ===== -->
        <header class="header">
            <h1>⏱️ 多用途計時器</h1>
            <div class="header-controls">
                <button class="theme-toggle" id="themeToggle" aria-label="切換黑暗模式">
                    <span class="icon" id="themeIcon">🌙</span>
                    <span id="themeLabel">暗色</span>
                </button>
            </div>
        </header>

        <!-- ===== 標籤 ===== -->
        <nav class="tabs" id="tabNav">
            <button class="tab-btn active" data-tab="countdown">⏰ 倒數</button>
            <button class="tab-btn" data-tab="pomodoro">🍅 蕃茄鐘</button>
            <button class="tab-btn" data-tab="stopwatch">⏱️ 碼錶</button>
            <button class="tab-btn" data-tab="hourglass">⌛ 沙漏</button>
            <button class="tab-btn" data-tab="visual">🎯 視覺</button>
            <button class="tab-btn" data-tab="chess">♟️ 棋鐘</button>
        </nav>

        <!-- ===== 面板 ===== -->
        <div class="timer-panels">

            <!-- 1. 倒數計時器 -->
            <div class="panel active" id="panel-countdown">
                <div class="timer-card">
                    <div class="input-group">
                        <label>分</label>
                        <input type="number" id="cdMinutes" value="5" min="0" max="99">
                        <span class="colon">:</span>
                        <label>秒</label>
                        <input type="number" id="cdSeconds" value="0" min="0" max="59">
                    </div>
                    <div class="timer-display large" id="cdDisplay">05:00</div>
                    <div class="timer-sub" id="cdSub">設定時間後按開始</div>
                    <div class="timer-controls">
                        <button class="btn primary" id="cdStart">▶ 開始</button>
                        <button class="btn warning" id="cdPause" disabled>⏸ 暫停</button>
                        <button class="btn danger" id="cdReset">↺ 重置</button>
                    </div>
                </div>
            </div>

            <!-- 2. 蕃茄鐘 -->
            <div class="panel" id="panel-pomodoro">
                <div class="timer-card">
                    <div class="pomodoro-status" id="pomoStatus">🍅 工作</div>
                    <div class="timer-display large" id="pomoDisplay">25:00</div>
                    <div class="pomodoro-count" id="pomoCount">已完成: 0 個蕃茄</div>
                    <div class="pomodoro-settings">
                        <label>工作 <input type="number" id="pomoWork" value="25" min="1" max="99"> 分</label>
                        <label>休息 <input type="number" id="pomoRest" value="5" min="1" max="99"> 分</label>
                    </div>
                    <div class="timer-controls">
                        <button class="btn primary" id="pomoStart">▶ 開始</button>
                        <button class="btn warning" id="pomoPause" disabled>⏸ 暫停</button>
                        <button class="btn danger" id="pomoReset">↺ 重置</button>
                    </div>
                </div>
            </div>

            <!-- 3. 碼錶 -->
            <div class="panel" id="panel-stopwatch">
                <div class="timer-card">
                    <div class="timer-display" id="swDisplay">00:00:00.0</div>
                    <div class="timer-sub" id="swSub">點按「記錄圈數」計圈</div>
                    <div class="timer-controls">
                        <button class="btn primary" id="swStart">▶ 開始</button>
                        <button class="btn warning" id="swPause" disabled>⏸ 暫停</button>
                        <button class="btn success" id="swLap" disabled>🔁 記錄圈數</button>
                        <button class="btn danger" id="swReset">↺ 重置</button>
                    </div>
                    <div class="lap-list" id="swLapList"></div>
                </div>
            </div>

            <!-- 4. 沙漏 (全新繪製) -->
            <div class="panel" id="panel-hourglass">
                <div class="timer-card">
                    <div class="input-group">
                        <label>秒數</label>
                        <input type="number" id="hgSeconds" value="60" min="5" max="3600" step="5">
                    </div>
                    <div class="hourglass-container">
                        <canvas id="hgCanvas" width="400" height="480"></canvas>
                        <div class="complete-badge" id="hgCompleteBadge">✨ 計時完成 ✨</div>
                    </div>
                    <div class="hourglass-time" id="hgDisplay">01:00</div>
                    <div class="timer-sub" id="hgSub">設定秒數後按開始</div>
                    <div class="timer-controls">
                        <button class="btn primary" id="hgStart">▶ 開始</button>
                        <button class="btn warning" id="hgPause" disabled>⏸ 暫停</button>
                        <button class="btn danger" id="hgReset">↺ 重置</button>
                    </div>
                    <div class="hg-presets">
                        <button data-seconds="30">30s</button>
                        <button data-seconds="60" class="active">1m</button>
                        <button data-seconds="120">2m</button>
                        <button data-seconds="300">5m</button>
                        <button data-seconds="600">10m</button>
                    </div>
                </div>
            </div>

            <!-- 5. 視覺計時器 (圓環) -->
            <div class="panel" id="panel-visual">
                <div class="timer-card">
                    <div class="input-group">
                        <label>秒數</label>
                        <input type="number" id="visSeconds" value="30" min="1" max="300">
                    </div>
                    <div class="radial-container">
                        <svg viewBox="0 0 120 120" id="visSvg">
                            <circle class="radial-bg" cx="60" cy="60" r="50" />
                            <circle class="radial-progress" id="visCircle" cx="60" cy="60" r="50"
                            stroke-dasharray="314.159" stroke-dashoffset="0" />
                            <text class="radial-center" x="60" y="60" id="visText">30</text>
                        </svg>
                        <div class="radial-label" id="visLabel">設定秒數後開始</div>
                    </div>
                    <div class="timer-controls">
                        <button class="btn primary" id="visStart">▶ 開始</button>
                        <button class="btn warning" id="visPause" disabled>⏸ 暫停</button>
                        <button class="btn danger" id="visReset">↺ 重置</button>
                    </div>
                </div>
            </div>

            <!-- 6. 國際象棋雙面計時鐘 -->
            <div class="panel" id="panel-chess">
                <div class="timer-card">
                    <div class="chess-container" id="chessContainer">
                        <div class="chess-side" id="chessLeft">
                            <div class="chess-label">⚪ 白棋</div>
                            <div class="chess-time" id="chLeftTime">10:00</div>
                            <div class="chess-status" id="chLeftStatus">等待開始</div>
                            <div class="chess-controls">
                                <button class="btn primary" id="chLeftStart">▶</button>
                            </div>
                        </div>
                        <div class="chess-side" id="chessRight">
                            <div class="chess-label">⚫ 黑棋</div>
                            <div class="chess-time" id="chRightTime">10:00</div>
                            <div class="chess-status" id="chRightStatus">等待開始</div>
                            <div class="chess-controls">
                                <button class="btn primary" id="chRightStart">▶</button>
                            </div>
                        </div>
                    </div>
                    <div class="timer-controls chess-reset-btn">
                        <button class="btn danger" id="chReset">↺ 重置全部</button>
                    </div>
                    <div class="timer-sub" id="chSub">點擊任一側開始計時，再點擊切換</div>
                </div>
            </div>

        </div>

        <!-- ===== 頁腳 ===== -->
        <footer class="footer">
            v1.0 2026 ☕ 迪遜咖啡廳，版權所有。
        </footer>
    </div>

    <script>
        // ============================================================
        //  工具函數
        // ============================================================
        function pad(n, d = 2) { return String(n).padStart(d, '0'); }

        function fmtTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return pad(m) + ':' + pad(s);
        }

        function fmtTimeMs(ms) {
            const totalSec = ms / 1000;
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = Math.floor(totalSec % 60);
            const ds = Math.floor((ms % 1000) / 100);
            if (h > 0) return pad(h) + ':' + pad(m) + ':' + pad(s) + '.' + ds;
            return pad(m) + ':' + pad(s) + '.' + ds;
        }

        function beep() {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.15;
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.25);
                setTimeout(() => ctx.close(), 300);
            } catch (_) { /* 靜音降級 */ }
        }

        // ============================================================
        //  主題切換
        // ============================================================
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        let darkMode = localStorage.getItem('timer-theme') === 'dark';

        function applyTheme(dark) {
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            themeIcon.textContent = dark ? '☀️' : '🌙';
            themeLabel.textContent = dark ? '亮色' : '暗色';
            localStorage.setItem('timer-theme', dark ? 'dark' : 'light');
        }

        applyTheme(darkMode);
        themeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            applyTheme(darkMode);
        });

        // ============================================================
        //  標籤切換
        // ============================================================
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panels = {
            countdown: document.getElementById('panel-countdown'),
            pomodoro: document.getElementById('panel-pomodoro'),
            stopwatch: document.getElementById('panel-stopwatch'),
            hourglass: document.getElementById('panel-hourglass'),
            visual: document.getElementById('panel-visual'),
            chess: document.getElementById('panel-chess'),
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const key = btn.dataset.tab;
                Object.keys(panels).forEach(k => {
                    panels[k].classList.toggle('active', k === key);
                });
                if (key === 'hourglass') {
                    // 重繪沙漏
                    setTimeout(() => { hgDraw(); }, 50);
                }
            });
        });

        // ============================================================
        //  1. 倒數計時器
        // ============================================================
        const cd = {
            total: 300,
            remaining: 300,
            timerId: null,
            running: false,
            paused: false,
            ended: false,
        };

        const cdDisplay = document.getElementById('cdDisplay');
        const cdSub = document.getElementById('cdSub');
        const cdMinutes = document.getElementById('cdMinutes');
        const cdSeconds = document.getElementById('cdSeconds');
        const cdStart = document.getElementById('cdStart');
        const cdPause = document.getElementById('cdPause');
        const cdReset = document.getElementById('cdReset');

        function cdUpdateDisplay() {
            cdDisplay.textContent = fmtTime(cd.remaining);
            if (cd.remaining <= 0) {
                cdDisplay.textContent = '00:00';
            }
        }

        function cdSyncInputs() {
            const m = parseInt(cdMinutes.value) || 0;
            const s = parseInt(cdSeconds.value) || 0;
            cd.total = m * 60 + s;
            if (!cd.running && !cd.paused) {
                cd.remaining = cd.total;
                cdUpdateDisplay();
                cdSub.textContent = '設定時間後按開始';
            }
        }

        cdMinutes.addEventListener('change', cdSyncInputs);
        cdSeconds.addEventListener('change', cdSyncInputs);

        function cdStartTimer() {
            if (cd.running) return;
            if (cd.remaining <= 0) {
                cd.remaining = cd.total;
                cdUpdateDisplay();
            }
            cd.running = true;
            cd.paused = false;
            cd.ended = false;
            cdStart.disabled = true;
            cdPause.disabled = false;
            cdPause.textContent = '⏸ 暫停';
            cdSub.textContent = '⏳ 倒數中...';
            cdDisplay.classList.remove('blink-warning');
            cd.timerId = setInterval(() => {
                cd.remaining -= 1;
                cdUpdateDisplay();
                if (cd.remaining <= 0) {
                    clearInterval(cd.timerId);
                    cd.timerId = null;
                    cd.running = false;
                    cd.ended = true;
                    cdStart.disabled = false;
                    cdPause.disabled = true;
                    cdSub.textContent = '⏰ 時間到！';
                    cdDisplay.classList.add('blink-warning');
                    beep();
                    setTimeout(() => beep(), 400);
                }
            }, 1000);
        }

        function cdPauseTimer() {
            if (!cd.running) return;
            clearInterval(cd.timerId);
            cd.timerId = null;
            cd.running = false;
            cd.paused = true;
            cdStart.disabled = false;
            cdPause.disabled = true;
            cdSub.textContent = '⏸ 已暫停';
            cdStart.textContent = '▶ 繼續';
        }

        function cdResetTimer() {
            clearInterval(cd.timerId);
            cd.timerId = null;
            cd.running = false;
            cd.paused = false;
            cd.ended = false;
            cdStart.disabled = false;
            cdPause.disabled = true;
            cdStart.textContent = '▶ 開始';
            cdDisplay.classList.remove('blink-warning');
            cdSyncInputs();
            cdSub.textContent = '已重置';
        }

        cdStart.addEventListener('click', () => {
            if (cd.paused) {
                cd.running = true;
                cd.paused = false;
                cdStart.disabled = true;
                cdPause.disabled = false;
                cdPause.textContent = '⏸ 暫停';
                cdSub.textContent = '⏳ 倒數中...';
                cd.timerId = setInterval(() => {
                    cd.remaining -= 1;
                    cdUpdateDisplay();
                    if (cd.remaining <= 0) {
                        clearInterval(cd.timerId);
                        cd.timerId = null;
                        cd.running = false;
                        cd.ended = true;
                        cdStart.disabled = false;
                        cdPause.disabled = true;
                        cdSub.textContent = '⏰ 時間到！';
                        cdDisplay.classList.add('blink-warning');
                        beep();
                        setTimeout(() => beep(), 400);
                    }
                }, 1000);
            } else {
                cdStartTimer();
            }
        });

        cdPause.addEventListener('click', cdPauseTimer);
        cdReset.addEventListener('click', cdResetTimer);

        cdSyncInputs();

        // ============================================================
        //  2. 蕃茄鐘
        // ============================================================
        const pomo = {
            workTime: 25 * 60,
            restTime: 5 * 60,
            remaining: 25 * 60,
            phase: 'work',
            count: 0,
            running: false,
            paused: false,
            timerId: null,
        };

        const pomoDisplay = document.getElementById('pomoDisplay');
        const pomoStatus = document.getElementById('pomoStatus');
        const pomoCount = document.getElementById('pomoCount');
        const pomoWork = document.getElementById('pomoWork');
        const pomoRest = document.getElementById('pomoRest');
        const pomoStart = document.getElementById('pomoStart');
        const pomoPause = document.getElementById('pomoPause');
        const pomoReset = document.getElementById('pomoReset');

        function pomoUpdateDisplay() {
            pomoDisplay.textContent = fmtTime(pomo.remaining);
            pomoStatus.textContent = pomo.phase === 'work' ? '🍅 工作中' : '☕ 休息中';
            pomoStatus.style.color = pomo.phase === 'work' ? 'var(--danger)' : 'var(--success)';
            pomoCount.textContent = `已完成: ${pomo.count} 個蕃茄`;
        }

        function pomoSyncSettings() {
            const w = parseInt(pomoWork.value) || 25;
            const r = parseInt(pomoRest.value) || 5;
            pomo.workTime = w * 60;
            pomo.restTime = r * 60;
            if (!pomo.running && !pomo.paused) {
                pomo.remaining = pomo.phase === 'work' ? pomo.workTime : pomo.restTime;
                pomoUpdateDisplay();
            }
        }

        pomoWork.addEventListener('change', pomoSyncSettings);
        pomoRest.addEventListener('change', pomoSyncSettings);

        function pomoStartTimer() {
            if (pomo.running) return;
            if (pomo.remaining <= 0) {
                pomo.remaining = pomo.phase === 'work' ? pomo.workTime : pomo.restTime;
                pomoUpdateDisplay();
            }
            pomo.running = true;
            pomo.paused = false;
            pomoStart.disabled = true;
            pomoPause.disabled = false;
            pomoPause.textContent = '⏸ 暫停';
            pomo.timerId = setInterval(() => {
                pomo.remaining -= 1;
                pomoUpdateDisplay();
                if (pomo.remaining <= 0) {
                    clearInterval(pomo.timerId);
                    pomo.timerId = null;
                    pomo.running = false;
                    pomoStart.disabled = false;
                    pomoPause.disabled = true;
                    beep();
                    setTimeout(() => beep(), 400);
                    if (pomo.phase === 'work') {
                        pomo.count += 1;
                        pomo.phase = 'rest';
                        pomo.remaining = pomo.restTime;
                        pomoUpdateDisplay();
                        pomoSubNotice('🍃 休息時間！');
                    } else {
                        pomo.phase = 'work';
                        pomo.remaining = pomo.workTime;
                        pomoUpdateDisplay();
                        pomoSubNotice('🍅 開始工作！');
                    }
                    pomoStart.disabled = false;
                    pomoPause.disabled = true;
                }
            }, 1000);
        }

        function pomoSubNotice(msg) {
            const el = document.createElement('div');
            el.textContent = msg;
            el.style.textAlign = 'center';
            el.style.fontSize = '15px';
            el.style.color = 'var(--text-secondary)';
            el.style.marginTop = '4px';
            el.style.fontWeight = '500';
            const old = document.querySelector('.pomo-notice');
            if (old) old.remove();
            el.className = 'pomo-notice';
            document.getElementById('panel-pomodoro').querySelector('.timer-card').appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 2500);
        }

        function pomoPauseTimer() {
            if (!pomo.running) return;
            clearInterval(pomo.timerId);
            pomo.timerId = null;
            pomo.running = false;
            pomo.paused = true;
            pomoStart.disabled = false;
            pomoPause.disabled = true;
            pomoStart.textContent = '▶ 繼續';
        }

        function pomoResetTimer() {
            clearInterval(pomo.timerId);
            pomo.timerId = null;
            pomo.running = false;
            pomo.paused = false;
            pomo.phase = 'work';
            pomo.remaining = pomo.workTime;
            pomoStart.disabled = false;
            pomoPause.disabled = true;
            pomoStart.textContent = '▶ 開始';
            pomoUpdateDisplay();
            const notice = document.querySelector('.pomo-notice');
            if (notice) notice.remove();
        }

        pomoStart.addEventListener('click', () => {
            if (pomo.paused) {
                pomo.running = true;
                pomo.paused = false;
                pomoStart.disabled = true;
                pomoPause.disabled = false;
                pomoPause.textContent = '⏸ 暫停';
                pomo.timerId = setInterval(() => {
                    pomo.remaining -= 1;
                    pomoUpdateDisplay();
                    if (pomo.remaining <= 0) {
                        clearInterval(pomo.timerId);
                        pomo.timerId = null;
                        pomo.running = false;
                        pomoStart.disabled = false;
                        pomoPause.disabled = true;
                        beep();
                        setTimeout(() => beep(), 400);
                        if (pomo.phase === 'work') {
                            pomo.count += 1;
                            pomo.phase = 'rest';
                            pomo.remaining = pomo.restTime;
                            pomoUpdateDisplay();
                            pomoSubNotice('🍃 休息時間！');
                        } else {
                            pomo.phase = 'work';
                            pomo.remaining = pomo.workTime;
                            pomoUpdateDisplay();
                            pomoSubNotice('🍅 開始工作！');
                        }
                        pomoStart.disabled = false;
                        pomoPause.disabled = true;
                    }
                }, 1000);
            } else {
                pomoStartTimer();
            }
        });

        pomoPause.addEventListener('click', pomoPauseTimer);
        pomoReset.addEventListener('click', pomoResetTimer);

        pomoUpdateDisplay();

        // ============================================================
        //  3. 碼錶
        // ============================================================
        const sw = {
            startTime: 0,
            elapsed: 0,
            running: false,
            timerId: null,
            laps: [],
            lapCount: 0,
            paused: false,
        };

        const swDisplay = document.getElementById('swDisplay');
        const swSub = document.getElementById('swSub');
        const swStart = document.getElementById('swStart');
        const swPause = document.getElementById('swPause');
        const swLap = document.getElementById('swLap');
        const swReset = document.getElementById('swReset');
        const swLapList = document.getElementById('swLapList');

        function swUpdateDisplay() {
            swDisplay.textContent = fmtTimeMs(sw.elapsed);
        }

        function swRenderLaps() {
            if (sw.laps.length === 0) {
                swLapList.innerHTML =
                    '<div style="text-align:center;color:var(--text-muted);padding:12px 0;font-size:14px;">尚無圈數記錄</div>';
                return;
            }
            let html = '';
            let best = Infinity;
            let bestIdx = -1;
            for (let i = 0; i < sw.laps.length; i++) {
                const t = sw.laps[i];
                if (t < best) { best = t;
                    bestIdx = i; }
            }
            sw.laps.forEach((t, i) => {
                const isBest = (i === bestIdx && sw.laps.length > 1);
                html += `<div class="lap-item">
                    <span class="lap-num">#${i+1}</span>
                    <span class="lap-time ${isBest?'lap-best':''}">${fmtTimeMs(t)} ${isBest?'⭐':''}</span>
                </div>`;
            });
            swLapList.innerHTML = html;
            swLapList.scrollTop = swLapList.scrollHeight;
        }

        function swStartTimer() {
            if (sw.running) return;
            if (sw.paused) {
                sw.running = true;
                sw.paused = false;
                sw.startTime = Date.now() - sw.elapsed;
                sw.timerId = setInterval(() => {
                    sw.elapsed = Date.now() - sw.startTime;
                    swUpdateDisplay();
                }, 100);
                swStart.disabled = true;
                swPause.disabled = false;
                swPause.textContent = '⏸ 暫停';
                swLap.disabled = false;
                swSub.textContent = '⏱️ 計時中...';
                return;
            }
            sw.elapsed = 0;
            sw.laps = [];
            sw.lapCount = 0;
            sw.running = true;
            sw.paused = false;
            sw.startTime = Date.now();
            sw.timerId = setInterval(() => {
                sw.elapsed = Date.now() - sw.startTime;
                swUpdateDisplay();
            }, 100);
            swStart.disabled = true;
            swPause.disabled = false;
            swPause.textContent = '⏸ 暫停';
            swLap.disabled = false;
            swSub.textContent = '⏱️ 計時中...';
            swRenderLaps();
        }

        function swPauseTimer() {
            if (!sw.running) return;
            clearInterval(sw.timerId);
            sw.timerId = null;
            sw.running = false;
            sw.paused = true;
            swStart.disabled = false;
            swPause.disabled = true;
            swLap.disabled = true;
            swStart.textContent = '▶ 繼續';
            swSub.textContent = '⏸ 已暫停';
        }

        function swLapTimer() {
            if (!sw.running) return;
            const lapTime = sw.elapsed - (sw.laps.reduce((a, b) => a + b, 0));
            sw.laps.push(lapTime);
            sw.lapCount++;
            swRenderLaps();
            swSub.textContent = `🏁 第 ${sw.lapCount} 圈記錄`;
            setTimeout(() => { swSub.textContent = '⏱️ 計時中...'; }, 1200);
        }

        function swResetTimer() {
            clearInterval(sw.timerId);
            sw.timerId = null;
            sw.running = false;
            sw.paused = false;
            sw.elapsed = 0;
            sw.laps = [];
            sw.lapCount = 0;
            swUpdateDisplay();
            swStart.disabled = false;
            swPause.disabled = true;
            swLap.disabled = true;
            swStart.textContent = '▶ 開始';
            swSub.textContent = '已重置';
            swRenderLaps();
        }

        swStart.addEventListener('click', swStartTimer);
        swPause.addEventListener('click', swPauseTimer);
        swLap.addEventListener('click', swLapTimer);
        swReset.addEventListener('click', swResetTimer);

        swRenderLaps();

        // ============================================================
        //  4. 沙漏 (採用精美繪製)
        // ============================================================
        const hg = {
            total: 60,
            remaining: 60,
            running: false,
            paused: false,
            timerId: null,
            progress: 0,
        };

        const hgCanvas = document.getElementById('hgCanvas');
        const hgDisplay = document.getElementById('hgDisplay');
        const hgSub = document.getElementById('hgSub');
        const hgSeconds = document.getElementById('hgSeconds');
        const hgStart = document.getElementById('hgStart');
        const hgPause = document.getElementById('hgPause');
        const hgReset = document.getElementById('hgReset');
        const hgCompleteBadge = document.getElementById('hgCompleteBadge');
        const ctx = hgCanvas.getContext('2d');

        // ---- 沙漏幾何參數 (固定 400x480) ----
        const CX = 200;
        const TOP_Y = 44;
        const BOTTOM_Y = 436;
        const MID_Y = 240;
        const HALF_W_TOP = 124;
        const HALF_W_BOTTOM = 124;
        const HALF_W_NARROW = 18;

        function getTopHalfWidth(y) {
            const t = (y - TOP_Y) / (MID_Y - TOP_Y);
            return HALF_W_TOP + (HALF_W_NARROW - HALF_W_TOP) * t;
        }

        function getBottomHalfWidth(y) {
            const t = (y - MID_Y) / (BOTTOM_Y - MID_Y);
            return HALF_W_NARROW + (HALF_W_BOTTOM - HALF_W_NARROW) * t;
        }

        // ---- 繪製木框 ----
        function drawWoodFrame(y, halfW, position) {
            const h = 14;
            const x1 = CX - halfW;
            const x2 = CX + halfW;
            const grad = ctx.createLinearGradient(x1, y, x2, y + h);
            if (position === 'top') {
                grad.addColorStop(0, 'rgba(100, 70, 40, 0.35)');
                grad.addColorStop(0.3, 'rgba(160, 120, 80, 0.40)');
                grad.addColorStop(0.7, 'rgba(140, 100, 65, 0.40)');
                grad.addColorStop(1, 'rgba(90, 60, 35, 0.35)');
            } else {
                grad.addColorStop(0, 'rgba(90, 60, 35, 0.35)');
                grad.addColorStop(0.3, 'rgba(140, 100, 65, 0.40)');
                grad.addColorStop(0.7, 'rgba(160, 120, 80, 0.40)');
                grad.addColorStop(1, 'rgba(100, 70, 40, 0.35)');
            }
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(x1, y, x2 - x1, h, 6);
            ctx.fill();
            ctx.strokeStyle = 'rgba(180, 140, 100, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
                const lx = x1 + 10 + i * (x2 - x1 - 20) / 4;
                ctx.beginPath();
                ctx.moveTo(lx, y + 2);
                ctx.lineTo(lx + 4, y + h - 2);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.moveTo(x1 + 4, y + 2);
            ctx.lineTo(x2 - 4, y + 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // roundRect polyfill for Canvas
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ---- 主繪製函數 ----
        function hgDraw() {
            const W = hgCanvas.width,
                H = hgCanvas.height;
            ctx.clearRect(0, 0, W, H);

            const progressVal = Math.min(1, Math.max(0, hg.progress));

            // 背景光暈
            const grad = ctx.createRadialGradient(CX, 120, 20, CX, 160, 280);
            grad.addColorStop(0, 'rgba(246, 201, 119, 0.04)');
            grad.addColorStop(1, 'rgba(246, 201, 119, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // ---- 玻璃外殼 ----
            function glassPath() {
                ctx.beginPath();
                ctx.moveTo(CX - HALF_W_TOP, TOP_Y);
                ctx.lineTo(CX, MID_Y);
                ctx.lineTo(CX + HALF_W_TOP, TOP_Y);
                ctx.lineTo(CX + HALF_W_NARROW, MID_Y);
                ctx.lineTo(CX + HALF_W_BOTTOM, BOTTOM_Y);
                ctx.lineTo(CX - HALF_W_BOTTOM, BOTTOM_Y);
                ctx.lineTo(CX - HALF_W_NARROW, MID_Y);
                ctx.closePath();
            }
            glassPath();
            ctx.fillStyle = 'rgba(180, 210, 240, 0.06)';
            ctx.fill();
            glassPath();
            ctx.strokeStyle = 'rgba(200, 225, 255, 0.18)';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            glassPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // ---- 沙子 ----
            const topFill = 1 - progressVal;
            const bottomFill = progressVal;

            // 頂部沙子
            if (topFill > 0.002) {
                const sandTopY = TOP_Y + (MID_Y - TOP_Y) * (1 - topFill);
                ctx.beginPath();
                ctx.moveTo(CX - getTopHalfWidth(sandTopY), sandTopY);
                let y = sandTopY;
                const steps = 30;
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const yy = sandTopY + t * (MID_Y - sandTopY);
                    const hw = getTopHalfWidth(yy);
                    ctx.lineTo(CX - hw, yy);
                }
                ctx.lineTo(CX - HALF_W_NARROW, MID_Y);
                ctx.lineTo(CX + HALF_W_NARROW, MID_Y);
                for (let i = steps; i >= 0; i--) {
                    const t = i / steps;
                    const yy = sandTopY + t * (MID_Y - sandTopY);
                    const hw = getTopHalfWidth(yy);
                    ctx.lineTo(CX + hw, yy);
                }
                ctx.closePath();
                const sandGrad = ctx.createLinearGradient(CX, TOP_Y, CX, MID_Y);
                sandGrad.addColorStop(0, '#f7d99a');
                sandGrad.addColorStop(0.3, '#e8c47a');
                sandGrad.addColorStop(0.7, '#d4a85a');
                sandGrad.addColorStop(1, '#b8893f');
                ctx.fillStyle = sandGrad;
                ctx.fill();
                // 表面高光
                ctx.beginPath();
                const surfaceY = sandTopY;
                const hwSurf = getTopHalfWidth(surfaceY);
                ctx.moveTo(CX - hwSurf * 0.7, surfaceY + 2);
                ctx.quadraticCurveTo(CX, surfaceY - 6, CX + hwSurf * 0.7, surfaceY + 2);
                ctx.strokeStyle = 'rgba(255, 235, 180, 0.25)';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                // 紋理
                ctx.fillStyle = 'rgba(160, 120, 70, 0.20)';
                for (let i = 0; i < 70; i++) {
                    const randY = sandTopY + 4 + Math.random() * (MID_Y - sandTopY - 8);
                    const hw = getTopHalfWidth(randY);
                    const randX = CX + (Math.random() - 0.5) * hw * 1.6;
                    const size = 1.2 + Math.random() * 2;
                    ctx.beginPath();
                    ctx.arc(randX, randY, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- 沙流粒子 ----
            if (progressVal > 0.001 && progressVal < 0.999) {
                const flowCount = 24;
                const narrowTop = MID_Y;
                const narrowBottom = MID_Y + 190;
                const now = Date.now() / 280;
                for (let i = 0; i < flowCount; i++) {
                    let t = (i / flowCount + now) % 1;
                    const speedFactor = 0.7 + 0.3 * Math.sin(i * 1.7 + Date.now() / 400);
                    const yPos = narrowTop + t * (narrowBottom - narrowTop);
                    const xOffset = (Math.random() - 0.5) * HALF_W_NARROW * 1.2 * (0.3 + 0.7 * (1 - Math.abs(t - 0.5) *
                    2));
                    const size = 1.8 + Math.random() * 2.8;
                    const alpha = 0.5 + 0.5 * (1 - Math.abs(t - 0.5) * 2);
                    ctx.beginPath();
                    ctx.arc(CX + xOffset, yPos, size * 0.7, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(240, 200, 130, ${alpha * 0.6})`;
                    ctx.fill();
                    if (size > 2) {
                        ctx.beginPath();
                        ctx.arc(CX + xOffset * 0.6, yPos - 0.8, size * 0.3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 240, 200, ${alpha * 0.3})`;
                        ctx.fill();
                    }
                }
                // 細管光柱
                const gradFlow = ctx.createLinearGradient(CX, narrowTop, CX, narrowBottom);
                gradFlow.addColorStop(0, 'rgba(246, 201, 119, 0)');
                gradFlow.addColorStop(0.3, 'rgba(246, 201, 119, 0.06)');
                gradFlow.addColorStop(0.5, 'rgba(246, 201, 119, 0.10)');
                gradFlow.addColorStop(0.7, 'rgba(246, 201, 119, 0.06)');
                gradFlow.addColorStop(1, 'rgba(246, 201, 119, 0)');
                ctx.fillStyle = gradFlow;
                ctx.fillRect(CX - 6, narrowTop, 12, narrowBottom - narrowTop);
            }
			
			// 底部沙子
            if (bottomFill > 0.002) {
                const sandBottomY = BOTTOM_Y - (BOTTOM_Y - MID_Y) * bottomFill;
                ctx.beginPath();
                const hwTop = getBottomHalfWidth(sandBottomY);
                ctx.moveTo(CX - hwTop, sandBottomY);
                const steps = 30;
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const yy = sandBottomY + t * (BOTTOM_Y - sandBottomY);
                    const hw = getBottomHalfWidth(yy);
                    ctx.lineTo(CX - hw, yy);
                }
                const hwBottom = getBottomHalfWidth(BOTTOM_Y);
                ctx.lineTo(CX + hwBottom, BOTTOM_Y);
                for (let i = steps; i >= 0; i--) {
                    const t = i / steps;
                    const yy = sandBottomY + t * (BOTTOM_Y - sandBottomY);
                    const hw = getBottomHalfWidth(yy);
                    ctx.lineTo(CX + hw, yy);
                }
                ctx.closePath();
                const sandGrad2 = ctx.createLinearGradient(CX, sandBottomY, CX, BOTTOM_Y);
                sandGrad2.addColorStop(0, '#d4a85a');
                sandGrad2.addColorStop(0.4, '#c4954a');
                sandGrad2.addColorStop(0.8, '#b0803a');
                sandGrad2.addColorStop(1, '#9a6a2e');
                ctx.fillStyle = sandGrad2;
                ctx.fill();
                // 表面高光
                ctx.beginPath();
                const surfY2 = sandBottomY;
                const hwSurf2 = getBottomHalfWidth(surfY2);
                ctx.moveTo(CX - hwSurf2 * 0.7, surfY2 + 2);
                ctx.quadraticCurveTo(CX, surfY2 - 4, CX + hwSurf2 * 0.7, surfY2 + 2);
                ctx.strokeStyle = 'rgba(255, 235, 180, 0.25)';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                // 紋理
                ctx.fillStyle = 'rgba(140, 100, 60, 0.18)';
                for (let i = 0; i < 70; i++) {
                    const randY = sandBottomY + 4 + Math.random() * (BOTTOM_Y - sandBottomY - 8);
                    const hw = getBottomHalfWidth(randY);
                    const randX = CX + (Math.random() - 0.5) * hw * 1.6;
                    const size = 1.2 + Math.random() * 2;
                    ctx.beginPath();
                    ctx.arc(randX, randY, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- 玻璃高光 ----
			// 頂部左側高光（沿倒三角的左斜邊）
			ctx.beginPath();
			ctx.moveTo(CX - HALF_W_TOP * 0.7, TOP_Y + 12);
			ctx.quadraticCurveTo(
				CX - HALF_W_TOP * 0.8, TOP_Y + 40,
				CX - HALF_W_NARROW * 0.8, MID_Y - 8   // 原本是 *1.2，改為 *0.8
			);
			ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
			ctx.lineWidth = 10;
			ctx.stroke();

			// 頂部右側高光（沿倒三角的右斜邊）
			ctx.beginPath();
			ctx.moveTo(CX + HALF_W_TOP * 0.6, TOP_Y + 16);
			ctx.quadraticCurveTo(
				CX + HALF_W_TOP * 0.8, TOP_Y + 44,
				CX + HALF_W_NARROW * 0.8, MID_Y - 6   // 原本 *1.0，改為 *0.8
			);
			ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
			ctx.lineWidth = 6;
			ctx.stroke();

			// 底部左側高光（沿正三角的左斜邊）
			ctx.beginPath();
			ctx.moveTo(CX - HALF_W_NARROW * 0.8, MID_Y + 8);   // 原本 *1.2
			ctx.quadraticCurveTo(
				CX - HALF_W_BOTTOM * 0.7, BOTTOM_Y - 40,
				CX - HALF_W_BOTTOM * 0.6, BOTTOM_Y - 12   // 原本 *0.7
			);
			ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
			ctx.lineWidth = 10;
			ctx.stroke();

			// 底部右側高光（沿正三角的右斜邊）
			ctx.beginPath();
			ctx.moveTo(CX + HALF_W_NARROW * 0.8, MID_Y + 10);  // 原本 *1.0
			ctx.quadraticCurveTo(
				CX + HALF_W_BOTTOM * 0.8, BOTTOM_Y - 44,
				CX + HALF_W_BOTTOM * 0.5, BOTTOM_Y - 14   // 原本 *0.6
			);
			ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
			ctx.lineWidth = 6;
			ctx.stroke();

            // ---- 木框 ----
            drawWoodFrame(TOP_Y - 15, HALF_W_TOP + 20, 'top');
            drawWoodFrame(BOTTOM_Y - 0, HALF_W_BOTTOM + 20, 'bottom');

            // ---- 中間金屬環 ----
            ctx.beginPath();
            ctx.ellipse(CX, MID_Y, HALF_W_NARROW + 6, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(180, 150, 110, 0.15)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(200, 180, 150, 0.15)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // ---- 細管 ----
            ctx.beginPath();
            ctx.moveTo(CX - HALF_W_NARROW, MID_Y - 34);
            ctx.lineTo(CX - HALF_W_NARROW, MID_Y + 34);
            ctx.lineTo(CX + HALF_W_NARROW, MID_Y + 34);
            ctx.lineTo(CX + HALF_W_NARROW, MID_Y - 34);
            ctx.closePath();
            ctx.fillStyle = 'rgba(100, 120, 140, 0.04)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(200, 225, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // ---- 裝飾線 ----
            ctx.beginPath();
            ctx.moveTo(CX - HALF_W_TOP - 6, TOP_Y + 4);
            ctx.lineTo(CX + HALF_W_TOP + 6, TOP_Y + 4);
            ctx.strokeStyle = 'rgba(200, 180, 150, 0.08)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(CX - HALF_W_BOTTOM - 6, BOTTOM_Y - 4);
            ctx.lineTo(CX + HALF_W_BOTTOM + 6, BOTTOM_Y - 4);
            ctx.strokeStyle = 'rgba(200, 180, 150, 0.08)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // ---- 更新顯示 ----
        function hgUpdateDisplay() {
            const mins = Math.floor(hg.remaining / 60);
            const secs = Math.floor(hg.remaining % 60);
            hgDisplay.textContent = pad(mins) + ':' + pad(secs);
            // 更新完成徽章
            if (hg.remaining <= 0 && hg.running === false && hg.paused === false) {
                hgCompleteBadge.classList.add('show');
            } else {
                hgCompleteBadge.classList.remove('show');
            }
        }

        function hgSetProgress() {
            hg.progress = hg.total > 0 ? 1 - (hg.remaining / hg.total) : 1;
            if (hg.progress < 0) hg.progress = 0;
            if (hg.progress > 1) hg.progress = 1;
            hgDraw();
            hgUpdateDisplay();
        }

        // ---- 控制 ----
        function hgSyncInput() {
            const val = parseInt(hgSeconds.value) || 60;
            hg.total = Math.max(5, Math.min(3600, val));
            if (!hg.running && !hg.paused) {
                hg.remaining = hg.total;
                hg.progress = 0;
                hgSetProgress();
                hgSub.textContent = '設定秒數後按開始';
                hgCompleteBadge.classList.remove('show');
            }
            // 更新預設高亮
            document.querySelectorAll('.hg-presets button').forEach(btn => {
                const secs = parseInt(btn.dataset.seconds);
                btn.classList.toggle('active', secs === hg.total);
            });
        }

        hgSeconds.addEventListener('change', hgSyncInput);

        // 預設按鈕
        document.querySelectorAll('.hg-presets button').forEach(btn => {
            btn.addEventListener('click', function() {
                if (hg.running || hg.paused) return;
                const secs = parseInt(this.dataset.seconds);
                if (!isNaN(secs) && secs > 0) {
                    hgSeconds.value = secs;
                    hg.total = secs;
                    hg.remaining = secs;
                    hg.progress = 0;
                    hgSetProgress();
                    hgSub.textContent = '已設定 ' + secs + ' 秒';
                    hgCompleteBadge.classList.remove('show');
                    document.querySelectorAll('.hg-presets button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                }
            });
        });

        function hgStartTimer() {
            if (hg.running) return;
            if (hg.remaining <= 0) {
                hg.remaining = hg.total;
                hg.progress = 0;
                hgSetProgress();
                hgCompleteBadge.classList.remove('show');
            }
            hg.running = true;
            hg.paused = false;
            hgStart.disabled = true;
            hgPause.disabled = false;
            hgPause.textContent = '⏸ 暫停';
            hgSub.textContent = '⏳ 倒數中...';
            hg.timerId = setInterval(() => {
                hg.remaining -= 0.1;
                if (hg.remaining < 0) hg.remaining = 0;
                hgSetProgress();
                if (hg.remaining <= 0) {
                    clearInterval(hg.timerId);
                    hg.timerId = null;
                    hg.running = false;
                    hgStart.disabled = false;
                    hgPause.disabled = true;
                    hgSub.textContent = '⏰ 時間到！';
                    hgCompleteBadge.classList.add('show');
                    beep();
                    setTimeout(() => beep(), 400);
                }
            }, 100);
        }

        function hgPauseTimer() {
            if (!hg.running) return;
            clearInterval(hg.timerId);
            hg.timerId = null;
            hg.running = false;
            hg.paused = true;
            hgStart.disabled = false;
            hgPause.disabled = true;
            hgStart.textContent = '▶ 繼續';
            hgSub.textContent = '⏸ 已暫停';
        }

        function hgResetTimer() {
            clearInterval(hg.timerId);
            hg.timerId = null;
            hg.running = false;
            hg.paused = false;
            hg.remaining = hg.total;
            hg.progress = 0;
            hgSetProgress();
            hgStart.disabled = false;
            hgPause.disabled = true;
            hgStart.textContent = '▶ 開始';
            hgSub.textContent = '已重置';
            hgCompleteBadge.classList.remove('show');
            // 更新輸入框
            hgSeconds.value = hg.total;
            document.querySelectorAll('.hg-presets button').forEach(b => {
                b.classList.toggle('active', parseInt(b.dataset.seconds) === hg.total);
            });
        }

        hgStart.addEventListener('click', () => {
            if (hg.paused) {
                // 繼續
                hg.running = true;
                hg.paused = false;
                hgStart.disabled = true;
                hgPause.disabled = false;
                hgPause.textContent = '⏸ 暫停';
                hgSub.textContent = '⏳ 倒數中...';
                hg.timerId = setInterval(() => {
                    hg.remaining -= 0.1;
                    if (hg.remaining < 0) hg.remaining = 0;
                    hgSetProgress();
                    if (hg.remaining <= 0) {
                        clearInterval(hg.timerId);
                        hg.timerId = null;
                        hg.running = false;
                        hgStart.disabled = false;
                        hgPause.disabled = true;
                        hgSub.textContent = '⏰ 時間到！';
                        hgCompleteBadge.classList.add('show');
                        beep();
                        setTimeout(() => beep(), 400);
                    }
                }, 100);
            } else {
                hgStartTimer();
            }
        });

        hgPause.addEventListener('click', hgPauseTimer);
        hgReset.addEventListener('click', hgResetTimer);

        // 初始化
        hgSyncInput();

        // ============================================================
        //  5. 視覺計時器 (明確藍→黃→紅)

        // ============================================================
        //  6. 國際象棋雙面計時鐘
        // ============================================================
        const chess = {
            left: { time: 600, total: 600, running: false, active: false, paused: false },
            right: { time: 600, total: 600, running: false, active: false, paused: false },
            timerId: null,
            started: false,
        };

        const chLeftTime = document.getElementById('chLeftTime');
        const chRightTime = document.getElementById('chRightTime');
        const chLeftStatus = document.getElementById('chLeftStatus');
        const chRightStatus = document.getElementById('chRightStatus');
        const chLeftStart = document.getElementById('chLeftStart');
        const chRightStart = document.getElementById('chRightStart');
        const chReset = document.getElementById('chReset');
        const chSub = document.getElementById('chSub');
        const chLeft = document.getElementById('chessLeft');
        const chRight = document.getElementById('chessRight');

        function chFormat(t) {
            const m = Math.floor(t / 60);
            const s = Math.floor(t % 60);
            return pad(m) + ':' + pad(s);
        }

        function chUpdateUI() {
            chLeftTime.textContent = chFormat(chess.left.time);
            chRightTime.textContent = chFormat(chess.right.time);
            chLeft.classList.toggle('active', chess.left.active);
            chRight.classList.toggle('active', chess.right.active);
            chLeft.classList.toggle('paused', chess.left.paused && !chess.left.active);
            chRight.classList.toggle('paused', chess.right.paused && !chess.right.active);
            chLeftStatus.textContent = chess.left.active ? '⚡ 計時中' :
                chess.left.paused ? '⏸ 暫停' : (chess.started ? '等待' : '等待開始');
            chRightStatus.textContent = chess.right.active ? '⚡ 計時中' :
                chess.right.paused ? '⏸ 暫停' : (chess.started ? '等待' : '等待開始');
            chLeftStart.textContent = chess.left.running ? '⏸' : '▶';
            chRightStart.textContent = chess.right.running ? '⏸' : '▶';
