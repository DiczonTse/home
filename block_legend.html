<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⛏️ 方塊傳說 · 迷宮冒險</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b1a1f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #coverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b1a1f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
            padding: 20px;
        }
        #coverScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .cover-title {
            font-size: 3.5rem;
            font-weight: 800;
            color: #f5d742;
            text-shadow: 0 0 30px rgba(245, 215, 66, 0.3);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        .cover-sub {
            font-size: 1.2rem;
            color: #98bcc3;
            margin-bottom: 30px;
            letter-spacing: 6px;
        }
        .cover-input-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 80%;
            max-width: 320px;
        }
        .cover-input-group label {
            color: #98bcc3;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }
        .cover-input-group input {
            background: #0d262b;
            border: 2px solid #3b6b73;
            border-radius: 60px;
            padding: 10px 20px;
            width: 100%;
            color: #e2f0f2;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }
        .cover-input-group input:focus {
            border-color: #f5d742;
            box-shadow: 0 0 20px rgba(245, 215, 66, 0.15);
        }
        .cover-input-group input::placeholder {
            color: #4a6b66;
        }
        .cover-btn {
            background: #2d5f67;
            border: none;
            border-radius: 60px;
            padding: 14px 48px;
            margin: 10px;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            border: 2px solid #48919b;
            transition: 0.2s;
            min-width: 200px;
            letter-spacing: 2px;
        }
        .cover-btn:hover {
            background: #3b7983;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(72, 145, 155, 0.4);
        }
        .cover-btn:active {
            transform: scale(0.95);
        }
        .cover-btn.secondary {
            background: #364f4b;
            border-color: #60918b;
        }
        .cover-btn.secondary:hover {
            background: #4a6b66;
        }
        .cover-version {
            margin-top: 40px;
            color: #4a6b66;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .game-wrapper {
            max-width: 950px;
            width: 100%;
            background: #1e3a3f;
            border-radius: 40px 40px 28px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 0 0 1px #4f7b82;
            padding: 18px 18px 16px;
            transition: 0.2s;
        }
        .battle-scene-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b1e22;
            border-radius: 20px;
            padding: 10px 16px;
            margin-bottom: 10px;
            border: 1px solid #3b6b73;
            min-height: 80px;
        }
        .battle-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
        }
        .battle-side .title {
            font-size: 0.65rem;
            color: #98bcc3;
        }
        .battle-side .units {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .unit-icon {
            font-size: 1.4rem;
            line-height: 1.2;
            text-align: center;
            background: #0f2a2f;
            border-radius: 12px;
            padding: 2px 8px;
            border: 1px solid #3b6b73;
            min-width: 40px;
            color: #f0f8fa;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        .unit-icon .hp-bar {
            font-size: 0.55rem;
            color: #7ddfb3;
            display: block;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        .unit-icon .player-name {
            font-size: 0.65rem;
            font-weight: 700;
            color: #f5d742;
            text-shadow: 0 0 10px rgba(245, 215, 66, 0.3);
            display: block;
            line-height: 1.1;
        }
        .unit-icon .monster-placeholder {
            font-size: 0.65rem;
            color: #b3d9e0;
            opacity: 0.7;
        }
        .unit-icon .unit-extra {
            font-size: 0.55rem;
            color: #7dc9df;
            display: block;
        }
        .battle-vs {
            font-size: 1.2rem;
            color: #f5d742;
            font-weight: 700;
            padding: 0 6px;
        }
        .status-panel {
            background: #0d262b;
            border-radius: 30px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            color: #d4e9ed;
            border-bottom: 3px solid #3b6b73;
            margin-bottom: 10px;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.5);
        }
        .stat-badge {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            font-weight: 600;
            background: #183238;
            padding: 5px 12px;
            border-radius: 40px;
            letter-spacing: 0.2px;
        }
        .stat-badge span {
            color: #b3d9e0;
            font-weight: 400;
        }
        .stat-badge strong {
            color: #f5d742;
            font-weight: 700;
        }
        .stat-badge .stamina-low {
            color: #ff6b6b !important;
        }
        .stat-badge .stamina-mid {
            color: #f5d742 !important;
        }
        .exp-bar-wrap {
            width: 100%;
            margin-top: 6px;
            background: #0b1e22;
            border-radius: 20px;
            height: 14px;
            overflow: hidden;
            border: 1px solid #3b6b73;
        }
        .exp-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5d742, #f7b731);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .exp-text {
            font-size: 0.7rem;
            color: #b3d9e0;
            text-align: center;
            margin-top: 2px;
        }
        .top-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .region-tabs {
            display: flex;
            gap: 5px;
            background: #0d262b;
            padding: 4px;
            border-radius: 60px;
            border: 1px solid #2b5a62;
            flex: 2;
            min-width: 180px;
            flex-wrap: wrap;
        }
        .region-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 7px 5px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #98bcc3;
            transition: 0.2s;
            cursor: pointer;
            letter-spacing: 0.2px;
            min-width: 40px;
        }
        .region-btn.active {
            background: #e4b13b;
            color: #0f282e;
            box-shadow: 0 3px 0 #8f6d1f;
            transform: scale(0.97);
        }
        .region-btn:active {
            transform: scale(0.94);
        }
        .map-btn {
            background: #2d5f67;
            border: none;
            border-radius: 40px;
            padding: 7px 18px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #48919b;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .map-btn:active {
            background: #1f4349;
        }
        .main-area {
            background: #163035;
            border-radius: 30px;
            padding: 14px 12px;
            min-height: 180px;
            border: 1px solid #3c6a72;
            box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.4);
            color: #e2f0f2;
            margin-bottom: 10px;
        }
        .info-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            gap: 4px 10px;
            background: #0f282e;
            border-radius: 16px;
            padding: 8px 14px;
            border-left: 4px solid #b68b3b;
            margin-bottom: 8px;
        }
        .info-row .loc {
            font-weight: 700;
            color: #f5d742;
        }
        .info-row .detail {
            color: #b3d9e0;
        }
        .combined-log {
            background: #0b1e22;
            border-radius: 16px;
            padding: 6px 10px;
            margin-top: 6px;
            border: 1px solid #3b6b73;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.75rem;
            line-height: 1.5;
            color: #d4e9ed;
        }
        .combined-log .system {
            color: #b3d9e0;
        }
        .combined-log .dmg {
            color: #ff9a76;
        }
        .combined-log .heal {
            color: #7ddfb3;
        }
        .combined-log .boss-speech {
            color: #f5d742;
            font-weight: 600;
        }
        .combined-log .player-attack {
            color: #f5d742;
        }
        .combined-log .monster-attack {
            color: #ff6b6b;
        }
        .combined-log .welcome {
            color: #7ddfb3;
        }
        .combined-log .stamina-msg {
            color: #7dc9df;
        }
        .combined-log .loot {
            color: #b3d9e0;
        }
        .action-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin: 8px 0 4px;
        }
        .action-btn {
            background: #1f4349;
            border: none;
            border-radius: 60px;
            padding: 6px 14px;
            font-weight: 600;
            color: #e7f6f8;
            box-shadow: 0 4px 0 #0f282e;
            transition: 0.07s linear;
            cursor: pointer;
            font-size: 0.8rem;
            flex: 1 0 auto;
            letter-spacing: 0.2px;
            border: 1px solid #3b7983;
        }
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #0f282e;
        }
        .action-btn.shop {
            background: #2a6d5e;
            border-color: #4ba392;
        }
        .action-btn.danger {
            background: #914141;
            border-color: #c96a6a;
        }
        .action-btn.special {
            background: #7a5f2e;
            border-color: #c9a33b;
        }
        .action-btn.equip {
            background: #3d5f7a;
            border-color: #6a9bc4;
        }
        .action-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 4px 0 #0f282e;
            pointer-events: none;
        }
        .save-load-area {
            margin-top: 12px;
            background: #0f262b;
            border-radius: 60px;
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2d5f67;
        }
        .file-label {
            background: #2d5f67;
            padding: 4px 12px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #48919b;
            font-size: 0.8rem;
        }
        .file-label:hover {
            background: #3b7983;
        }
        #fileInput {
            display: none;
        }
        .txt-btn {
            background: #364f4b;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #60918b;
            font-size: 0.8rem;
        }
        .txt-btn:active {
            background: #1f3d39;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }
        .modal-box {
            background: #1a3a3f;
            border-radius: 40px;
            max-width: 850px;
            width: 100%;
            padding: 20px 18px;
            border: 2px solid #7ab3b0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            color: #e2f0f2;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            color: #f5d742;
            margin-bottom: 12px;
            border-bottom: 2px solid #3b6b73;
            padding-bottom: 6px;
        }
        .modal-box h4 {
            color: #7dc9df;
            margin: 12px 0 6px;
        }
        .modal-close {
            background: #5a3e3e;
            border: none;
            border-radius: 60px;
            padding: 8px 20px;
            color: white;
            font-weight: 700;
            margin-top: 12px;
            cursor: pointer;
            width: 100%;
            border: 1px solid #a06b6b;
        }
        .modal-close:active {
            background: #3f2b2b;
        }
        .skill-choice-btn {
            background: #2a5a4a;
            border: 1px solid #4ba392;
            border-radius: 30px;
            padding: 10px 20px;
            margin: 6px 0;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: 0.15s;
        }
        .skill-choice-btn:hover {
            background: #3a7a5a;
        }
        .skill-choice-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #1a3a3a;
        }
        .maze-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 4px;
            width: 100%;
        }
        .maze-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin: 2px 0;
            width: 100%;
        }
        .maze-cell {
            width: 90px;
            min-height: 50px;
            padding: 4px 6px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 600;
            background: #0f2a2f;
            border: 2px solid #3b6b73;
            color: #b3d9e0;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            position: relative;
            line-height: 1.2;
            flex: 0 1 auto;
        }
        .maze-cell .cell-name {
            font-size: 0.55rem;
            line-height: 1.2;
        }
        .maze-cell .cell-boss {
            font-size: 0.5rem;
            color: #f5d742;
        }
        .maze-cell.unlocked {
            border-color: #4ba392;
            background: #1a3f44;
        }
        .maze-cell.unlocked:hover {
            border-color: #f5d742;
            transform: scale(1.05);
        }
        .maze-cell.current {
            border-color: #f5d742;
            box-shadow: 0 0 15px rgba(245, 215, 66, 0.5);
            background: #2a5a4a;
        }
        .maze-cell.locked {
            background: #0b1e22;
            border-color: #2a4a4f;
            opacity: 0.6;
            cursor: not-allowed;
            color: #4a6b66;
        }
        .maze-cell .lock-icon {
            font-size: 1.2rem;
        }
        .maze-connector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            color: #3b6b73;
            font-size: 0.7rem;
            padding: 0 4px;
            flex-wrap: wrap;
            min-width: 20px;
        }
        .maze-connector .line {
            height: 2px;
            background: #3b6b73;
            min-width: 20px;
            flex: 1;
        }
        .maze-connector .line.unlocked {
            background: #4ba392;
        }
        .maze-connector .line.boss-path {
            background: #f5d742;
            box-shadow: 0 0 6px #f5d742;
        }
        @media (max-width: 600px) {
            .maze-cell {
                width: 70px;
                min-height: 40px;
                font-size: 0.5rem;
            }
            .maze-cell .cell-name {
                font-size: 0.45rem;
            }
            .maze-connector .line {
                min-width: 12px;
            }
        }
        @media (max-width: 480px) {
            .maze-cell {
                width: 60px;
                min-height: 35px;
                font-size: 0.45rem;
                padding: 2px 4px;
            }
            .maze-cell .cell-name {
                font-size: 0.4rem;
            }
            .maze-connector .line {
                min-width: 8px;
            }
            .battle-scene-top {
                flex-direction: column;
                gap: 6px;
            }
            .battle-vs {
                transform: rotate(90deg);
            }
        }
        .equip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 6px 0;
        }
        .equip-item {
            background: #0f2a2f;
            border-radius: 20px;
            padding: 8px 12px;
            border-left: 4px solid #b68b3b;
        }
        .modal-item {
            background: #0f2a2f;
            border-radius: 30px;
            padding: 10px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #b68b3b;
            flex-wrap: wrap;
            gap: 6px;
        }
        .modal-item button {
            background: #2a6d5e;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #4ba392;
            white-space: nowrap;
        }
        .modal-item button:active {
            background: #1d4f44;
        }
        .modal-item .item-info {
            flex: 1;
            font-size: 0.85rem;
        }
        .stamina-bar-wrap {
            width: 100%;
            margin-top: 4px;
            background: #0b1e22;
            border-radius: 20px;
            height: 6px;
            overflow: hidden;
            border: 1px solid #2a5a62;
        }
        .stamina-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff6b6b, #f5d742, #7ddfb3);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .stamina-text {
            font-size: 0.6rem;
            color: #b3d9e0;
            text-align: center;
            margin-top: 1px;
        }
        .stamina-info {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .stamina-info .stamina-icon {
            font-size: 0.9rem;
        }
        .copyright {
            margin-top: 14px;
            padding: 8px 12px;
            border-top: 1px solid #2a5a62;
            text-align: center;
            font-size: 0.7rem;
            color: #4a6b66;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .copyright .version {
            background: #0f282e;
            padding: 0 8px;
            border-radius: 12px;
            font-weight: 600;
            color: #7d9ea0;
        }
        .copyright #copyrightText {
            color: #4a7a7a;
        }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 6px;
            margin: 8px 0;
        }
        .inv-item {
            background: #0f2a2f;
            border-radius: 12px;
            padding: 4px 8px;
            text-align: center;
            border: 1px solid #3b6b73;
            font-size: 0.7rem;
        }
        .inv-item .count {
            color: #f5d742;
            font-weight: 700;
        }
        .badge {
            display: inline-block;
            background: #2a5a62;
            border-radius: 20px;
            padding: 0 8px;
            font-size: 0.65rem;
            color: #b3d9e0;
        }
        .upgrade-path {
            font-size: 0.7rem;
            color: #7dc9df;
            margin: 2px 0;
        }
    </style>
</head>
<body>

    <!-- 封面 -->
    <div id="coverScreen">
        <div class="cover-title">⛏️ 方塊傳說</div>
        <div class="cover-sub">— 迷宮冒險 · 升級樹 —</div>
        <div class="cover-input-group">
            <label for="playerNameInput">👤 輸入你的名字</label>
            <input type="text" id="playerNameInput" placeholder="例如：史蒂夫" value="史蒂夫" maxlength="10">
        </div>
        <button class="cover-btn" id="startNewBtn">🌟 開始遊戲</button>
        <button class="cover-btn secondary" id="continueBtn">📂 繼續遊戲</button>
        <div class="cover-version">v1.0 · 打造專屬自已的裝備！</div>
    </div>

    <!-- 主遊戲 -->
    <div class="game-wrapper" id="gameWrapper" style="display:none;">

        <!-- 戰鬥畫面 (置頂) -->
        <div class="battle-scene-top" id="battleSceneTop">
            <div class="battle-side" id="playerSide">

            };

            // ============================================================
            // 1. 裝備升級樹
            // ============================================================
            const WEAPON_TREES = {

                    },
                    baseAtk: { '木弓': 3, '短弓': 4, '長弓': 5, '獵弓': 6, '毒弓': 7, '火弓': 8 },
                },

                    path: ['輕弩', '重弩', '煙火弩'],
                    upgradeCost: {

                        '石刀': { resources: { '石頭': 2 }, gold: 45 },
                        '銅刀': { resources: { '銅錠': 2 }, gold: 65 },
                        '鐵刀': { resources: { '鐵礦': 2, '煤炭': 1 }, gold: 85 },
                        '金刀': { resources: { '金粒': 4 }, gold: 105 },
