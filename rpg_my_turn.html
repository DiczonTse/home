<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG · 三界傳說 · 迷宮地圖</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b1a1f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #coverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b1a1f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
            padding: 20px;
        }
        #coverScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .cover-title {
            font-size: 3.5rem;
            font-weight: 800;
            color: #f5d742;
            text-shadow: 0 0 30px rgba(245, 215, 66, 0.3);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        .cover-sub {
            font-size: 1.2rem;
            color: #98bcc3;
            margin-bottom: 30px;
            letter-spacing: 6px;
        }
        .cover-input-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 80%;
            max-width: 320px;
        }
        .cover-input-group label {
            color: #98bcc3;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }
        .cover-input-group input {
            background: #0d262b;
            border: 2px solid #3b6b73;
            border-radius: 60px;
            padding: 10px 20px;
            width: 100%;
            color: #e2f0f2;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }
        .cover-input-group input:focus {
            border-color: #f5d742;
            box-shadow: 0 0 20px rgba(245, 215, 66, 0.15);
        }
        .cover-input-group input::placeholder {
            color: #4a6b66;
        }
        .cover-btn {
            background: #2d5f67;
            border: none;
            border-radius: 60px;
            padding: 14px 48px;
            margin: 10px;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            border: 2px solid #48919b;
            transition: 0.2s;
            min-width: 200px;
            letter-spacing: 2px;
        }
        .cover-btn:hover {
            background: #3b7983;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(72, 145, 155, 0.4);
        }
        .cover-btn:active {
            transform: scale(0.95);
        }
        .cover-btn.secondary {
            background: #364f4b;
            border-color: #60918b;
        }
        .cover-btn.secondary:hover {
            background: #4a6b66;
        }
        .cover-version {
            margin-top: 40px;
            color: #4a6b66;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .game-wrapper {
            max-width: 950px;
            width: 100%;
            background: #1e3a3f;
            border-radius: 40px 40px 28px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 0 0 1px #4f7b82;
            padding: 18px 18px 16px;
            transition: 0.2s;
        }
        .battle-scene-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b1e22;
            border-radius: 20px;
            padding: 10px 16px;
            margin-bottom: 10px;
            border: 1px solid #3b6b73;
            min-height: 80px;
        }
        .battle-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
        }
        .battle-side .title {
            font-size: 0.65rem;
            color: #98bcc3;
        }
        .battle-side .units {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .unit-icon {
            font-size: 1.4rem;
            line-height: 1.2;
            text-align: center;
            background: #0f2a2f;
            border-radius: 12px;
            padding: 2px 8px;
            border: 1px solid #3b6b73;
            min-width: 40px;
            color: #f0f8fa;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        .unit-icon .hp-bar {
            font-size: 0.55rem;
            color: #7ddfb3;
            display: block;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        .battle-vs {
            font-size: 1.2rem;
            color: #f5d742;
            font-weight: 700;
            padding: 0 6px;
        }
        .status-panel {
            background: #0d262b;
            border-radius: 30px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            color: #d4e9ed;
            border-bottom: 3px solid #3b6b73;
            margin-bottom: 10px;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.5);
        }
        .stat-badge {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            font-weight: 600;
            background: #183238;
            padding: 5px 12px;
            border-radius: 40px;
            letter-spacing: 0.2px;
        }
        .stat-badge span {
            color: #b3d9e0;
            font-weight: 400;
        }
        .stat-badge strong {
            color: #f5d742;
            font-weight: 700;
        }
        .stat-badge .stamina-low {
            color: #ff6b6b !important;
        }
        .stat-badge .stamina-mid {
            color: #f5d742 !important;
        }
        .exp-bar-wrap {
            width: 100%;
            margin-top: 6px;
            background: #0b1e22;
            border-radius: 20px;
            height: 14px;
            overflow: hidden;
            border: 1px solid #3b6b73;
        }
        .exp-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5d742, #f7b731);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .exp-text {
            font-size: 0.7rem;
            color: #b3d9e0;
            text-align: center;
            margin-top: 2px;
        }
        .top-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .region-tabs {
            display: flex;
            gap: 5px;
            background: #0d262b;
            padding: 4px;
            border-radius: 60px;
            border: 1px solid #2b5a62;
            flex: 2;
            min-width: 180px;
        }
        .region-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 7px 5px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #98bcc3;
            transition: 0.2s;
            cursor: pointer;
            letter-spacing: 0.2px;
        }
        .region-btn.active {
            background: #e4b13b;
            color: #0f282e;
            box-shadow: 0 3px 0 #8f6d1f;
            transform: scale(0.97);
        }
        .region-btn:active {
            transform: scale(0.94);
        }
        .map-btn {
            background: #2d5f67;
            border: none;
            border-radius: 40px;
            padding: 7px 18px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #48919b;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .map-btn:active {
            background: #1f4349;
        }
        .main-area {
            background: #163035;
            border-radius: 30px;
            padding: 14px 12px;
            min-height: 180px;
            border: 1px solid #3c6a72;
            box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.4);
            color: #e2f0f2;
            margin-bottom: 10px;
        }
        .info-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            gap: 4px 10px;
            background: #0f282e;
            border-radius: 16px;
            padding: 8px 14px;
            border-left: 4px solid #b68b3b;
            margin-bottom: 8px;
        }
        .info-row .loc {
            font-weight: 700;
            color: #f5d742;
        }
        .info-row .detail {
            color: #b3d9e0;
        }
        .combined-log {
            background: #0b1e22;
            border-radius: 16px;
            padding: 6px 10px;
            margin-top: 6px;
            border: 1px solid #3b6b73;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.75rem;
            line-height: 1.5;
            color: #d4e9ed;
        }
        .combined-log .system {
            color: #b3d9e0;
        }
        .combined-log .dmg {
            color: #ff9a76;
        }
        .combined-log .heal {
            color: #7ddfb3;
        }
        .combined-log .boss-speech {
            color: #f5d742;
            font-weight: 600;
        }
        .combined-log .player-attack {
            color: #f5d742;
        }
        .combined-log .monster-attack {
            color: #ff6b6b;
        }
        .combined-log .welcome {
            color: #7ddfb3;
        }
        .combined-log .stamina-msg {
            color: #7dc9df;
        }
        .action-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin: 8px 0 4px;
        }
        .action-btn {
            background: #1f4349;
            border: none;
            border-radius: 60px;
            padding: 6px 14px;
            font-weight: 600;
            color: #e7f6f8;
            box-shadow: 0 4px 0 #0f282e;
            transition: 0.07s linear;
            cursor: pointer;
            font-size: 0.8rem;
            flex: 1 0 auto;
            letter-spacing: 0.2px;
            border: 1px solid #3b7983;
        }
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #0f282e;
        }
        .action-btn.shop {
            background: #2a6d5e;
            border-color: #4ba392;
        }
        .action-btn.danger {
            background: #914141;
            border-color: #c96a6a;
        }
        .action-btn.special {
            background: #7a5f2e;
            border-color: #c9a33b;
        }
        .action-btn.equip {
            background: #3d5f7a;
            border-color: #6a9bc4;
        }
        .action-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 4px 0 #0f282e;
            pointer-events: none;
        }
        .save-load-area {
            margin-top: 12px;
            background: #0f262b;
            border-radius: 60px;
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2d5f67;
        }
        .file-label {
            background: #2d5f67;
            padding: 4px 12px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #48919b;
            font-size: 0.8rem;
        }
        .file-label:hover {
            background: #3b7983;
        }
        #fileInput {
            display: none;
        }
        .txt-btn {
            background: #364f4b;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #60918b;
            font-size: 0.8rem;
        }
        .txt-btn:active {
            background: #1f3d39;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }
        .modal-box {
            background: #1a3a3f;
            border-radius: 40px;
            max-width: 850px;
            width: 100%;
            padding: 20px 18px;
            border: 2px solid #7ab3b0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            color: #e2f0f2;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            color: #f5d742;
            margin-bottom: 12px;
            border-bottom: 2px solid #3b6b73;
            padding-bottom: 6px;
        }
        .modal-close {
            background: #5a3e3e;
            border: none;
            border-radius: 60px;
            padding: 8px 20px;
            color: white;
            font-weight: 700;
            margin-top: 12px;
            cursor: pointer;
            width: 100%;
            border: 1px solid #a06b6b;
        }
        .modal-close:active {
            background: #3f2b2b;
        }
        .skill-choice-btn {
            background: #2a5a4a;
            border: 1px solid #4ba392;
            border-radius: 30px;
            padding: 10px 20px;
            margin: 6px 0;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: 0.15s;
        }
        .skill-choice-btn:hover {
            background: #3a7a5a;
        }
        .skill-choice-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #1a3a3a;
        }
        .maze-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 4px;
        }
        .maze-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin: 2px 0;
        }
        .maze-cell {
            width: 80px;
            min-height: 50px;
            padding: 4px 6px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 600;
            background: #0f2a2f;
            border: 2px solid #3b6b73;
            color: #b3d9e0;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            position: relative;
            line-height: 1.2;
            flex: 0 1 auto;
        }
        .maze-cell .cell-name {
            font-size: 0.6rem;
            line-height: 1.2;
        }
        .maze-cell .cell-boss {
            font-size: 0.5rem;
            color: #f5d742;
        }
        .maze-cell.unlocked {
            border-color: #4ba392;
            background: #1a3f44;
        }
        .maze-cell.unlocked:hover {
            border-color: #f5d742;
            transform: scale(1.05);
        }
        .maze-cell.current {
            border-color: #f5d742;
            box-shadow: 0 0 15px rgba(245, 215, 66, 0.5);
            background: #2a5a4a;
        }
        .maze-cell.locked {
            background: #0b1e22;
            border-color: #2a4a4f;
            opacity: 0.6;
            cursor: not-allowed;
            color: #4a6b66;
        }
        .maze-cell .lock-icon {
            font-size: 1.2rem;
        }
        .maze-connector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            color: #3b6b73;
            font-size: 0.7rem;
            padding: 0 4px;
            flex-wrap: wrap;
        }
        .maze-connector .line {
            height: 2px;
            background: #3b6b73;
            min-width: 20px;
            flex: 1;
        }
        .maze-connector .line.unlocked {
            background: #4ba392;
        }
        .maze-connector .line.boss-path {
            background: #f5d742;
            box-shadow: 0 0 6px #f5d742;
        }
        .maze-level-label {
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            color: #98bcc3;
            letter-spacing: 2px;
            margin: 6px 0 2px;
        }
        @media (max-width: 600px) {
            .maze-cell {
                width: 60px;
                min-height: 40px;
                font-size: 0.55rem;
            }
            .maze-cell .cell-name {
                font-size: 0.5rem;
            }
            .maze-connector .line {
                min-width: 12px;
            }
        }
        @media (max-width: 480px) {
            .maze-cell {
                width: 50px;
                min-height: 35px;
                font-size: 0.5rem;
                padding: 2px 4px;
            }
            .maze-cell .cell-name {
                font-size: 0.45rem;
            }
            .maze-connector .line {
                min-width: 8px;
            }
            .battle-scene-top {
                flex-direction: column;
                gap: 6px;
            }
            .battle-vs {
                transform: rotate(90deg);
            }
        }
        .equip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 6px 0;
        }
        .equip-item {
            background: #0f2a2f;
            border-radius: 20px;
            padding: 8px 12px;
            border-left: 4px solid #b68b3b;
        }
        .modal-item {
            background: #0f2a2f;
            border-radius: 30px;
            padding: 10px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #b68b3b;
        }
        .modal-item button {
            background: #2a6d5e;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #4ba392;
        }
        .modal-item button:active {
            background: #1d4f44;
        }
        .stamina-bar-wrap {
            width: 100%;
            margin-top: 4px;
            background: #0b1e22;
            border-radius: 20px;
            height: 6px;
            overflow: hidden;
            border: 1px solid #2a5a62;
        }
        .stamina-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff6b6b, #f5d742, #7ddfb3);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .stamina-text {
            font-size: 0.6rem;
            color: #b3d9e0;
            text-align: center;
            margin-top: 1px;
        }
        .stamina-info {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .stamina-info .stamina-icon {
            font-size: 0.9rem;
        }
        .unit-icon .player-name {
            font-size: 0.65rem;
            font-weight: 700;
            color: #f5d742;
            text-shadow: 0 0 10px rgba(245, 215, 66, 0.3);
            display: block;
            line-height: 1.1;
        }
        .unit-icon .monster-placeholder {
            font-size: 0.65rem;
            color: #b3d9e0;
            opacity: 0.7;
        }
        /* ---- 版權資訊 ---- */
        .copyright {
            margin-top: 14px;
            padding: 8px 12px;
            border-top: 1px solid #2a5a62;
            text-align: center;
            font-size: 0.7rem;
            color: #4a6b66;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .copyright .version {
            background: #0f282e;
            padding: 0 8px;
            border-radius: 12px;
            font-weight: 600;
            color: #7d9ea0;
        }
        .copyright #copyrightText {
            color: #4a7a7a;
        }
    </style>
</head>
<body>

    <!-- 封面 -->
    <div id="coverScreen">
        <div class="cover-title">⚔️ 三界傳說</div>
        <div class="cover-sub">— 迷宮冒險 · 體力制 —</div>
        <div class="cover-input-group">
            <label for="playerNameInput">👤 輸入你的名字</label>
            <input type="text" id="playerNameInput" placeholder="例如：亞瑟" value="冒險者" maxlength="10">
        </div>
        <button class="cover-btn" id="startNewBtn">🌟 開始遊戲</button>
        <button class="cover-btn secondary" id="continueBtn">📂 繼續遊戲</button>
        <div class="cover-version">v2.0 · 體力 · 探索 · 戰鬥 · 成長</div>
    </div>

    <!-- 主遊戲 -->
    <div class="game-wrapper" id="gameWrapper" style="display:none;">

        <!-- 戰鬥畫面 (置頂) -->
        <div class="battle-scene-top" id="battleSceneTop">
            <div class="battle-side" id="playerSide">
                <div class="title">🛡️ 我方</div>
                <div class="units" id="playerUnits">
                    <div class="unit-icon">🧑 <span class="player-name">冒險者</span><br><span class="hp-bar">❤️30</span></div>
                </div>
            </div>
            <div class="battle-vs">⚔️</div>
            <div class="battle-side" id="enemySide">
                <div class="title">👹 敵方</div>
                <div class="units" id="enemyUnits">
                    <div class="unit-icon">❓ <span class="monster-placeholder">???</span><br><span class="hp-bar">❤️??</span></div>
                </div>
            </div>
        </div>

        <!-- 狀態欄 -->
        <div class="status-panel">
            <div class="stat-badge">
                <span>⚔️ Lv.<strong id="levelDisplay">1</strong></span>
                <span>❤️ <strong id="hpDisplay">30/30</strong></span>
                <span class="stamina-info">
                    <span class="stamina-icon">⚡</span>
                    <strong id="staminaDisplay">50/50</strong>
                </span>
                <span>⚡ <strong id="atkDisplay">6</strong></span>
                <span>🛡️ <strong id="defDisplay">2</strong></span>
            </div>
            <div class="stat-badge">
                <span>💰 <strong id="goldDisplay">20</strong></span>

            // ============================================================

            // ============================================================
            const MONSTER_POOLS = {
                0: [
                    { name: '森林哥布林', hp: 12, atk: 4, def: 1, gold: 6 },
                    { name: '野狼', hp: 15, atk: 6, def: 2, gold: 8 },

                ],
                1: [
                    { name: '沙漠蠍', hp: 18, atk: 8, def: 4, gold: 14 },
                    { name: '沙盜', hp: 22, atk: 9, def: 5, gold: 18 },
                    { name: '毒蛇', hp: 16, atk: 7, def: 2, gold: 12 },
                    { name: '沙巨人', hp: 25, atk: 10, def: 6, gold: 20 },
                ],
                2: [
                    { name: '冰霜巨人', hp: 30, atk: 12, def: 6, gold: 25 },
                    { name: '雪怪', hp: 28, atk: 11, def: 7, gold: 22 },
                    { name: '冰狼', hp: 20, atk: 9, def: 4, gold: 16 },
                    { name: '雪人', hp: 24, atk: 10, def: 5, gold: 18 },
                ]
            };

            const ACHIEVEMENTS = {
                '初出茅廬': () => G.level >= 2,
                '小有資財': () => G.gold >= 100,
                '武器大師': () => G.weapon !== '木劍' && G.weaponAtk >= 7,
                '團隊精神': () => G.teammates.length >= 2,
                '三界行者': () => G.visitedScenes.size >= 3,
                '技能達人': () => G.skills.length >= 2,
                '屠龍者': () => G.totalKills >= 20,
                '森林守護者': () => G.bossDefeated[0],
                '沙漠征服者': () => G.bossDefeated[1],
                '冰原之王': () => G.bossDefeated[2],
                '地圖探索者': () => G.unlockedNodes.size >= 10,
                '體力達人': () => G.maxStamina >= 70,
            };
            const ACHIEVE_NAMES = Object.keys(ACHIEVEMENTS);

            // ============================================================
            // 3. 遊戲狀態
            // ============================================================
            const G = {
                playerName: '冒險者',
                region: 0,
                currentNode: 'f0',
                level: 1,
                hp: 30,
                maxHp: 30,
                attack: 6,
                defense: 2,
                gold: 20,
                weapon: '木劍',
                weaponAtk: 2,
                armor: '布衣',
                armorDef: 0,
                weaponLevel: 0,
                armorLevel: 0,
                skills: [],
                teammates: [],
                achievements: [],
                exp: 0,
                expNext: 20,
                baseAtk: 4,
                baseDef: 1,
                battleCooldown: 0,
                totalKills: 0,
                visitedScenes: new Set([0]),
                bossDefeated: [false, false, false],
                unlockedNodes: new Set(['f0', 'd0', 'i0']),
                nodeKills: {},
                battleMonster: null,
                isFighting: false,
                stamina: 50,
                maxStamina: 50,
                staminaRegenTimer: null,
            };

            // ============================================================
            // 4. 輔助函數
            // ============================================================
            function getRegion() { return REGIONS[G.region]; }

            function getNodes() { return getRegion().nodes; }

            function getConnections() { return getRegion().connections; }

            function getNode(nodeId) { return getNodes().find(n => n.id === nodeId); }

            function getCurrentNode() { return getNode(G.currentNode); }

            function isBossNode(nodeId) { const n = getNode(nodeId); return n && n.isBoss === true; }

            function getNeighbors(nodeId) {
                const conns = getConnections();
                const neighbors = [];
                conns.forEach(pair => {
                    if (pair[0] === nodeId) neighbors.push(pair[1]);
                    if (pair[1] === nodeId) neighbors.push(pair[0]);
                });
                return neighbors;
            }

            function getLockedNeighbors(nodeId) {
                return getNeighbors(nodeId).filter(id => !G.unlockedNodes.has(id));
            }

            function hasEnoughStamina(amount) {
                return G.stamina >= amount;
            }

            function consumeStamina(amount) {
                if (G.stamina < amount) {
                    logMessage(`⚠️ 體力不足！需要 ${amount} 點體力 (當前 ${G.stamina})`, 'stamina-msg');
                    return false;
                }
                G.stamina = Math.max(0, G.stamina - amount);
                updateUI();
                return true;
            }

            function regenStamina(amount) {
                G.stamina = Math.min(G.maxStamina, G.stamina + amount);
                updateUI();
            }

            function startStaminaRegen() {
                if (G.staminaRegenTimer) {
                    clearInterval(G.staminaRegenTimer);
                    G.staminaRegenTimer = null;
                }
                G.staminaRegenTimer = setInterval(() => {
                    if (!G.isFighting) {
                        regenStamina(1);
                    }
                }, 3000);
            }

            function stopStaminaRegen() {
                if (G.staminaRegenTimer) {
                    clearInterval(G.staminaRegenTimer);
                    G.staminaRegenTimer = null;
                }
            }

            // ============================================================
            // 5. UI 更新
            // ============================================================
            function updateUI() {
                document.getElementById('levelDisplay').textContent = G.level;
                document.getElementById('hpDisplay').textContent = `${G.hp}/${G.maxHp}`;
                document.getElementById('staminaDisplay').textContent = `${G.stamina}/${G.maxStamina}`;
                document.getElementById('atkDisplay').textContent = G.attack;
                document.getElementById('defDisplay').textContent = G.defense;
                document.getElementById('goldDisplay').textContent = G.gold;
                document.getElementById('achieveCount').textContent = G.achievements.length;

                const pct = Math.min(100, (G.exp / G.expNext) * 100);
                document.getElementById('expBarFill').style.width = pct + '%';
                document.getElementById('expText').textContent = `經驗 ${G.exp} / ${G.expNext}`;

                const staminaPct = Math.min(100, (G.stamina / G.maxStamina) * 100);
                document.getElementById('staminaBarFill').style.width = staminaPct + '%';
                const fill = document.getElementById('staminaBarFill');
                if (staminaPct < 20) {
                    fill.style.background = 'linear-gradient(90deg, #ff4444, #ff6b6b)';
                } else if (staminaPct < 50) {
                    fill.style.background = 'linear-gradient(90deg, #f5d742, #f7b731)';
                } else {
                    fill.style.background = 'linear-gradient(90deg, #7ddfb3, #4ba392)';
                }
                document.getElementById('staminaText').textContent =
                    `⚡ 體力 ${G.stamina} / ${G.maxStamina} · 每3秒恢復1`;

                document.querySelectorAll('.region-btn').forEach((btn, idx) => {
                    btn.classList.toggle('active', idx === G.region);
                });

                const node = getCurrentNode();
                const reg = getRegion();
                const bossStatus = G.bossDefeated[G.region] ? ' ✅ Boss已擊敗' : '';
                document.getElementById('locName').textContent = node ? node.name : '???';
                document.getElementById('locDetail').textContent = `${reg.name}${bossStatus}`;
                let detail = `武器: ${G.weapon} (+${G.weaponAtk}) 防具: ${G.armor} (+${G.armorDef})`;
                if (G.skills.length) detail += ` 技能: ${G.skills.join('、')}`;
                if (G.teammates.length) detail += ` 隊友: ${G.teammates.join('、')}`;
                document.getElementById('extraDetail').textContent = detail;

                const fightBtn = document.getElementById('fightBtn');
                if (G.battleCooldown > 0 || G.isFighting) {
                    fightBtn.textContent = G.isFighting ? '⚔️ 戰鬥中...' : `⏳ 冷卻 (${G.battleCooldown})`;
                    fightBtn.disabled = true;
                } else {
                    if (!hasEnoughStamina(12)) {
                        fightBtn.textContent = '⚔️ 體力不足';
                        fightBtn.disabled = true;
                    } else if (isBossNode(G.currentNode)) {
                        fightBtn.textContent = G.bossDefeated[G.region] ? '♻️ Boss重生' : '👹 Boss戰';
                        fightBtn.disabled = false;
                    } else {
                        fightBtn.textContent = '⚔️ 戰鬥';
                        fightBtn.disabled = false;
                    }
                }

                const exploreBtn = document.getElementById('exploreBtn');
                if (!hasEnoughStamina(8)) {
                    exploreBtn.textContent = '🔍 體力不足';
                    exploreBtn.disabled = true;
                } else {
                    exploreBtn.textContent = '🔍 探索';
                    exploreBtn.disabled = false;
                }

                const skillBtn = document.getElementById('skillBtn');
                if (G.skills.length === 0) {
                    skillBtn.textContent = '✨ 無技能';
                    skillBtn.disabled = true;
                } else {
                    const hasSkillStamina = G.skills.some(s => {
                        const cost = s === '猛擊' ? 18 : 12;
                        return hasEnoughStamina(cost);
                    });
                    if (!hasSkillStamina) {
                        skillBtn.textContent = '✨ 體力不足';
                        skillBtn.disabled = true;
                    } else {
                        skillBtn.textContent = '✨ 技能';
                        skillBtn.disabled = false;
                    }
                }

                updateBattleSceneTop();
                checkAchievements();
                // 更新版權年份（只在初始化時做一次）
                const copyrightEl = document.getElementById('copyrightText');
                if (copyrightEl && !copyrightEl.dataset.initialized) {
                    const year = new Date().getFullYear();
                    copyrightEl.textContent = `© ${year} ☕迪遜咖啡廳，版權所有。`;
                    copyrightEl.dataset.initialized = 'true';
                }
            }

            function updateBattleSceneTop() {
                const playerDiv = document.getElementById('playerUnits');
                const enemyDiv = document.getElementById('enemyUnits');
                let playerHtml =
                    `<div class="unit-icon">🧑 <span class="player-name">${G.playerName}</span><br><span class="hp-bar">❤️${G.hp}/${G.maxHp}</span></div>`;
                G.teammates.forEach(t => {
                    const icons = { '獵犬': '🐕', '法師': '🧙‍♂️', '戰士': '⚔️', '盾兵': '🛡️' };
                    playerHtml += `<div class="unit-icon">${icons[t]||'👤'} ${t}</div>`;
                });
                playerDiv.innerHTML = playerHtml;

                const monster = G.battleMonster;
                if (monster) {
                    const hp = monster.currentHp !== undefined ? monster.currentHp : monster.hp;
                    enemyDiv.innerHTML =
                        `<div class="unit-icon">${monster.emoji||'👹'} ${monster.name}<br><span class="hp-bar">❤️${Math.max(0,hp)}/${monster.maxHp||monster.hp}</span></div>`;
                } else {
                    enemyDiv.innerHTML =
                        `<div class="unit-icon">❓ <span class="monster-placeholder">???</span><br><span class="hp-bar">❤️??</span></div>`;
                }
            }

            function addLog(msg, type = 'system') {
                const logDiv = document.getElementById('combinedLog');
                const entry = document.createElement('div');
                entry.className = type;
                entry.innerHTML = msg;
                logDiv.prepend(entry);
                while (logDiv.children.length > 30) logDiv.removeChild(logDiv.lastChild);
            }

            function logMessage(msg, type = 'system') { addLog(msg, type); }

            function battleLog(msg, type = 'system') { addLog(msg, type); }

            function tickCooldown() {
                if (G.battleCooldown > 0) { G.battleCooldown--; }
                updateUI();
            }

            function checkAchievements() {
                let newAchieve = false;
                ACHIEVE_NAMES.forEach(name => {
                    if (!G.achievements.includes(name) && ACHIEVEMENTS[name]()) {
                        G.achievements.push(name);
                        newAchieve = true;
                        logMessage(`🏆 成就解鎖: ${name} !`);
                    }
                });
                if (newAchieve) document.getElementById('achieveCount').textContent = G.achievements.length;
            }

            function updateStats() {
                let atk = G.baseAtk + G.weaponAtk;
                let def = G.baseDef + G.armorDef;
                if (G.teammates.includes('戰士')) { atk += 2;
                    def += 1; }
                if (G.teammates.includes('獵犬')) atk += 3;
                if (G.teammates.includes('盾兵')) def += 2;
                G.attack = atk;
                G.defense = def;
            }

            // ============================================================
            // 6. 戰鬥系統
            // ============================================================
            function startBattle(name, mHpBase, mAtkBase, mDefBase, goldBase, isBoss) {
                if (G.isFighting) return;
                if (!consumeStamina(12)) {
                    logMessage('⚠️ 體力不足，無法戰鬥！', 'stamina-msg');
                    return;
                }
                G.isFighting = true;
                updateUI();

                const monster = {
                    name: name,
                    hp: mHpBase + Math.floor(G.level * 1.8),
                    maxHp: mHpBase + Math.floor(G.level * 1.8),
                    atk: mAtkBase + Math.floor(G.level * 0.8),
                    def: mDefBase + Math.floor(G.level * 0.4),
                    gold: goldBase,
                    emoji: isBoss ? '👑' : '👹',
                    currentHp: mHpBase + Math.floor(G.level * 1.8),
                };
                G.battleMonster = monster;
                updateBattleSceneTop();

                let mHp = monster.hp;
                let mAtk = monster.atk;
                let mDef = monster.def;
                let playerAtk = G.attack;
                let playerDef = G.defense;

                const title = isBoss ? '👹 BOSS' : '⚔️';
                battleLog(`${title} 遭遇 <strong>${name}</strong> (HP:${mHp} ATK:${mAtk} DEF:${mDef})`, 'system');

                let playerHp = G.hp;
                let turn = 0;

                function doTurn() {
                    if (G.teammates.includes('法師')) {
                        playerHp = Math.min(playerHp + 1, G.maxHp);
                        G.hp = playerHp;
                        updateBattleSceneTop();
                    }
                    if (playerHp <= 0 || mHp <= 0 || turn >= 20) {
                        finishBattle(playerHp, mHp, monster, goldBase, isBoss);
                        return;
                    }
                    turn++;
                    let dmg = Math.max(1, playerAtk - mDef + Math.floor(Math.random() * 4));
                    mHp -= dmg;
                    monster.currentHp = mHp;
                    const attackEmojis = ['🗡️', '⚔️', '💥', '🔥', '💢'];
                    const emoji = attackEmojis[Math.floor(Math.random() * attackEmojis.length)];
                    battleLog(`▶ 第${turn}回合 你${emoji}造成 <span class="dmg">${dmg}</span> 傷害 (怪物HP:${Math.max(0,mHp)})`,
                        'player-attack');
                    updateBattleSceneTop();
                    if (mHp <= 0) {
                        battleLog(`✅ 擊敗 ${name}!`, 'system');
                        finishBattle(playerHp, mHp, monster, goldBase, isBoss);
                        return;
                    }

                    let dmg2 = Math.max(1, mAtk - playerDef + Math.floor(Math.random() * 3));
                    playerHp -= dmg2;
                    const monsterEmojis = ['👊', '🦷', '🌪️', '💨', '❄️'];
                    const mEmoji = monsterEmojis[Math.floor(Math.random() * monsterEmojis.length)];
                    battleLog(`◀ 怪物${mEmoji}造成 <span class="dmg">${dmg2}</span> 傷害 (你的HP:${Math.max(0,playerHp)})`,
                        'monster-attack');
                    G.hp = playerHp;
                    updateBattleSceneTop();
                    if (playerHp <= 0) {
                        battleLog(`💀 你被擊敗了...`, 'system');
                        finishBattle(playerHp, mHp, monster, goldBase, isBoss);
                        return;
                    }
                    setTimeout(doTurn, 700);
                }
                setTimeout(doTurn, 400);
            }

            function finishBattle(playerHp, mHp, monster, goldBase, isBoss) {
                G.battleMonster = null;
                G.isFighting = false;

                if (playerHp <= 0) {
                    G.hp = Math.max(1, Math.floor(G.maxHp * 0.3));
                    logMessage(`💀 戰敗... 回復至 ${G.hp}HP`);
                    G.battleCooldown = 1;
                    tickCooldown();
                    updateUI();
                    return;
                }
                if (mHp <= 0) {
                    G.hp = Math.min(G.maxHp, playerHp);
                    const goldReward = Math.floor(goldBase + G.level * 2);
                    G.gold += goldReward;
                    const expGain = 15 + G.level * 4;
                    G.exp += expGain;
                    G.totalKills += 1;
                    battleLog(`🏅 勝利! 獲得 ${goldReward}💰 ${expGain}EXP`, 'system');

                    if (isBoss) {
                        G.bossDefeated[G.region] = true;
                        battleLog(`👑 擊敗了 ${monster.name}！此區域Boss已清除！`, 'system');
                        logMessage(`👑 擊敗了 ${monster.name}！`);
                    } else {
                        if (!G.nodeKills[G.currentNode]) G.nodeKills[G.currentNode] = 0;
                        G.nodeKills[G.currentNode]++;
                    }

                    while (G.exp >= G.expNext) {
                        G.exp -= G.expNext;
                        G.level++;
                        G.maxHp += 8;
                        G.hp = Math.min(G.hp + 8, G.maxHp);
                        G.baseAtk += 2;
                        G.baseDef += 1;
                        G.maxStamina += 2;
                        G.stamina = G.maxStamina;
                        updateStats();
                        G.expNext = Math.floor(G.expNext * 1.4) + 8;
                        battleLog(`🎉 升級! Lv.${G.level} 體力上限+2，體力全回復!`, 'system');
                    }
                    updateStats();
                    G.battleCooldown = 1;
                    tickCooldown();
                    updateUI();
                    checkAchievements();
                } else {
                    logMessage('⚖️ 戰鬥結束，不分勝負');
                    G.battleCooldown = 1;
                    tickCooldown();
                    updateUI();
                }
            }

            function handleFight() {
                if (G.isFighting) return;
                if (G.battleCooldown > 0) {
                    battleLog(`⏳ 冷卻中 (${G.battleCooldown} 回合)`, 'system');
                    return;
                }
                if (!hasEnoughStamina(12)) {
                    battleLog(`⚠️ 體力不足 (需要12點，當前${G.stamina})`, 'stamina-msg');
                    return;
                }
                const node = getCurrentNode();
                if (!node) { battleLog('⚠️ 無效節點', 'system'); return; }

                if (node.isBoss) {
                    const loc = getRegion();
                    if (G.bossDefeated[G.region]) {
                        G.bossDefeated[G.region] = false;
                        battleLog(`♻️ ${loc.bossName} 已重生！再次挑戰吧！`, 'system');
                        logMessage(`♻️ ${loc.bossName} 已重生！`);
                        updateUI();
                        return;
                    }
                    battleLog(`👹 ${loc.bossName}: 「${loc.bossSpeech}」`, 'boss-speech');
                    startBattle(loc.bossName, loc.bossHp, loc.bossAtk, loc.bossDef, loc.bossGold, true);
                    return;
                }

                const pool = MONSTER_POOLS[G.region] || MONSTER_POOLS[0];
                const monster = pool[Math.floor(Math.random() * pool.length)];
                startBattle(monster.name, monster.hp, monster.atk, monster.def, monster.gold, false);
            }

            // ============================================================
            // 7. 探索
            // ============================================================
            function explore() {
                tickCooldown();
                if (!hasEnoughStamina(8)) {
                    logMessage(`⚠️ 體力不足 (需要8點，當前${G.stamina})`, 'stamina-msg');
                    return;
                }
                if (!consumeStamina(8)) return;

                const goldFound = 3 + Math.floor(Math.random() * 8) + G.level;
                G.gold += goldFound;
                let msg = `🔍 探索發現 ${goldFound} 金幣!`;

                const locked = getLockedNeighbors(G.currentNode);
                if (locked.length > 0 && Math.random() < 0.4) {
                    const pick = locked[Math.floor(Math.random() * locked.length)];
                    G.unlockedNodes.add(pick);
                    const node = getNode(pick);
                    msg += ` 🗺️ 發現了新地點: ${node ? node.name : pick}!`;
                    logMessage(`🗺️ 解鎖了新地點: ${node ? node.name : pick}`);
                } else if (locked.length === 0) {
                    msg += ` (此處沒有未探索的路徑)`;
                }
                logMessage(msg);
                updateUI();
            }

            // ============================================================
            // 8. 迷宮地圖
            // ============================================================
            function openMap() {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.id = 'mapModal';
                const reg = getRegion();
                const nodes = getNodes();
                const conns = getConnections();

                let maxRow = 0,
                    maxCol = 0;
                nodes.forEach(n => {
                    if (n.row > maxRow) maxRow = n.row;
                    if (n.col > maxCol) maxCol = n.col;
                });

                let html = `<div class="modal-box"><h3>🗺️ ${reg.name} — 迷宮地圖</h3>
                    <div style="font-size:0.75rem;color:#98bcc3;margin-bottom:8px;text-align:center;">
                        🟡 當前位置 &nbsp;|&nbsp; 🟢 已解鎖 &nbsp;|&nbsp; ⬜ 未探索 &nbsp;|&nbsp; 👑 Boss點
                    </div>
                    <div class="maze-container">`;

                for (let r = 0; r <= maxRow; r++) {
                    const rowNodes = nodes.filter(n => n.row === r).sort((a, b) => a.col - b.col);
                    if (rowNodes.length === 0) continue;

                    html += `<div class="maze-row">`;
                    let currentCol = 0;
                    rowNodes.forEach(node => {
                        while (currentCol < node.col) {
                            html +=
                                `<div class="maze-cell locked" style="opacity:0.2;cursor:default;border-color:#1a3a3a;">&nbsp;</div>`;
                            currentCol++;
                        }
                        const isUnlocked = G.unlockedNodes.has(node.id);
                        const isCurrent = node.id === G.currentNode;
                        const isBoss = node.isBoss === true;
                        const bossDefeated = isBoss && G.bossDefeated[G.region];

                        let cellClass = 'maze-cell';
                        if (isCurrent) cellClass += ' current';
                        else if (isUnlocked) cellClass += ' unlocked';
                        else cellClass += ' locked';

                        let content = '';
                        if (isUnlocked) {
                            let nameDisplay = node.name;
                            if (isBoss) nameDisplay += ' 👑';
                            content = `<div class="cell-name">${nameDisplay}</div>`;
                            if (isBoss && bossDefeated) content += `<div class="cell-boss">✅ 已擊敗</div>`;
                        } else {
                            content = `<div class="lock-icon">🔒</div>`;
                        }
                        html += `<div class="${cellClass}" data-node="${node.id}">${content}</div>`;
                        currentCol = node.col + 1;
                    });
                    html += `</div>`;

                    if (r < maxRow) {
                        const nextNodes = nodes.filter(n => n.row === r + 1);
                        if (nextNodes.length > 0) {
                            html += `<div class="maze-connector">`;
                            const thisIds = rowNodes.map(n => n.id);
                            const nextIds = nextNodes.map(n => n.id);
                            let hasConnection = false;
                            conns.forEach(pair => {
                                if (thisIds.includes(pair[0]) && nextIds.includes(pair[1])) hasConnection = true;
                                if (thisIds.includes(pair[1]) && nextIds.includes(pair[0])) hasConnection = true;
                            });
                            if (hasConnection) {
                                html += `<span class="line unlocked"></span>`;
                            } else {
                                html += `<span class="line"></span>`;
                            }
                            html += `</div>`;
                        }
                    }
                }

                html += `<button class="modal-close" id="closeMap">關閉地圖</button></div>`;
                overlay.innerHTML = html;
                document.body.appendChild(overlay);

                overlay.querySelectorAll('.maze-cell.unlocked, .maze-cell.current').forEach(el => {
                    el.addEventListener('click', function() {
                        const nodeId = this.dataset.node;
                        if (!nodeId) return;
                        if (nodeId === G.currentNode) {
                            logMessage('📍 你已經在這裡了');
                            document.getElementById('mapModal')?.remove();
                            return;
                        }
                        G.currentNode = nodeId;
                        G.visitedScenes.add(G.region);
                        updateUI();
                        logMessage(`📍 移動到 ${getNode(nodeId).name}`);
                        document.getElementById('mapModal')?.remove();
                    });
                });

                document.getElementById('closeMap').addEventListener('click', function() {
                    document.getElementById('mapModal')?.remove();
                });
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) this.remove();
                });
            }

            // ============================================================
            // 9. 商店
            // ============================================================
            function openShop() {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.id = 'shopModal';
                let html = `<div class="modal-box"><h3>🏪 商店</h3>`;

                if (G.weaponLevel < WEAPON_CHAIN.length) {
                    const w = WEAPON_CHAIN[G.weaponLevel];
                    html += `<div class="modal-item">
                        <span>${w.name} (攻擊+${w.atk}) <strong>💰${w.cost}</strong></span>
                        <button data-shop="weapon">購買</button>
                    </div>`;
                } else {
                    html += `<div class="modal-item" style="opacity:0.6;cursor:default;">武器已達最高級</div>`;
                }

                if (G.armorLevel < ARMOR_CHAIN.length) {
                    const a = ARMOR_CHAIN[G.armorLevel];
                    let desc = '';
                    if (a.hp > 0) desc = `HP+${a.hp}`;
                    else if (a.def > 0) desc = `防禦+${a.def}`;
                    html += `<div class="modal-item">
                        <span>${a.name} (${desc}) <strong>💰${a.cost}</strong></span>
                        <button data-shop="armor">購買</button>
                    </div>`;
                } else {
                    html += `<div class="modal-item" style="opacity:0.6;cursor:default;">防具已達最高級</div>`;
                }

                html += `<div class="modal-item">
                    <span>${POTION.name} (${POTION.desc}) <strong>💰${POTION.cost}</strong></span>
                    <button data-shop="potion">購買</button>
                </div>`;

                html += `<div class="modal-item" style="border-left-color:#f5d742;">
                    <span>🍞 ${BREAD.name} (${BREAD.desc}) <strong>💰${BREAD.cost}</strong></span>
                    <button data-shop="bread">購買</button>
                </div>`;

                SKILL_ITEMS.forEach(skillItem => {
                    if (!G.skills.includes(skillItem.skill)) {
                        html += `<div class="modal-item">
                            <span>${skillItem.name} (${skillItem.desc}) <strong>💰${skillItem.cost}</strong></span>
                            <button data-shop="skill" data-skill="${skillItem.skill}" data-cost="${skillItem.cost}">購買</button>
                        </div>`;
                    }
                });
                if (G.skills.length === SKILL_ITEMS.length) {
                    html += `<div class="modal-item" style="opacity:0.6;cursor:default;">已學會所有技能</div>`;
                }

                html += `<button class="modal-close" id="closeShop">關閉商店</button></div>`;
                overlay.innerHTML = html;
                document.body.appendChild(overlay);

                overlay.querySelectorAll('[data-shop]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const type = this.dataset.shop;
                        if (type === 'weapon') {
                            const w = WEAPON_CHAIN[G.weaponLevel];
                            if (!w) { logMessage('❌ 武器已達最高級'); return; }
                            if (G.gold < w.cost) { logMessage(`❌ 金幣不足! 需要 ${w.cost}`); return; }
                            G.gold -= w.cost;
                            G.weapon = w.name;
                            G.weaponAtk = w.atk;
                            G.weaponLevel++;
                            updateStats();
                            logMessage(`⚔️ 裝備了 ${w.name} (攻擊+${w.atk})`);
                            document.getElementById('shopModal')?.remove();
                            openShop();
                            updateUI();
                        } else if (type === 'armor') {
                            const a = ARMOR_CHAIN[G.armorLevel];
                            if (!a) { logMessage('❌ 防具已達最高級'); return; }
                            if (G.gold < a.cost) { logMessage(`❌ 金幣不足! 需要 ${a.cost}`); return; }
                            G.gold -= a.cost;
                            G.armor = a.name;
                            if (a.hp > 0) {
                                G.maxHp += a.hp;
                                G.hp = Math.min(G.hp + a.hp, G.maxHp);
                            }
                            if (a.def > 0) {
                                G.armorDef = a.def;
                            } else {
                                G.armorDef = 0;
                            }
                            G.armorLevel++;
                            updateStats();
                            logMessage(`🛡️ 購入 ${a.name} (${a.hp>0?'HP+'+a.hp:'防禦+'+a.def})`);
                            document.getElementById('shopModal')?.remove();
                            openShop();
                            updateUI();
                        } else if (type === 'potion') {
                            if (G.gold < POTION.cost) { logMessage(`❌ 金幣不足! 需要 ${POTION.cost}`); return; }
                            G.gold -= POTION.cost;
                            G.hp = Math.min(G.maxHp, G.hp + POTION.heal);
                            logMessage(`💚 使用藥水，回復 ${POTION.heal} HP`);
                            updateUI();
                        } else if (type === 'bread') {
                            if (G.gold < BREAD.cost) { logMessage(`❌ 金幣不足! 需要 ${BREAD.cost}`); return; }
                            G.gold -= BREAD.cost;
                            const oldStamina = G.stamina;
                            G.stamina = Math.min(G.maxStamina, G.stamina + BREAD.stamina);
                            const actual = G.stamina - oldStamina;
                            logMessage(`🍞 吃麵包，回復 ${actual} 體力 (${oldStamina}→${G.stamina})`);
                            updateUI();
                        } else if (type === 'skill') {
                            const skillName = this.dataset.skill;
                            const cost = parseInt(this.dataset.cost);
                            if (G.skills.includes(skillName)) { logMessage('❌ 已學會此技能'); return; }
                            if (G.gold < cost) { logMessage(`❌ 金幣不足! 需要 ${cost}`); return; }
                            G.gold -= cost;
                            G.skills.push(skillName);
                            logMessage(`✨ 學會技能: ${skillName}`);
                            document.getElementById('shopModal')?.remove();
                            openShop();
                            updateUI();
                        }
                    });
                });

                document.getElementById('closeShop').addEventListener('click', function() {
                    document.getElementById('shopModal')?.remove();
                });
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) this.remove();
                });
            }

            // ============================================================
            // 10. 隊友招募
            // ============================================================
            const TEAM_POOL = [
                { id: '獵犬', name: '🐕獵犬', desc: '攻擊加成', cost: 355, effect: { atk: 3 } },
                { id: '戰士', name: '⚔️戰士', desc: '綜合加成', cost: 555, effect: { atk: 2, def: 1 } },
                { id: '法師', name: '🧙‍♂️法師', desc: '治療', cost: 755, effect: { heal: 1 } },
                { id: '盾兵', name: '🛡️盾兵', desc: '防禦加成', cost: 855, effect: { def: 2 } },
            ].sort((a, b) => a.cost - b.cost);

            function manageTeam() {
                const available = TEAM_POOL.filter(t => !G.teammates.includes(t.id));
                if (available.length === 0) {
                    logMessage('👥 你已經擁有所有隊友!');
                    return;
                }
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.id = 'teamModal';
                let html = `<div class="modal-box"><h3>👥 招募隊友</h3>`;
                available.forEach((t, idx) => {
                    html += `<div class="modal-item">
                        <span>${t.name} (${t.desc}) <strong>💰${t.cost}</strong></span>
                        <button data-teamidx="${idx}">招募</button>
                    </div>`;
                });
                html += `<button class="modal-close" id="closeTeam">關閉</button></div>`;
                overlay.innerHTML = html;
                document.body.appendChild(overlay);

                overlay.querySelectorAll('[data-teamidx]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.teamidx);
                        const recruit = available[idx];
                        if (!recruit) return;
                        if (G.gold < recruit.cost) {
                            logMessage(`❌ 金幣不足 ${recruit.cost}`);
                            return;
                        }
                        G.gold -= recruit.cost;
                        G.teammates.push(recruit.id);
                        if (recruit.effect.atk) G.attack += recruit.effect.atk;
                        if (recruit.effect.def) G.defense += recruit.effect.def;
                        logMessage(`👥 招募了 ${recruit.name}`);
                        updateStats();
                        updateUI();
                        document.getElementById('teamModal')?.remove();
                        manageTeam();
                    });
                });

                document.getElementById('closeTeam').addEventListener('click', function() {
                    document.getElementById('teamModal')?.remove();
                });
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) this.remove();
                });
            }

            // ============================================================
            // 11. 技能使用 (消耗體力，無冷卻)
            // ============================================================
            function useSkill() {
                tickCooldown();
                if (G.skills.length === 0) {
                    logMessage('❌ 沒有技能');
                    return;
                }

                const availableSkills = G.skills.filter(s => {
                    const cost = s === '猛擊' ? 18 : 12;
                    return hasEnoughStamina(cost);
                });

                if (availableSkills.length === 0) {
                    logMessage(`⚠️ 體力不足，無法使用任何技能`, 'stamina-msg');
                    return;
                }

                if (availableSkills.length === 1) {
                    executeSkill(availableSkills[0]);
                    return;
                }

                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.id = 'skillChoiceModal';
                let html = `<div class="modal-box"><h3>✨ 選擇技能</h3>`;
                G.skills.forEach(skillName => {
                    const cost = skillName === '猛擊' ? 18 : 12;
                    const canUse = hasEnoughStamina(cost);
                    const status = canUse ? ` (消耗${cost}體力)` : ' ❌ 體力不足';
                    let desc = '';
                    if (skillName === '猛擊') desc = '⚡ 攻擊力暫時 +9 (消耗18體力)';
                    else if (skillName === '治癒') desc = '💚 回復 17 HP (消耗12體力)';
                    html += `<button class="skill-choice-btn" data-skill="${skillName}" ${!canUse?'disabled':''}>
                        ${skillName}${status}<br><span style="font-size:0.7rem;color:#98bcc3;">${desc}</span>
                    </button>`;
                });
                html += `<button class="modal-close" id="closeSkillChoice">取消</button></div>`;
                overlay.innerHTML = html;
                document.body.appendChild(overlay);

                overlay.querySelectorAll('.skill-choice-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const skillName = this.dataset.skill;
                        document.getElementById('skillChoiceModal')?.remove();
                        if (!this.disabled) {
                            executeSkill(skillName);
                        }
                    });
                });

                document.getElementById('closeSkillChoice').addEventListener('click', function() {
                    document.getElementById('skillChoiceModal')?.remove();
                });
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) this.remove();
                });
            }

            function executeSkill(skillName) {
                const cost = skillName === '猛擊' ? 18 : 12;
                if (!hasEnoughStamina(cost)) {
                    logMessage(`⚠️ 體力不足，使用 ${skillName} 需要 ${cost} 點體力`, 'stamina-msg');
                    return;
                }
                if (!consumeStamina(cost)) return;

                if (skillName === '猛擊') {
                    if (G.battleCooldown > 0) {
                        logMessage('⏳ 戰鬥冷卻中');
                        G.stamina = Math.min(G.maxStamina, G.stamina + cost);
                        updateUI();
                        return;
                    }
                    const bonus = 8 + G.level;
                    G.attack += bonus;
                    logMessage(`⚡ 猛擊！ 攻擊力暫時 +${bonus} (消耗${cost}體力)`);
                    battleLog(`⚡ 使用猛擊！攻擊+${bonus} (持續4秒)`, 'system');
                    setTimeout(() => {
                        G.attack -= bonus;
                        updateUI();
                    }, 4000);
                    G.battleCooldown = 1;
                } else if (skillName === '治癒') {
                    const heal = 15 + G.level * 2;
                    G.hp = Math.min(G.maxHp, G.hp + heal);
                    logMessage(`💚 治癒！回復 ${heal} HP (消耗${cost}體力)`);
                    battleLog(`💚 使用治癒！回復 ${heal} HP`, 'heal');
                }
                updateUI();
            }

            // ============================================================
            // 12. 裝備顯示
            // ============================================================
            function showEquipment() {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.id = 'equipModal';
                let html = `<div class="modal-box"><h3>📦 角色裝備</h3>
                    <div class="equip-grid">
                        <div class="equip-item"><strong>⚔️ 武器</strong><br>${G.weapon} (攻擊+${G.weaponAtk})</div>
                        <div class="equip-item"><strong>🛡️ 防具</strong><br>${G.armor} (防禦+${G.armorDef})</div>
                        <div class="equip-item"><strong>❤️ HP</strong><br>${G.hp}/${G.maxHp}</div>
                        <div class="equip-item"><strong>⚡ 體力</strong><br>${G.stamina}/${G.maxStamina}</div>
                        <div class="equip-item"><strong>⚡ 攻擊</strong><br>${G.attack}</div>
                        <div class="equip-item"><strong>🛡️ 防禦</strong><br>${G.defense}</div>
                        <div class="equip-item"><strong>💰 金幣</strong><br>${G.gold}</div>
                        <div class="equip-item"><strong>🏆 成就</strong><br>${G.achievements.length}</div>
                    </div>
                    <div style="font-size:0.8rem;"><strong>👥 隊友:</strong> ${G.teammates.length?G.teammates.join('、'):'無'}</div>
                    <div style="font-size:0.8rem;"><strong>✨ 技能:</strong> ${G.skills.length?G.skills.join('、'):'無'}</div>
                    <div style="font-size:0.8rem;"><strong>🗺️ 解鎖節點:</strong> ${G.unlockedNodes.size} 個</div>
                    <button class="modal-close" id="closeEquip">關閉</button></div>`;
                overlay.innerHTML = html;
                document.body.appendChild(overlay);
                document.getElementById('closeEquip').addEventListener('click', function() {
                    document.getElementById('equipModal')?.remove();
                });
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) this.remove();
                });
            }

            // ============================================================
            // 13. 存檔 / 讀檔
            // ============================================================
            function saveToTxt() {
                const data = {
                    playerName: G.playerName,
                    region: G.region,
                    currentNode: G.currentNode,
                    level: G.level,
                    hp: G.hp,
                    maxHp: G.maxHp,
                    attack: G.attack,
                    defense: G.defense,
                    gold: G.gold,
                    weapon: G.weapon,
                    weaponAtk: G.weaponAtk,
                    armor: G.armor,
                    armorDef: G.armorDef,
                    weaponLevel: G.weaponLevel,
                    armorLevel: G.armorLevel,
                    skills: G.skills,
                    teammates: G.teammates,
                    achievements: G.achievements,
                    exp: G.exp,
                    expNext: G.expNext,
                    baseAtk: G.baseAtk,
                    baseDef: G.baseDef,
                    totalKills: G.totalKills,
                    visitedScenes: [...G.visitedScenes],
                    battleCooldown: G.battleCooldown,
                    bossDefeated: G.bossDefeated,
                    unlockedNodes: [...G.unlockedNodes],
                    nodeKills: G.nodeKills,
                    stamina: G.stamina,
                    maxStamina: G.maxStamina,
                };
                const json = JSON.stringify(data);
                const blob = new Blob([json], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'rpg_save.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                logMessage('💾 存檔已下載');
            }

            function loadFromFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        G.playerName = data.playerName || '冒險者';
                        G.region = data.region || 0;
                        G.currentNode = data.currentNode || 'f0';
                        G.level = data.level || 1;
                        G.hp = data.hp || 30;
                        G.maxHp = data.maxHp || 30;
                        G.attack = data.attack || 6;
                        G.defense = data.defense || 2;
                        G.gold = data.gold || 20;
                        G.weapon = data.weapon || '木劍';
                        G.weaponAtk = data.weaponAtk || 2;
                        G.armor = data.armor || '布衣';
                        G.armorDef = data.armorDef || 0;
                        G.weaponLevel = data.weaponLevel || 0;
                        G.armorLevel = data.armorLevel || 0;
                        G.skills = data.skills || [];
                        G.teammates = data.teammates || [];
                        G.achievements = data.achievements || [];
                        G.exp = data.exp || 0;
                        G.expNext = data.expNext || 20;
                        G.baseAtk = data.baseAtk || 4;
                        G.baseDef = data.baseDef || 1;
                        G.totalKills = data.totalKills || 0;
                        G.visitedScenes = new Set(data.visitedScenes || [0]);
                        G.battleCooldown = data.battleCooldown || 0;
                        G.bossDefeated = data.bossDefeated || [false, false, false];
                        G.unlockedNodes = new Set(data.unlockedNodes || ['f0', 'd0', 'i0']);
                        G.nodeKills = data.nodeKills || {};
                        G.stamina = data.stamina !== undefined ? data.stamina : 50;
                        G.maxStamina = data.maxStamina !== undefined ? data.maxStamina : 50;
                        updateStats();
                        updateUI();
                        logMessage('📂 存檔讀取成功!');
                    } catch (err) {
                        logMessage('❌ 讀取失敗，檔案格式錯誤');
                    }
                };
                reader.readAsText(file);
            }

            function resetGame() {
                if (!confirm('確定重新開始？')) return;
                stopStaminaRegen();
                location.reload();
            }

            // ============================================================
            // 14. 初始化與封面控制
            // ============================================================
            function initGame() {
                const nameInput = document.getElementById('playerNameInput');
                if (nameInput && nameInput.value.trim()) {
                    G.playerName = nameInput.value.trim();
                } else {
                    G.playerName = '冒險者';
                }

                document.getElementById('combinedLog').innerHTML = '';
                logMessage(`🟢 歡迎，${G.playerName}！`);
                logMessage('⚡ 體力系統已啟用：探索/戰鬥/技能消耗體力，每3秒恢復1點');
                logMessage('🍞 商店新增麵包，可回復體力！');
                ['f0', 'd0', 'i0'].forEach(id => G.unlockedNodes.add(id));
                updateStats();
                updateUI();
                startStaminaRegen();
                // 設定版權年份（只做一次）
                const copyrightEl = document.getElementById('copyrightText');
                if (copyrightEl) {
                    const year = new Date().getFullYear();
                    copyrightEl.textContent = `© ${year} ☕迪遜咖啡廳，版權所有。`;
                }
            }

            document.getElementById('startNewBtn').addEventListener('click', function() {
                document.getElementById('coverScreen').classList.add('hidden');
                document.getElementById('gameWrapper').style.display = 'block';
                initGame();
            });

            document.getElementById('continueBtn').addEventListener('click', function() {
                document.getElementById('coverScreen').classList.add('hidden');
                document.getElementById('gameWrapper').style.display = 'block';
                initGame();
                document.getElementById('fileInput').click();
            });

            document.querySelectorAll('.region-btn').forEach((btn) => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.region);
                    if (idx === G.region) return;
                    G.region = idx;
                    const entryId = ['f0', 'd0', 'i0'][idx];
                    if (entryId) {
                        G.currentNode = entryId;
                        G.unlockedNodes.add(entryId);
                    }
                    G.visitedScenes.add(idx);
                    updateUI();
                    logMessage(`📍 進入 ${getRegion().name}`);
                });
            });

            document.getElementById('mapBtn').addEventListener('click', openMap);
            document.getElementById('fightBtn').addEventListener('click', handleFight);

            document.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const action = this.dataset.action;
                    switch (action) {
                        case 'explore':
                            explore();
                            break;
                        case 'shop':
                            openShop();
                            break;
                        case 'skill':
                            useSkill();
                            break;
                        case 'team':
                            manageTeam();
                            break;
                        case 'equip':
                            showEquipment();
                            break;
                        default:
                            break;
                    }
                });
            });

            document.getElementById('saveTxtBtn').addEventListener('click', saveToTxt);
            document.getElementById('fileInput').addEventListener('change', function(e) {
                if (this.files.length) loadFromFile(this.files[0]);
                this.value = '';
            });
            document.getElementById('resetGameBtn').addEventListener('click', resetGame);

            window.addEventListener('beforeunload', function() {
                stopStaminaRegen();
            });
        })();
    </script>
</body>
</html>
