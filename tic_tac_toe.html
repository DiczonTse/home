<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⭕❌井字棋</title>
    <style>
        /* ===== 全域樣式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft YaHei', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0c0e1a 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
        }

        .game-wrapper {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 50px;
            max-width: 700px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .menu-title {
            text-align: center;
            margin-bottom: 15px;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            position: relative;
            background: linear-gradient(135deg, #ff6b6b 0%, #f7971e 20%, #ffd200 40%, #4ecdc4 60%, #45b7d1 80%, #ff6b6b 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.3), 0 0 20px rgba(247, 151, 30, 0.2), 0 0 40px rgba(255, 215, 0, 0.15), 0 0 80px rgba(78, 205, 196, 0.1), 0 8px 30px rgba(0, 0, 0, 0.5);
            -webkit-text-fill-color: transparent;
        }

        .menu-title::before {
            content: '⭕❌ 井字棋';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b 0%, #f7971e 20%, #ffd200 40%, #4ecdc4 60%, #45b7d1 80%, #ff6b6b 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite;
            filter: blur(20px);
            opacity: 0.5;
            z-index: -1;
            transform: scale(1.02);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .menu-title .circle {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            -webkit-text-fill-color: #ffd700;
        }
        .menu-title .cross {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
            -webkit-text-fill-color: #ff6b6b;
        }

        .title-underline {
            width: 120px;
            height: 3px;
            margin: 0 auto 20px;
            background: linear-gradient(90deg, transparent, #ffd200, #4ecdc4, transparent);
            border-radius: 10px;
            animation: underlinePulse 2s ease-in-out infinite;
        }
        @keyframes underlinePulse {
            0%, 100% { width: 120px; opacity: 0.6; }
            50% { width: 200px; opacity: 1; }
        }

        .menu-sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 16px;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* 預覽棋盤（可隱藏） */
        .preview-container {
            display: flex;
            justify-content: center;
            margin: 10px auto 25px;
            transition: all 0.3s ease;
        }
        .preview-container.hidden {
            display: none;
        }

        .preview-board {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .preview-cell {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 700;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .preview-cell.X { color: #ff6b6b; text-shadow: 0 0 20px rgba(255, 107, 107, 0.3); }
        .preview-cell.O { color: #4ecdc4; text-shadow: 0 0 20px rgba(78, 205, 196, 0.3); }
        .preview-cell.empty { opacity: 0.2; }

        .lang-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .lang-select {
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }
        .lang-select:hover { background: rgba(255, 255, 255, 0.15); }
        .lang-select option { background: #1a1a2e; color: #fff; }

        .btn-enter {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            font-weight: 700;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(247, 151, 30, 0.3);
        }
        .btn-enter:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(247, 151, 30, 0.5);
        }

        #settingsArea { display: none; margin-top: 10px; }
        #settingsArea.visible { display: block; animation: fadeSlideDown 0.4s ease; }
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-settings {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .menu-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .menu-row label { flex: 1; }
        .menu-row select {
            flex: 2;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }
        .menu-row select:hover { background: rgba(255, 255, 255, 0.15); }
        .menu-row select option { background: #1a1a2e; color: #fff; }

        .btn-start-game {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #4ecdc4, #44b39d);
            color: #1a1a2e;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(78, 205, 196, 0.3);
        }
        .btn-start-game:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(78, 205, 196, 0.5);
        }

        /* 遊戲畫面 */
        #gameScreen { display: none !important; }
        #gameScreen.active { display: block !important; }

        .board-container {
            position: relative;
            margin: 0 auto 20px;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .cell {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 56px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #fff;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .cell:hover:not(.taken):not(.disabled) {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.03);
        }
        .cell.taken { cursor: default; }
        .cell.X { color: #ff6b6b; text-shadow: 0 0 30px rgba(255, 107, 107, 0.3); }
        .cell.O { color: #4ecdc4; text-shadow: 0 0 30px rgba(78, 205, 196, 0.3); }

        @keyframes blinkPulse {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0); }
            50% { opacity: 0.25; transform: scale(0.9); box-shadow: 0 0 40px rgba(255, 215, 0, 0.5); background: rgba(255, 215, 0, 0.15); }
        }
        .cell.blink {
            animation: blinkPulse 0.7s ease-in-out infinite;
            z-index: 5;
            border-color: rgba(255, 215, 0, 0.3);
        }

        @keyframes winGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(46, 213, 115, 0.3); }
            50% { box-shadow: 0 0 60px rgba(46, 213, 115, 0.6); }
        }
        .cell.win {
            background: rgba(46, 213, 115, 0.2) !important;
            border-color: #2ed573 !important;
            animation: winGlow 1s ease-in-out infinite;
            transform: scale(1.05);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .status-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-text .turn-indicator {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 16px;
            line-height: 28px;
            text-align: center;
            font-weight: 700;
        }
        .turn-indicator.turn-X { background: rgba(255, 107, 107, 0.25); color: #ff6b6b; }
        .turn-indicator.turn-O { background: rgba(78, 205, 196, 0.25); color: #4ecdc4; }

        .status-info {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .status-info .badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-reset {
            padding: 10px 30px;
            border-radius: 30px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }
        .overlay.show { display: flex; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .overlay .result-icon { font-size: 64px; }
        .overlay .result-text { color: #fff; font-size: 28px; font-weight: 700; }
        .overlay .result-sub { color: rgba(255, 255, 255, 0.5); font-size: 16px; }
        .overlay .btn-play-again {
            margin-top: 10px;
            padding: 12px 40px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .overlay .btn-play-again:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(247, 151, 30, 0.4);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .game-wrapper { padding: 20px; border-radius: 24px; }
            .menu-title { font-size: 32px; }
            .menu-row { flex-direction: column; align-items: stretch; gap: 5px; }
            .menu-row select { flex: 1; }
            .cell { font-size: 36px; }
            .board { gap: 6px; padding: 8px; }
            .status-text { font-size: 15px; }
            .status-info { font-size: 12px; }
            .preview-board { grid-template-columns: repeat(3, 40px); gap: 4px; padding: 6px; }
            .preview-cell { width: 40px; height: 40px; font-size: 20px; }
        }
        @media (max-width: 400px) {
            .cell { font-size: 28px; }
            .board { gap: 4px; padding: 6px; }
            .menu-title { font-size: 26px; }
            .preview-board { grid-template-columns: repeat(3, 32px); gap: 3px; padding: 4px; }
            .preview-cell { width: 32px; height: 32px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- 主選單 -->
    <div id="menuScreen">
        <div class="menu-title" id="menuTitle">⭕❌ 井字棋</div>
        <div class="title-underline"></div>
        <div class="menu-sub" id="menuSub">✦ 選擇語言，然後進入遊戲 ✦</div>

        <!-- 動態預覽棋盤（可隱藏） -->
        <div class="preview-container" id="previewContainer">
            <div class="preview-board" id="previewBoard">
                <div class="preview-cell empty" data-pindex="0"></div>
                <div class="preview-cell empty" data-pindex="1"></div>
                <div class="preview-cell empty" data-pindex="2"></div>
                <div class="preview-cell empty" data-pindex="3"></div>
                <div class="preview-cell empty" data-pindex="4"></div>
                <div class="preview-cell empty" data-pindex="5"></div>
                <div class="preview-cell empty" data-pindex="6"></div>
                <div class="preview-cell empty" data-pindex="7"></div>
                <div class="preview-cell empty" data-pindex="8"></div>
            </div>
        </div>

        <!-- 語言選擇 -->
        <div class="lang-container">
            <select class="lang-select" id="langSelect">
                <option value="zh-TW">繁體中文</option>
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
        </div>

        <button class="btn-enter" id="btnEnterGame">▶ 進入遊戲</button>

        <div id="settingsArea">
            <div class="menu-settings">
                <div class="menu-row">
                    <label id="lblMode">模式</label>
                    <select id="modeSelect">
                        <option value="classic" selected>傳統</option>
                        <option value="infinite">無限</option>
                    </select>
                </div>
                <div class="menu-row">
                    <label id="lblGameType">對戰</label>
                    <select id="gameTypeSelect">
                        <option value="pvp">👥 玩家 vs 玩家</option>
                        <option value="pvc" selected>🤖 玩家 vs AI</option>
                    </select>
                </div>
                <div class="menu-row" id="difficultyRow">
                    <label id="lblDifficulty">AI 難度</label>
                    <select id="difficultySelect">
                        <option value="easy">簡單</option>
                        <option value="medium">中等</option>
                        <option value="hard" selected>困難</option>
                    </select>
                </div>
                <div class="menu-row" id="firstMoveRow">
                    <label id="lblFirstMove">先手</label>
                    <select id="firstMoveSelect">
                        <option value="player">👤 玩家 (X)</option>
                        <option value="ai">🤖 AI (X)</option>
                    </select>
                </div>
            </div>
            <button class="btn-start-game" id="btnStartGame">⚔️ 開始遊戲</button>
        </div>

        <div class="footer" id="footerCopyright">v1.0 © 2025 ☕迪遜咖啡廳，版權所有。</div>
    </div>

    <!-- 遊戲畫面 -->
    <div id="gameScreen">
        <div class="board-container">
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <div class="overlay" id="overlay">
                <div class="result-icon" id="resultIcon">🎉</div>
                <div class="result-text" id="resultText">X 獲勝！</div>
                <div class="result-sub" id="resultSub">點擊下方繼續</div>
                <button class="btn-play-again" id="btnPlayAgain">🔄 再玩一局</button>
            </div>
        </div>
        <div class="status-bar">
            <div class="status-text" id="statusText">
                <span class="turn-indicator turn-X" id="turnIndicator">X</span>
                <span id="statusMessage">X 的回合</span>
            </div>
            <div class="status-info">
                <span class="badge" id="modeBadge">🎯 傳統</span>
                <span class="badge" id="stepBadge">第 1 步</span>
                <span class="badge" id="countBadge">● 0</span>
            </div>
        </div>
        <button class="btn-reset" id="btnReset">🔙 返回選單</button>
    </div>
</div>

    // ============================================================
    //  🎮 遊戲狀態
    // ============================================================
    let state = {
        board: ['', '', '', '', '', '', '', '', ''],
        currentPlayer: 'X',
        gameActive: false,
        gameMode: 'classic',
        gameType: 'pvc',
        difficulty: 'hard',
        firstMove: 'player',
        moveHistory: [],
        moveCount: 0,
        lang: 'zh-TW',
        winner: null,
        isOver: false,
        isProcessing: false,
        playerSymbol: 'X',
        aiSymbol: 'O'
    };

    // ============================================================
    //  DOM 參考
    // ============================================================
    const menuScreen = document.getElementById('menuScreen');
    const gameScreen = document.getElementById('gameScreen');
    const menuTitle = document.getElementById('menuTitle');
    const menuSub = document.getElementById('menuSub');
    const previewContainer = document.getElementById('previewContainer');
    const settingsArea = document.getElementById('settingsArea');
    const btnEnterGame = document.getElementById('btnEnterGame');
    const btnStartGame = document.getElementById('btnStartGame');
    const btnReset = document.getElementById('btnReset');
    const btnPlayAgain = document.getElementById('btnPlayAgain');
    const langSelect = document.getElementById('langSelect');
    const modeSelect = document.getElementById('modeSelect');
    const gameTypeSelect = document.getElementById('gameTypeSelect');
    const difficultySelect = document.getElementById('difficultySelect');
    const firstMoveSelect = document.getElementById('firstMoveSelect');
    const lblMode = document.getElementById('lblMode');
    const lblGameType = document.getElementById('lblGameType');
    const lblDifficulty = document.getElementById('lblDifficulty');
    const lblFirstMove = document.getElementById('lblFirstMove');
    const difficultyRow = document.getElementById('difficultyRow');
    const firstMoveRow = document.getElementById('firstMoveRow');
    const footerCopyright = document.getElementById('footerCopyright');

    const cells = document.querySelectorAll('.cell');
    const overlay = document.getElementById('overlay');
    const resultIcon = document.getElementById('resultIcon');
    const resultText = document.getElementById('resultText');
    const resultSub = document.getElementById('resultSub');
    const statusMessage = document.getElementById('statusMessage');
    const turnIndicator = document.getElementById('turnIndicator');
    const modeBadge = document.getElementById('modeBadge');
    const stepBadge = document.getElementById('stepBadge');
    const countBadge = document.getElementById('countBadge');
    const previewCells = document.querySelectorAll('.preview-cell');

    const WIN_COMBOS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    // ============================================================
    //  🌐 語言函數
    // ============================================================
    function t(key, params = {}) {
        const dict = LANG[state.lang] || LANG['zh-TW'];
        let text = dict[key] || key;
        for (const [k, v] of Object.entries(params)) {
            text = text.replace(`{${k}}`, v);
        }
        return text;
    }

    function updateLanguage() {
        menuTitle.textContent = t('title');
        menuSub.textContent = t('menuSub');
        lblMode.textContent = t('mode');
        lblGameType.textContent = t('gameType');
        lblDifficulty.textContent = t('difficulty');
        lblFirstMove.textContent = t('firstMove');
        modeSelect.options[0].text = t('classic');
        modeSelect.options[1].text = t('infinite');
        gameTypeSelect.options[0].text = t('pvp');
        gameTypeSelect.options[1].text = t('pvc');
        difficultySelect.options[0].text = t('easy');
        difficultySelect.options[1].text = t('medium');
        difficultySelect.options[2].text = t('hard');
        firstMoveSelect.options[0].text = t('firstPlayer');
        firstMoveSelect.options[1].text = t('firstAI');
        btnStartGame.textContent = t('start');
        btnReset.textContent = t('reset');
        btnPlayAgain.textContent = t('playAgain');

        // 根據 settingsArea 是否可見設定 btnEnterGame
        if (settingsArea.classList.contains('visible')) {
            btnEnterGame.textContent = t('back');
        } else {
            btnEnterGame.textContent = t('enter');
        }

        const year = new Date().getFullYear();
        footerCopyright.textContent = t('copyright', { year: year });

        updateUI();
    }

    // ============================================================
    //  🖥️ UI 更新
    // ============================================================
    function updateUI() {
        const mode = state.gameMode;
        const modeName = mode === 'classic' ? t('modeClassic') : t('modeInfinite');
        const rule = mode === 'classic' ? t('classicRule') : t('infiniteRule');
        modeBadge.textContent = `${modeName} · ${rule}`;

        if (state.gameActive && !state.isOver) {
            let playerName = '';
            if (state.gameType === 'pvp') {
                playerName = state.currentPlayer === 'X' ? t('player1') : t('player2');
            } else {
                playerName = state.currentPlayer === state.playerSymbol ? t('you') : t('ai');
            }
            const turnText = (state.gameType === 'pvc' && state.currentPlayer === state.aiSymbol) ?
                t('aiTurn') :
                `${playerName}${t('turn')}`;
            statusMessage.textContent = turnText;
            turnIndicator.textContent = state.currentPlayer;
            turnIndicator.className = `turn-indicator turn-${state.currentPlayer}`;
            stepBadge.textContent = t('step', { n: state.moveCount + 1 });
            const totalPieces = state.board.filter(c => c !== '').length;
            countBadge.textContent = t('count', { n: totalPieces });
            countBadge.style.display = 'inline';
        } else if (state.isOver) {
            // 保持結果顯示
        } else {
            statusMessage.textContent = t('start');
            turnIndicator.textContent = '▶';
            turnIndicator.className = 'turn-indicator';
            stepBadge.textContent = '--';
            countBadge.style.display = 'none';
        }

        const isAI = gameTypeSelect.value === 'pvc';
        difficultyRow.style.display = isAI ? 'flex' : 'none';
        firstMoveRow.style.display = isAI ? 'flex' : 'none';
    }

    // ============================================================
    //  🎯 遊戲邏輯
    // ============================================================
    function startGame() {
        state.gameMode = modeSelect.value;
        state.gameType = gameTypeSelect.value;
        state.difficulty = difficultySelect.value;
        state.firstMove = firstMoveSelect.value;

        if (state.gameType === 'pvc') {
            if (state.firstMove === 'player') {
                state.playerSymbol = 'X';
                state.aiSymbol = 'O';
            } else {
                state.playerSymbol = 'O';
                state.aiSymbol = 'X';
            }
        } else {
            state.playerSymbol = 'X';
            state.aiSymbol = 'O';
        }

        state.board = ['', '', '', '', '', '', '', '', ''];
        state.currentPlayer = 'X';
        state.gameActive = true;
        state.isOver = false;
        state.moveHistory = [];
        state.moveCount = 0;
        state.winner = null;
        state.isProcessing = false;

        cells.forEach(cell => {
            cell.textContent = '';
            cell.className = 'cell';
        });
        overlay.classList.remove('show');

        // 切換畫面
        menuScreen.style.display = 'none';
        gameScreen.classList.add('active');

        // 停止預覽動畫
        if (previewInterval) {
            clearInterval(previewInterval);
            previewInterval = null;
        }

        updateUI();

        // AI 先手
        if (state.gameType === 'pvc' && state.firstMove === 'ai' && state.currentPlayer === 'X') {
            state.isProcessing = true;
            setTimeout(() => {
                aiMove();
            }, 400);
        }
    }

    function endGame(winner) {
        state.gameActive = false;
        state.isOver = true;
        state.winner = winner;

        let resultMsg = '';
        let icon = '';

        if (winner === 'draw') {
            icon = '🤝';
            resultMsg = t('draw');
        } else if (state.gameType === 'pvp') {
            const pName = winner === 'X' ? t('player1') : t('player2');
            icon = '🎉';
            resultMsg = `${pName} ${t('win')}`;
        } else {
            if (winner === state.playerSymbol) {
                icon = '🎉';
                resultMsg = t('youWin');
            } else if (winner === state.aiSymbol) {
                icon = '😢';
                resultMsg = t('youLose');
            }
        }

        resultIcon.textContent = icon;
        resultText.textContent = resultMsg;
        resultSub.textContent = t('resultSub');

        if (winner !== 'draw') {
            highlightWin(winner);
        }

        overlay.classList.add('show');
        updateUI();
    }

    function highlightWin(player) {
        for (const combo of WIN_COMBOS) {
            if (combo.every(idx => state.board[idx] === player)) {
                combo.forEach(idx => {
                    cells[idx].classList.add('win');
                });
            }
        }
    }

    function checkWinner(player) {
        return WIN_COMBOS.some(combo => combo.every(idx => state.board[idx] === player));
    }

    function isBoardFull() {
        return state.board.every(cell => cell !== '');
    }

    // ============================================================
    //  🔄 核心移動邏輯
    // ============================================================
    function doMove(index, player, fromAI = false) {
        if (state.board[index] !== '' || !state.gameActive || state.isOver) return false;

        state.board[index] = player;
        state.moveHistory.push({ index, player });
        state.moveCount++;

        const cell = cells[index];
        cell.textContent = player;
        cell.classList.add('taken', player);

        if (state.gameMode === 'infinite') {
            if (state.moveHistory.length === 7) {
                const oldest = state.moveHistory.shift();
                state.board[oldest.index] = '';
                const oldCell = cells[oldest.index];
                oldCell.textContent = '';
                oldCell.className = 'cell';
                oldCell.classList.remove('blink');
            }
            if (state.moveHistory.length === 6) {
                const first = state.moveHistory[0];
                cells[first.index].classList.add('blink');
            }
        }

        if (checkWinner(player)) {
            endGame(player);
            return true;
        }

        if (state.gameMode === 'classic' && isBoardFull()) {
            endGame('draw');
            return true;
        }

        state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
        updateUI();

        if (state.gameActive && state.gameType === 'pvc' && !state.isOver && !fromAI) {
            const nextIsAI = (state.currentPlayer === state.aiSymbol);
            if (nextIsAI) {
                state.isProcessing = true;
                setTimeout(() => {
                    aiMove();
                }, 300 + Math.random() * 200);
            }
        }

        return true;
    }

    // ============================================================
    //  🤖 AI 邏輯
    // ============================================================
    function aiMove() {
        state.isProcessing = false;

        if (!state.gameActive || state.isOver || state.currentPlayer !== state.aiSymbol) {
            return;
        }

        const empty = state.board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
        if (empty.length === 0) return;

        let moveIndex = null;
        switch (state.difficulty) {
            case 'easy': moveIndex = easyAI(empty); break;
            case 'medium': moveIndex = mediumAI(empty); break;
            case 'hard': moveIndex = hardAI(empty); break;
            default: moveIndex = easyAI(empty);
        }

        if (moveIndex !== null && state.gameActive && !state.isOver) {
            doMove(moveIndex, state.aiSymbol, true);
        }
    }

    function easyAI(empty) {
        return empty[Math.floor(Math.random() * empty.length)];
    }

    function mediumAI(empty) {
        for (const idx of empty) {
            state.board[idx] = state.playerSymbol;
            if (checkWinner(state.playerSymbol)) {
                state.board[idx] = '';
                return idx;
            }
            state.board[idx] = '';
        }
        return easyAI(empty);
    }

    function hardAI(empty) {
        for (const idx of empty) {
            state.board[idx] = state.aiSymbol;
            if (checkWinner(state.aiSymbol)) {
                state.board[idx] = '';
                return idx;
            }
            state.board[idx] = '';
        }
        for (const idx of empty) {
            state.board[idx] = state.playerSymbol;
            if (checkWinner(state.playerSymbol)) {
                state.board[idx] = '';
                return idx;
            }
            state.board[idx] = '';
        }

        let bestScore = -Infinity;
        let bestMove = empty[0];
        for (const idx of empty) {
            state.board[idx] = state.aiSymbol;
            const score = minimax(state.board, 0, false, state.playerSymbol);
            state.board[idx] = '';
            if (score > bestScore) {
                bestScore = score;
                bestMove = idx;
            }
        }
        return bestMove;
    }

    function minimax(board, depth, isMaximizing, player) {
        if (depth >= 3) return 0;
        if (checkWinner(state.aiSymbol)) return 10 - depth;
        if (checkWinner(state.playerSymbol)) return -10 + depth;

        const empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
        if (empty.length === 0) return 0;

        if (isMaximizing) {
            let maxEval = -Infinity;
            for (const idx of empty) {
                board[idx] = state.aiSymbol;
                const evalResult = minimax(board, depth + 1, false, state.playerSymbol);
                board[idx] = '';
                maxEval = Math.max(maxEval, evalResult);
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            for (const idx of empty) {
                board[idx] = state.playerSymbol;
                const evalResult = minimax(board, depth + 1, true, state.aiSymbol);
                board[idx] = '';
                minEval = Math.min(minEval, evalResult);
            }
            return minEval;
        }
    }

    // ============================================================
    //  🎬 預覽棋盤動畫
    // ============================================================
    let previewInterval = null;

    function startPreviewAnimation() {
        updatePreviewCells();
        if (previewInterval) clearInterval(previewInterval);
        previewInterval = setInterval(() => {
            updatePreviewCells();
        }, 1500);
    }

    function updatePreviewCells() {
        const numToShow = 3 + Math.floor(Math.random() * 3);
        const indices = [];
        while (indices.length < numToShow) {
            const idx = Math.floor(Math.random() * 9);
            if (!indices.includes(idx)) {
                indices.push(idx);
            }
        }

        previewCells.forEach((cell, i) => {
            if (indices.includes(i)) {
                const symbol = Math.random() < 0.5 ? 'X' : 'O';
                cell.textContent = symbol;
                cell.className = `preview-cell ${symbol}`;
            } else {
                cell.textContent = '';
                cell.className = 'preview-cell empty';
            }
        });
    }

    // ============================================================
    //  🖱️ 事件綁定
    // ============================================================
    cells.forEach(cell => {
        cell.addEventListener('click', function() {
            const index = parseInt(this.dataset.index);
            if (!state.gameActive || state.isOver || state.isProcessing) return;
            if (state.board[index] !== '') return;

            let isPlayerTurn = false;
            if (state.gameType === 'pvp') {
                isPlayerTurn = (state.currentPlayer === 'X' || state.currentPlayer === 'O');
            } else {
                isPlayerTurn = (state.currentPlayer === state.playerSymbol);
            }
            if (!isPlayerTurn) return;

            doMove(index, state.currentPlayer);
        });
    });

    btnEnterGame.addEventListener('click', function() {
        settingsArea.classList.toggle('visible');
        if (settingsArea.classList.contains('visible')) {
            btnEnterGame.textContent = t('back');
            previewContainer.classList.add('hidden'); // 隱藏預覽棋盤
        } else {
            btnEnterGame.textContent = t('enter');
            previewContainer.classList.remove('hidden'); // 顯示預覽棋盤
            // 如果動畫已停止，重新啟動
            if (!previewInterval) {
                startPreviewAnimation();
            }
        }
    });

    btnStartGame.addEventListener('click', startGame);

    btnReset.addEventListener('click', function() {
        state.gameActive = false;
        state.isOver = false;
        menuScreen.style.display = 'block';
        gameScreen.classList.remove('active');
        cells.forEach(cell => {
            cell.textContent = '';
            cell.className = 'cell';
        });
        overlay.classList.remove('show');
        updateUI();
        settingsArea.classList.remove('visible');
        btnEnterGame.textContent = t('enter');
        previewContainer.classList.remove('hidden'); // 恢復顯示預覽棋盤
        // 重新啟動預覽
        if (!previewInterval) {
            startPreviewAnimation();
        }
    });

    btnPlayAgain.addEventListener('click', startGame);

    langSelect.addEventListener('change', function() {
        state.lang = this.value;
        updateLanguage();
        // 更新按鈕文字（保持狀態一致）
        if (settingsArea.classList.contains('visible')) {
            btnEnterGame.textContent = t('back');
        } else {
            btnEnterGame.textContent = t('enter');
        }
    });

    gameTypeSelect.addEventListener('change', function() {
        updateUI();
    });

    // ============================================================
    //  🚀 初始化
    // ============================================================
    state.lang = langSelect.value;
    updateLanguage();
    menuScreen.style.display = 'block';
    gameScreen.classList.remove('active');
    settingsArea.classList.remove('visible');
    btnEnterGame.textContent = t('enter');
    previewContainer.classList.remove('hidden');
    updateUI();
    statusMessage.textContent = '▶ 點擊「開始遊戲」';
    turnIndicator.textContent = '▶';
    turnIndicator.className = 'turn-indicator';
    stepBadge.textContent = '--';
    countBadge.style.display = 'none';

    // 啟動預覽動畫
    startPreviewAnimation();
</script>
