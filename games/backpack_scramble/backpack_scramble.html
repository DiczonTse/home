<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backpack Scramble</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cell:44px;
    --panel:#161a23;
    --panel2:#1d222d;
    --line:#2a3040;
    --accent:#f0b429;
    --bg:#080a0e;
  }
  html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(circle at 50% -10%,#1a2030 0%,#080a0e 65%);
    color:#e6e8ee;min-height:100vh;padding:10px;
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;overflow-x:hidden;
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  }
  .screen{display:none;animation:fadeIn .4s ease}
  .screen.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ============ 浮動按鈕 ============ */
  .float-btn{
    position:fixed;bottom:14px;width:46px;height:46px;border-radius:50%;
    background:rgba(22,26,35,.92);border:1px solid rgba(255,255,255,.16);
    color:#e6e8ee;font-size:19px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:900;backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(0,0,0,.55);transition:.2s;
    touch-action:manipulation;padding:0;
  }
  .float-btn:hover{background:rgba(42,50,68,.95);transform:scale(1.08)}
  .float-btn:active{transform:scale(.94)}
  .float-btn.mute{left:14px}
  .float-btn.fs{right:14px}
  .float-btn.muted{color:#6c7488;border-color:rgba(255,255,255,.08)}

  /* ============ 封面 ============ */
  #screenCover{
    position:fixed;inset:0;background:#05070b;
    display:none;align-items:center;justify-content:center;
    padding:0;z-index:100;
  }
  #screenCover.active{display:flex}
  .cover-frame{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    max-width:1600px;overflow:hidden;border-radius:0;
  }
  @media(min-width:900px){
    .cover-frame{border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.85)}
  }
  .cover-bg{
    position:absolute;inset:0;
    background:linear-gradient(135deg,#1c2436 0%,#0d1119 55%,#221628 100%);
    background-size:cover;background-position:center;
  }
  .cover-bg img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-veil{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 50% 60%, rgba(10,14,22,.2) 0%, rgba(5,7,11,.7) 80%),
      linear-gradient(180deg, rgba(5,7,11,.72) 0%, rgba(5,7,11,.28) 30%, rgba(5,7,11,.9) 100%);
  }
  /* 標題與按鈕置頂 */
  .cover-inner{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;
    padding:clamp(22px,5vh,60px) 6% 0;
    gap:clamp(14px,2.6vh,30px);
  }
  .cover-title{
    font-size:clamp(28px,7.2vw,84px);
    font-weight:900;letter-spacing:clamp(1px,.9vw,6px);
    color:#fff;text-shadow:0 0 30px rgba(240,180,41,.55),0 4px 0 rgba(0,0,0,.4),0 10px 40px rgba(0,0,0,.85);
    background:linear-gradient(180deg,#fff7e0 0%,#f0b429 55%,#b87f0d 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-align:center;line-height:1.1;
  }
  .cover-actions{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cover-save-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .cbtn{
    background:rgba(29,34,45,.9);color:#dfe3ec;
    border:1px solid rgba(255,255,255,.16);border-radius:12px;
    padding:10px 20px;font-size:13.5px;font-weight:800;
    cursor:pointer;transition:.16s;font-family:inherit;
    backdrop-filter:blur(8px);letter-spacing:.5px;touch-action:manipulation;
  }
  .cbtn:hover:not(:disabled){background:rgba(46,56,74,.95);border-color:rgba(255,255,255,.28);transform:translateY(-1px)}
  .cbtn:active:not(:disabled){transform:translateY(0) scale(.98)}
  .cbtn:disabled{opacity:.35;cursor:not-allowed}
  .cbtn-primary{
    background:linear-gradient(180deg,#f7c243,#d4910a);color:#2a1c00;
    border:none;font-size:clamp(15px,2.4vw,20px);
    padding:clamp(12px,2vh,18px) clamp(38px,7vw,64px);
    border-radius:16px;letter-spacing:2px;
    box-shadow:0 8px 30px rgba(240,180,41,.42),inset 0 1px 0 rgba(255,255,255,.5);
  }
  .cbtn-primary:hover:not(:disabled){filter:brightness(1.09);transform:translateY(-2px);box-shadow:0 12px 38px rgba(240,180,41,.55)}
  .cbtn-primary:active{transform:translateY(0)}
  .cbtn-primary:disabled{filter:grayscale(1);box-shadow:none}
  .cover-copyright{
    position:absolute;left:0;right:0;bottom:clamp(10px,2.2vh,22px);
    text-align:center;font-size:clamp(9.5px,1.15vw,13px);
    color:rgba(220,226,240,.72);letter-spacing:.6px;font-weight:600;
    text-shadow:0 2px 8px rgba(0,0,0,.9);pointer-events:none;padding:0 70px;
  }

  /* ============ 選角 ============ */
  #screenSelect{max-width:1100px;margin:0 auto;padding:6px 0 90px;overflow:hidden}
  .select-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;padding:0 6px;
  }
  .select-head h2{
    font-size:19px;letter-spacing:3px;font-weight:900;color:#f0b429;
    text-shadow:0 2px 12px rgba(240,180,41,.35);
  }
  .select-trophy{
    font-size:14px;font-weight:800;color:#e6e8ee;
    background:rgba(29,34,45,.9);border:1px solid var(--line);
    padding:7px 16px;border-radius:20px;
  }
  .select-trophy span{color:#f0b429;font-size:16px}
  .select-sub{
    font-size:11px;color:#7c879e;text-align:center;
    letter-spacing:.6px;margin-bottom:12px;line-height:1.6;
  }
  .select-sub b{color:#f0b429}

  /* 循環橫向滾動器 */
  .char-scroller-wrap{
    position:relative;
    padding:14px 0 24px;
  }
  .char-scroller-wrap::before,
  .char-scroller-wrap::after{
    content:'';position:absolute;top:0;bottom:0;width:60px;
    pointer-events:none;z-index:3;
  }
  .char-scroller-wrap::before{
    left:0;background:linear-gradient(90deg,#080a0e 5%,transparent);
  }
  .char-scroller-wrap::after{
    right:0;background:linear-gradient(-90deg,#080a0e 5%,transparent);
  }
  .char-scroller{
    display:flex;gap:14px;overflow-x:auto;
    padding:8px 0 14px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    scroll-behavior:auto;
  }
  .char-scroller::-webkit-scrollbar{display:none}

  .char-card{
    position:relative;flex-shrink:0;
    height:min(52vh,430px);aspect-ratio:9/16;
    border-radius:16px;overflow:hidden;
    border:2px solid rgba(255,255,255,.1);
    background:linear-gradient(160deg,#232a3a,#141822);
    cursor:pointer;
    transition:transform .25s cubic-bezier(.2,1,.4,1),
               border-color .25s, box-shadow .25s, filter .25s;
    touch-action:pan-x;
    transform:scale(.86);
    opacity:.55;
  }
  .char-card.centered{
    transform:scale(1);
    opacity:1;
    border-color:rgba(240,180,41,.35);
  }
  .char-card.selected{
    border-color:#f0b429;
    box-shadow:0 0 0 3px rgba(240,180,41,.28),0 14px 44px rgba(240,180,41,.32);
    transform:scale(1.02);
    opacity:1;
  }
  .char-card.locked{cursor:pointer}
  .char-card.locked.centered{filter:brightness(.55) grayscale(.65)}
  .char-card.locked:not(.centered){filter:brightness(.3) grayscale(.85)}
  .char-card:not(.locked).centered{filter:none}

  .char-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .char-fallback{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:900;color:rgba(255,255,255,.16);letter-spacing:2px;
  }
  .char-name{
    position:absolute;left:0;right:0;bottom:0;
    padding:26px 10px 12px;
    background:linear-gradient(0deg,rgba(5,7,11,.95) 30%,rgba(5,7,11,0));
    font-size:14px;font-weight:900;letter-spacing:1.5px;
    text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9);
  }
  .char-card.locked .char-name{color:#a8afc0}
  .char-lock-badge{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    font-size:11px;font-weight:800;color:#f0b429;
    background:rgba(8,10,15,.92);border:1px solid rgba(240,180,41,.45);
    padding:10px 14px;border-radius:12px;letter-spacing:.5px;
    text-align:center;line-height:1.4;pointer-events:none;
    opacity:0;transition:opacity .25s;
  }
  .char-card.locked.centered .char-lock-badge{opacity:1}
  .char-lock-badge .lock-ico{font-size:22px}
  .char-lock-badge .try-hint{
    color:#8b95ab;font-size:9.5px;font-weight:700;
    border-top:1px solid rgba(255,255,255,.08);
    margin-top:2px;padding-top:5px;
  }
  .char-check{
    position:absolute;top:10px;right:10px;
    width:28px;height:28px;border-radius:50%;
    background:#f0b429;color:#2a1c00;
    display:none;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;
    box-shadow:0 3px 12px rgba(0,0,0,.6);
  }
  .char-card.selected .char-check{display:flex}
  .char-preview-tag{
    position:absolute;top:10px;left:10px;
    background:rgba(240,180,41,.92);color:#2a1c00;
    font-size:9px;font-weight:900;letter-spacing:.5px;
    padding:3px 8px;border-radius:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:none;
  }
  .char-card.previewing .char-preview-tag{display:block}

  .scroll-hint{
    text-align:center;font-size:11px;color:#6c7488;
    letter-spacing:.5px;margin-top:4px;
  }
  .scroll-hint b{color:#f0b429}

  .select-foot{
    display:flex;gap:12px;justify-content:center;align-items:center;
    margin-top:12px;flex-wrap:wrap;
  }
  .select-foot .cbtn{min-width:120px;text-align:center}
  .select-foot .cbtn-primary{min-width:180px}

  /* Toast */
  .toast{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.9);
    background:rgba(10,13,20,.96);
    color:#f0b429;font-size:13px;font-weight:800;
    padding:14px 22px;border-radius:14px;
    border:1px solid rgba(240,180,41,.45);
    box-shadow:0 20px 60px rgba(0,0,0,.8);
    z-index:99999;opacity:0;pointer-events:none;
    transition:.28s cubic-bezier(.2,1.4,.5,1);
    letter-spacing:.5px;text-align:center;line-height:1.6;
    max-width:280px;
  }
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toast .toast-ico{font-size:22px;display:block;margin-bottom:4px}

  /* ============ 遊戲 ============ */
  #screenGame{max-width:560px;margin:0 auto;padding-bottom:80px}
  .hud{
    display:flex;gap:8px;align-items:center;justify-content:space-between;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:9px 14px;margin-bottom:10px;
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .hud-item{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .hud-item .val{color:var(--accent);font-size:15px}
  .lives{display:flex;gap:2px;font-size:14px}
  .life{filter:grayscale(1);opacity:.22;transition:.25s}
  .life.on{filter:none;opacity:1}
  .hud-char{
    width:26px;height:26px;border-radius:50%;object-fit:cover;
    border:1.5px solid var(--accent);
  }
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:11px;margin-bottom:10px;
    box-shadow:0 4px 18px rgba(0,0,0,.3);
  }
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:9px;min-height:30px;gap:8px;flex-wrap:wrap;
  }
  .panel-head h2{
    font-size:12.5px;letter-spacing:.6px;color:#98a1b6;font-weight:800;
    display:flex;align-items:center;gap:6px;
  }
  .head-btns{display:flex;gap:6px;flex-wrap:wrap}
  .dps{
    font-size:11px;color:#7c879e;font-weight:700;
    background:var(--panel2);padding:3px 9px;border-radius:20px;
    border:1px solid var(--line);
  }
  .dps.hot{color:#ffb84d;border-color:#5a4413}

  #shopView{position:relative;padding:4px;border-radius:14px;overflow:hidden}
  .shop-bg{
    position:absolute;inset:0;
    background-color:#0c1017;
    background-image:url('shop.jpg');
    background-size:cover;
    background-position:center;
    border-radius:14px;z-index:0;pointer-events:none;
  }
  .shop-bg::after{
    content:'';position:absolute;inset:0;border-radius:14px;
    background:linear-gradient(180deg,rgba(5,7,11,.62) 0%,rgba(5,7,11,.72) 55%,rgba(5,7,11,.82) 100%);
  }
  .shop-content{position:relative;z-index:1;padding:4px 4px 6px}
  .shop-content .panel-head h2{color:#dfe3ec;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  .shop-content .shop-card{
    background:rgba(22,26,35,.86);
    backdrop-filter:blur(6px);
  }
  .shop-content .shop-empty{color:#8b95ab;text-shadow:0 2px 6px rgba(0,0,0,.9)}

  .grid{
    position:relative;margin:0 auto;
    background:#080a0e;border-radius:10px;
    border:1px solid #222836;
    box-shadow:inset 0 0 30px rgba(0,0,0,.7);
    touch-action:none;overscroll-behavior:contain;
  }
  .cell{
    position:absolute;border-right:1px solid #13171f;border-bottom:1px solid #13171f;
    pointer-events:none;
  }
  .bagblock{
    position:absolute;background:rgba(180,140,80,.13);
    border:2px solid rgba(200,165,105,.42);border-radius:9px;
    box-shadow:inset 0 0 18px rgba(200,165,105,.08);
    cursor:grab;touch-action:none;
  }
  .item{
    position:absolute;border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;overflow:hidden;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 2px 6px rgba(0,0,0,.5);
    cursor:grab;touch-action:none;
  }
  .item .ico{
    font-size:clamp(12px,calc(var(--cell)*0.44),22px);line-height:1;pointer-events:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  .item .nm{
    font-size:7.5px;color:rgba(255,255,255,.88);font-weight:800;
    line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.85);
    pointer-events:none;text-align:center;padding:0 2px;
  }
  .item .cdmask{
    position:absolute;left:0;top:0;width:100%;height:0%;
    background:rgba(0,0,0,.66);pointer-events:none;border-radius:0 0 7px 7px;
  }
  .item.flash{box-shadow:0 0 0 2px #fff,0 0 18px 5px rgba(255,255,255,.6);z-index:8}

  .bars{display:flex;flex-direction:column;gap:4px;margin-top:9px}
  .bar{height:10px;border-radius:6px;background:#05070b;overflow:hidden;position:relative}
  .bar-fill{height:100%;width:100%;transition:width .1s linear;border-radius:6px}
  .bar-fill.hp{background:linear-gradient(90deg,#7d1a20,#e5484d)}
  .bar-fill.ar{background:linear-gradient(90deg,#254f8c,#5b9bf8)}
  .bar-txt{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;
  }
  .bar.thin{height:6px}

  .stash-panel{
    background:var(--panel);border:1px dashed #3a4358;border-radius:16px;
    padding:10px 11px;margin-bottom:10px;transition:.18s;
  }
  .stash-panel.drop-hover{
    border-color:#f0b429;background:#221c0e;
    box-shadow:0 0 0 3px rgba(240,180,41,.12);
  }
  .stash-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:#8b95ab;font-weight:800;letter-spacing:.4px;margin-bottom:8px;
  }
  .stash-head .count{color:#5f6779;font-weight:700;font-size:10.5px}
  .stash-list{
    display:flex;gap:6px;flex-wrap:wrap;
    min-height:64px;align-content:flex-start;touch-action:none;
  }
  .stash-card{
    width:60px;height:60px;
    background:var(--panel2);border:1px dashed #3a4358;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;cursor:grab;transition:.14s;touch-action:none;flex-shrink:0;
  }
  .stash-card:active{transform:scale(.94)}
  .stash-card .s-ico{font-size:22px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .stash-card .s-name{font-size:8px;color:#8b95ab;font-weight:800;line-height:1}
  .stash-empty{
    color:#454d60;font-size:11px;text-align:center;
    padding:16px 8px;width:100%;line-height:1.6;
  }
  .stash-empty b{color:#6f788c}

  .shop-list{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;touch-action:none;
  }
  .shop-card{
    width:72px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:8px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:grab;transition:.14s;touch-action:none;
  }
  .shop-card:active{transform:scale(.95)}
  .shop-card.poor{opacity:.3;cursor:not-allowed}
  .shop-card .cico{font-size:21px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .shop-card .cname{font-size:9.5px;font-weight:800;color:#c9cfe0;text-align:center;line-height:1.1}
  .shop-card .cstat{font-size:8px;color:#6f788c}
  .shop-card .ccost{font-size:11px;font-weight:900;color:var(--accent)}
  .shop-empty{text-align:center;color:#4d5568;font-size:11px;padding:16px 0;width:100%}

  .btn{
    background:var(--panel2);color:#e6e8ee;border:1px solid var(--line);
    border-radius:9px;padding:8px 14px;font-size:12px;font-weight:800;
    cursor:pointer;transition:.14s;font-family:inherit;white-space:nowrap;
    touch-action:manipulation;
  }
  .btn:hover:not(:disabled){background:#2a3142;border-color:#3d465c}
  .btn:disabled{opacity:.3;cursor:not-allowed}
  .btn.primary{
    background:linear-gradient(180deg,#f5bd35,#d4930d);color:#2a1c00;
    border:none;padding:15px 0;font-size:15.5px;border-radius:13px;
    box-shadow:0 5px 20px rgba(240,180,41,.3);
    width:100%;letter-spacing:1px;
  }
  .btn.primary:hover:not(:disabled){filter:brightness(1.08)}
  .btn.primary:disabled{filter:grayscale(1);box-shadow:none}

  .ghost{
    position:fixed;pointer-events:none;z-index:9999;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,255,255,.4);
    box-shadow:0 10px 28px rgba(0,0,0,.75);
    filter:drop-shadow(0 0 10px rgba(240,180,41,.45));
    will-change:left,top;
  }
  .preview{
    position:absolute;pointer-events:none;border-radius:8px;display:none;z-index:6;
    transition:left .04s,top .04s;
  }
  .preview.ok{background:rgba(80,225,140,.22);border:2px solid rgba(80,225,140,.9)}
  .preview.bad{background:rgba(229,72,77,.22);border:2px solid rgba(229,72,77,.85)}

  .hint{
    font-size:10.5px;color:#596274;text-align:center;
    line-height:1.75;padding:0 12px 12px;
  }
  .hint b{color:#8b95ab}

  .overlay{
    position:fixed;inset:0;background:rgba(5,7,11,.88);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;z-index:10000;
    opacity:0;pointer-events:none;transition:opacity .28s;padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:30px 28px;text-align:center;max-width:330px;width:100%;
    box-shadow:0 24px 70px rgba(0,0,0,.8);
    transform:scale(.92);transition:transform .28s cubic-bezier(.2,1.4,.5,1);
  }
  .overlay.show .modal{transform:scale(1)}

/* =========================================================

/* =========================================================
   音訊管理器
   ========================================================= */
const AudioMgr = {
  ctx: null, bgm: null, currentSrc: null, lastHit: 0,

  ensureCtx() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
    return this.ctx;
  },

  playBGM(src, volume=BGM_VOL) {
    if (this.currentSrc === src && this.bgm) {
      this.bgm.volume = volume;
      if (this.bgm.paused) this.bgm.play().catch(()=>{});
      return;
    }
    this.stopBGM();
    const a = new Audio(src);
    a.loop = true;
    a.volume = volume;
    a.muted = appState.muted;
    a.addEventListener('error', () => console.warn('[BGM 缺失]', src));
    const p = a.play();
    if (p && p.catch) p.catch(()=>{});
    this.bgm = a;
    this.currentSrc = src;
  },

  stopBGM() {
    if (this.bgm) {
      try { this.bgm.pause(); this.bgm.currentTime = 0; } catch(e){}
      this.bgm = null;
    }
    this.currentSrc = null;
  },

  setMuted(m) { if (this.bgm) this.bgm.muted = m; },

  tone(freq, dur, type='sine', vol=0.08, delay=0) {
    if (appState.muted) return;
    const ctx = this.ensureCtx(); if (!ctx) return;
    const now = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now + dur + 0.03);
  },

  noise(dur, vol=0.14, delay=0) {
    if (appState.muted) return;
    const ctx = this.ensureCtx(); if (!ctx) return;
    const now = ctx.currentTime + delay;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++)
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = vol;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.8;
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start(now);
  },

  sfx(type) {
    switch (type) {
      case 'click':  this.tone(720, 0.055, 'triangle', 0.055); break;
      case 'pickup': this.tone(560, 0.06, 'sine', 0.065);
                     this.tone(840, 0.08, 'sine', 0.05, 0.045); break;
      case 'place':  this.tone(420, 0.09, 'sine', 0.065);
                     this.tone(630, 0.07, 'sine', 0.04, 0.04); break;
      case 'buy':    this.tone(880, 0.08, 'triangle', 0.075);
                     this.tone(1175, 0.13, 'triangle', 0.065, 0.07); break;
      case 'error':  this.tone(180, 0.14, 'sawtooth', 0.045); break;
      case 'hit': {
        const now = performance.now();
        if (now - this.lastHit < 55) return;
        this.lastHit = now;
        this.noise(0.09, 0.11);
        this.tone(160, 0.06, 'square', 0.035);
        break;
      }
      case 'heal':   this.tone(660, 0.1, 'sine', 0.06);
                     this.tone(880, 0.12, 'sine', 0.05, 0.07);
                     this.tone(1100, 0.16, 'sine', 0.04, 0.14); break;
      case 'armor':  this.tone(300, 0.1, 'square', 0.05); break;
      case 'gold':   this.tone(1046, 0.06, 'triangle', 0.06);
                     this.tone(1568, 0.12, 'triangle', 0.05, 0.05); break;
      case 'win':    [523, 659, 784, 1046].forEach((f,i)=>this.tone(f,0.22,'triangle',0.075,i*0.1)); break;
      case 'lose':   [523, 440, 349, 262].forEach((f,i)=>this.tone(f,0.26,'sine',0.07,i*0.13)); break;
      case 'select': this.tone(880, 0.07, 'sine', 0.07);
                     this.tone(1320, 0.1, 'sine', 0.05, 0.06); break;
      case 'unlock': [659, 784, 988, 1319].forEach((f,i)=>this.tone(f,0.18,'triangle',0.07,i*0.08)); break;
      case 'preview': this.tone(660, 0.06, 'sine', 0.05);
                      this.tone(990, 0.08, 'sine', 0.04, 0.05); break;
      case 'snap':   this.tone(1040, 0.04, 'sine', 0.04); break;
    }
  }
};

/* =========================================================
   全域狀態
   ========================================================= */
const appState = { screen:'cover', muted:false, trophies:0, character:null };

function persistState() {
  try {
    localStorage.setItem(STORAGE.muted,    appState.muted ? '1' : '0');
    localStorage.setItem(STORAGE.trophies, String(appState.trophies));
    localStorage.setItem(STORAGE.char,     appState.character || '');
  } catch(e){}
}
function restoreState() {
  try {
    const m = localStorage.getItem(STORAGE.muted);
    if (m !== null) appState.muted = (m === '1');
    const t = localStorage.getItem(STORAGE.trophies);
    if (t !== null) appState.trophies = parseInt(t) || 0;
    const c = localStorage.getItem(STORAGE.char);
    if (c) appState.character = c;
  } catch(e){}
}

/* =========================================================
   尺寸
   ========================================================= */
function computeCell() {
  const avail = Math.min(window.innerWidth - 54, 520);
  CELL = Math.max(26, Math.min(46, Math.floor(avail / GRID_W)));
  document.documentElement.style.setProperty('--cell', CELL + 'px');
}

/* =========================================================
   工具函式
   ========================================================= */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)+amt, g = ((n>>8)&0xff)+amt, b = (n&0xff)+amt;
  r = Math.max(0,Math.min(255,r));
  g = Math.max(0,Math.min(255,g));
  b = Math.max(0,Math.min(255,b));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function buildOcc(items, excludeUid) {
  const occ = Array.from({length:GRID_H}, () => Array(GRID_W).fill(null));
  for (const it of items) {
    if (excludeUid !== undefined && it.uid === excludeUid) continue;
    const def = ITEMS[it.defKey]; if (!def) continue;
    for (let dy=0; dy<def.h; dy++)
      for (let dx=0; dx<def.w; dx++) {
        const y = it.y+dy, x = it.x+dx;
        if (y>=0 && y<GRID_H && x>=0 && x<GRID_W) occ[y][x] = it.uid;
      }
  }
  return occ;
}
function cellInBags(bags, x, y) {
  for (const b of bags)
    if (x>=b.x && x<b.x+b.w && y>=b.y && y<b.y+b.h) return true;
  return false;
}
function canPlaceItem(bags, items, def, x, y, excludeUid) {
  if (x<0||y<0||x+def.w>GRID_W||y+def.h>GRID_H) return false;
  for (let dy=0; dy<def.h; dy++)
    for (let dx=0; dx<def.w; dx++)
      if (!cellInBags(bags, x+dx, y+dy)) return false;
  const occ = buildOcc(items, excludeUid);
  for (let dy=0; dy<def.h; dy++)
    for (let dx=0; dx<def.w; dx++)
      if (occ[y+dy][x+dx] !== null) return false;
  return true;
}
function canPlaceBag(bags, x, y, w, h) {
  if (x<0||y<0||x+w>GRID_W||y+h>GRID_H) return false;
  for (const b of bags)
    if (x < b.x+b.w && x+w > b.x && y < b.y+b.h && y+h > b.y) return false;
  return true;
}
function isItemInBag(item, bag) {
  const def = ITEMS[item.defKey]; if (!def) return false;
  return item.x>=bag.x && item.y>=bag.y &&
         item.x+def.w<=bag.x+bag.w && item.y+def.h<=bag.y+bag.h;
}
function rectsAdjacent(a, b) {
  const set = new Set();
  for (let dy=0; dy<a.h; dy++)
    for (let dx=0; dx<a.w; dx++) set.add((a.x+dx)+','+(a.y+dy));
  for (let dy=0; dy<b.h; dy++)
    for (let dx=0; dx<b.w; dx++) {
      const x = b.x+dx, y = b.y+dy;
      if (set.has((x+1)+','+y)||set.has((x-1)+','+y)||
          set.has(x+','+(y+1))||set.has(x+','+(y-1))) return true;
    }
  return false;
}
function findBagSpot(bags) {
  const adj=[], any=[];
  for (let y=0; y<=GRID_H-2; y++) {
    for (let x=0; x<=GRID_W-2; x++) {
      if (!canPlaceBag(bags, x, y, 2, 2)) continue;
      any.push({x,y});
      let near=false;
      for (const b of bags) {
        if (x===b.x+b.w && y<b.y+b.h && y+2>b.y) near=true;
        if (x+2===b.x && y<b.y+b.h && y+2>b.y) near=true;
        if (y===b.y+b.h && x<b.x+b.w && x+2>b.x) near=true;
        if (y+2===b.y && x<b.x+b.w && x+2>b.x) near=true;
      }
      if (near) adj.push({x,y});
    }
  }
  const pool = adj.length ? adj : any;
  if (!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function findItemSpot(bags, items, def) {
  const spots = [];
  for (let y=0; y<=GRID_H-def.h; y++)
    for (let x=0; x<=GRID_W-def.w; x++)
      if (canPlaceItem(bags, items, def, x, y)) spots.push({x,y});
  if (!spots.length) return null;
  return spots[Math.floor(Math.random()*spots.length)];
}

  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  if (name === 'cover') {
    screenCover.classList.add('active');
    screenCover.style.display = 'flex';
    AudioMgr.playBGM(SONGS.openBag, BGM_VOL);
  } else {
    screenCover.style.display = 'none';
  }
  if (name === 'select') {
    screenSelect.classList.add('active');
    // 進選角時建構循環滾動器
    initCharScroller();
  }
  if (name === 'game') {
    screenGame.classList.add('active');
    computeCell();
    renderAll();
  }
}

/* =========================================================
   封面
   ========================================================= */
function initCover() {

  const bg = $('coverBg');

  img.onload = () => { bg.innerHTML = ''; bg.appendChild(img); };

/* =========================================================
   選角 —— 循環橫向滾動器
   ========================================================= */
const CS = {
  copies: 3,          // 複製 3 份達成循環
  cards: [],          // 所有卡片 DOM
  setWidth: 0,        // 一份完整角色列表的寬度（含間距）
  centeredId: null,   // 目前置中的角色 id
  initDone: false,
  scrollTimer: null,
  lastUserInput: 0,
  rafPending: false,
};

function createCharCard(ch, copyIdx) {
  const locked = appState.trophies < ch.need;
  const card = document.createElement('div');
  card.className = 'char-card' + (locked ? ' locked' : '');
  card.dataset.id = ch.id;
  card.dataset.copy = copyIdx;

  const fallback = document.createElement('div');
  fallback.className = 'char-fallback';
  fallback.textContent = ch.name.slice(0,1);
  card.appendChild(fallback);

  const im = document.createElement('img');
  im.alt = ch.name;
  im.draggable = false;
  im.onload = () => { fallback.style.display = 'none'; };
  im.onerror = () => im.remove();
  im.src = ch.img;
  card.appendChild(im);

  const nm = document.createElement('div');
  nm.className = 'char-name';
  nm.textContent = ch.name;
  card.appendChild(nm);

  const previewTag = document.createElement('div');
  previewTag.className = 'char-preview-tag';
  previewTag.textContent = '♪ 試聽中';
  card.appendChild(previewTag);

  const ck = document.createElement('div');
  ck.className = 'char-check';
  ck.textContent = '✓';
  card.appendChild(ck);

  if (locked) {
    const lock = document.createElement('div');
    lock.className = 'char-lock-badge';
    lock.innerHTML =
      `<div class="lock-ico">🔒</div>` +
      `需要 ${ch.need} 🏆 解鎖` +
      `<div class="try-hint">已自動試聽主題曲</div>`;
    card.appendChild(lock);
  }

  // 點擊卡片 → 置中
  card.addEventListener('click', () => {
    const scroller = $('charScroller');
    const target = card.offsetLeft + card.offsetWidth/2 - scroller.clientWidth/2;
    CS.lastUserInput = performance.now();
    scroller.scrollTo({ left: target, behavior: 'smooth' });
    // scroll 事件會自動觸發後續處理
  });

  return card;
}

function initCharScroller() {
  const scroller = $('charScroller');
  scroller.innerHTML = '';
  CS.cards = [];
  CS.initDone = false;

  const n = CHARACTERS.length;
  for (let c = 0; c < CS.copies; c++) {
    for (let i = 0; i < n; i++) {
      const ch = CHARACTERS[i];
      const card = createCharCard(ch, c);
      scroller.appendChild(card);
      CS.cards.push(card);
    }
  }

  // 等 layout 完成後才量寬度並定位
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      measureSetWidth();
      // 定位到中間副本的「已選角色」或第一個角色
      let startIdx = 0;
      if (appState.character) {
        const i = CHARACTERS.findIndex(c => c.id === appState.character);
        if (i >= 0) startIdx = i;
      }
      const midCard = scroller.children[n * 1 + startIdx];
      if (midCard) {
        scroller.scrollLeft = midCard.offsetLeft + midCard.offsetWidth/2 - scroller.clientWidth/2;
      } else {
        scroller.scrollLeft = scroller.scrollWidth / 3;
      }
      CS.initDone = true;
      // 立刻同步一次置中
      syncCenterFromScroll(true);
    });
  });

  // 綁定事件（避免重複綁定，先移除再綁）
  scroller.removeEventListener('scroll', onScrollerScroll);
  scroller.addEventListener('scroll', onScrollerScroll, { passive:true });
}

function measureSetWidth() {
  const scroller = $('charScroller');
  const n = CHARACTERS.length;
  if (scroller.children.length < n * 2) return;
  const a = scroller.children[0];
  const b = scroller.children[n];
  CS.setWidth = b.offsetLeft - a.offsetLeft;
}

function onScrollerScroll() {
  if (!CS.initDone) return;
  const scroller = $('charScroller');

  // 循環包裹（即時，保持 scrollLeft 永遠在中間副本範圍附近）
  if (CS.setWidth > 0) {
    // 避免用 while 造成無限迴圈
    if (scroller.scrollLeft < CS.setWidth * 0.5) {
      scroller.scrollLeft += CS.setWidth;
    } else if (scroller.scrollLeft > CS.setWidth * 1.5) {
      scroller.scrollLeft -= CS.setWidth;
    }
  }

  // 記錄使用者操作時間
  CS.lastUserInput = performance.now();

  // 防抖：滑動停下來後才吸附 + 播放音樂
  clearTimeout(CS.scrollTimer);
  CS.scrollTimer = setTimeout(() => {
    syncCenterFromScroll(false);
  }, 130);
}

/**
 * 找到最接近視窗中心的卡片
 * @param {boolean} silent - true 表示不播放音效（初始化用）
 */
function syncCenterFromScroll(silent) {
  const scroller = $('charScroller');
  const cRect = scroller.getBoundingClientRect();
  const centerX = cRect.left + cRect.width / 2;

  let best = null, bestDist = Infinity;
  for (const card of CS.cards) {
    const r = card.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const d = Math.abs(cx - centerX);
    if (d < bestDist) { bestDist = d; best = card; }
  }
  if (!best) return;

  // 平滑吸附到中心
  const r = best.getBoundingClientRect();
  const targetScrollLeft = scroller.scrollLeft + (r.left + r.width/2) - centerX;
  const diff = Math.abs(targetScrollLeft - scroller.scrollLeft);
  if (diff > 2) {
    scroller.scrollTo({ left: targetScrollLeft, behavior: 'smooth' });
  }

  const chId = best.dataset.id;
  const ch = CHARACTERS.find(c => c.id === chId);
  if (!ch) return;

  // 若置中角色沒變，只更新視覺（例如 trophy 變化時）
  const locked = appState.trophies < ch.need;

  // 更新置中/試聽樣式
  CS.cards.forEach(c => {
    c.classList.toggle('centered', c === best);
    c.classList.toggle('previewing', c === best);
  });

  if (CS.centeredId === chId && silent !== true) {
    // 同樣角色，但鎖定狀態可能變了，仍要更新選擇狀態
    updateSelectedVisual();
    return;
  }
  CS.centeredId = chId;

  // 播放音樂（音量 1.0）
  AudioMgr.ensureCtx();
  AudioMgr.playBGM(ch.music, BGM_VOL);

  if (locked) {
    // 鎖定：只試聽，不選擇
    if (!silent) {
      AudioMgr.sfx('preview');
      showToast(`已試聽 ${ch.name} 的主題曲\n🔒 需要 ${ch.need} 🏆 才能使用`, '🎵');
    }
    updateSelectedVisual();
  } else {
    // 解鎖：正式選擇
    if (appState.character !== ch.id) {
      appState.character = ch.id;
      persistState();
      if (!silent) AudioMgr.sfx('select');
    }
    updateSelectedVisual();
  }
}

function updateSelectedVisual() {
  CS.cards.forEach(c => {
    c.classList.toggle('selected',
      !c.classList.contains('locked') && c.dataset.id === appState.character);
  });
  $('btnConfirmChar').disabled = !appState.character;
}

/* =========================================================
   遊戲渲染 —— 網格
   ========================================================= */
function renderGrid(el, bags, items, prefix, interactive) {
  if (!el) return;
  el.innerHTML = '';
  el.style.width  = GRID_W * CELL + 'px';
  el.style.height = GRID_H * CELL + 'px';

  for (let y=0; y<GRID_H; y++) {
    for (let x=0; x<GRID_W; x++) {
      const c = document.createElement('div');
      c.className = 'cell';
      c.style.cssText = `left:${x*CELL}px;top:${y*CELL}px;width:${CELL}px;height:${CELL}px`;
      el.appendChild(c);
    }
  }

  for (const b of bags) {
    const d = document.createElement('div');
    d.className = 'bagblock';
    d.id = prefix + 'bag-' + b.uid;
    d.style.cssText =
      `left:${b.x*CELL}px;top:${b.y*CELL}px;width:${b.w*CELL}px;height:${b.h*CELL}px`;
    el.appendChild(d);

    if (interactive && state.phase === 'prepare') {
      d.addEventListener('pointerdown', (ev) => {
        if (ev.target !== d) return;
        ev.preventDefault(); ev.stopPropagation();
        startDrag(ev, { kind:'bag', uid:b.uid, source:'grid', origBag:{...b} });
      });
    }
  }

  for (const it of items) {
    const def = ITEMS[it.defKey]; if (!def) continue;
    const d = document.createElement('div');
    d.className = 'item';
    d.id = prefix + it.uid;
    d.style.cssText =
      `left:${it.x*CELL+2}px;top:${it.y*CELL+2}px;` +
      `width:${def.w*CELL-4}px;height:${def.h*CELL-4}px;` +
      `background:linear-gradient(150deg,${def.color},${shade(def.color,-30)})`;
    d.innerHTML =
      `<span class="ico">${def.icon}</span>` +
      `<span class="nm">${def.name}</span>` +
      `<div class="cdmask"></div>`;
    d.title = itemTooltip(def);
    el.appendChild(d);

    if (interactive && state.phase === 'prepare') {
      d.addEventListener('pointerdown', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        startDrag(ev, {
          kind:'item', defKey:it.defKey, uid:it.uid,
          source:'grid', origX:it.x, origY:it.y
        });
      });
    }
  }

  if (prefix === 'pi-') {
    previewEl = document.createElement('div');
    previewEl.className = 'preview';
    el.appendChild(previewEl);
  }
}

function itemTooltip(def) {
  const p = [def.name];
  if (def.dmg)   p.push(`傷害 ${def.dmg} / 冷卻 ${def.cd}s`);
  if (def.armor) p.push(`護甲 +${def.armor} / 冷卻 ${def.cd}s`);
  if (def.heal)  p.push(`治療 ${def.heal} / 冷卻 ${def.cd}s`);
  if (def.passive === 'dmg') p.push(`相鄰武器傷害 +${def.value}`);
  if (def.passive === 'hp')  p.push(`最大生命 +${def.value}`);
  p.push(`價格 ${def.cost}💰`);
  return p.join('\n');
}

/* =========================================================
   暫存區

function renderStash() {

  stashCount.textContent = state.stash.length ? state.stash.length + ' 件' : '';

  if (!state.stash.length) {
    stashListEl.innerHTML =

  }

      el.innerHTML = `<div class="s-ico">🎒</div><div class="s-name">${s.w}×${s.h}</div>`;
    } else {
      const d = ITEMS[s.defKey]; if (!d) continue;
      el.innerHTML = `<div class="s-ico">${d.icon}</div><div class="s-name">${d.name}</div>`;
    }

    if (state.phase === 'prepare') {
      el.addEventListener('pointerdown', (ev) => {

        startDrag(ev, {
          kind:s.kind, defKey:s.defKey, uid:s.uid,

        });

/* =========================================================
   商店
   ========================================================= */
function rollShop() {
  const shop = [];
  const maxCost = 4 + state.round * 1.7;
  const pool = ITEM_KEYS.filter(k => ITEMS[k].cost <= maxCost);
  const bagChance = state.bags.length < 3 ? 0.42 : 0.24;

  for (let i=0; i<5; i++) {
    if (Math.random() < bagChance) {
      shop.push({ id: ++uidCounter, kind:'bag', cost:BAG_COST });
    } else {
      const k = pool[Math.floor(Math.random()*pool.length)];
      shop.push({ id: ++uidCounter, kind:'item', key:k, cost:ITEMS[k].cost });
    }
  }
  return shop;
}

function renderShop() {
  shopListEl.innerHTML = '';
  if (!state.shop.length) {
    shopListEl.innerHTML = '<div class="shop-empty">已售罄 — 點擊刷新</div>';
    return;
  }

  for (const slot of state.shop) {
    let icon, name, stat, cost;
    if (slot.kind === 'bag') {
      icon='🎒'; name='背包'; stat='2×2 空間'; cost=slot.cost;
    } else {
      const d = ITEMS[slot.key];
      icon=d.icon; name=d.name; cost=slot.cost;
      stat = d.dmg   ? d.dmg + ' 傷害'
           : d.armor ? d.armor + ' 護甲'
           : d.heal  ? d.heal + ' 治療'
           : d.passive === 'hp' ? '+' + d.value + ' 生命'
           : '+' + d.value + ' 傷害';
    }

    const card = document.createElement('div');
    card.className = 'shop-card' + (state.gold < cost ? ' poor' : '');
    card.innerHTML =
      `<div class="cico">${icon}</div>` +
      `<div class="cname">${name}</div>` +
      `<div class="cstat">${stat}</div>` +
      `<div class="ccost">${cost}💰</div>`;

    card.addEventListener('pointerdown', (ev) => {
      if (state.phase !== 'prepare') return;
      if (state.gold < cost) { AudioMgr.sfx('error'); return; }
      ev.preventDefault(); ev.stopPropagation();
      if (slot.kind === 'bag') {
        startDrag(ev, { kind:'bag', cost, shopId:slot.id, source:'shop' });
      } else {
        startDrag(ev, { kind:'item', defKey:slot.key, cost, shopId:slot.id, source:'shop' });
      }
    });
    shopListEl.appendChild(card);
  }
}

/* =========================================================
   拖拽系統
   ========================================================= */
let drag = null;

function startDrag(ev, payload) {
  if (drag) return;
  if (state.phase !== 'prepare') return;

  let def, innerItems = [];
  if (payload.kind === 'bag') {
    let bw=2, bh=2;
    if (payload.source === 'grid' && payload.origBag) { bw=payload.origBag.w; bh=payload.origBag.h; }
    else if (payload.source === 'stash') { bw=payload.w||2; bh=payload.h||2; }
    def = { w:bw, h:bh, icon:'🎒', color:BAG_COLOR, name:'背包' };

    if (payload.source === 'grid' && payload.origBag) {
      const bag = payload.origBag;
      innerItems = state.items
        .filter(it => isItemInBag(it, bag))
        .map(it => ({ uid:it.uid, defKey:it.defKey, dx:it.x-bag.x, dy:it.y-bag.y }));
    }
  } else {
    def = ITEMS[payload.defKey]; if (!def) return;
  }

  if (payload.source === 'grid') {
    if (payload.kind === 'item') {
      const el = document.getElementById('pi-' + payload.uid);
      if (el) el.style.visibility = 'hidden';
    } else {
      const bagEl = document.getElementById('pi-bag-' + payload.uid);
      if (bagEl) bagEl.style.visibility = 'hidden';
      for (const bi of innerItems) {
        const el = document.getElementById('pi-' + bi.uid);
        if (el) el.style.visibility = 'hidden';
      }
    }
  } else if (payload.source === 'stash') {
    const el = document.getElementById('st-' + payload.uid);
    if (el) el.style.visibility = 'hidden';
  }

  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.style.width  = def.w * CELL - 4 + 'px';
  ghost.style.height = def.h * CELL - 4 + 'px';
  ghost.style.background = `linear-gradient(150deg,${def.color},${shade(def.color,-30)})`;
  ghost.innerHTML =
    `<span style="font-size:${Math.round(Math.min(def.w,def.h)*CELL*0.46)}px;` +
    `filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))">${def.icon}</span>` +
    (innerItems.length
      ? `<span style="position:absolute;bottom:2px;right:4px;font-size:9px;` +
        `font-weight:900;color:#ffd76a;text-shadow:0 1px 3px #000">+${innerItems.length}</span>`
      : '');
  document.body.appendChild(ghost);

  drag = { ...payload, def, ghost, innerItems, gx:-99, gy:-99, valid:false, pid:ev.pointerId };
  AudioMgr.sfx('pickup');

  try { if (document.body.setPointerCapture) document.body.setPointerCapture(ev.pointerId); } catch(e){}

  moveGhost(ev.clientX, ev.clientY);
  updatePreview(ev.clientX, ev.clientY);

  document.addEventListener('pointermove', onPointerMove, { passive:false });
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);
}

function moveGhost(cx, cy) {
  if (!drag) return;
  drag.ghost.style.left = cx + 'px';
  drag.ghost.style.top  = cy + 'px';
}

function onPointerMove(ev) {
  if (!drag) return;
  if (ev.cancelable) ev.preventDefault();
  moveGhost(ev.clientX, ev.clientY);
  updatePreview(ev.clientX, ev.clientY);
}

function updatePreview(cx, cy) {
  if (!drag || !previewEl) return;
  const def = drag.def;
  const rect = playerGridEl.getBoundingClientRect();
  const px = cx - rect.left - def.w*CELL/2;
  const py = cy - rect.top  - def.h*CELL/2;
  const gx = Math.round(px/CELL), gy = Math.round(py/CELL);
  drag.gx = gx; drag.gy = gy;

  let ok;
  if (drag.kind === 'bag') {
    const others = drag.source === 'grid'
      ? state.bags.filter(b => b.uid !== drag.uid) : state.bags;
    ok = canPlaceBag(others, gx, gy, def.w, def.h);
  } else {
    const ex = drag.source === 'grid' ? drag.uid : undefined;
    ok = canPlaceItem(state.bags, state.items, def, gx, gy, ex);
  }
  drag.valid = ok;

  if (gx < -3 || gy < -3 || gx > GRID_W+2 || gy > GRID_H+2) {
    previewEl.style.display = 'none';
  } else {
    previewEl.style.display = 'block';
    previewEl.style.left = gx*CELL + 'px';
    previewEl.style.top  = gy*CELL + 'px';
    previewEl.style.width  = def.w*CELL + 'px';
    previewEl.style.height = def.h*CELL + 'px';
    previewEl.className = 'preview ' + (ok ? 'ok' : 'bad');
  }

  const sr = stashListEl.getBoundingClientRect();
  const overStash = cx >= sr.left-40 && cx <= sr.right+40 &&
                    cy >= sr.top-40  && cy <= sr.bottom+40;
  stashPanel.classList.toggle('drop-hover', overStash && drag.source !== 'shop');
}

function onPointerUp(ev) {
  cleanupDragListeners();
  if (!drag) return;

  const rect = playerGridEl.getBoundingClientRect();
  const overGrid =
    ev.clientX >= rect.left && ev.clientX <= rect.right &&
    ev.clientY >= rect.top  && ev.clientY <= rect.bottom;

  const d = drag;

  if (d.valid && overGrid) {
    if (d.kind === 'bag') {
      if (d.source === 'grid') {
        const old = d.origBag;
        state.bags  = state.bags.filter(b => b.uid !== old.uid);
        state.items = state.items.filter(it => !isItemInBag(it, old));
      } else if (d.source === 'stash') {
        state.stash = state.stash.filter(s => s.uid !== d.uid);
      }
      const nb = { uid:d.uid||(++uidCounter), x:d.gx, y:d.gy, w:d.def.w, h:d.def.h };
      state.bags.push(nb);
      for (const bi of d.innerItems)
        state.items.push({ uid:bi.uid, defKey:bi.defKey, x:nb.x+bi.dx, y:nb.y+bi.dy });
    } else {
      if (d.source === 'grid') state.items = state.items.filter(it => it.uid !== d.uid);
      else if (d.source === 'stash') state.stash = state.stash.filter(s => s.uid !== d.uid);
      state.items.push({ uid:d.uid||(++uidCounter), defKey:d.defKey, x:d.gx, y:d.gy });
    }
    if (d.source === 'shop') {
      state.gold -= d.cost;
      state.shop = state.shop.filter(s => s.id !== d.shopId);
      AudioMgr.sfx('buy');
    } else {
      AudioMgr.sfx('place');
    }
  } else if (!overGrid && d.source !== 'shop') {
    if (d.source === 'grid') {
      if (d.kind === 'bag') {
        const old = d.origBag;
        state.bags  = state.bags.filter(b => b.uid !== old.uid);
        state.items = state.items.filter(it => !isItemInBag(it, old));
        state.stash.push({ uid:d.uid, kind:'bag', w:d.def.w, h:d.def.h });
        for (const bi of d.innerItems)
          state.stash.push({ uid:bi.uid, kind:'item', defKey:bi.defKey });
      } else {
        state.items = state.items.filter(it => it.uid !== d.uid);
        state.stash.push({ uid:d.uid, kind:'item', defKey:d.defKey });
      }
    } else if (d.source === 'stash') {
      if (d.kind === 'bag') {
        state.stash.push({ uid:d.uid, kind:'bag', w:d.def.w, h:d.def.h });
        for (const bi of d.innerItems)
          state.stash.push({ uid:bi.uid, kind:'item', defKey:bi.defKey });
      } else {
        state.stash.push({ uid:d.uid, kind:'item', defKey:d.defKey });
      }
    }
    AudioMgr.sfx('place');
  }

  try { document.body.releasePointerCapture(d.pid); } catch(e){}
  d.ghost.remove();
  drag = null;
  renderAll();
}

function onPointerCancel(ev) {
  cleanupDragListeners();
  if (!drag) return;
  try { document.body.releasePointerCapture(drag.pid); } catch(e){}
  drag.ghost.remove();
  drag = null;
  renderAll();
}

function cleanupDragListeners() {
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  document.removeEventListener('pointercancel', onPointerCancel);
  stashPanel.classList.remove('drop-hover');
}

/* =========================================================
   渲染主控
   ========================================================= */
function renderPlayerGrid() {
  const inBattle = (state.phase === 'battle' || state.phase === 'result') && state.fP;
  const items = inBattle ? state.fP.items : state.items;
  renderGrid(playerGridEl, state.bags, items, 'pi-', state.phase === 'prepare');
}
function renderEnemyGrid() {
  const items = state.fE ? state.fE.items : [];
  renderGrid(enemyGridEl, state.enemyBags, items, 'ei-', false);
}
function renderAll() {
  if (appState.screen !== 'game') return;
  renderPlayerGrid();
  if (state.phase === 'battle' || state.phase === 'result') renderEnemyGrid();
  renderShop();
  renderStash();
  updateHud();
  updateIdleBars();
}

/* =========================================================
   HUD
   ========================================================= */
function updateHud() {
  $('hudGold').textContent   = state.gold;
  $('hudRound').textContent  = Math.min(state.round, MAX_ROUND);
  $('hudStreak').textContent = state.streak;

  const livesEl = $('hudLives');
  livesEl.innerHTML = '';
  for (let i=0; i<MAX_LIVES; i++) {
    const s = document.createElement('span');
    s.className = 'life' + (i < state.lives ? ' on' : '');
    s.textContent = '❤️';
    livesEl.appendChild(s);
  }

  const chImg = $('hudCharImg');
  const ch = CHARACTERS.find(c => c.id === appState.character);
  if (ch) {
    chImg.src = ch.img;
    chImg.onerror = () => { chImg.style.display = 'none'; };
    chImg.style.display = '';
  }

  let dps = 0;
  const src = state.items;
  for (const it of src) {
    const d = ITEMS[it.defKey];
    if (d && d.dmg) dps += d.dmg/d.cd;
  }
  for (const it of src) {
    const d = ITEMS[it.defKey];
    if (!d || d.passive !== 'dmg') continue;
    for (const o of src) {
      const od = ITEMS[o.defKey];
      if (!od || !od.dmg) continue;
      if (rectsAdjacent({x:it.x,y:it.y,w:d.w,h:d.h},{x:o.x,y:o.y,w:od.w,h:od.h}))
        dps += d.value/od.cd;
    }
  }

  const dpsEl = $('pDps');
  if (!state.items.length && !state.stash.filter(s => s.kind === 'item').length) {
    dpsEl.textContent = '空背包'; dpsEl.classList.remove('hot');
  } else {
    dpsEl.textContent = 'DPS ≈ ' + dps.toFixed(1);
    dpsEl.classList.toggle('hot', dps > 0);
  }

  const eDpsEl = $('eDps');
  if (state.fE) {
    let ed = 0;
    for (const it of state.fE.items) {
      const d = it.def;
      if (d.dmg) ed += (d.dmg + it.bonusDmg)/d.cd;
    }
    eDpsEl.textContent = 'DPS ≈ ' + ed.toFixed(1);
  } else {
    eDpsEl.textContent = '—';
  }

  $('eRound').textContent = Math.min(state.round, MAX_ROUND);
  battleBtn.disabled = state.phase !== 'prepare' || state.items.length === 0;
  refreshBtn.disabled = state.phase !== 'prepare' || state.gold < 1;
}

function updateIdleBars() {
  if (state.phase === 'prepare' || state.phase === 'gameover') {
    setBarWidth('pHpBar','pHpTxt', BASE_HP, BASE_HP, 0);
    setBarWidth('eHpBar','eHpTxt', BASE_HP, BASE_HP, 0);
  }
}
function setBarWidth(barId, txtId, hp, maxHp, armor) {
  const el = $(barId), tx = $(txtId);
  if (!el || !tx) return;
  el.style.width = (maxHp ? Math.max(0,hp/maxHp)*100 : 0) + '%';
  tx.textContent = Math.ceil(Math.max(0,hp)) + ' / ' + Math.ceil(maxHp) +
                   (armor > 0 ? '  🛡' + Math.round(armor) : '');
}

/* =========================================================
   戰鬥
   ========================================================= */
function buildFighter(bags, items, baseHp) {
  const f = { hp:baseHp, maxHp:baseHp, armor:0, alive:true, items:[] };
  for (const b of items) {
    const def = ITEMS[b.defKey]; if (!def) continue;
    f.items.push({
      uid:b.uid, defKey:b.defKey, def,
      x:b.x, y:b.y, w:def.w, h:def.h,
      timer: def.cd ? def.cd*(0.25+Math.random()*0.75) : 0,
      bonusDmg:0, flash:0
    });
  }
  for (const it of f.items) {
    if (it.def.passive === 'hp') { f.maxHp += it.def.value; f.hp += it.def.value; }
  }
  for (const it of f.items) {
    if (it.def.passive !== 'dmg') continue;
    for (const o of f.items) {
      if (o === it || !o.def.dmg) continue;
      if (rectsAdjacent(it, o)) o.bonusDmg += it.def.value;
    }
  }
  return f;
}

function triggerItem(it, owner, foe) {
  it.flash = 1;
  const def = it.def;
  if (def.dmg) {
    let dmg = def.dmg + it.bonusDmg;
    if (foe.armor > 0) {
      const abs = Math.min(foe.armor, dmg);
      foe.armor -= abs; dmg -= abs;
    }
    if (dmg > 0) {
      foe.hp = Math.max(0, foe.hp - dmg);
      AudioMgr.sfx('hit');
      if (foe.hp <= 0) foe.alive = false;
    }
  } else if (def.armor) {
    owner.armor += def.armor; AudioMgr.sfx('armor');
  } else if (def.heal) {
    owner.hp = Math.min(owner.maxHp, owner.hp + def.heal); AudioMgr.sfx('heal');
  }
}

function stepBattle(p, e, dt) {
  for (const [side, foe] of [[p,e],[e,p]]) {
    if (!side.alive) continue;
    for (const it of side.items) {
      if (!it.def.cd) continue;
      it.timer -= dt;
      if (it.timer <= 0) {
        it.timer = it.def.cd;
        triggerItem(it, side, foe);
        if (!foe.alive) break;
      }
    }
  }
}

let battleRAF = null, lastT = 0;

function startBattle() {
  if (state.phase !== 'prepare') return;
  if (state.items.length === 0) return;
  state.phase = 'battle';
  state.battleTime = 0;

  shopView.style.display = 'none';
  enemyView.style.display = '';

  state.fP = buildFighter(state.bags, state.items, BASE_HP);
  state.fE = buildFighter(state.enemyBags, state.enemyItems, BASE_HP);

  renderPlayerGrid();
  renderEnemyGrid();
  updateHud();

  battleBtn.disabled = true;
  refreshBtn.disabled = true;

  const ch = CHARACTERS.find(c => c.id === appState.character);
  AudioMgr.playBGM(ch ? ch.music : SONGS.you, BGM_VOL);

  lastT = 0;
  battleRAF = requestAnimationFrame(battleLoop);
}

function battleLoop(t) {
  if (state.phase !== 'battle') return;
  if (!lastT) lastT = t;
  let dt = Math.min((t - lastT)/1000, 0.06);
  lastT = t;
  state.battleTime += dt;

  stepBattle(state.fP, state.fE, dt);

  if (state.battleTime > 20) {
    const fat = (state.battleTime - 20)*3.2*dt;
    state.fP.hp = Math.max(0, state.fP.hp - fat);
    state.fE.hp = Math.max(0, state.fE.hp - fat);
    if (state.fP.hp <= 0) state.fP.alive = false;
    if (state.fE.hp <= 0) state.fE.alive = false;
  }

  updateBars();
  updateCooldowns(state.fP, 'pi-');
  updateCooldowns(state.fE, 'ei-');

  if (!state.fP.alive || !state.fE.alive) { endBattle(); return; }
  battleRAF = requestAnimationFrame(battleLoop);
}

function updateBars() {
  const p = state.fP, e = state.fE;
  if (!p || !e) return;
  setBarWidth('pHpBar','pHpTxt', p.hp, p.maxHp, p.armor);
  setBarWidth('eHpBar','eHpTxt', e.hp, e.maxHp, e.armor);
  $('pArBar').style.width = Math.min(100, p.armor/30*100) + '%';
  $('eArBar').style.width = Math.min(100, e.armor/30*100) + '%';
}

function updateCooldowns(f, prefix) {
  if (!f) return;
  for (const it of f.items) {
    const el = document.getElementById(prefix + it.uid);
    if (!el) continue;
    const mask = el.querySelector('.cdmask');
    if (mask && it.def.cd)
      mask.style.height = Math.max(0, Math.min(100, it.timer/it.def.cd*100)) + '%';
    if (it.flash > 0) { el.classList.add('flash'); it.flash -= 0.09; }
    else el.classList.remove('flash');
  }
}

/* =========================================================
   戰鬥結算
   ========================================================= */
function endBattle() {
  cancelAnimationFrame(battleRAF);
  state.phase = 'result';

  const p = state.fP, e = state.fE;
  const playerWon = e.hp <= 0 && p.hp > 0;
  const draw      = p.hp <= 0 && e.hp <= 0;

  let goldGain, title, icon, desc, cls;

  if (playerWon) {
    state.streak++;
    goldGain = 8 + Math.min(state.streak, 5)*2;
    title = '勝利！'; icon = '🏆'; cls = 'win';
    desc = `擊敗對手 #${Math.min(state.round, MAX_ROUND)}<br>` +
           `獎勵 <span class="gold-gain">+${goldGain}💰</span>` +
           (state.streak > 1 ? `<br>🔥 ${state.streak} 連勝` : '');
    AudioMgr.sfx('win');
    appState.trophies++;
    persistState();
  } else if (draw) {
    state.streak = 0; state.lives--; goldGain = 5;
    title = '同歸於盡'; icon = '💀'; cls = 'lose';
    desc = `雙方同時倒下……<br>獲得 <span class="gold-gain">+${goldGain}💰</span>`;
    AudioMgr.sfx('lose');
  } else {
    state.streak = 0; state.lives--; goldGain = 5;
    title = '失敗'; icon = '☠️'; cls = 'lose';
    desc = `你被對手擊敗了。<br>安慰獎 <span class="gold-gain">+${goldGain}💰</span>`;
    AudioMgr.sfx('lose');
  }

  state.gold += goldGain;
  state.round++;

  updateHud();

  document.querySelectorAll('.cdmask').forEach(m => m.style.height = '0%');
  document.querySelectorAll('.item.flash').forEach(m => m.classList.remove('flash'));

  const gameOver = state.lives <= 0 || state.round > MAX_ROUND;

  if (gameOver) {
    const win = state.lives > 0;
    state.phase = 'gameover';
    modalIcon.textContent  = win ? '👑' : '💔';
    modalTitle.textContent = win ? '挑戰完成！' : '挑戰失敗';
    modalTitle.className   = win ? 'win' : 'lose';
    modalDesc.innerHTML = win
      ? `你撐過了全部 ${MAX_ROUND} 回合<br>剩餘生命 ${state.lives} ❤️<br>` +
        `最終金幣 <span class="gold-gain">${state.gold}💰</span>`
      : `你輸掉了所有生命。<br>止步於第 ${state.round - 1} 回合。`;
    modalBtn.textContent = '回到封面';
    modalBtn.onclick = () => {
      overlay.classList.remove('show');
      saveProgressToStorage();
      showScreen('cover');
    };
  } else {
    modalIcon.textContent  = icon;
    modalTitle.textContent = title;
    modalTitle.className   = cls;
    modalDesc.innerHTML    = desc;
    modalBtn.textContent   = '繼續';
    modalBtn.onclick = () => {
      overlay.classList.remove('show');
      nextRound();
    };
  }

  overlay.classList.add('show');
}

/* =========================================================
   回合流程
   ========================================================= */
function nextRound() {
  state.phase = 'prepare';
  state.fP = null;
  state.fE = null;
  state.gold += 6 + Math.floor(state.round/2);

  state.enemyBags  = generateEnemyBags(state.round);
  state.enemyItems = generateEnemyItems(state.enemyBags, state.round);
  state.shop = rollShop();

  shopView.style.display = '';
  enemyView.style.display = 'none';

  AudioMgr.playBGM(SONGS.shopping, BGM_VOL);
  saveProgressToStorage();
  renderAll();
}

/* =========================================================
   對手生成
   ========================================================= */
function generateEnemyBags(round) {
  const bags = [];
  const cx = Math.floor((GRID_W-3)/2);
  const cy = Math.floor((GRID_H-2)/2);
  bags.push({ uid:++uidCounter, x:cx, y:cy, w:3, h:2 });

  const extra = Math.min(round-1, 9);
  for (let i=0; i<extra; i++) {
    const spot = findBagSpot(bags);
    if (!spot) break;
    bags.push({ uid:++uidCounter, x:spot.x, y:spot.y, w:2, h:2 });
  }
  return bags;
}
function generateEnemyItems(bags, round) {
  const items = [];
  const budget = 9 + round*8;
  let spent = 0, tries = 0;
  const maxCost = 3 + round*1.8;
  const pool = ITEM_KEYS.filter(k => ITEMS[k].cost <= maxCost);

  while (spent < budget && tries < 400) {
    tries++;
    const key = pool[Math.floor(Math.random()*pool.length)];
    const def = ITEMS[key];
    if (spent + def.cost > budget+2) continue;
    const spot = findItemSpot(bags, items, def);
    if (!spot) continue;
    items.push({ uid:++uidCounter, defKey:key, x:spot.x, y:spot.y });
    spent += def.cost;
  }
  return items;
}

/* =========================================================
   進度儲存 / 讀取
   ========================================================= */
function saveProgressToStorage() {
  try {
    const data = {
      round:state.round, gold:state.gold, lives:state.lives, streak:state.streak,
      bags:state.bags, items:state.items, stash:state.stash,
      savedAt: Date.now()
    };
    localStorage.setItem(STORAGE.progress, JSON.stringify(data));
  } catch(e){}
}
function loadProgressFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE.progress);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.bags)) return false;
    state.round  = d.round  ?? 1;
    state.gold   = d.gold   ?? START_GOLD;
    state.lives  = d.lives  ?? MAX_LIVES;
    state.streak = d.streak ?? 0;
    state.bags   = d.bags   || [];
    state.items  = d.items  || [];
    state.stash  = d.stash  || [];
    state.phase  = 'prepare';
    state.fP = null; state.fE = null;
    const allUids = [
      ...state.bags.map(b=>b.uid),
      ...state.items.map(i=>i.uid),
      ...state.stash.map(s=>s.uid)
    ];
    uidCounter = Math.max(uidCounter, ...allUids, 0);
    return true;
  } catch(e){ return false; }
}
function clearProgress() {
  try { localStorage.removeItem(STORAGE.progress); } catch(e){}
}

/* =========================================================
   全新遊戲
   ========================================================= */
function newGame() {
  state.phase  = 'prepare';
  state.round  = 1;
  state.gold   = START_GOLD;
  state.lives  = MAX_LIVES;
  state.streak = 0;
  state.fP = null; state.fE = null;

  const bx = Math.floor((GRID_W-3)/2);
  const by = Math.floor((GRID_H-2)/2);
  state.bags  = [{ uid:++uidCounter, x:bx, y:by, w:3, h:2 }];
  state.items = [{ uid:++uidCounter, defKey:'dagger', x:bx, y:by }];
  state.stash = [];

  state.enemyBags  = generateEnemyBags(1);
  state.enemyItems = generateEnemyItems(state.enemyBags, 1);
  state.shop = rollShop();

  shopView.style.display = '';
  enemyView.style.display = 'none';
}

/* =========================================================
   結算 → 回封面
   ========================================================= */
function settleAndReturn() {
  if (state.phase === 'battle') return;
  saveProgressToStorage();
  AudioMgr.sfx('click');
  overlay.classList.remove('show');
  showScreen('cover');
}

/* =========================================================
   音效 / 全螢幕
   ========================================================= */
function syncMuteButtons() {
  const btn = $('btnMute');
  btn.textContent = appState.muted ? '🔇' : '🔊';
  btn.classList.toggle('muted', appState.muted);
  AudioMgr.setMuted(appState.muted);
}
function toggleMute() {
  appState.muted = !appState.muted;
  syncMuteButtons();
  persistState();
  if (!appState.muted) {
    AudioMgr.sfx('click');
    if (AudioMgr.bgm && AudioMgr.bgm.paused) AudioMgr.bgm.play().catch(()=>{});
  }
}
function toggleFullscreen() {
  AudioMgr.sfx('click');
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(()=>{});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exit) exit.call(document).catch(()=>{});
  }
}

/* =========================================================
   存檔 .txt
   ========================================================= */
function saveSettingsFile() {
  AudioMgr.sfx('click');
  const now = new Date();
  const char = CHARACTERS.find(c => c.id === appState.character);
  const txt =
`Backpack Scramble v1.0 存檔
========================================
音效設定: ${appState.muted ? '關閉' : '開啟'}
獎杯數: ${appState.trophies}
選擇角色: ${char ? char.name : '未選擇'}
儲存時間: ${now.toLocaleString('zh-Hant')}
========================================
此檔案可透過遊戲封面「載入」按鈕匯入。
`;
  const blob = new Blob([txt], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backpack_scramble_save_${now.getTime()}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function loadSettingsFile() {
  AudioMgr.sfx('click');
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.txt,text/plain';
  input.onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = String(ev.target.result || '');
      const mMatch = text.match(/音效設定[:：]\s*(開啟|關閉)/);
      const tMatch = text.match(/獎杯數[:：]\s*(\d+)/);
      const cMatch = text.match(/選擇角色[:：]\s*(.+)/);

      if (mMatch) appState.muted = (mMatch[1] === '關閉');
      if (tMatch) appState.trophies = parseInt(tMatch[1], 10) || 0;
      if (cMatch && cMatch[1].trim() !== '未選擇') {
        const name = cMatch[1].trim();
        const found = CHARACTERS.find(c => c.name === name);
        if (found) appState.character = found.id;
      }
      persistState();
      syncMuteButtons();
      initCharScroller();
      AudioMgr.sfx('unlock');
      alert('載入成功！');
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}
function resetAllData() {
  AudioMgr.sfx('click');
  if (!confirm('確定要重設所有資料嗎？\n這會清除音效設定、獎盃數與遊戲進度。')) return;
  try { Object.values(STORAGE).forEach(k => localStorage.removeItem(k)); } catch(e){}
  appState.muted = false;
  appState.trophies = 0;
  appState.character = null;
  state.phase = 'prepare';
  syncMuteButtons();
  initCharScroller();
  alert('已重設完成。');
}

/* =========================================================
   事件綁定
   ========================================================= */
function bindEvents() {
  $('btnStartGame').addEventListener('click', () => {
    AudioMgr.sfx('click');
    AudioMgr.ensureCtx();
    showScreen('select');
  });
  $('btnSave').addEventListener('click', saveSettingsFile);
  $('btnLoad').addEventListener('click', loadSettingsFile);
  $('btnResetData').addEventListener('click', resetAllData);

  $('btnBackCover').addEventListener('click', () => {
    AudioMgr.sfx('click');
    showScreen('cover');
  });
  $('btnConfirmChar').addEventListener('click', () => {
    if (!appState.character) return;
    AudioMgr.sfx('click');
    AudioMgr.ensureCtx();
    if (!loadProgressFromStorage()) newGame();
    showScreen('game');
    AudioMgr.playBGM(SONGS.shopping, BGM_VOL);
    renderAll();
  });

  refreshBtn.addEventListener('click', () => {
    if (state.phase !== 'prepare' || state.gold < 1) return;
    state.gold -= 1;
    state.shop = rollShop();
    AudioMgr.sfx('click');
    renderShop();
    updateHud();
  });
  battleBtn.addEventListener('click', () => { AudioMgr.sfx('click'); startBattle(); });
  $('btnSettle').addEventListener('click', settleAndReturn);

  $('btnMute').addEventListener('click', toggleMute);
  $('btnFs').addEventListener('click', toggleFullscreen);

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart',   e => e.preventDefault());

  let lastTouch = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  window.addEventListener('resize', () => {
    computeCell();
    if (appState.screen === 'game') renderAll();
    if (appState.screen === 'select') {
      // 重新量測並保持置中
      measureSetWidth();
      requestAnimationFrame(() => syncCenterFromScroll(true));
    }
  });
}

/* =========================================================
   自動播放啟動器
   ========================================================= */
function bootAudio() {
  const src = SONGS.openBag;
  const a = new Audio(src);
  a.loop = true;
  a.volume = BGM_VOL;
  a.muted = appState.muted;
  a.addEventListener('error', () => console.warn('[BGM 缺失]', src));

  const tryPlay = () => {
    const p = a.play();
    if (!p || !p.then) {
      AudioMgr.bgm = a; AudioMgr.currentSrc = src;
      return Promise.resolve();
    }
    return p.then(() => { AudioMgr.bgm = a; AudioMgr.currentSrc = src; });
  };

  tryPlay().catch(() => {
    const resume = () => {
      tryPlay().catch(()=>{});
      document.removeEventListener('pointerdown', resume);
      document.removeEventListener('click', resume);
      document.removeEventListener('keydown', resume);
      document.removeEventListener('touchstart', resume);
    };
    document.addEventListener('pointerdown', resume, { once:false });
    document.addEventListener('click', resume, { once:false });
    document.addEventListener('keydown', resume, { once:false });
    document.addEventListener('touchstart', resume, { once:false });
  });
}

/* =========================================================
   啟動
   ========================================================= */
function boot() {
  restoreState();
  computeCell();
  initCover();
  syncMuteButtons();
  bindEvents();
  bootAudio();
