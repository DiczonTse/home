<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backpack Scramble</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--cell:44px;--panel:#161a23;--panel2:#1d222d;--line:#2a3040;--accent:#f0b429}
  html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 50% -10%,#1a2030 0%,#080a0e 65%);color:#e6e8ee;min-height:100vh;padding:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow-x:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  .screen{display:none;animation:fadeIn .4s ease}
  .screen.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .float-btn{position:fixed;bottom:14px;width:46px;height:46px;border-radius:50%;background:rgba(22,26,35,.92);border:1px solid rgba(255,255,255,.16);color:#e6e8ee;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:900;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.55);transition:.2s;touch-action:manipulation;padding:0}
  .float-btn.mute{left:14px}
  .float-btn.fs{right:14px}
  .float-btn.muted{color:#6c7488;border-color:rgba(255,255,255,.08)}

  #screenCover{position:fixed;inset:0;background:#05070b;display:none;align-items:center;justify-content:center;padding:0;z-index:100}
  #screenCover.active{display:flex}
  .cover-frame{position:relative;width:min(100vw, calc(100vh * 16 / 9));height:min(100vh, calc(100vw * 9 / 16));max-width:1600px;overflow:hidden;border-radius:0}
  @media(min-width:900px){.cover-frame{border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.85)}}
  .cover-bg{position:absolute;inset:0;background:linear-gradient(135deg,#1c2436 0%,#0d1119 55%,#221628 100%);background-size:cover;background-position:center}
  .cover-bg img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%, rgba(10,14,22,.02) 0%, rgba(5,7,11,.32) 85%),linear-gradient(180deg, rgba(5,7,11,.28) 0%, rgba(5,7,11,.05) 35%, rgba(5,7,11,.5) 100%)}
  .cover-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(16px,4vh,50px) 6% 0;gap:clamp(10px,2vh,24px)}
  .cover-title{font-size:clamp(26px,5vw,64px);font-weight:900;letter-spacing:clamp(1px,.7vw,5px);color:#fff;text-shadow:0 0 30px rgba(240,180,41,.55),0 4px 0 rgba(0,0,0,.4),0 10px 40px rgba(0,0,0,.85);background:linear-gradient(180deg,#fff7e0 0%,#f0b429 55%,#b87f0d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;line-height:1.1}
  .cover-actions{display:flex;flex-direction:column;align-items:center;gap:10px}
  .cover-save-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .cover-trophy-badge{font-size:13px;font-weight:800;color:#fff;background:rgba(22,26,35,.85);border:1px solid rgba(240,180,41,.4);padding:6px 16px;border-radius:20px;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.5);letter-spacing:.5px}
  .cover-trophy-badge .val{color:#f0b429;font-size:15px}
  .cbtn{background:rgba(29,34,45,.85);color:#dfe3ec;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 20px;font-size:13.5px;font-weight:800;cursor:pointer;transition:.16s;font-family:inherit;backdrop-filter:blur(8px);letter-spacing:.5px;touch-action:manipulation}
  .cbtn:disabled{opacity:.35;cursor:not-allowed}
  .cbtn-primary{background:linear-gradient(180deg,#f7c243,#d4910a);color:#2a1c00;border:none;font-size:16px;padding:12px 44px;border-radius:14px;letter-spacing:1.5px;box-shadow:0 8px 30px rgba(240,180,41,.42),inset 0 1px 0 rgba(255,255,255,.5)}
  .cbtn-primary:disabled{filter:grayscale(1);box-shadow:none}
  .cover-copyright{position:absolute;left:0;right:0;bottom:clamp(8px,1.8vh,18px);text-align:center;font-size:clamp(9.5px,1.05vw,12px);color:rgba(220,226,240,.75);letter-spacing:.6px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.95);pointer-events:none;padding:0 70px}
  @media(max-width:520px){.cover-title{font-size:clamp(22px,6vw,38px);letter-spacing:1px}.cbtn-primary{font-size:14px;padding:10px 34px;border-radius:12px}.cbtn{padding:8px 15px;font-size:12px;border-radius:10px}.cover-inner{gap:12px}.cover-save-actions{gap:7px}.cover-trophy-badge{font-size:11px;padding:5px 12px}.cover-trophy-badge .val{font-size:13px}}

  #screenSelect{max-width:1100px;margin:0 auto;padding:6px 0 90px;overflow:hidden}
  .select-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 6px}
  .select-head h2{font-size:19px;letter-spacing:3px;font-weight:900;color:#f0b429;text-shadow:0 2px 12px rgba(240,180,41,.35)}
  .select-trophy{font-size:14px;font-weight:800;color:#e6e8ee;background:rgba(29,34,45,.9);border:1px solid var(--line);padding:7px 16px;border-radius:20px}
  .select-trophy span{color:#f0b429;font-size:16px}
  .select-sub{font-size:11px;color:#7c879e;text-align:center;letter-spacing:.6px;margin-bottom:12px;line-height:1.6}
  .select-sub b{color:#f0b429}
  .char-scroller-wrap{position:relative;padding:14px 0 24px}
  .char-scroller-wrap::before,.char-scroller-wrap::after{content:'';position:absolute;top:0;bottom:0;width:50px;pointer-events:none;z-index:3}
  .char-scroller-wrap::before{left:0;background:linear-gradient(90deg,#080a0e 5%,transparent)}
  .char-scroller-wrap::after{right:0;background:linear-gradient(-90deg,#080a0e 5%,transparent)}
  .char-scroller{display:flex;gap:14px;overflow-x:auto;padding:8px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;cursor:grab;touch-action:pan-x}
  .char-scroller.dragging{cursor:grabbing}
  .char-scroller::-webkit-scrollbar{display:none}
  .char-card{position:relative;flex-shrink:0;height:min(52vh,430px);aspect-ratio:9/16;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:linear-gradient(160deg,#232a3a,#141822);cursor:pointer;transition:transform .25s cubic-bezier(.2,1,.4,1),border-color .25s, box-shadow .25s, filter .25s;touch-action:pan-x;transform:scale(.86);opacity:.6}
  .char-card.centered{transform:scale(1);opacity:1;border-color:rgba(240,180,41,.35)}
  .char-card.selected{border-color:#f0b429;box-shadow:0 0 0 3px rgba(240,180,41,.28),0 14px 44px rgba(240,180,41,.32);transform:scale(1.02);opacity:1}
  .char-card.locked{cursor:pointer}
  .char-card.locked.centered{filter:brightness(.8) grayscale(.45)}
  .char-card.locked:not(.centered){filter:brightness(.55) grayscale(.72)}
  .char-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .char-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:rgba(255,255,255,.16);letter-spacing:2px}
  .char-name{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 12px;background:linear-gradient(0deg,rgba(5,7,11,.95) 30%,rgba(5,7,11,0));font-size:14px;font-weight:900;letter-spacing:1.5px;text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  .char-card.locked .char-name{color:#c5ccdb}
  .char-lock-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#f0b429;background:rgba(8,10,15,.9);border:1px solid rgba(240,180,41,.45);padding:8px 12px;border-radius:11px;letter-spacing:.4px;text-align:center;line-height:1.3;pointer-events:none;opacity:0;transition:opacity .25s;max-width:88%}
  .char-card.locked.centered .char-lock-badge{opacity:1}
  .char-lock-badge .lock-ico{font-size:18px}
  .char-lock-badge .try-hint{color:#8b95ab;font-size:9px;font-weight:700;border-top:1px solid rgba(255,255,255,.08);margin-top:1px;padding-top:4px}
  .char-check{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:#f0b429;color:#2a1c00;display:none;align-items:center;justify-content:center;font-size:15px;font-weight:900;box-shadow:0 3px 12px rgba(0,0,0,.6)}
  .char-card.selected .char-check{display:flex}
  .char-preview-tag{position:absolute;top:10px;left:10px;background:rgba(240,180,41,.92);color:#2a1c00;font-size:9px;font-weight:900;letter-spacing:.5px;padding:3px 8px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,.5);display:none}
  .char-card.previewing .char-preview-tag{display:block}
  .scroll-hint{text-align:center;font-size:11px;color:#6c7488;letter-spacing:.5px;margin-top:4px}
  .scroll-hint b{color:#f0b429}
  .select-foot{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
  .select-foot .cbtn{min-width:120px;text-align:center}
  .select-foot .cbtn-primary{min-width:180px}

  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(10,13,20,.96);color:#f0b429;font-size:13px;font-weight:800;padding:14px 22px;border-radius:14px;border:1px solid rgba(240,180,41,.45);box-shadow:0 20px 60px rgba(0,0,0,.8);z-index:99999;opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,1.4,.5,1);letter-spacing:.5px;text-align:center;line-height:1.6;max-width:280px}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toast .toast-ico{font-size:22px;display:block;margin-bottom:4px}

  #screenGame{max-width:560px;margin:0 auto;padding-bottom:80px}
  .hud{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px;margin-bottom:10px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  .hud-item{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .hud-item .val{color:var(--accent);font-size:15px}
  .lives{display:flex;gap:2px;font-size:14px}
  .life{filter:grayscale(1);opacity:.22;transition:.25s}
  .life.on{filter:none;opacity:1}
  .hud-char{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent);background:#232a3a}
  .game-main{display:block}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px;margin-bottom:10px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;min-height:30px;gap:8px;flex-wrap:wrap}
  .panel-head h2{font-size:12.5px;letter-spacing:.6px;color:#98a1b6;font-weight:800;display:flex;align-items:center;gap:6px}
  .head-right{display:flex;align-items:center;gap:8px}
  .head-avatar{width:32px;height:32px;border-radius:8px;object-fit:cover;border:2px solid rgba(240,180,41,.5);background:#232a3a;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .head-btns{display:flex;gap:6px;flex-wrap:wrap}
  .dps{font-size:11px;color:#7c879e;font-weight:700;background:var(--panel2);padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
  .dps.hot{color:#ffb84d;border-color:#5a4413}

  #shopView{position:relative;padding:4px;border-radius:14px;overflow:hidden;transition:.2s}
  #shopView.sell-hover{box-shadow:0 0 0 3px rgba(80,225,140,.5)}
  .shop-bg{position:absolute;inset:0;background-color:#0c1017;background-image:url('shop.jpg');background-size:cover;background-position:center;border-radius:14px;z-index:0;pointer-events:none}
  .shop-bg::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(180deg,rgba(5,7,11,.62) 0%,rgba(5,7,11,.72) 55%,rgba(5,7,11,.82) 100%)}
  .shop-content{position:relative;z-index:1;padding:4px 4px 6px}
  .shop-content .panel-head h2{color:#dfe3ec;text-shadow:0 2px 8px rgba(0,0,0,.9)}
  .shop-content .shop-card{background:rgba(22,26,35,.86);backdrop-filter:blur(6px)}
  .shop-content .shop-empty{color:#8b95ab;text-shadow:0 2px 6px rgba(0,0,0,.9)}

  .grid{position:relative;margin:0 auto;background:#080a0e;border-radius:10px;border:1px solid #222836;box-shadow:inset 0 0 30px rgba(0,0,0,.7);touch-action:none;overscroll-behavior:contain}
  .cell{position:absolute;border-right:1px solid #13171f;border-bottom:1px solid #13171f;pointer-events:none}
  .bagblock-cell{position:absolute;background:rgba(180,140,80,.18);box-shadow:inset 0 0 0 1.5px rgba(210,175,110,.35);cursor:grab;touch-action:none;box-sizing:border-box}
  .bagblock-cell:active{cursor:grabbing}

  .item{position:absolute;pointer-events:auto;cursor:grab;touch-action:none}
  .item .item-cell{position:absolute;border-radius:6px;border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 2px 6px rgba(0,0,0,.5);pointer-events:none;box-sizing:border-box}
  .item .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .item .cdmask{position:absolute;left:2px;right:2px;top:2px;height:0%;background:rgba(0,0,0,.66);pointer-events:none;border-radius:6px;width:auto}
  .item.flash{filter:drop-shadow(0 0 12px rgba(255,255,255,.75))}
  .item.spent{opacity:.35;filter:grayscale(.7)}
  .item.ammo-spent{opacity:.28;filter:grayscale(.85)}

  .bars{display:flex;flex-direction:column;gap:4px;margin-top:9px}
  .bar{height:10px;border-radius:6px;background:#05070b;overflow:hidden;position:relative}
  .bar-fill{height:100%;width:100%;transition:width .1s linear;border-radius:6px}
  .bar-fill.hp{background:linear-gradient(90deg,#7d1a20,#e5484d)}
  .bar-fill.st{background:linear-gradient(90deg,#0e7490,#22d3ee)}
  .bar-fill.ar{background:linear-gradient(90deg,#254f8c,#5b9bf8)}
  .bar-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
  .bar.tiny{height:5px}

  .stash-panel{background:var(--panel);border:1px dashed #3a4358;border-radius:16px;padding:10px 11px;margin-bottom:10px;transition:.18s}
  .stash-panel.drop-hover{border-color:#f0b429;background:#221c0e;box-shadow:0 0 0 3px rgba(240,180,41,.12)}
  .stash-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8b95ab;font-weight:800;letter-spacing:.4px;margin-bottom:8px}
  .stash-head .count{color:#5f6779;font-weight:700;font-size:10.5px}
  .stash-list{display:flex;gap:6px;flex-wrap:wrap;min-height:64px;align-content:flex-start;touch-action:none}
  .stash-card{width:64px;height:64px;background:var(--panel2);border:1px dashed #3a4358;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:grab;transition:.14s;touch-action:none;flex-shrink:0;padding:2px}
  .stash-card:active{transform:scale(.94)}
  .stash-card .s-ico{font-size:20px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .stash-card .s-name{font-size:7.5px;color:#8b95ab;font-weight:800;line-height:1;text-align:center}
  .stash-card .s-stat{font-size:7.5px;color:#f0b429;font-weight:900;line-height:1}
  .stash-empty{color:#454d60;font-size:11px;text-align:center;padding:16px 8px;width:100%;line-height:1.6}
  .stash-empty b{color:#6f788c}

  .shop-list{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;touch-action:none}
  .shop-card{width:72px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;transition:.14s;touch-action:none}
  .shop-card:active{transform:scale(.95)}
  .shop-card.poor{opacity:.3;cursor:not-allowed}
  .shop-card .cico{font-size:21px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .shop-card .cname{font-size:9.5px;font-weight:800;color:#c9cfe0;text-align:center;line-height:1.1}
  .shop-card .cstat{font-size:8px;color:#6f788c}
  .shop-card .ccost{font-size:11px;font-weight:900;color:var(--accent)}
  .shop-empty{text-align:center;color:#4d5568;font-size:11px;padding:16px 0;width:100%}

  .btn{background:var(--panel2);color:#e6e8ee;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;transition:.14s;font-family:inherit;white-space:nowrap;touch-action:manipulation}
  .btn:disabled{opacity:.3;cursor:not-allowed}
  .btn.primary{background:linear-gradient(180deg,#f5bd35,#d4930d);color:#2a1c00;border:none;padding:15px 0;font-size:15.5px;border-radius:13px;box-shadow:0 5px 20px rgba(240,180,41,.3);width:100%;letter-spacing:1px}
  .btn.primary:disabled{filter:grayscale(1);box-shadow:none}

  .ghost{position:fixed;pointer-events:none;z-index:9999;border-radius:8px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 28px rgba(0,0,0,.75);filter:drop-shadow(0 0 10px rgba(240,180,41,.45));will-change:left,top}
  .preview{position:absolute;pointer-events:none;border-radius:8px;display:none;z-index:6;transition:left .04s,top .04s}
  .preview.ok{background:rgba(80,225,140,.22);border:2px solid rgba(80,225,140,.9)}
  .preview.bad{background:rgba(229,72,77,.22);border:2px solid rgba(229,72,77,.85)}

  .hint{font-size:10.5px;color:#596274;text-align:center;line-height:1.75;padding:0 12px 12px}
  .hint b{color:#8b95ab}

  .overlay{position:fixed;inset:0;background:rgba(5,7,11,.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:10000;opacity:0;pointer-events:none;transition:opacity .28s;padding:20px}
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 28px;text-align:center;max-width:340px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.8);transform:scale(.92);transition:transform .28s cubic-bezier(.2,1.4,.5,1)}
  .overlay.show .modal{transform:scale(1)}
  .modal .big{font-size:46px;margin-bottom:8px;line-height:1}
  .modal h3{font-size:21px;margin-bottom:10px;letter-spacing:1px}
  .modal h3.win{color:#4ade80}
  .modal h3.lose{color:#e5484d}
  .modal p{font-size:12.5px;color:#9aa3b8;line-height:1.8;margin-bottom:22px}
  .modal .gold-gain{color:var(--accent);font-weight:900}
  .modal .trophy-line{display:block;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);color:#f0b429;font-weight:800;font-size:13px}

  @media(max-width:400px){
    .shop-card{width:62px}.hud-item{font-size:11px}.hud-item .val{font-size:13px}
    .stash-card{width:56px;height:56px}.char-card{height:min(46vh,340px)}
    .head-avatar{width:28px;height:28px}
  }

  @media (orientation: landscape) and (max-height: 620px) {
    body { padding: 4px; }
    #screenGame { max-width: 100vw; padding-bottom: 4px; display: flex; flex-direction: column; height: 100vh; gap: 4px; overflow: hidden; }
    .hud { padding: 5px 10px; margin-bottom: 0; border-radius: 9px; gap: 6px; }
    .hud-item { font-size: 10.5px; gap: 3px; }
    .hud-item .val { font-size: 12px; }
    .hud-char { width: 20px; height: 20px; }
    .game-main { display: flex; flex-direction: row; gap: 6px; flex: 1; min-height: 0; }
    #shopPanel, #playerPanel { flex: 1 1 50%; padding: 6px 8px; margin-bottom: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .panel-head { margin-bottom: 4px; min-height: 22px; }
    .panel-head h2 { font-size: 10.5px; }
    .head-avatar { width: 22px; height: 22px; border-width: 1.5px; }
    .dps { font-size: 9.5px; padding: 2px 7px; }
    .btn { padding: 4px 9px; font-size: 10px; border-radius: 7px; }
    .bars { margin-top: 4px; gap: 3px; }
    .bar { height: 8px; }
    .stash-panel { padding: 4px 8px; margin-bottom: 0; }
    .stash-list { min-height: 34px; }
    .stash-card { width: 38px; height: 38px; padding: 1px; }
    .stash-card .s-ico { font-size: 13px; }
    .stash-card .s-name { font-size: 6px; }
    .stash-card .s-stat { font-size: 6px; }

/* =========================================================
   形狀旋轉
   ========================================================= */
function rotateShape90(shape){
  const h = shape.length, w = shape[0].length;
  const ns = Array.from({length:w}, () => Array(h).fill(0));
  for (let y=0; y<h; y++)
    for (let x=0; x<w; x++)
      ns[x][h-1-y] = shape[y][x];
  return ns;
}
function rotateShapeN(shape, n){
  n = ((n % 4) + 4) % 4;
  let s = shape;
  for (let i=0; i<n; i++) s = rotateShape90(s);
  return s;
}
function shapeKey(shape){ return shape.map(r => r.join('')).join('|'); }
function getDistinctRots(shape){
  const seen = new Set();
  const arr = [];
  for (let i=0; i<4; i++){
    const k = shapeKey(rotateShapeN(shape, i));
    if (!seen.has(k)){ seen.add(k); arr.push(i); }
  }
  return arr;
}
function getBaseShape(def){
  if (def.shape) return def.shape;
  return Array.from({length:def.h}, () => Array(def.w).fill(1));
}
function getBagDims(bag){
  const t = BAG_TYPES[bag.bagType];
  const rot = bag.rot || 0;
  const shape = rotateShapeN(t.shape, rot);
  return { w: shape[0].length, h: shape.length, shape };
}
function getItemDims(def, rot){
  const shape = rotateShapeN(getBaseShape(def), rot || 0);
  return { w: shape[0].length, h: shape.length, shape };
}

const AudioMgr = {
  ctx:null, bgm:null, currentSrc:null, lastHit:0,
  ensureCtx(){ if (!this.ctx){ try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ this.ctx=null; } } if (this.ctx && this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); return this.ctx; },
  playBGM(src, volume=BGM_VOL){ if (this.currentSrc===src && this.bgm){ this.bgm.volume=volume; if (this.bgm.paused) this.bgm.play().catch(()=>{}); return; } this.stopBGM(); const a=new Audio(src); a.loop=true; a.volume=volume; a.muted=appState.muted; a.addEventListener('error',()=>console.warn('[BGM 缺失]',src)); const p=a.play(); if (p&&p.catch) p.catch(()=>{}); this.bgm=a; this.currentSrc=src; },
  stopBGM(){ if (this.bgm){ try{ this.bgm.pause(); this.bgm.currentTime=0; }catch(e){} this.bgm=null; } this.currentSrc=null; },
  setMuted(m){ if (this.bgm) this.bgm.muted=m; },
  tone(freq,dur,type='sine',vol=0.08,delay=0){ if (appState.muted) return; const ctx=this.ensureCtx(); if (!ctx) return; const now=ctx.currentTime+delay; const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,now); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(vol,now+0.012); g.gain.exponentialRampToValueAtTime(0.0001,now+dur); o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now+dur+0.03); },
  noise(dur,vol=0.14,delay=0){ if (appState.muted) return; const ctx=this.ensureCtx(); if (!ctx) return; const now=ctx.currentTime+delay; const len=Math.floor(ctx.sampleRate*dur); const buf=ctx.createBuffer(1,len,ctx.sampleRate); const d=buf.getChannelData(0); for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2); const src=ctx.createBufferSource(); src.buffer=buf; const g=ctx.createGain(); g.gain.value=vol; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; f.Q.value=0.8; src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(now); },
  sfx(type){
    switch(type){
      case 'click': this.tone(720,0.055,'triangle',0.055); break;
      case 'pickup': this.tone(560,0.06,'sine',0.065); this.tone(840,0.08,'sine',0.05,0.045); break;

      case 'rotate': this.tone(700,0.05,'square',0.045); this.tone(1050,0.06,'square',0.035,0.05); break;
      case 'error': this.tone(180,0.14,'sawtooth',0.045); break;
      case 'hit': { const now=performance.now(); if (now-this.lastHit<55) return; this.lastHit=now; this.noise(0.09,0.11); this.tone(160,0.06,'square',0.035); break; }
      case 'heal': this.tone(660,0.1,'sine',0.06); this.tone(880,0.12,'sine',0.05,0.07); this.tone(1100,0.16,'sine',0.04,0.14); break;
      case 'armor': this.tone(300,0.1,'square',0.05); break;

      case 'lose': [523,440,349,262].forEach((f,i)=>this.tone(f,0.26,'sine',0.07,i*0.13)); break;
      case 'select': this.tone(880,0.07,'sine',0.07); this.tone(1320,0.1,'sine',0.05,0.06); break;

function computeCell(){
  const isLandscape = window.innerWidth > window.innerHeight*1.3 && window.innerHeight < 620;
  if (isLandscape && appState.screen === 'game'){
    const availW = (window.innerWidth/2) - 36;
    const availH = window.innerHeight - 210;
    CELL = Math.max(16, Math.min(Math.floor(availW/GRID_W), Math.floor(availH/GRID_H), 36));
  } else {
    const avail = Math.min(window.innerWidth-54, 520);
    CELL = Math.max(26, Math.min(46, Math.floor(avail/GRID_W)));
  }
  document.documentElement.style.setProperty('--cell', CELL+'px');
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function cellInBags(bags, x, y){
  for (const b of bags){
    const d = getBagDims(b);
    const rx = x - b.x, ry = y - b.y;
    if (rx>=0 && rx<d.w && ry>=0 && ry<d.h && d.shape[ry][rx]) return true;
  }
  return false;
}
function buildOcc(items, excludeUid){
  const occ = Array.from({length:GRID_H}, () => Array(GRID_W).fill(null));
  for (const it of items){
    if (excludeUid !== undefined && it.uid === excludeUid) continue;
    const def = ITEMS[it.defKey]; if (!def) continue;
    const dims = getItemDims(def, it.rot);
    for (let dy=0; dy<dims.h; dy++)
      for (let dx=0; dx<dims.w; dx++){
        if (!dims.shape[dy][dx]) continue;
        const y = it.y+dy, x = it.x+dx;
        if (y>=0 && y<GRID_H && x>=0 && x<GRID_W) occ[y][x] = it.uid;
      }
  }
  return occ;
}
function canPlaceItem(bags, items, def, rot, x, y, excludeUid){
  const dims = getItemDims(def, rot);
  if (x<0||y<0||x+dims.w>GRID_W||y+dims.h>GRID_H) return false;
  for (let dy=0; dy<dims.h; dy++)
    for (let dx=0; dx<dims.w; dx++){
      if (!dims.shape[dy][dx]) continue;
      if (!cellInBags(bags, x+dx, y+dy)) return false;
    }
  const occ = buildOcc(items, excludeUid);
  for (let dy=0; dy<dims.h; dy++)
    for (let dx=0; dx<dims.w; dx++){
      if (!dims.shape[dy][dx]) continue;
      if (occ[y+dy][x+dx] !== null) return false;
    }
  return true;
}
function canPlaceBag(bags, x, y, w, h, shape, excludeUid){
  if (x<0||y<0||x+w>GRID_W||y+h>GRID_H) return false;
  for (let dy=0; dy<h; dy++){
    for (let dx=0; dx<w; dx++){
      if (!shape[dy][dx]) continue;
      const gx = x+dx, gy = y+dy;
      for (const b of bags){
        if (excludeUid !== undefined && b.uid === excludeUid) continue;
        const bd = getBagDims(b);
        const rx = gx - b.x, ry = gy - b.y;
        if (rx>=0 && rx<bd.w && ry>=0 && ry<bd.h && bd.shape[ry][rx]) return false;
      }
    }
  }
  return true;
}
function isItemInBag(item, bag){
  const def = ITEMS[item.defKey]; if (!def) return false;
  const dims = getItemDims(def, item.rot);
  const bd = getBagDims(bag);
  for (let dy=0; dy<dims.h; dy++){
    for (let dx=0; dx<dims.w; dx++){
      if (!dims.shape[dy][dx]) continue;
      const bx = item.x + dx - bag.x;
      const by = item.y + dy - bag.y;
      if (bx<0 || bx>=bd.w || by<0 || by>=bd.h) return false;
      if (!bd.shape[by][bx]) return false;
    }
  }
  return true;
}
function rectsAdjacent(a, b){
  const set = new Set();
  for (let dy=0; dy<a.h; dy++)
    for (let dx=0; dx<a.w; dx++) set.add((a.x+dx)+','+(a.y+dy));
  for (let dy=0; dy<b.h; dy++)
    for (let dx=0; dx<b.w; dx++){
      const x=b.x+dx, y=b.y+dy;
      if (set.has((x+1)+','+y)||set.has((x-1)+','+y)||set.has(x+','+(y+1))||set.has(x+','+(y-1))) return true;
    }
  return false;
}
function findBagSpot(bags, type){
  const t = BAG_TYPES[type];
  const adj = [], any = [];
  for (let y=0; y<=GRID_H-t.shape.length; y++){
    for (let x=0; x<=GRID_W-t.shape[0].length; x++){
      if (!canPlaceBag(bags, x, y, t.shape[0].length, t.shape.length, t.shape)) continue;
      any.push({x,y});
      let near = false;
      for (const b of bags){
        const bd = getBagDims(b);
        if (x === b.x+bd.w && y < b.y+bd.h && y+t.shape.length > b.y) near = true;
        if (x+t.shape[0].length === b.x && y < b.y+bd.h && y+t.shape.length > b.y) near = true;
        if (y === b.y+bd.h && x < b.x+bd.w && x+t.shape[0].length > b.x) near = true;
        if (y+t.shape.length === b.y && x < b.x+bd.w && x+t.shape[0].length > b.x) near = true;
      }
      if (near) adj.push({x,y});
    }
  }
  const pool = adj.length ? adj : any;
  if (!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function findItemSpot(bags, items, def){
  const dims = getItemDims(def, 0);
  const spots = [];
  for (let y=0; y<=GRID_H-dims.h; y++)
    for (let x=0; x<=GRID_W-dims.w; x++)
      if (canPlaceItem(bags, items, def, 0, x, y)) spots.push({x,y});
  if (!spots.length) return null;
  return spots[Math.floor(Math.random()*spots.length)];
}

function measureSetWidth(){ const sc = $('charScroller'); const n = CHARACTERS.length; if (sc.children.length < n*2) return; CS.setWidth = sc.children[n].offsetLeft - sc.children[0].offsetLeft; }
function onScrollerScroll(){ if (!CS.initDone) return; const sc = $('charScroller'); if (CS.setWidth > 0){ if (sc.scrollLeft < CS.setWidth*0.5) sc.scrollLeft += CS.setWidth; else if (sc.scrollLeft > CS.setWidth*1.5) sc.scrollLeft -= CS.setWidth; } clearTimeout(CS.scrollTimer); CS.scrollTimer = setTimeout(() => syncCenterFromScroll(false), 130); }
function onScrollerMouseDown(ev){ if (ev.button !== 0) return; const sc = $('charScroller'); CS.isMouseDown = true; CS.mouseHasDragged = false; CS.mouseStartX = ev.clientX; CS.mouseStartScroll = sc.scrollLeft; sc.classList.add('dragging'); ev.preventDefault(); }

function syncCenterFromScroll(silent){
  const sc = $('charScroller');
  const cRect = sc.getBoundingClientRect();
  const centerX = cRect.left + cRect.width/2;
  let best = null, bestDist = Infinity;
  for (const card of CS.cards){ const r = card.getBoundingClientRect(); const d = Math.abs((r.left + r.width/2) - centerX); if (d < bestDist){ bestDist = d; best = card; } }
  if (!best) return;
  const r = best.getBoundingClientRect();
  const target = sc.scrollLeft + (r.left + r.width/2) - centerX;
  if (Math.abs(target - sc.scrollLeft) > 2) sc.scrollTo({ left: target, behavior:'smooth' });
  const chId = best.dataset.id;
  const ch = CHARACTERS.find(c => c.id === chId);
  if (!ch) return;
  const locked = appState.trophies < ch.need;
  CS.cards.forEach(c => { c.classList.toggle('centered', c === best); c.classList.toggle('previewing', c === best); });

  CS.centeredId = chId;

}

/* ★ 商店：專屬武器不受 maxCost 限制，且出現率提高 */
function rollShop(){
  const shop = [];
  const charId = appState.character;
  const maxCost = 4 + state.round * 1.7;
  // 普通物品受 maxCost 限制
  const normalPool = ITEM_KEYS.filter(k => ITEMS[k].cost <= maxCost && isItemAvailable(k, charId) && !ITEMS[k].exclusive);
  // 專屬武器不受 maxCost 限制（但需符合角色）
  const exclusivePool = ITEM_KEYS.filter(k => isItemAvailable(k, charId) && ITEMS[k].exclusive);
  if (!normalPool.length && !exclusivePool.length) return shop;

  const bagChance = state.bags.length < 3 ? 0.32 : 0.2;

  for (let i = 0; i < 5; i++){
    if (Math.random() < bagChance){
      const r = Math.random();
      const bagType = r < 0.35 ? 'small' : r < 0.62 ? 'long' : r < 0.85 ? 'L' : 'square';
      shop.push({ id:++uidCounter, kind:'bag', bagType, cost: BAG_TYPES[bagType].cost });
    } else {
      let key;
      // 35% 機率抽專屬武器（若存在）
      if (exclusivePool.length && Math.random() < 0.35){
        key = exclusivePool[Math.floor(Math.random() * exclusivePool.length)];
      } else if (normalPool.length){
        key = normalPool[Math.floor(Math.random() * normalPool.length)];
      } else {
        key = exclusivePool[Math.floor(Math.random() * exclusivePool.length)];
      }
      shop.push({ id:++uidCounter, kind:'item', key, cost: ITEMS[key].cost });
    }
  }
  return shop;
}

let drag = null;

function startDrag(ev, payload){
  if (drag) return;
  if (state.phase !== 'prepare') return;

  let def, bagType = null;
  let originData = null;

  if (payload.kind === 'bag'){
    if (payload.source === 'shop') bagType = payload.bagType;
    else if (payload.source === 'grid') bagType = payload.origBag.bagType;
    else if (payload.source === 'stash') bagType = payload.bagType;
    const t = BAG_TYPES[bagType];
    def = { w:t.shape[0].length, h:t.shape.length, icon:t.icon, color:t.color, name:t.name };

    if (payload.source === 'grid' && payload.origBag){
      const bag = payload.origBag;
      const bagItems = state.items.filter(it => isItemInBag(it, bag));
      originData = { type:'bag', bag: { ...bag }, items: bagItems.map(it => ({ ...it })) };
      for (const it of bagItems) state.stash.push({ uid:it.uid, kind:'item', defKey:it.defKey, rot: it.rot || 0 });
      state.items = state.items.filter(it => !bagItems.includes(it));
      state.bags = state.bags.filter(b => b.uid !== bag.uid);
    } else if (payload.source === 'stash'){
      const s = state.stash.find(x => x.uid === payload.uid);
      if (s) originData = { type:'bag-stash', data: { ...s } };
      state.stash = state.stash.filter(x => x.uid !== payload.uid);
    }
  } else {
    const defSrc = ITEMS[payload.defKey]; if (!defSrc) return;
    def = { ...defSrc };
    if (payload.source === 'grid'){
      const orig = state.items.find(x => x.uid === payload.uid);
      if (orig) originData = { type:'item-grid', data: { ...orig } };
      state.items = state.items.filter(it => it.uid !== payload.uid);
    } else if (payload.source === 'stash'){
      const orig = state.stash.find(x => x.uid === payload.uid);
      if (orig) originData = { type:'item-stash', data: { ...orig } };
      state.stash = state.stash.filter(s => s.uid !== payload.uid);
    }
  }

  // ★ 修正：從 grid 拾取背包時，使用 origBag.rot 作為初始旋轉
  let initRot = payload.rot;
  if (initRot === undefined){
    if (payload.source === 'grid' && payload.origBag) initRot = payload.origBag.rot || 0;
    else initRot = 0;
  }

  // Ghost
  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  const initDims = payload.kind === 'bag'
    ? getBagDims({ bagType, rot: initRot })
    : getItemDims(ITEMS[payload.defKey], initRot);
  def.w = initDims.w; def.h = initDims.h;
  ghost.style.width  = (def.w * CELL - 4) + 'px';
  ghost.style.height = (def.h * CELL - 4) + 'px';
  ghost.style.background = `linear-gradient(150deg,${def.color},${shade(def.color,-30)})`;
  ghost.innerHTML = `<span style="font-size:${Math.round(Math.min(def.w,def.h)*CELL*0.46)}px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))">${def.icon}</span>`;
  document.body.appendChild(ghost);

  let sellPrice;
  if (payload.kind === 'bag') sellPrice = Math.max(1, Math.floor(BAG_TYPES[bagType].cost/2));
  else sellPrice = Math.max(1, Math.floor(ITEMS[payload.defKey].cost/2));

  drag = {
    ...payload, def, ghost, bagType, sellPrice, originData,
    rot: initRot,
    gx:-99, gy:-99, valid:false, pid:ev.pointerId,
  };

  AudioMgr.sfx('pickup');
  try { if (document.body.setPointerCapture) document.body.setPointerCapture(ev.pointerId); } catch(e){}
  moveGhost(ev.clientX, ev.clientY);
  updatePreview(ev.clientX, ev.clientY);

  renderPlayerGrid();
  renderStash();

  document.addEventListener('pointermove', onPointerMove, { passive:false });
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);
}

function rotateDuringDrag(){
  if (!drag) return;
  let baseShape, curRot = drag.rot || 0;

  if (drag.kind === 'bag'){
    const t = BAG_TYPES[drag.bagType];
    baseShape = t.shape;
  } else {
    const defSrc = ITEMS[drag.defKey];
    if (!defSrc) return;
    baseShape = getBaseShape(defSrc);
  }

  const distinct = getDistinctRots(baseShape);
  if (distinct.length <= 1){ AudioMgr.sfx('error'); return; }

  const curIdx = Math.max(0, distinct.indexOf(curRot));
  const nextIdx = (curIdx + 1) % distinct.length;
  drag.rot = distinct[nextIdx];

  const dims = drag.kind === 'bag'
    ? getBagDims({ bagType: drag.bagType, rot: drag.rot })
    : getItemDims(ITEMS[drag.defKey], drag.rot);
  drag.def.w = dims.w; drag.def.h = dims.h;
  drag.ghost.style.width  = (dims.w*CELL - 4) + 'px';
  drag.ghost.style.height = (dims.h*CELL - 4) + 'px';
  drag.ghost.querySelector('span').style.fontSize = Math.round(Math.min(dims.w,dims.h)*CELL*0.46) + 'px';

  updatePreview(lastPointerX, lastPointerY);
  AudioMgr.sfx('rotate');
}

function moveGhost(cx, cy){ if (!drag) return; drag.ghost.style.left = cx + 'px'; drag.ghost.style.top = cy + 'px'; }
function onPointerMove(ev){ if (!drag) return; lastPointerX = ev.clientX; lastPointerY = ev.clientY; if (ev.cancelable) ev.preventDefault(); moveGhost(ev.clientX, ev.clientY); updatePreview(ev.clientX, ev.clientY); }

function updatePreview(cx, cy){
  if (!drag || !previewEl) return;
  const def = drag.def;
  const rect = playerGridEl.getBoundingClientRect();
  const px = cx - rect.left - def.w*CELL/2;
  const py = cy - rect.top  - def.h*CELL/2;
  const gx = Math.round(px/CELL), gy = Math.round(py/CELL);
  drag.gx = gx; drag.gy = gy;

  let ok;
  if (drag.kind === 'bag'){
    const dims = getBagDims({ bagType: drag.bagType, rot: drag.rot });
    const others = drag.source === 'grid' ? state.bags.filter(b => b.uid !== drag.uid) : state.bags;
    ok = canPlaceBag(others, gx, gy, dims.w, dims.h, dims.shape);
  } else {
    const srcDef = ITEMS[drag.defKey];
    const ex = drag.source === 'grid' ? drag.uid : undefined;
    ok = canPlaceItem(state.bags, state.items, srcDef, drag.rot, gx, gy, ex);
  }
  drag.valid = ok;

  if (gx < -3 || gy < -3 || gx > GRID_W+2 || gy > GRID_H+2){ previewEl.style.display = 'none'; }
  else {
    previewEl.style.display = 'block';
    previewEl.style.left = gx*CELL + 'px';
    previewEl.style.top  = gy*CELL + 'px';
    previewEl.style.width  = def.w*CELL + 'px';
    previewEl.style.height = def.h*CELL + 'px';
    previewEl.className = 'preview ' + (ok ? 'ok' : 'bad');
  }

  const sr = stashListEl.getBoundingClientRect();
  const overStash = cx >= sr.left-40 && cx <= sr.right+40 && cy >= sr.top-40 && cy <= sr.bottom+40;
  stashPanel.classList.toggle('drop-hover', overStash && drag.source !== 'shop');
  const spr = shopPanel.getBoundingClientRect();
  const overShop = cx >= spr.left && cx <= spr.right && cy >= spr.top && cy <= spr.bottom;
  shopView.classList.toggle('sell-hover', overShop && (drag.source === 'grid' || drag.source === 'stash'));
}

function onPointerUp(ev){
  cleanupDragListeners();
  if (!drag) return;

  const rect = playerGridEl.getBoundingClientRect();
  const overGrid = ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom;
  const spr = shopPanel.getBoundingClientRect();
  const overShop = ev.clientX >= spr.left && ev.clientX <= spr.right && ev.clientY >= spr.top && ev.clientY <= spr.bottom;

  const d = drag;
  let handled = false;

  if (overShop && d.source !== 'shop'){
    state.gold += d.sellPrice;
    AudioMgr.sfx('sell');
    showToast(`販賣獲得 +${d.sellPrice}💰`, '💰', 900);
    handled = true;
  } else if (d.valid && overGrid){
    if (d.kind === 'bag'){
      state.bags.push({ uid: d.uid || (++uidCounter), bagType: d.bagType, x: d.gx, y: d.gy, rot: d.rot });
    } else {
      state.items.push({ uid: d.uid || (++uidCounter), defKey: d.defKey, x: d.gx, y: d.gy, rot: d.rot });
    }
    if (d.source === 'shop'){
      state.gold -= d.cost;
      state.shop = state.shop.filter(s => s.id !== d.shopId);
      AudioMgr.sfx('buy');
    } else AudioMgr.sfx('place');
    handled = true;
  } else if (!overGrid && d.source !== 'shop'){
    if (d.kind === 'bag') state.stash.push({ uid: d.uid || (++uidCounter), kind:'bag', bagType:d.bagType, rot: d.rot });
    else state.stash.push({ uid: d.uid || (++uidCounter), kind:'item', defKey:d.defKey, rot:d.rot });
    AudioMgr.sfx('place');
    handled = true;
  } else if (d.source === 'shop'){
    handled = true;
  }

  if (!handled && d.originData){
    const o = d.originData;
    if (o.type === 'item-grid') state.items.push({ ...o.data });
    else if (o.type === 'item-stash') state.stash.push({ ...o.data });
    else if (o.type === 'bag'){
      state.bags.push({ ...o.bag });
      for (const it of o.items){
        const sIdx = state.stash.findIndex(x => x.uid === it.uid);
        if (sIdx >= 0) state.stash.splice(sIdx, 1);
        state.items.push({ ...it });
      }
    } else if (o.type === 'bag-stash') state.stash.push({ ...o.data });
    AudioMgr.sfx('place');
  }

  try { document.body.releasePointerCapture(d.pid); } catch(e){}
  d.ghost.remove(); drag = null; renderAll();
}
function onPointerCancel(ev){
  cleanupDragListeners();
  if (!drag) return;
  const d = drag;
  if (d.originData){
    const o = d.originData;
    if (o.type === 'item-grid') state.items.push({ ...o.data });
    else if (o.type === 'item-stash') state.stash.push({ ...o.data });
    else if (o.type === 'bag'){
      state.bags.push({ ...o.bag });
      for (const it of o.items){
        const sIdx = state.stash.findIndex(x => x.uid === it.uid);
        if (sIdx >= 0) state.stash.splice(sIdx, 1);
        state.items.push({ ...it });
      }
    } else if (o.type === 'bag-stash') state.stash.push({ ...o.data });
  }
  try { document.body.releasePointerCapture(d.pid); } catch(e){}
  d.ghost.remove(); drag = null; renderAll();
}
function cleanupDragListeners(){
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  document.removeEventListener('pointercancel', onPointerCancel);
  stashPanel.classList.remove('drop-hover');
  shopView.classList.remove('sell-hover');
}

function renderPlayerGrid(){
  const inBattle = (state.phase === 'battle' || state.phase === 'result') && state.fP;

function updateHud(){

    else eAvatar.style.display = 'none';
  } else eAvatar.style.display = 'none';

  if (state.enemyChar){
    const ech = CHARACTERS.find(c => c.id === state.enemyChar);
    if (ech) $('enemyTitle').textContent = `👹 對手 #${Math.min(state.round, MAX_ROUND)} · ${ech.name}`;
    else $('enemyTitle').textContent = `👹 對手 #${Math.min(state.round, MAX_ROUND)}`;
  } else {
    $('enemyTitle').textContent = `👹 對手 #${Math.min(state.round, MAX_ROUND)}`;
  }

  let dps = 0;
  const src = state.items;
  for (const it of src){ const d = ITEMS[it.defKey]; if (d && d.dmg) dps += d.dmg/d.cd; }
  for (const it of src){

    if (!d || d.passive !== 'dmg') continue;
    const s1 = getItemDims(d, it.rot);
    for (const o of src){
      const od = ITEMS[o.defKey];
      if (!od || !od.dmg) continue;
      const s2 = getItemDims(od, o.rot);
      if (rectsAdjacent({x:it.x,y:it.y,w:s1.w,h:s1.h},{x:o.x,y:o.y,w:s2.w,h:s2.h})) dps += d.value/od.cd;
    }
  }
  const dpsEl = $('pDps');
  if (!state.items.length && !state.stash.filter(s => s.kind === 'item').length){ dpsEl.textContent = '空背包'; dpsEl.classList.remove('hot'); }
  else { dpsEl.textContent = 'DPS ≈ ' + dps.toFixed(1); dpsEl.classList.toggle('hot', dps > 0); }

  const eDpsEl = $('eDps');
  if (state.fE){
    let ed = 0;
    for (const it of state.fE.items){ const d = it.def; if (d.dmg && !it.used) ed += (d.dmg + it.bonusDmg)/d.cd; }
    eDpsEl.textContent = 'DPS ≈ ' + ed.toFixed(1);
  } else eDpsEl.textContent = '—';

  battleBtn.disabled = state.phase !== 'prepare' || state.items.length === 0;
  refreshBtn.disabled = state.phase !== 'prepare' || state.gold < 1;
}
function updateIdleBars(){
  if (state.phase === 'prepare' || state.phase === 'gameover'){
    setBarWidth('pHpBar','pHpTxt', BASE_HP, BASE_HP, 0);
    setBarWidth('eHpBar','eHpTxt', BASE_HP, BASE_HP, 0);
    $('pStBar').style.width = '100%'; $('eStBar').style.width = '100%';

function setBarWidth(barId, txtId, hp, maxHp, armor){
  const el = $(barId), tx = $(txtId);
  if (!el || !tx) return;
  el.style.width = (maxHp ? Math.max(0,hp/maxHp)*100 : 0) + '%';

}

/* =========================================================
   戰鬥
   ========================================================= */
function buildFighter(bags, items, baseHp){
  const f = {
    hp:baseHp, maxHp:baseHp, armor:0, alive:true, items:[],
    stamina: BASE_STAMINA, maxStamina: BASE_STAMINA, staminaRegen: STAMINA_REGEN,
    burnStacks: 0, burnTimer: 0, riposteDamage: 0,
  };
  for (const b of items){
    const def = ITEMS[b.defKey]; if (!def) continue;
    const s = getItemDims(def, b.rot);
    f.items.push({
      uid:b.uid, defKey:b.defKey, def,
      x:b.x, y:b.y, w:s.w, h:s.h,
      rot: b.rot || 0,
      timer: def.battleStart ? 0 : (def.cd ? def.cd*(0.25+Math.random()*0.75) : 0),
      bonusDmg:0, flash:0, used:false, once: def.once || false,
      hpThreshold: def.hpThreshold || 0, paired: false,
      ammoLeft: def.isAmmo ? def.ammoCount : 0, ammoSpent: false,
    });
  }
  for (const it of f.items){ if (it.def.passive === 'hp'){ f.maxHp += it.def.value; f.hp += it.def.value; } }
  for (const it of f.items){
    if (it.def.passive !== 'dmg') continue;
    for (const o of f.items){ if (o === it || !o.def.dmg) continue; if (rectsAdjacent(it, o)) o.bonusDmg += it.def.value; }
  }
  for (const it of f.items){ if (it.def.riposte) f.riposteDamage += it.def.riposte; }
  for (const it of f.items){
    if (!it.def.pairArmor) continue;
    for (const o of f.items){ if (o === it || !o.def.pairArmor) continue; if (rectsAdjacent(it, o)){ it.paired = true; break; } }
  }
  return f;
}
function triggerItem(it, owner, foe){
  it.flash = 1;
  const def = it.def;
  if (def.dmg){
    let dmg = def.dmg + it.bonusDmg;
    if (def.needsBolt){
      for (const o of owner.items){
        if (!o.def.isAmmo || o.ammoSpent) continue;
        if (rectsAdjacent(it, o)){ o.ammoLeft--; if (o.ammoLeft <= 0) o.ammoSpent = true; dmg += o.def.dmg; break; }
      }
    }
    if (!def.pierce && foe.armor > 0){
      const abs = Math.min(foe.armor, dmg);
      foe.armor -= abs; dmg -= abs;
    }
    if (dmg > 0){
      foe.hp = Math.max(0, foe.hp - dmg);
      if (def.battleStart) AudioMgr.sfx('stone'); else AudioMgr.sfx('hit');
      if (foe.hp <= 0) foe.alive = false;
    }
    if (def.burn){ foe.burnStacks += def.burn; AudioMgr.sfx('burn'); }
    if (def.pairArmor && it.paired){ owner.armor += def.pairArmor; AudioMgr.sfx('armor'); }
    if (foe.riposteDamage > 0 && owner.alive){
      owner.hp = Math.max(0, owner.hp - foe.riposteDamage);
      AudioMgr.sfx('riposte');
      if (owner.hp <= 0) owner.alive = false;
    }
  } else if (def.armor){ owner.armor += def.armor; AudioMgr.sfx('armor'); }
  else if (def.heal){ owner.hp = Math.min(owner.maxHp, owner.hp + def.heal); AudioMgr.sfx('heal'); }
}
function stepBattle(p, e, dt){
  for (const [side, foe] of [[p,e],[e,p]]){
    if (!side.alive) continue;
    side.stamina = Math.min(side.maxStamina, side.stamina + side.staminaRegen * dt);
    if (side.burnStacks > 0){
      side.burnTimer += dt;
      if (side.burnTimer >= 2.0){
        side.burnTimer -= 2.0;
        side.hp = Math.max(0, side.hp - 1);
        side.burnStacks--;
        if (side.hp <= 0) side.alive = false;
      }
    }
    for (const it of side.items){
      if (it.def.isAmmo) continue;
      if (!it.def.cd) continue;
      if (it.once && it.used) continue;
      if (it.hpThreshold && !it.used){
        if (side.hp <= side.maxHp * it.hpThreshold){ it.used = true; triggerItem(it, side, foe); }
        continue;
      }
      it.timer -= dt;
      if (it.timer <= 0){
        const cost = it.def.stamina || 0;
        if (cost > 0 && side.stamina < cost){ it.timer = 0; continue; }
        it.timer = it.def.cd;
        if (cost > 0) side.stamina -= cost;
        if (it.once) it.used = true;
        triggerItem(it, side, foe);
        if (!foe.alive) break;
      }
    }
  }
}
let battleRAF = null, lastT = 0;
function startBattle(){
  if (state.phase !== 'prepare') return;
  if (state.items.length === 0) return;
  state.phase = 'battle'; state.battleTime = 0;
  shopView.style.display = 'none'; enemyView.style.display = '';
  state.fP = buildFighter(state.bags, state.items, BASE_HP);
  state.fE = buildFighter(state.enemyBags, state.enemyItems, BASE_HP);
  computeCell(); renderPlayerGrid(); renderEnemyGrid(); updateHud();
  battleBtn.disabled = true; refreshBtn.disabled = true;
  const ch = CHARACTERS.find(c => c.id === appState.character);
  AudioMgr.playBGM(ch ? ch.music : SONGS.you, BGM_VOL);
  lastT = 0; battleRAF = requestAnimationFrame(battleLoop);
}
function battleLoop(t){
  if (state.phase !== 'battle') return;
  if (!lastT) lastT = t;
  let dt = Math.min((t-lastT)/1000, 0.06);
  lastT = t; state.battleTime += dt;
  stepBattle(state.fP, state.fE, dt);
  if (state.battleTime > 20){
    const fat = (state.battleTime - 20)*3.2*dt;
    state.fP.hp = Math.max(0, state.fP.hp - fat);
    state.fE.hp = Math.max(0, state.fE.hp - fat);
    if (state.fP.hp <= 0) state.fP.alive = false;
    if (state.fE.hp <= 0) state.fE.alive = false;
  }
  updateBars();
  updateCooldowns(state.fP, 'pi-'); updateCooldowns(state.fE, 'ei-');
  if (!state.fP.alive || !state.fE.alive){ endBattle(); return; }
  battleRAF = requestAnimationFrame(battleLoop);
}
function updateBars(){
  const p = state.fP, e = state.fE;
  if (!p || !e) return;
  setBarWidth('pHpBar','pHpTxt', p.hp, p.maxHp, p.armor);
  setBarWidth('eHpBar','eHpTxt', e.hp, e.maxHp, e.armor);
  $('pArBar').style.width = Math.min(100, p.armor/30*100) + '%';
  $('eArBar').style.width = Math.min(100, e.armor/30*100) + '%';
  $('pStBar').style.width = Math.max(0, Math.min(100, p.stamina/p.maxStamina*100)) + '%';
  $('eStBar').style.width = Math.max(0, Math.min(100, e.stamina/e.maxStamina*100)) + '%';
}
function updateCooldowns(f, prefix){
  if (!f) return;
  for (const it of f.items){
    const el = document.getElementById(prefix + it.uid);
    if (!el) continue;
    const mask = el.querySelector('.cdmask');
    if (mask && it.def.cd && !(it.once && it.used)){
      mask.style.height = Math.max(0, Math.min(100, it.timer/it.def.cd*100)) + '%';
    } else if (mask && it.once && it.used){
      mask.style.height = '100%';
      el.classList.add('spent');
    }
    if (it.def.isAmmo && it.ammoSpent) el.classList.add('ammo-spent');
    if (it.flash > 0){ el.classList.add('flash'); it.flash -= 0.09; }
    else el.classList.remove('flash');
  }
}
function tryAddFish(){
  const fishDef = ITEMS.fish;
  const spot = findItemSpot(state.bags, state.items, fishDef);
  if (spot){ state.items.push({ uid: ++uidCounter, defKey:'fish', x:spot.x, y:spot.y, rot:0 }); return true; }
  state.stash.push({ uid: ++uidCounter, kind:'item', defKey:'fish', rot:0 });
  return false;
}
function endBattle(){
  cancelAnimationFrame(battleRAF);
  state.phase = 'result';
  const p = state.fP, e = state.fE;
  const playerWon = e.hp <= 0 && p.hp > 0;
  const draw = p.hp <= 0 && e.hp <= 0;
  let goldGain, title, icon, desc, cls;

  if (playerWon){
    state.streak++; state.sessionTrophies++; appState.trophies++; persistState();
    goldGain = 8 + Math.min(state.streak, 5)*2;
    title = '勝利！'; icon = '🏆'; cls = 'win';
    desc = `擊敗對手 #${Math.min(state.round, MAX_ROUND)}<br>獎勵 <span class="gold-gain">+${goldGain}💰</span>` + (state.streak > 1 ? `<br>🔥 ${state.streak} 連勝` : '');
    AudioMgr.sfx('win');
    for (const it of state.fP.items){
      if (it.def.fishChance && Math.random() < it.def.fishChance){
        if (tryAddFish()) showToast('🎣 釣到了魚！', '🐟', 1500);
      }
    }
  } else if (draw){
    state.streak = 0; state.lives--; goldGain = 5;
    title = '同歸於盡'; icon = '💀'; cls = 'lose';
    desc = `雙方同時倒下……<br>獲得 <span class="gold-gain">+${goldGain}💰</span>`;
    AudioMgr.sfx('lose');
  } else {
    state.streak = 0; state.lives--; goldGain = 5;
    title = '失敗'; icon = '☠️'; cls = 'lose';
    desc = `你被對手擊敗了。<br>安慰獎 <span class="gold-gain">+${goldGain}💰</span>`;
    AudioMgr.sfx('lose');
  }
  state.gold += goldGain; state.round++;
  updateHud();
  document.querySelectorAll('.cdmask').forEach(m => m.style.height = '0%');
  document.querySelectorAll('.item.flash').forEach(m => m.classList.remove('flash'));
  document.querySelectorAll('.item.spent').forEach(m => m.classList.remove('spent'));
  document.querySelectorAll('.item.ammo-spent').forEach(m => m.classList.remove('ammo-spent'));

  const gameOver = state.lives <= 0 || state.round > MAX_ROUND;
  if (gameOver){
    const win = state.lives > 0;
    state.phase = 'gameover';
    modalIcon.textContent = win ? '👑' : '💔';
    modalTitle.textContent = win ? '挑戰完成！' : '挑戰失敗';
    modalTitle.className = win ? 'win' : 'lose';
    modalDesc.innerHTML = (win ? `你撐過了全部 ${MAX_ROUND} 回合<br>剩餘生命 ${state.lives} ❤️<br>最終金幣 <span class="gold-gain">${state.gold}💰</span>` : `你輸掉了所有生命。<br>止步於第 ${state.round - 1} 回合。`) + `<span class="trophy-line">🏆 本局獲得獎盃：${state.sessionTrophies}</span>`;
    modalBtn.textContent = '回到封面';
    modalBtn.onclick = () => { overlay.classList.remove('show'); resetGameState(); showScreen('cover'); };
  } else {
    modalIcon.textContent = icon; modalTitle.textContent = title; modalTitle.className = cls;
    modalDesc.innerHTML = desc + `<span class="trophy-line">🏆 本局獲得獎盃：${state.sessionTrophies}</span>`;
    modalBtn.textContent = '繼續';
    modalBtn.onclick = () => { overlay.classList.remove('show'); nextRound(); };
  }
  overlay.classList.add('show');
}

function nextRound(){
  state.phase = 'prepare'; state.fP = null; state.fE = null;
  state.gold += 6 + Math.floor(state.round/2);
  state.enemyChar = pickRandomEnemyChar();
  state.enemyBags = generateEnemyBags(state.round);
  state.enemyItems = generateEnemyItems(state.enemyBags, state.round, state.enemyChar);
  state.shop = rollShop();
  shopView.style.display = ''; enemyView.style.display = 'none';
  AudioMgr.playBGM(SONGS.shopping, BGM_VOL);
  saveProgressToStorage(); computeCell(); renderAll();
}
function pickRandomEnemyChar(){
  const heroes = ['victor','diczon','cherier','ringo','leo','zoe','terry','rodge','lok','rico'];
  return heroes[Math.floor(Math.random() * heroes.length)];
}
function generateEnemyBags(round){
  const bags = [];
  const cx = Math.floor((GRID_W-2)/2), cy = Math.floor((GRID_H-2)/2);
  bags.push({ uid:++uidCounter, bagType:'square', x:cx, y:cy, rot:0 });
  const extra = Math.min(round-1, 9);
  for (let i=0; i<extra; i++){
    const types = ['small','long','L','square'];
    const type = types[Math.floor(Math.random()*types.length)];
    const spot = findBagSpot(bags, type);
    if (!spot) continue;
    bags.push({ uid:++uidCounter, bagType:type, x:spot.x, y:spot.y, rot:0 });
  }
  return bags;
}
function generateEnemyItems(bags, round, charId){
  const items = [];
  const budget = 9 + round*8;
  let spent = 0, tries = 0;
  const maxCost = 3 + round*1.8;
  const pool = ITEM_KEYS.filter(k => ITEMS[k].cost <= maxCost && isItemAvailable(k, charId));
  if (!pool.length) return items;
  const exclusive = pool.filter(k => ITEMS[k].exclusive);
  while (spent < budget && tries < 400){
    tries++;
    let key;
    if (exclusive.length && Math.random() < 0.25) key = exclusive[Math.floor(Math.random()*exclusive.length)];
    else key = pool[Math.floor(Math.random()*pool.length)];
    const def = ITEMS[key];
    if (spent + def.cost > budget+2) continue;
    const spot = findItemSpot(bags, items, def);
    if (!spot) continue;
    items.push({ uid:++uidCounter, defKey:key, x:spot.x, y:spot.y, rot:0 });
    spent += def.cost;
  }
  return items;
}

function saveProgressToStorage(){
  try {
    const data = { round:state.round, gold:state.gold, lives:state.lives, streak:state.streak, sessionTrophies: state.sessionTrophies, bags:state.bags, items:state.items, stash:state.stash, savedAt: Date.now() };
    localStorage.setItem(STORAGE.progress, JSON.stringify(data));
  } catch(e){}
}
function migrateRot(obj){
  if (obj.rot === undefined) obj.rot = obj.rotated ? 1 : 0;
  return obj;
}
function loadProgressFromStorage(){
  try {
    const raw = localStorage.getItem(STORAGE.progress);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.bags)) return false;
    state.round = d.round ?? 1; state.gold = d.gold ?? START_GOLD;
    state.lives = d.lives ?? MAX_LIVES; state.streak = d.streak ?? 0;
    state.sessionTrophies = d.sessionTrophies ?? 0;
    state.bags = (d.bags || []).map(migrateRot);
    state.items = (d.items || []).map(migrateRot);
    state.stash = (d.stash || []).map(migrateRot);
    state.phase = 'prepare'; state.fP = null; state.fE = null;
    const allUids = [...state.bags.map(b=>b.uid), ...state.items.map(i=>i.uid), ...state.stash.map(s=>s.uid)];
    uidCounter = Math.max(uidCounter, ...allUids, 0);
    return true;
  } catch(e){ return false; }
}
function clearProgress(){ try { localStorage.removeItem(STORAGE.progress); } catch(e){} }
function resetGameState(){
  state.phase='prepare'; state.round=1; state.gold=START_GOLD; state.lives=MAX_LIVES; state.streak=0; state.sessionTrophies=0;
  state.fP=null; state.fE=null; state.bags=[]; state.items=[]; state.stash=[]; state.shop=[]; state.enemyBags=[]; state.enemyItems=[]; state.enemyChar=null;
  clearProgress();
  shopView.style.display = ''; enemyView.style.display = 'none';
}
function newGame(){
  state.phase='prepare'; state.round=1; state.gold=START_GOLD; state.lives=MAX_LIVES; state.streak=0; state.sessionTrophies=0;
  state.fP=null; state.fE=null;
  const bx = Math.floor((GRID_W-2)/2), by = Math.floor((GRID_H-2)/2);
  state.bags = [{ uid:++uidCounter, bagType:'square', x:bx, y:by, rot:0 }];
  state.items = [{ uid:++uidCounter, defKey:'dagger', x:bx, y:by, rot:0 }];
  state.stash = [];
  state.enemyChar = pickRandomEnemyChar();
  state.enemyBags = generateEnemyBags(1);
  state.enemyItems = generateEnemyItems(state.enemyBags, 1, state.enemyChar);
  state.shop = rollShop();
  shopView.style.display = ''; enemyView.style.display = 'none';
}
function settleAndReturn(){
  if (state.phase === 'battle') return;
  AudioMgr.sfx('click');
  const earned = state.sessionTrophies;
  modalIcon.textContent = earned > 0 ? '🏆' : '📊';
  modalTitle.textContent = '結算'; modalTitle.className = '';
  modalDesc.innerHTML = `本局遊戲結束<br>獲得金幣 <span class="gold-gain">${state.gold}💰</span><br>生存回合：${state.round - 1} / ${MAX_ROUND}<span class="trophy-line">🏆 本局獲得獎盃：${earned}</span>`;
  modalBtn.textContent = '回到封面';
  modalBtn.onclick = () => { overlay.classList.remove('show'); resetGameState(); showScreen('cover'); };
  overlay.classList.add('show');
}

function syncMuteButtons(){ const btn = $('btnMute'); btn.textContent = appState.muted ? '🔇' : '🔊'; btn.classList.toggle('muted', appState.muted); AudioMgr.setMuted(appState.muted); }
function toggleMute(){ appState.muted = !appState.muted; syncMuteButtons(); persistState(); if (!appState.muted){ AudioMgr.sfx('click'); if (AudioMgr.bgm && AudioMgr.bgm.paused) AudioMgr.bgm.play().catch(()=>{}); } }
function toggleFullscreen(){
  AudioMgr.sfx('click');
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement){
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(()=>{});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exit) exit.call(document).catch(()=>{});
  }
}
function saveSettingsFile(){
  AudioMgr.sfx('click'); const now = new Date();
  const char = CHARACTERS.find(c => c.id === appState.character);
  const txt = `Backpack Scramble v1.0 存檔\n========================================\n音效設定: ${appState.muted?'關閉':'開啟'}\n總獎盃數: ${appState.trophies}\n選擇角色: ${char ? char.name : '未選擇'}\n儲存時間: ${now.toLocaleString('zh-Hant')}\n========================================\n此檔案可透過遊戲封面「載入」按鈕匯入。\n`;
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `backpack_scramble_save_${now.getTime()}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function loadSettingsFile(){
  AudioMgr.sfx('click');
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.txt,text/plain';
  input.onchange = (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = String(ev.target.result || '');
      const mMatch = text.match(/音效設定[:：]\s*(開啟|關閉)/);
      const tMatch = text.match(/總獎盃數[:：]\s*(\d+)/);
      const cMatch = text.match(/選擇角色[:：]\s*(.+)/);
      if (mMatch) appState.muted = (mMatch[1] === '關閉');
      if (tMatch) appState.trophies = parseInt(tMatch[1], 10) || 0;
      if (cMatch && cMatch[1].trim() !== '未選擇'){ const found = CHARACTERS.find(c => c.name === cMatch[1].trim()); if (found) appState.character = found.id; }
      persistState(); syncMuteButtons();
      $('coverTrophyCount').textContent = appState.trophies;
      if (appState.screen === 'select'){ $('selectTrophyCount').textContent = appState.trophies; initCharScroller(); }
      AudioMgr.sfx('unlock'); alert('載入成功！');
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
}
function resetAllData(){
  AudioMgr.sfx('click');
  if (!confirm('確定要重設所有資料嗎？\n這會清除音效設定、獎盃數與遊戲進度。')) return;
  try { Object.values(STORAGE).forEach(k => localStorage.removeItem(k)); } catch(e){}
  appState.muted = false; appState.trophies = 0; appState.character = null;
  resetGameState(); syncMuteButtons();
  $('coverTrophyCount').textContent = 0;
  if (appState.screen === 'select'){ $('selectTrophyCount').textContent = 0; initCharScroller(); }
  alert('已重設完成。');
}

function bindEvents(){
  $('btnStartGame').addEventListener('click', () => { AudioMgr.sfx('click'); AudioMgr.ensureCtx(); showScreen('select'); });
  $('btnSave').addEventListener('click', saveSettingsFile);
  $('btnLoad').addEventListener('click', loadSettingsFile);
  $('btnResetData').addEventListener('click', resetAllData);
  $('btnBackCover').addEventListener('click', () => { AudioMgr.sfx('click'); showScreen('cover'); });
  $('btnConfirmChar').addEventListener('click', () => {
    if (!appState.character) return;
    AudioMgr.sfx('click'); AudioMgr.ensureCtx();
    if (!loadProgressFromStorage()) newGame();
    showScreen('game');
    AudioMgr.playBGM(SONGS.shopping, BGM_VOL);
    computeCell(); renderAll();
  });
  refreshBtn.addEventListener('click', () => {
    if (state.phase !== 'prepare' || state.gold < 1) return;
    state.gold -= 1; state.shop = rollShop();
    AudioMgr.sfx('click'); renderShop(); updateHud();
  });
  battleBtn.addEventListener('click', () => { AudioMgr.sfx('click'); startBattle(); });
  $('btnSettle').addEventListener('click', settleAndReturn);
  $('btnMute').addEventListener('click', toggleMute);
  $('btnFs').addEventListener('click', toggleFullscreen);

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('pointermove', (e) => { lastPointerX = e.clientX; lastPointerY = e.clientY; }, { passive: true });
  document.addEventListener('pointerdown', (ev) => {
    if (drag && drag.pid !== ev.pointerId){ ev.preventDefault(); ev.stopPropagation(); rotateDuringDrag(); }
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' '){ if (drag){ e.preventDefault(); rotateDuringDrag(); } }
  });
  document.addEventListener('mousemove', onScrollerMouseMove);
  document.addEventListener('mouseup', onScrollerMouseUp);

  let lastTouch = 0;
  document.addEventListener('touchend', (e) => { const now = Date.now(); if (now - lastTouch < 300) e.preventDefault(); lastTouch = now; }, { passive:false });

  window.addEventListener('resize', () => {
    computeCell();
    if (appState.screen === 'game') renderAll();
    if (appState.screen === 'select'){ measureSetWidth(); requestAnimationFrame(() => syncCenterFromScroll(true)); }
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      computeCell();
      if (appState.screen === 'game') renderAll();
      if (appState.screen === 'select'){ measureSetWidth(); syncCenterFromScroll(true); }
    }, 220);
  });
}

function bootAudio(){
  const src = SONGS.openBag;
  const a = new Audio(src);
  a.loop = true; a.volume = BGM_VOL; a.muted = appState.muted;
  a.addEventListener('error', () => console.warn('[BGM 缺失]', src));
  const tryPlay = () => {
    const p = a.play();
    if (!p || !p.then){ AudioMgr.bgm = a; AudioMgr.currentSrc = src; return Promise.resolve(); }
    return p.then(() => { AudioMgr.bgm = a; AudioMgr.currentSrc = src; });
  };
  tryPlay().catch(() => {
    const resume = () => { tryPlay().catch(()=>{}); document.removeEventListener('pointerdown', resume); document.removeEventListener('click', resume); document.removeEventListener('keydown', resume); document.removeEventListener('touchstart', resume); };
    document.addEventListener('pointerdown', resume, { once:false });
    document.addEventListener('click', resume, { once:false });
    document.addEventListener('keydown', resume, { once:false });
    document.addEventListener('touchstart', resume, { once:false });
  });
}

function boot(){
  restoreState(); computeCell(); initCover(); syncMuteButtons(); bindEvents(); bootAudio(); showScreen('cover');
}
boot();
</script>
