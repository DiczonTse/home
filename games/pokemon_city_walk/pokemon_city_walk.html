function pickRandomCandySource(excludeName) {
  const names = Object.keys(candyBag).filter(n => n !== excludeName && (candyBag[n] || 0) > 0);
  if (!names.length) return null;
  const name = names[Math.floor(Math.random() * names.length)];
  return { name, amount: candyBag[name] };
}

function openNPCExchange(npc) {
  if (catchState !== 'idle') return;
  if (npcExchangeLocked) return;

  const { emoji, trade } = npc;
  const npcMon = POKEDEX.find(p => p.name === trade.npcName);
  const candySource = pickRandomCandySource(trade.npcName);
  npc.candySource = candySource;
  const isEvo = trade.kind === 'evo';

  npcTitle.textContent = `${emoji} 交換`;
  npcSub.textContent = isEvo
    ? 'NPC 願意與你交換精靈（交換後會進化）'
    : 'NPC 願意與你交換精靈（隨機精靈，消耗 1 顆糖果）';

  npcCardName.textContent = trade.npcName;
  const spriteId = trade.spriteId || (npcMon && npcMon.id);
  const spriteMon = npcMon || (spriteId ? POKEDEX.find(x => x.id === spriteId) : null) || (spriteId ? { id: spriteId } : null);

  if (spriteMon) {
    npcCardImg.src = spriteUrl(spriteMon, false);
    npcCardImg.style.display = '';
    npcCardFallback.style.display = 'none';
    npcCardImg.onerror = () => {
      npcCardImg.style.display = 'none';
      npcCardFallback.style.display = '';
      npcCardFallback.textContent = '❓';
    };
  } else {
    npcCardImg.style.display = 'none';
    npcCardFallback.style.display = '';
    npcCardFallback.textContent = '❓';
  }

  if (candySource) {
    const srcMon = POKEDEX.find(p => p.name === candySource.name);
    playerCardName.textContent = `${candySource.name}糖果`;
    if (srcMon) {
      playerCardImg.src = spriteUrl(srcMon, false);
      playerCardImg.style.display = '';
      playerCardFallback.style.display = 'none';
      playerCardImg.onerror = () => {
        playerCardImg.style.display = 'none';
        playerCardFallback.style.display = '';
        playerCardFallback.textContent = '🍬';
      };
    } else {
      playerCardImg.style.display = 'none';
      playerCardFallback.style.display = '';
      playerCardFallback.textContent = '🍬';
    }
    npcOwnLabel.textContent = `${candySource.amount} 顆`;
    npcOwnLabel.classList.toggle('ok', candySource.amount >= trade.candyCost);
    npcOwnLabel.classList.toggle('lack', candySource.amount < trade.candyCost);
  } else {
    playerCardName.textContent = '沒有可交換的糖果';
    playerCardImg.style.display = 'none';
    playerCardFallback.style.display = '';
    playerCardFallback.textContent = '🍬';
    npcOwnLabel.textContent = '0 顆';
    npcOwnLabel.classList.remove('ok');
    npcOwnLabel.classList.add('lack');
  }

  npcCostLabel.textContent = `${trade.candyCost} 顆`;
  npcEvoLineLabel.textContent = isEvo ? '交換後進化為' : '交換後獲得';
  npcEvoLabel.textContent = isEvo ? trade.to : trade.npcName;

  const enough = !!candySource && candySource.amount >= trade.candyCost;
  npcConfirmBtn.disabled = !enough;
  npcConfirmBtn.textContent = enough
    ? '確認交換'
    : (candySource ? `糖果不足（需要 ${trade.candyCost} 顆）` : '沒有可交換的糖果');

  npcScreen.classList.remove('hidden');
  SFX.init();
  audio.init();
  audio.playTrade();
}

npcConfirmBtn.addEventListener('click', () => {
  if (!currentNPC) return;
  const { trade, candySource } = currentNPC;
  if (!candySource || candySource.amount < trade.candyCost) return;
  if (npcExchangeLocked) return;

  npcExchangeLocked = true;
  npcScreen.classList.add('hidden');

  const npcMon = POKEDEX.find(p => p.name === trade.npcName);
  const playerMon = POKEDEX.find(p => p.name === candySource.name);

  playTradeAnimation(npcMon, playerMon, trade, candySource, () => {

    if (candyBag[candySource.name] < 0) candyBag[candySource.name] = 0;
    clearNPC();

    const finish = (msg) => {
      caughtCount++;
      updateHUD();
      autoSave();
      toast(msg, 3000);
      npcExchangeLocked = false;
      if (gameStarted) audio.playMap(env.time);
    };

      playNPCEvolutionAnimation(trade.npcName, trade.to, trade.evoSpriteId, () => {

          dexState[trade.to].caught++;

        if (dexState[trade.npcName]) dexState[trade.npcName].seen = 1;
        finish(`🔄 交換成功！${trade.npcName} 進化成 ${trade.to}！`);
      });
    } else {
      if (dexState[trade.npcName]) {
        dexState[trade.npcName].seen = 1;
        dexState[trade.npcName].caught++;
      }
      finish(`🔄 交換成功！獲得 ${trade.npcName}！`);
    }
  });
});

function resetBallPosition(animate) {
  ensureUsableBall();
  const totalAll = getTotalBalls();
  ballFly.className = 'pokeball ball-' + currentBall;
  if (totalAll === 0) {
    ballFly.style.display = 'none';
    return;
  }
  ballFly.style.display = 'block';

  const w = catchStage.clientWidth;
  const h = catchStage.clientHeight;
  ballHome.x = w / 2 - BALL_SIZE / 2;
  ballHome.y = h - 88;
  ballFly.style.opacity = '1';
  ballFly.style.filter = '';
  ballFly.style.transition = animate
    ? 'transform .28s cubic-bezier(.3,.8,.4,1), opacity .28s' : 'none';
  ballFly.style.transform = `translate(${ballHome.x}px, ${ballHome.y}px) rotate(0deg)`;
}

function setBallTransform(x, y, rot) {
  ballFly.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
}

function updateGroundLine() {
  if (!catchStage || !catchScreen) return;
  const stageH = catchStage.clientHeight;
  if (!stageH) return;
  const monH = 180;
  const monTopInStage = (stageH - monH) / 2;
  const pct = Math.max(22, Math.min(72, (monTopInStage / stageH) * 100));
  catchScreen.style.setProperty('--groundY', pct + '%');
}

function hideAimArc() { if (aimArc) aimArc.classList.remove('on'); }

function drawAimArc(dirSign) {
  if (!aimArc) return;
  const stageRect = catchStage.getBoundingClientRect();
  const monRect   = wildMon.getBoundingClientRect();
  const tx = monRect.left - stageRect.left + monRect.width  / 2;
  const ty = monRect.top  - stageRect.top  + monRect.height / 2 - 14;
  const sx = swipe.startX;
  const sy = swipe.startY;
  const dx = tx - sx;
  const dy = ty - sy;
  const len = Math.hypot(dx, dy) || 1;
  const px = -dy / len;
  const py =  dx / len;
  const off = dirSign * Math.min(len * 0.34, 150);
  const cx = (sx + tx) / 2 + px * off;
  const cy = (sy + ty) / 2 + py * off;
  aimArcPath.setAttribute('d', `M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`);
  const ax = 2 * (tx - cx);
  const ay = 2 * (ty - cy);
  const al = Math.hypot(ax, ay) || 1;
  const ux = ax / al;
  const uy = ay / al;
  const hl = 18, hw = 10;
  const bx = tx - ux * hl;
  const by = ty - uy * hl;
  const nx = -uy, ny = ux;
  aimArrowHead.setAttribute('points',
    `${tx},${ty} ${bx + nx * hw},${by + ny * hw} ${bx - nx * hw},${by - ny * hw}`);
  aimArc.classList.add('on');
}
let confirmMasterPending = false;
function renderCatchBallSelector() {
  const box = document.getElementById('catchBalls');
  if (!box) return;

  const totalAll = getTotalBalls();
  if (totalAll === 0) {
    box.innerHTML = '';
    return;
  }

  const order = ['poke', 'great', 'ultra', 'master'];
  box.innerHTML = order.map(t => {
    const n = ballInventory[t] || 0;
    const active = (t === currentBall);
    const disabled = (n <= 0) || !(catchState === 'aim' && !ballFlying);
    return `
      <button class="catch-ball-btn ${active ? 'active' : ''}"
              data-ball="${t}"
              ${disabled ? 'disabled' : ''}
              title="${BALL_TYPES[t].name}${n > 0 ? ' ×' + n : ''}">
        <span class="cb-icon ball-${t}"></span>
        <span class="cb-count">${n}</span>
      </button>`;
  }).join('');

  box.querySelectorAll('.catch-ball-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      const t = btn.dataset.ball;
      switchCatchBall(t);
    });
  });
}

async function switchCatchBall(t) {
  if (catchState !== 'aim' || ballFlying) return;
  if (t === currentBall) return;
  if ((ballInventory[t] || 0) <= 0) {
    toast(`${BALL_TYPES[t].name}已用完`);
    return;
  }

  /* 大師球二次確認 */
  if (t === 'master' && !confirmMasterPending) {
    confirmMasterPending = true;
    const ok = await showConfirm({
      icon: '🟣',
      title: '使用大師球？',
      message: `大師球必定捕獲，目前剩餘 ${ballInventory.master} 顆。\n確定要使用嗎？`,
      okText: '使用',
      cancelText: '取消',
    });
    confirmMasterPending = false;
    if (!ok) return;
  }

  currentBall = t;
  if (ballFly) ballFly.className = 'pokeball ball-' + currentBall;
  updateHUD();
  renderCatchBallSelector();
  SFX.init();
  SFX.bubble();
  toast(`已切換為 ${BALL_TYPES[t].name}`);
}
function updateCatchItemUI() {
  const pEl = document.getElementById('itemCountPineapple');
  const gEl = document.getElementById('itemCountGrape');
  if (pEl) pEl.textContent = itemInventory.pineapple || 0;
  if (gEl) gEl.textContent = itemInventory.grape || 0;

  const canUse = (catchState === 'aim') && !ballFlying;

  document.querySelectorAll('.catch-item-btn').forEach(btn => {
    const t = btn.dataset.item;
    const n = itemInventory[t] || 0;
    const active = (t === 'pineapple' && catchEffect.extraCandy > 0) ||
                   (t === 'grape' && catchEffect.fleeReduction);
    btn.classList.toggle('active', active);
    btn.disabled = n === 0 || active || !canUse;
  });
  renderCatchBallSelector();
}

function showEffectBadge(text) {
  if (!catchEffectsEl) return;
  const b = document.createElement('div');
  b.className = 'catch-effect-badge';
  b.textContent = text;
  catchEffectsEl.appendChild(b);
}

function clearEffectBadges() {
  if (catchEffectsEl) catchEffectsEl.innerHTML = '';
}

function resetCatchEffect() {
  catchEffect = { extraCandy: 0, fleeReduction: false };
  clearEffectBadges();
  updateCatchItemUI();
}

function useCatchItem(type) {
  if (catchState !== 'aim') return;
  if (!catchEffect) catchEffect = { extraCandy: 0, fleeReduction: false };
  if ((itemInventory[type] || 0) <= 0) {
    toast(`沒有${ITEMS[type].name}`);
    return;
  }

  itemInventory[type]--;
  if (type === 'pineapple') {
    catchEffect.extraCandy = 1;
    showEffectBadge('🍍 捕獲糖果+1');
  } else if (type === 'grape') {
    catchEffect.fleeReduction = true;
    showEffectBadge('🍇 降低逃跑機率');
  }

  SFX.init();
  SFX.itemUse();
  updateHUD();
  autoSave();
  toast(`已使用${ITEMS[type].name}，變回手拿精靈球`);
}

document.querySelectorAll('.catch-item-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    const t = btn.dataset.item;
    useCatchItem(t);
  });
});

function openCatch(p, marker, shiny) {
  if (catchState !== 'idle') return;
  catchState = 'aim';
  currentSpawn = { p, marker, shiny };
  catchEffect = { extraCandy: 0, fleeReduction: false };
  clearEffectBadges();

  ensureUsableBall();
  ballFly.className = 'pokeball ball-' + currentBall;
  const totalAll = getTotalBalls();
  if (totalAll === 0) ballFly.style.display = 'none';
  else ballFly.style.display = 'block';

  catchScreen.classList.toggle('day', env.time === 'day');
  catchScreen.classList.toggle('night', env.time === 'night');
  buildStars();

  const nameEl = document.getElementById('catchName');
  nameEl.textContent = shiny ? `✨ 異色 ${p.name} ✨` : `野生的 ${p.name}`;
  nameEl.classList.toggle('shiny', !!shiny);

  monBody.classList.toggle('shiny', !!shiny);
  monBody.innerHTML = '';

  const img = document.createElement('img');
  img.src = spriteUrl(p, shiny);
  img.alt = p.name;
  img.draggable = false;
  if (spriteIsPng(p)) img.classList.add('png-big');
  img.onerror = () => {
    if (!img.dataset.fb) {
      img.dataset.fb = '1';
      img.src = staticSpriteUrl(p, shiny);
      img.classList.add('png-big');
      return;
    }
    img.remove();
    const s = document.createElement('span');
    s.className = 'mon-fallback';
    s.textContent = '❓';
    monBody.appendChild(s);
  };
  monBody.appendChild(img);

  wildMon.classList.remove('absorbed');

  catchResult.textContent = '';
  swipeHint.style.display = '';
  powerWrap.style.display = 'none';
  powerFill.style.width = '0%';
  trail.style.display = 'none';
  hideAimArc();
  ballFlying = false;
  lastThrow = null;

  updateHUD();
  renderCatchBallSelector();
  catchScreen.classList.remove('hidden');
  syncCatchWeather();

  requestAnimationFrame(() => {
    resetBallPosition(false);
    updateGroundLine();
  });

  audio.init();
  audio.playCatch(env.time);
  SFX.init();
}

function closeCatch() {
  catchScreen.classList.add('hidden');
  catchState = 'idle';
  renderCatchBallSelector();
  currentSpawn = null;
  ballFlying = false;
  catchEffect = { extraCandy: 0, fleeReduction: false };
  clearEffectBadges();
  resetSwipe();
  hideAimArc();

  CatchWeatherFX.setMode('none');
  const fogEl = document.getElementById('catchFogLayer');
  if (fogEl) fogEl.classList.remove('on');

  wildMon.classList.remove('absorbed');
  wildMon.classList.remove('fleeing');
  ballFly.style.opacity = '1';
  ballFly.style.filter = '';

  if (gameStarted) audio.playMap(env.time);
}

function resetSwipe() {
  swipe.active = false;
  swipe.pointerId = null;
  trail.style.display = 'none';
  hideAimArc();
  powerWrap.style.display = 'none';
  powerFill.style.width = '0%';
}

function showResult(text, color) {
  catchResult.textContent = text;
  catchResult.style.color = color || '#fff';
}

catchStage.addEventListener('pointerdown', onPointerDown);
catchStage.addEventListener('pointermove', onPointerMove);
catchStage.addEventListener('pointerup', onPointerUp);
catchStage.addEventListener('pointercancel', onPointerUp);

function onPointerDown(e) {
  if (e.target.closest('.catch-item-btn')) return;
  if (catchState !== 'aim' || ballFlying) return;

  if (!ensureUsableBall()) {
    showResult('沒有精靈球了！去補給站補給或離開', '#ff8a8a');
    return;
  }

  const rect = catchStage.getBoundingClientRect();
  swipe.active = true;
  swipe.pointerId = e.pointerId;
  swipe.startX = e.clientX - rect.left;
  swipe.startY = e.clientY - rect.top;
  swipe.curX = swipe.startX;
  swipe.curY = swipe.startY;

  try { catchStage.setPointerCapture(e.pointerId); } catch(_) {}

  swipeHint.style.display = 'none';
  powerWrap.style.display = 'block';
  powerFill.style.width = '0%';
  ballFly.style.transition = 'none';
  e.preventDefault();
}

function onPointerMove(e) {
  if (!swipe.active || e.pointerId !== swipe.pointerId) return;
  const rect = catchStage.getBoundingClientRect();
  swipe.curX = e.clientX - rect.left;
  swipe.curY = e.clientY - rect.top;
  drawTrail();
  updatePowerBar();
  const dx = swipe.curX - swipe.startX;
  const dy = swipe.curY - swipe.startY;
  setBallTransform(ballHome.x + dx * 0.12, ballHome.y + dy * 0.12, dx * 0.25);
  e.preventDefault();
}

function onPointerUp(e) {
  if (!swipe.active || e.pointerId !== swipe.pointerId) return;
  swipe.active = false;
  trail.style.display = 'none';
  hideAimArc();
  powerWrap.style.display = 'none';
  evaluateSwipe();
}

function drawTrail() {
  const dx = swipe.curX - swipe.startX;
  const dy = swipe.curY - swipe.startY;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  const absAng = Math.abs(ang + 90);
  const isCurve = dy < -12 && absAng > 22 && absAng < 62;
  if (isCurve) {
    trail.style.display = 'none';
    drawAimArc(Math.sign(dx) || 1);
    return;
  }
  hideAimArc();
  if (len < 1) { trail.style.display = 'none'; return; }
  trail.style.display = 'block';
  trail.style.left  = swipe.startX + 'px';
  trail.style.top   = (swipe.startY - 2) + 'px';
  trail.style.width = len + 'px';
  trail.style.transform = `rotate(${ang}deg)`;
  trail.style.background = 'linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.9))';
}

function updatePowerBar() {
  const dx = swipe.curX - swipe.startX;
  const dy = swipe.curY - swipe.startY;
  const len = Math.hypot(dx, dy);
  const h = catchStage.clientHeight || 1;
  const p = Math.min(1, len / (h * 0.75));
  powerFill.style.width = (p * 100) + '%';
}

function evaluateSwipe() {
  if (catchState !== 'aim') return;
  const dx = swipe.curX - swipe.startX;
  const dy = swipe.curY - swipe.startY;
  const len = Math.hypot(dx, dy);
  const goHome = (msg) => {
    if (msg) showResult(msg, '#ffd166');
    ballFly.style.transition = 'transform .28s cubic-bezier(.3,.8,.4,1)';
    setBallTransform(ballHome.x, ballHome.y, 0);
    ballFlying = false;
  };
  if (len < 24) { goHome(); return; }
  if (dy >= -24) { goHome('請向上滑動投球 ↑'); return; }
  const angle = Math.atan2(Math.abs(dx), -dy) * 180 / Math.PI;
  if (angle > 62) { goHome('角度太斜了，請朝上方滑動'); return; }
  const ballType = angle <= 22 ? 'straight' : 'curve';
  const h = catchStage.clientHeight || 1;
  const power = len / h;
  let quality;
  if (power < 0.18)       quality = 'low';
  else if (power < 0.32)  quality = 'weak';
  else if (power <= 0.55) quality = 'perfect';
  else if (power <= 0.78) quality = 'strong';
  else                    quality = 'high';
  performThrow(ballType, quality, angle, power);
}

function performThrow(ballType, quality, angle, power) {
  catchState = 'flying';
  ballFlying = true;
  ballInventory[currentBall] = Math.max(0, (ballInventory[currentBall] || 0) - 1);
  updateHUD();
  swipeHint.style.display = 'none';

  SFX.resume();
  SFX.throwBall();

  const stageRect = catchStage.getBoundingClientRect();
  const monRect = wildMon.getBoundingClientRect();
  const monCx = monRect.left - stageRect.left + monRect.width / 2;
  const monCy = monRect.top  - stageRect.top  + monRect.height / 2 - 14;

  const isMiss = (quality === 'low' || quality === 'high');
  const curveSlip = (ballType === 'curve' && !isMiss && Math.random() < CURVE_SLIP_CHANCE);
  const finalMiss = isMiss || curveSlip;

  let targetCx = monCx;
  let targetCy = monCy;

  if (curveSlip) {
    const side = Math.random() < 0.5 ? -1 : 1;
    targetCx = monCx + side * (110 + Math.random() * 90);
    targetCy = monCy + (Math.random() * 160 - 80);
  } else if (quality === 'low')        { targetCy = monCy + 150; targetCx = monCx + (Math.random()*70-35); }
  else if (quality === 'high')         { targetCy = monCy - 190; targetCx = monCx + (Math.random()*70-35); }
  else if (quality === 'weak')         { targetCy = monCy + 38; }
  else if (quality === 'strong')       { targetCy = monCy - 38; }

  const targetX = targetCx - BALL_SIZE / 2;
  const targetY = targetCy - BALL_SIZE / 2;

  const dirSign = Math.sign(swipe.curX - swipe.startX) || 1;
  let curveOffset = 0;
  if (ballType === 'curve') {
    const ddx = targetX - ballHome.x;
    const ddy = targetY - ballHome.y;
    const dist = Math.hypot(ddx, ddy) || 1;
    curveOffset = dirSign * dist * 0.38;
  }

  const spinDir = dirSign;
  const duration = 520;
  lastThrow = { ballType, quality, angle, power, targetX, targetY, spinDir };

  flyBall(targetX, targetY, spinDir, curveOffset, duration, () => {
    SFX.hit();

    if (finalMiss) {
      ballFly.style.transition = 'transform .32s ease-in, opacity .32s';
      setBallTransform(
        targetX + dirSign * 70,
        targetY + (curveSlip ? 130 : (quality === 'low' ? 140 : -140)),
        spinDir * 1080
      );
      ballFly.style.opacity = '0';
      showResult(
        curveSlip ? '🌀 旋轉球失手，球飛歪了…'
          : (quality === 'low' ? '力道太輕，球沒飛到…' : '力道過猛，球飛過頭了！'),
        '#ff8a8a'
      );
      setTimeout(() => {
        ballFlying = false;
        if (catchState === 'flying') {
          catchState = 'aim';
          swipeHint.style.display = '';
          resetBallPosition(true);
          updateCatchItemUI();
        }
      }, 340);
      return;
    }

    wildMon.classList.add('absorbed');
    setTimeout(() => {
      wobbleBall(targetX, targetY, spinDir * 720, () => {
        resolveCatch();
      });
    }, 240);
  });
}

function flyBall(targetX, targetY, spinDir, curveOffset, duration, onDone) {
  const startX = ballHome.x;
  const startY = ballHome.y;
  const midX = (startX + targetX) / 2;
  const midY = (startY + targetY) / 2;
  let cpX = midX, cpY = midY;
  if (curveOffset !== 0) {
    const dx = targetX - startX;
    const dy = targetY - startY;
    const len = Math.hypot(dx, dy) || 1;
    const perpX = -dy / len;
    const perpY =  dx / len;
    cpX = midX + perpX * curveOffset;
    cpY = midY + perpY * curveOffset;
  }
  ballFly.style.transition = 'none';
  const startTime = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const ease = t * t * (3 - 2 * t);
    const om = 1 - ease;
    const x = om*om*startX + 2*om*ease*cpX + ease*ease*targetX;
    const y = om*om*startY + 2*om*ease*cpY + ease*ease*targetY;
    const rot = ease * 720 * spinDir;
    setBallTransform(x, y, rot);
    if (t < 1) requestAnimationFrame(step);
    else onDone();
  }
  requestAnimationFrame(step);
}

function wobbleBall(baseX, baseY, baseRot, onDone) {
  const TOTAL = 3;
  const WOBBLE_DUR = 480;
  const PAUSE_DUR  = 340;
  let count = 0;
  function doWobble() {
    if (count >= TOTAL) { onDone(); return; }
    SFX.wobble(count);
    const startTime = performance.now();
    const dir = (count % 2 === 0) ? 1 : -1;
    function step(now) {
      const t = Math.min(1, (now - startTime) / WOBBLE_DUR);
      const phase = t * Math.PI * 2;
      const damp = 1 - t * 0.4;
      const wobbleX = Math.sin(phase) * 12 * damp * dir;
      const tilt    = Math.sin(phase) * 18 * damp * dir;
      setBallTransform(baseX + wobbleX, baseY, baseRot + tilt);
      if (t < 1) requestAnimationFrame(step);
      else {
        setBallTransform(baseX, baseY, baseRot);
        count++;
        if (count < TOTAL) setTimeout(doWobble, PAUSE_DUR);
        else setTimeout(onDone, PAUSE_DUR + 180);
      }
    }
    requestAnimationFrame(step);
  }
  setTimeout(doWobble, 260);
}

function showCatchStars() {
  const stageRect = catchStage.getBoundingClientRect();
  const ballRect  = ballFly.getBoundingClientRect();
  const baseX = ballRect.right - stageRect.left - 4;
  const baseY = ballRect.top  - stageRect.top  + 4;
  const offsets = [ { dx: 26, dy: -30 }, { dx: 54, dy: -54 }, { dx: 82, dy: -38 } ];
  offsets.forEach((o, i) => {
    const star = document.createElement('div');
    star.className = 'catch-star';
    star.textContent = '✦';
    star.style.left = baseX + 'px';
    star.style.top  = baseY + 'px';
    star.style.setProperty('--dx', o.dx + 'px');
    star.style.setProperty('--dy', o.dy + 'px');
    star.style.animationDelay = (i * 0.1) + 's';
    catchStage.appendChild(star);
    setTimeout(() => star.remove(), 1600);
  });
}

function resolveCatch() {
  if (!currentSpawn) return;
  const { p, marker, shiny } = currentSpawn;
  const info = lastThrow || { ballType:'straight', quality:'perfect', spinDir:1,
                              targetX: ballHome.x, targetY: ballHome.y };

  /* 讀取效果（不立即清除，等成功或逃走才消耗） */
  const extraCandy = catchEffect.extraCandy || 0;
  const fleeReduction = catchEffect.fleeReduction || false;

  let mult = 1;
  if (info.quality === 'perfect') mult *= 1.25;
  else if (info.quality === 'weak' || info.quality === 'strong') mult *= 0.78;
  if (info.ballType === 'curve') mult *= CURVE_SUCCESS_MULT;

  let chance;
  if (currentBall === 'master') {
    chance = 1;
  } else {
    const ballMult = (BALL_TYPES[currentBall] && BALL_TYPES[currentBall].catchMult) || 1;
    chance = Math.min(0.95, p.rate * mult * ballMult);
  }
  const success = Math.random() < chance;

  if (success) {
    catchState = 'caught';
    caughtCount++;
    const firstTime = dexState[p.name].caught === 0;
    dexState[p.name].caught++;
    if (shiny) dexState[p.name].shiny++;

    const candyGain = 1 + extraCandy;
    addCandy(p.name, candyGain);

    /* 捕獲成功 → 消耗效果 */
    catchEffect = { extraCandy: 0, fleeReduction: false };
    clearEffectBadges();

    updateHUD();
    autoSave();

    SFX.caught();
    audio.stopCatch();
    showCatchStars();

    const candyMsg = `　🍬 +${candyGain} ${p.name} 糖果`;
    const usedName = BALL_TYPES[currentBall].name;
    const itemMsg = extraCandy > 0 ? ' 🍍' : '';

    if (firstTime) {
      showResult(shiny
        ? `✨ 首次捕獲異色 ${p.name}！（${usedName}）${itemMsg}${candyMsg}`
        : `Gotcha！首次捕獲 ${p.name}！（${usedName}）${itemMsg}${candyMsg}`, '#ffd166');
    } else {
      showResult(shiny
        ? `✨ 異色 ${p.name}！（${usedName}）${itemMsg}${candyMsg}`
        : `Gotcha！${p.name}！（${usedName}）${itemMsg}${candyMsg}`, '#7CFC9A');
    }

    if (shiny) toast(`✨ 太幸運了！異色 ${p.name} 入手！`, 2800);

    if (map.hasLayer(marker)) map.removeLayer(marker);
    spawnMarkers = spawnMarkers.filter(m => m !== marker);

    ballFly.style.filter = shiny
      ? 'brightness(2) drop-shadow(0 0 20px #ffd166)'
      : 'brightness(1.8) drop-shadow(0 0 16px #ffd166)';
    setTimeout(() => { ballFly.style.filter = ''; }, 320);

    setTimeout(closeCatch, 1900);
  } else {
    catchState = 'fail';
    wildMon.classList.remove('absorbed');
    SFX.catchFail();

    ballFly.style.transition = 'transform .3s ease-in, opacity .3s';
    ballFly.style.opacity = '0';

    const fleeChance = fleeReduction ? 0.10 : 0.35;

    if (Math.random() < fleeChance) {
      /* 精靈逃走 → 消耗效果 */
      catchEffect = { extraCandy: 0, fleeReduction: false };
      clearEffectBadges();

      showResult(`可惜！${p.name} 逃走了…`, '#ff8a8a');
      wildMon.classList.add('fleeing');
      SFX.flee();
      setTimeout(() => {
        wildMon.classList.remove('fleeing');
        if (map.hasLayer(marker)) map.removeLayer(marker);
        spawnMarkers = spawnMarkers.filter(m => m !== marker);
        closeCatch();
      }, 900);
    } else {
      /* 精靈沒逃走 → 保留效果讓玩家再試 */
      showResult(fleeReduction
        ? '差一點！（🍇 提子生效，精靈沒逃走）'
        : '差一點！再試一次', '#ffd166');
      ballFly.style.transition = 'transform .32s ease-in, opacity .32s';
      setBallTransform(info.targetX, info.targetY + 240, info.spinDir * 1080);
      ballFly.style.opacity = '0';
      setTimeout(() => {
        ballFlying = false;
        if (catchState === 'fail') {
          catchState = 'aim';
          swipeHint.style.display = '';
          resetBallPosition(true);
          updateCatchItemUI();
        }
      }, 360);
    }
  }
}

document.getElementById('fleeBtn').addEventListener('click', () => {
  if (catchState === 'flying') return;
  closeCatch();
});

/* =========================================================
   12. 補給站
   ========================================================= */
const stopScreen = document.getElementById('stopScreen');
const stopStage  = document.getElementById('stopStage');
const stopDisc   = document.getElementById('stopDisc');
const stopHint   = document.getElementById('stopHint');
const stopReward = document.getElementById('stopReward');

const stopSwipe = { active:false, id:null, x0:0, y0:0, x:0, y:0 };

function coinTransform(deg) { return `rotateX(10deg) rotateY(${deg}deg)`; }

function openStop(marker) {
  if (catchState !== 'idle') return;
  if (marker._used) { toast('這個補給站已經補給過了，等刷新吧'); return; }
  currentStopMarker = marker;
  stopReward.innerHTML = '';
  stopHint.textContent = '← 在硬幣上橫掃 →';
  stopHint.style.animation = '';
  stopDisc.style.transition = 'none';
  stopDisc.style.transform = coinTransform(discRot);
  stopScreen.classList.remove('hidden');
  SFX.init();
}

function markStopUsed(marker) {
  marker._used = true;
  const el = marker.getElement();
  if (el) {
    const d = el.querySelector('.stop');
    if (d) { d.classList.add('used'); d.textContent = '✓'; }
  }
}

function showBallBubble(gain) {
  SFX.bubble();
  const b = document.createElement('div');
  b.className = 'ball-bubble';
  b.innerHTML = `<span class="bub-txt">+${gain}</span>`;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 1750);
}

function spinStop() {
  if (spinning) return;
  const marker = currentStopMarker;
  if (!marker || marker._used) return;

  spinning = true;
  stopHint.textContent = '補給中…';
  SFX.spin();
  SFX.coinSpin();

  discRot += 1080 + Math.floor(Math.random() * 720);
  stopDisc.style.transition = 'transform 1.7s cubic-bezier(.15,.85,.3,1)';
  stopDisc.style.transform = coinTransform(discRot);

  setTimeout(() => {
    const gained = { poke: 0, great: 0, ultra: 0, master: 0 };
    const itemsGained = { pineapple: 0, grape: 0, incense: 0 };

    const base = 1 + Math.floor(Math.random() * 3);
    gained.poke = base;

    const r = Math.random();
    if (r < 0.003)        gained.master = 1;
    else if (r < 0.033)   gained.ultra  = 1;
    else if (r < 0.133)   gained.great  = 1;

    const ir = Math.random();
    if (ir < 0.05)        itemsGained.incense = 1;
    else if (ir < 0.17)   itemsGained.grape = 1;
    else if (ir < 0.32)   itemsGained.pineapple = 1;

    ['poke','great','ultra','master'].forEach(t => {
      ballInventory[t] = (ballInventory[t] || 0) + gained[t];
    });
    ['pineapple','grape','incense'].forEach(t => {
      itemInventory[t] = (itemInventory[t] || 0) + itemsGained[t];
    });
    updateHUD();
    autoSave();

    let html = '';
    ['master','ultra','great','poke'].forEach(t => {
      if (gained[t] > 0) {
        html += `<span style="display:inline-flex;align-items:center;gap:5px;margin:0 4px">
                   <span class="ball-mini ball-${t}"></span>×${gained[t]}
                 </span>`;
      }
    });
    ['incense','grape','pineapple'].forEach(t => {
      if (itemsGained[t] > 0) {
        html += `<span style="display:inline-flex;align-items:center;gap:5px;margin:0 4px">
                   <span style="font-size:22px">${ITEMS[t].icon}</span>×${itemsGained[t]}
                 </span>`;
      }
    });
    stopReward.innerHTML = html;
    stopReward.style.animation = 'none';
    void stopReward.offsetWidth;
    stopReward.style.animation = 'rewardIn .55s cubic-bezier(.3,1.4,.5,1) both';

    stopHint.textContent = '此補給站已使用';
    stopHint.style.animation = 'none';
    markStopUsed(marker);
    spinning = false;
    currentStopMarker = null;

    SFX.reward();

    const totalBalls = gained.poke + gained.great + gained.ultra + gained.master;
    if (totalBalls > 0) showBallBubble(totalBalls);

    if (gained.master > 0)      toast('✨✨ 獲得了大師球！', 3200);
    else if (gained.ultra > 0)  toast('✨ 獲得了超級球！', 2800);
    else if (gained.great > 0)  toast('✨ 獲得了高級球！', 2600);

    if (itemsGained.incense > 0)      toast('🌀 獲得了香薰！', 2600);
    else if (itemsGained.grape > 0)   toast('🍇 獲得了提子！', 2400);
    else if (itemsGained.pineapple > 0) toast('🍍 獲得了菠蘿！', 2400);
  }, 1700);
}

stopStage.addEventListener('pointerdown', e => {
  if (spinning) return;
  const marker = currentStopMarker;
  if (!marker || marker._used) return;
  stopSwipe.active = true;
  stopSwipe.id = e.pointerId;
  stopSwipe.x0 = e.clientX;
  stopSwipe.y0 = e.clientY;
  stopSwipe.x = e.clientX;
  stopSwipe.y = e.clientY;
  try { stopStage.setPointerCapture(e.pointerId); } catch(_) {}
  stopDisc.style.transition = 'none';
  e.preventDefault();
});

stopStage.addEventListener('pointermove', e => {
  if (!stopSwipe.active || e.pointerId !== stopSwipe.id) return;
  stopSwipe.x = e.clientX;
  stopSwipe.y = e.clientY;
  const dx = stopSwipe.x - stopSwipe.x0;
  stopDisc.style.transform = coinTransform(discRot + dx * 0.85);
  e.preventDefault();
});

function endStopSwipe(e) {
  if (!stopSwipe.active || e.pointerId !== stopSwipe.id) return;
  stopSwipe.active = false;
  stopDisc.style.transition = '';
  const dx = stopSwipe.x - stopSwipe.x0;
  const dy = stopSwipe.y - stopSwipe.y0;
  if (!spinning && Math.abs(dx) >= SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
    spinStop();
  } else {
    stopDisc.style.transform = coinTransform(discRot);
    if (!spinning && (Math.abs(dx) > 18 || Math.abs(dy) > 18)) {
      stopHint.textContent = '橫掃距離不夠，再試一次';
      setTimeout(() => {
        if (!spinning && currentStopMarker && !currentStopMarker._used)
          stopHint.textContent = '← 在硬幣上橫掃 →';
      }, 1400);
    }
  }
}
stopStage.addEventListener('pointerup', endStopSwipe);
stopStage.addEventListener('pointercancel', endStopSwipe);

function closeStopScreen() {
  stopScreen.classList.add('hidden');
  currentStopMarker = null;
  discRot = 0;
  stopDisc.style.transition = 'none';
  stopDisc.style.transform = coinTransform(0);
}

document.getElementById('stopCloseBtn').addEventListener('click', () => {
  if (spinning) return;
  closeStopScreen();
});

   ========================================================= */
const bagScreen = document.getElementById('bagScreen');

function renderBag() {
  const ballGrid = document.getElementById('bagGrid');
  const order = ['poke', 'great', 'ultra', 'master'];
  ballGrid.innerHTML = order.map(t => {
    const d = BALL_TYPES[t];
    const n = ballInventory[t] || 0;
    const sel = (t === currentBall);
    return `
      <div class="bag-item ${sel ? 'selected' : ''} ${n === 0 ? 'empty' : ''}" data-ball="${t}">
        <div class="bag-ball-icon ball-${t}"></div>
        <div class="bag-ball-name">${d.name}</div>
        <div class="bag-ball-desc">${d.desc}</div>
        <div class="bag-ball-count">${n}</div>
        ${sel ? '<div class="bag-ball-tag">✓ 使用中</div>' : ''}
      </div>`;
  }).join('');

  ballGrid.querySelectorAll('.bag-item').forEach(el => {
    el.addEventListener('click', () => {
      const t = el.dataset.ball;
      if ((ballInventory[t] || 0) <= 0) { toast('這個精靈球已用完'); return; }
      currentBall = t;
      if (ballFly) ballFly.className = 'pokeball ball-' + currentBall;
      updateHUD();
      renderBag();
      SFX.init();
      SFX.bubble();
      toast(`已切換為 ${BALL_TYPES[t].name}`);
    });
  });

  const itemGrid = document.getElementById('bagItemGrid');
  const itemOrder = ['pineapple', 'grape', 'incense'];
  itemGrid.innerHTML = itemOrder.map(t => {
    const d = ITEMS[t];
    const n = itemInventory[t] || 0;
    const isIncense = (t === 'incense');
    const incenseActive = isIncense && isIncenseActive();

    let useBtn = '';
    if (isIncense) {
      useBtn = n > 0
        ? `<button class="bag-item-use ${incenseActive ? 'active-incense' : ''}" data-item="incense" ${incenseActive ? 'disabled' : ''}>${incenseActive ? '🌀 使用中' : '使用'}</button>`
        : '';
    }

    return `
      <div class="bag-item ${n === 0 ? 'empty' : ''}" data-item="${t}">
        <div class="bag-item-emoji">${d.icon}</div>
        <div class="bag-ball-name">${d.name}</div>
        <div class="bag-ball-desc">${d.desc}</div>
        <div class="bag-ball-count">${n}</div>
        ${useBtn}
      </div>`;
  }).join('');

  itemGrid.querySelectorAll('.bag-item-use').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      useIncense();
    });
  });
}

function useIncense() {
  if (itemInventory.incense <= 0) { toast('沒有香薰'); return; }
  if (isIncenseActive()) { toast('香薰已在作用中'); return; }

  itemInventory.incense--;
  incenseEndAt = Date.now() + INCENSE_MS;
  nextRefreshAt = Date.now() + REFRESH_MS;

  const center = playerLatLng || spawnCenter || DEFAULT_CENTER;
  spawnCenter = center;
  spawnPokemon(center);
  spawnStops(center);
  maybeSpawnNPC(center);

  updateHUD();
  renderBag();
  autoSave();

  startConfetti();
  SFX.init();
  SFX.incenseStart();
  toast('🌀 香薰已使用，精靈數量翻倍！持續 15 分鐘', 3200);
}

function endIncense() {
  incenseEndAt = 0;
  nextRefreshAt = Date.now() + REFRESH_MS;

  const center = playerLatLng || spawnCenter || DEFAULT_CENTER;
  spawnCenter = center;
  spawnPokemon(center);

  updateHUD();
  if (!bagScreen.classList.contains('hidden')) renderBag();
  autoSave();

  stopConfetti();
  toast('🌀 香薰效果結束，精靈數量回復正常', 2600);
}

document.getElementById('bagBtn').addEventListener('click', () => {
  renderBag();
  bagScreen.classList.remove('hidden');
});
document.getElementById('bagCloseBtn').addEventListener('click', () => {

});

/* =========================================================
   14. 圖鑑
   ========================================================= */
const dexScreen = document.getElementById('dexScreen');
const evoScreen = document.getElementById('evoScreen');

function renderDex() {
  const grid = document.getElementById('dexGrid');
  let caughtTotal = 0;
  let html = '';

  POKEDEX.forEach(p => {
    const st = dexState[p.name];
    if (!st) return;
    const isCaught = st.caught > 0;
    const isSeen = st.seen > 0 || isCaught;
    if (isCaught) caughtTotal++;

    let cls = 'dex-cell';
    if (isCaught) cls += ' caught';
    else if (isSeen) cls += ' seen';
    else cls += ' unknown';

    const hasEvo = EVOLUTIONS[p.name] && isCaught;
    const candy = getCandy(p.name);

    html += `
      <div class="${cls}">
        <div class="dex-icon" data-id="${p.id}" data-name="${p.name}" data-seen="${isSeen?1:0}" data-shiny="${st.shiny>0?1:0}" style="--c:${p.color}">
          <div class="dex-shadow"></div>
          ${isSeen ? '' : `<span style="font-size:30px;z-index:2">❓</span>`}
        </div>
        <div class="dex-name">${isSeen ? p.name : '？？？'}</div>
        ${isCaught ? `<div class="dex-count">捕獲 ${st.caught} 次</div>` : ''}
        ${(isCaught && hasEvo) ? `<div class="dex-candy"><span class="candy-mini" style="width:10px;height:10px"></span>${candy}</div>` : ''}
        ${st.shiny > 0 ? `<div class="dex-shiny">✨ 異色 ×${st.shiny}</div>` : ''}
        ${p.notWild ? `<div class="dex-evo-tag">🧬 僅能進化獲得</div>` : ''}
      </div>`;
  });

  grid.innerHTML = html;
  document.getElementById('dexProgress').textContent = `已捕獲 ${caughtTotal} / ${POKEDEX.length}`;

  grid.querySelectorAll('.dex-icon').forEach(box => {
    if (box.dataset.seen !== '1') return;
    const name = box.dataset.name;
    const p = POKEDEX.find(x => x.name === name);
    if (!p) return;
    const st = dexState[p.name];
    const hasShiny = st && st.shiny > 0;

    const img = document.createElement('img');
    const normalSrc = spriteUrl(p, false);
    const shinySrc = hasShiny ? spriteUrl(p, true) : normalSrc;
    img.src = normalSrc;
    img.alt = p.name;
    img.draggable = false;
    img.onerror = () => {
      if (!img.dataset.fb) {
        img.dataset.fb = '1';
        img.src = staticSpriteUrl(p, false);
        return;
      }
      img.remove();
      const s = document.createElement('span');
      s.className = 'dex-fallback';
      s.textContent = '❓';
      box.appendChild(s);
    };
    box.appendChild(img);

    if (hasShiny) {
      box.classList.add('has-shiny');
      let pressing = false;
      const showShiny = () => { if (pressing) return; pressing = true; img.src = shinySrc; };
      const showNormal = () => { pressing = false; img.src = normalSrc; };
      box.addEventListener('pointerdown', showShiny);
      box.addEventListener('pointerup', showNormal);
      box.addEventListener('pointercancel', showNormal);
      box.addEventListener('pointerleave', showNormal);
      box.addEventListener('contextmenu', e => e.preventDefault());
    }
  });
}

document.getElementById('dexBtn').addEventListener('click', () => {
  renderDex();
  dexScreen.classList.remove('hidden');
});
document.getElementById('dexCloseBtn').addEventListener('click', () => {
  dexScreen.classList.add('hidden');
});

/* =========================================================
   15. 進化
   ========================================================= */
function renderEvoList() {
  const list = document.getElementById('evoList');
  const prog = document.getElementById('evoProgress');
  const sources = Object.keys(EVOLUTIONS).filter(n => dexState[n] && dexState[n].caught > 0);

  if (sources.length === 0) {
    list.innerHTML = `<div class="evo-empty">
      還沒有可以進化的精靈<br>
      先去捕捉精靈，收集足夠的糖果吧！
    </div>`;
    prog.textContent = '';
    return;
  }

  let readyCount = 0;
  let html = '';

  sources.forEach(srcName => {
    const evos = EVOLUTIONS[srcName];
    const src = POKEDEX.find(p => p.name === srcName);
    if (!src) return;
    const candy = getCandy(srcName);

    evos.forEach(evo => {
      const tgt = POKEDEX.find(p => p.name === evo.to);
      if (!tgt) return;
      const enough = candy >= evo.candy;
      if (enough) readyCount++;
      const targetKnown = dexState[tgt.name] && (dexState[tgt.name].caught > 0 || dexState[tgt.name].seen > 0);

      html += `
        <div class="evo-item ${enough ? 'ready' : ''}">
          <div class="evo-sprites">
            <img src="${spriteUrl(src,false)}" alt="${src.name}"
                 onerror="this.outerHTML='<span style=&quot;font-size:36px&quot;>❓</span>'">
            <span class="evo-arrow">➜</span>
            <img src="${spriteUrl(tgt,false)}" alt="${tgt.name}"
                 onerror="this.outerHTML='<span style=&quot;font-size:36px&quot;>❓</span>'">
          </div>
          <div class="evo-info">
            <div class="evo-title">${src.name} → ${tgt.name}${!targetKnown ? ' <span style="color:#7dd3fc">(新!)</span>' : ''}</div>
            <div class="evo-candy-line ${enough ? '' : 'lack'}">
              <span class="candy-mini" style="width:12px;height:12px"></span>
              ${candy} / ${evo.candy} 糖果
            </div>
          </div>
          <button class="evo-btn" ${enough ? '' : 'disabled'}
                  data-src="${srcName}" data-to="${evo.to}">進化</button>
        </div>`;
    });
  });

  list.innerHTML = html;
  prog.textContent = `可進化 ${readyCount} 個分支`;

  list.querySelectorAll('.evo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      tryEvolve(btn.dataset.src, btn.dataset.to);
    });
  });
}

function tryEvolve(srcName, toName) {
  const evos = EVOLUTIONS[srcName];
  if (!evos) return;
  const evo = evos.find(e => e.to === toName);
  if (!evo) return;
  if (!dexState[srcName] || dexState[srcName].caught <= 0) return;
  if (getCandy(srcName) < evo.candy) return;

  const src = POKEDEX.find(p => p.name === srcName);
  const tgt = POKEDEX.find(p => p.name === toName);
  if (!src || !tgt) return;

  const ov = document.getElementById('evoOverlay');
  const animImg = document.getElementById('evoAnimImg');
  const fromSrc = spriteUrl(src, false);
  const toSrc   = spriteUrl(tgt, false);

  animImg.src = fromSrc;
  animImg.style.display = '';
  animImg.onerror = () => { animImg.style.display = 'none'; };
  ov.style.display = 'flex';

  audio.init();
  audio.playTrade();
  SFX.evolve();

  const swapTimer = setTimeout(() => { animImg.src = toSrc; }, 1100);

  setTimeout(() => {
    clearTimeout(swapTimer);
    ov.style.display = 'none';
    animImg.style.display = '';

    candyBag[srcName] -= evo.candy;
    dexState[tgt.name].seen = 1;
    dexState[tgt.name].caught++;
    caughtCount++;
    updateHUD();
    autoSave();

    toast(`🧬 ${srcName} 進化成 ${tgt.name}！`, 2600);
    renderEvoList();
    if (gameStarted) audio.playMap(env.time);
  }, 2700);
}

document.getElementById('evoBtn').addEventListener('click', () => {
  renderEvoList();
  evoScreen.classList.remove('hidden');
});
document.getElementById('evoCloseBtn').addEventListener('click', () => {
  evoScreen.classList.add('hidden');
});

/* =========================================================
   16. 全螢幕
   ========================================================= */
const fsBtn = document.getElementById('fsBtn');

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
            document.mozFullScreenElement || document.msFullscreenElement);
}

function toggleFullscreen() {
  const el = document.documentElement;
  try {
    if (!isFullscreen()) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                  el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) {
        const p = req.call(el);
        if (p && p.catch) p.catch(() => toast('此裝置不支援全螢幕'));
      } else {
        toast('此裝置不支援全螢幕');
      }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
      if (exit) {
        const p = exit.call(document);
        if (p && p.catch) p.catch(()=>{});
      }
    }
  } catch (e) { toast('此裝置不支援全螢幕'); }
}

fsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });

function syncFsBtn() {
  fsBtn.classList.toggle('on', isFullscreen());
  fsBtn.textContent = isFullscreen() ? '⤡' : '⛶';
  setTimeout(() => { if (map) map.invalidateSize(); }, 260);
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
  .forEach(ev => document.addEventListener(ev, syncFsBtn));

/* =========================================================
   17. 計時器
   ========================================================= */
function startTimers() {
  setInterval(() => {
    const now = Date.now();

    if (incenseEndAt > 0) {
      if (now >= incenseEndAt) {
        endIncense();
        return;
      }
      const left = Math.ceil((incenseEndAt - now) / 1000);
      const m = Math.floor(left / 60);
      const s = left % 60;
      const chip = document.getElementById('timerChip');
      chip.textContent = `🌀 ${m}:${String(s).padStart(2, '0')}`;
      chip.style.color = '#7CFC9A';

      if (now >= nextRefreshAt) {
        refreshSpawns();
      }
      return;
    }

    const chip = document.getElementById('timerChip');
    chip.style.color = '';
    const left = Math.max(0, Math.ceil((nextRefreshAt - now) / 1000));
    const m = Math.floor(left / 60);
    const s = left % 60;
    chip.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`;

    if (left <= 0) {
      refreshSpawns();
    }
  }, 1000);

  setInterval(checkDeviceTime, 20000);
}

function refreshSpawns() {
  nextRefreshAt = Date.now() + REFRESH_MS;

  if (npcScreen && !npcScreen.classList.contains('hidden')) {
    toast('交換進行中，稍後刷新');
    return;
  }

  rollWeather();
  renderEnvironment();

  const center = playerLatLng || spawnCenter || DEFAULT_CENTER;
  spawnCenter = center;
  spawnPokemon(center);
  if (stopMarkers.length === 0) spawnStops(center);
  else resetStops();
  maybeSpawnNPC(center);

  const w = WEATHERS.find(x => x.id === env.weather) || WEATHERS[0];
  const t = env.time === 'day' ? '☀️ 白天' : '🌙 夜晚';
  const incTag = isIncenseActive() ? ' 🌀×2' : '';
  toast(`${t} · ${w.icon}${w.name}　地圖已刷新！${incTag}`);
}

function spawnWorld(center) {

async function startGame() {
  if (gameStarted) return;
  gameStarted = true;

  audio.init();
  audio.playMap(env.time);
  SFX.init();

  initMap();
  updateHUD();

  rollWeather();
  renderEnvironment();

  placePlayer(DEFAULT_CENTER, false);
  spawnWorld(DEFAULT_CENTER);

  const restored = loadAutoSave();
  if (restored) {
    toast('📂 已恢復上次遊戲進度', 2600);
    if (isIncenseActive()) startConfetti();
  } else {
    autoSave();
  }

  startTimers();
  startGPS();

  document.getElementById('locateBtn').addEventListener('click', () => {
    if (manualMode) {
      setManualMode(false);
      toast('🛰 已切回 GPS 定位模式');
      if (playerLatLng) map.setView(playerLatLng, 17, { animate: true });
    } else if (document.body.classList.contains('gps-live')) {
      setManualMode(true);
      toast('🚶 已切換手動模式，可使用方向鍵移動');
    } else {
      if (playerLatLng) map.setView(playerLatLng, 17, { animate: true });
      toast('📍 回到你的位置');
    }
  });

  document.getElementById('mapModeBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (mapFallbackActive) activateOsm(true);
    else activateProcedural(true);
  });

  document.getElementById('dpadToggleBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    forceDpad = !forceDpad;
    document.body.classList.toggle('force-dpad', forceDpad);
    document.getElementById('dpadToggleBtn').classList.toggle('on', forceDpad);
    toast(forceDpad ? '🕹 已顯示方向鍵（手動移動）' : '🕹 已隱藏方向鍵');
  });

  window.addEventListener('resize', () => {
    if (catchState === 'aim') {
      resetBallPosition(false);
      updateGroundLine();
    }
    if (map) map.invalidateSize();
  });

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(already => {
      if (!already) navigator.storage.persist().catch(() => {});
    });
  }
}

async function boot() {
  env.time = getTimeOfDay();
  document.getElementById('copyrightYear').textContent = new Date().getFullYear();

  const splash = document.getElementById('splash');
  const loadingScreen = document.getElementById('loadingScreen');
  let entered = false;

  const enter = async () => {
    if (entered) return;
    entered = true;
    splash.classList.add('fade');
    setTimeout(() => splash.remove(), 600);

    loadingScreen.classList.remove('hidden');

    try {
      await loadAllData();
    } catch (e) {
      console.error('加載失敗:', e);
      document.getElementById('loadSub').textContent =
        '加載失敗，請重新整理頁面。' + (e.message || '');
      return;
    }

    loadingScreen.classList.add('hidden');
    WeatherFX.init();
    CatchWeatherFX.init();
    audio.init();
    SFX.init();
    SFX.resume();
    await startGame();
  };

  splash.addEventListener('pointerdown', enter);
  splash.addEventListener('click', enter);

  document.addEventListener('gesturestart', e => e.preventDefault());
  setInterval(checkDeviceTime, 20000);
}

/* =========================================================
   GPS / 方向鍵
   ========================================================= */
function startGPS() {
  if (!navigator.geolocation) { toast('此裝置不支援 GPS，請用方向鍵移動'); return; }
  navigator.geolocation.watchPosition(onPos, onGeoError, {
    enableHighAccuracy: true, maximumAge: 3000, timeout: 20000,
  });
}

function onPos(pos) {
  if (manualMode) return;
  const ll = [pos.coords.latitude, pos.coords.longitude];
  const isFirst = firstFix;
  placePlayer(ll, isFirst);
  document.body.classList.add('gps-live');

  if (isFirst) {
    firstFix = false;
    if (!spawnCenter || map.distance(L.latLng(spawnCenter), L.latLng(ll)) > 800) {
      spawnWorld(ll);
    }
    toast('📍 已定位到你的位置');
  } else {
    map.panTo(ll, {
      animate: true, duration: 0.3, easeLinearity: 0.25, noMoveStart: true,
    });
  }
}

function onGeoError(err) {
  if (firstFix) {
    toast('⚠️ 無法取得 GPS，請使用左下方向鍵移動');
    setManualMode(true);
  }
  document.body.classList.remove('gps-live');
  console.warn('Geolocation error:', err.message);
}

function setManualMode(on) {
  manualMode = on;
  const btn = document.getElementById('locateBtn');
  btn.classList.toggle('manual', on);
  btn.title = on ? '手動模式中（點擊恢復 GPS）' : '回到 GPS 位置';
  if (on) document.body.classList.remove('gps-live');
}

const dpad = { up:false, down:false, left:false, right:false };
let dpadRaf = null;

function startDpadLoop() {
  if (dpadRaf) return;
  let last = performance.now();
  const SPEED = 28;
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    let dx = 0, dy = 0;
    if (dpad.up)    dy -= 1;
    if (dpad.down)  dy += 1;
    if (dpad.left)  dx -= 1;
    if (dpad.right) dx += 1;
    if ((dx || dy) && playerLatLng) {
      const bearing = Math.atan2(dx, -dy) * 180 / Math.PI;
      const move = SPEED * dt;
      const [lat, lng] = offsetLatLng(playerLatLng[0], playerLatLng[1], move, bearing);
      const ll = [lat, lng];
      placePlayer(ll, false);
      map.panTo(ll, { animate: false });
    }
    dpadRaf = requestAnimationFrame(tick);
  }
  dpadRaf = requestAnimationFrame(tick);
}

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const press = (e) => {
    e.preventDefault();
    if (!manualMode) setManualMode(true);
    dpad[dir] = true;
    btn.classList.add('on');
    startDpadLoop();
  };
  const release = (e) => {
    e.preventDefault();
    dpad[dir] = false;
    btn.classList.remove('on');
  };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

document.getElementById('saveBtn').addEventListener('click', (e) => {
  e.stopPropagation(); downloadSave();
});
document.getElementById('loadBtn').addEventListener('click', (e) => {
  e.stopPropagation(); document.getElementById('loadFileInput').click();
});
document.getElementById('loadFileInput').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  handleLoadFile(file);
  e.target.value = '';
});
document.getElementById('resetBtn').addEventListener('click', (e) => {
  e.stopPropagation(); resetGame();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') autoSave();
});

window.addEventListener('load', boot);
</script>

    });
