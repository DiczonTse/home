/* =========================================================
   11. 捕捉
   ========================================================= */
const BALL_SIZE = 56;

const catchScreen = document.getElementById('catchScreen');
const catchStage  = document.getElementById('catchStage');
const wildMon     = document.getElementById('wildMon');
const monBody     = document.getElementById('monBody');
const ballFly     = document.getElementById('ballFly');
const trail       = document.getElementById('trail');
const catchResult = document.getElementById('catchResult');
const swipeHint   = document.getElementById('swipeHint');
const powerWrap   = document.getElementById('powerWrap');
const powerFill   = document.getElementById('powerFill');

let ballHome = { x: 0, y: 0 };
let ballFlying = false;
let lastThrow = null;

const swipe = {
  active: false, pointerId: null,
  startX: 0, startY: 0, curX: 0, curY: 0,
};

function resetBallPosition(animate) {
  const w = catchStage.clientWidth;
  const h = catchStage.clientHeight;
  ballHome.x = w / 2 - BALL_SIZE / 2;
  ballHome.y = h - 88;
  ballFly.style.display = 'block';
  ballFly.style.opacity = '1';
  ballFly.style.filter = '';
  ballFly.style.transition = animate
    ? 'transform .28s cubic-bezier(.3,.8,.4,1), opacity .28s' : 'none';
  ballFly.style.transform = `translate(${ballHome.x}px, ${ballHome.y}px) rotate(0deg)`;
}

function setBallTransform(x, y, rot) {
  ballFly.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
}

function updateGroundLine() {
  if (!catchStage || !catchScreen) return;
  const stageH = catchStage.clientHeight;
  if (!stageH) return;
  const monH = 180;
  const monTopInStage = (stageH - monH) / 2;
  const pct = Math.max(22, Math.min(72, (monTopInStage / stageH) * 100));
  catchScreen.style.setProperty('--groundY', pct + '%');
}

function openCatch(p, marker, shiny) {
  if (catchState !== 'idle') return;
  catchState = 'aim';
  currentSpawn = { p, marker, shiny };

  catchScreen.classList.toggle('day', env.time === 'day');
  catchScreen.classList.toggle('night', env.time === 'night');
  buildStars();

  const nameEl = document.getElementById('catchName');
  nameEl.textContent = shiny ? `✨ 異色 ${p.name} ✨` : `野生的 ${p.name}`;
  nameEl.classList.toggle('shiny', !!shiny);

  monBody.classList.toggle('shiny', !!shiny);
  monBody.innerHTML = '';

  const img = document.createElement('img');
  img.src = spriteUrl(p, shiny);
  img.alt = p.name;
  img.draggable = false;
  img.onerror = () => {
    img.remove();
    const s = document.createElement('span');
    s.className = 'mon-fallback';
    s.textContent = '❓';
    monBody.appendChild(s);
  };
  monBody.appendChild(img);

  wildMon.classList.remove('absorbed');

  catchResult.textContent = '';
  swipeHint.style.display = '';
  powerWrap.style.display = 'none';
  powerFill.style.width = '0%';
  trail.style.display = 'none';
  ballFlying = false;
  lastThrow = null;

  updateHUD();
  catchScreen.classList.remove('hidden');

  requestAnimationFrame(() => {
    resetBallPosition(false);
    updateGroundLine();
  });

  audio.init();
  audio.playCatch(env.time);
  SFX.init();
}

function closeCatch() {
  catchScreen.classList.add('hidden');
  catchState = 'idle';
  currentSpawn = null;
  ballFlying = false;
  resetSwipe();

  wildMon.classList.remove('absorbed');
  wildMon.classList.remove('fleeing');
  ballFly.style.opacity = '1';
  ballFly.style.filter = '';

  if (gameStarted) audio.playMap(env.time);
}

function resetSwipe() {
  swipe.active = false;
  swipe.pointerId = null;
  trail.style.display = 'none';
  powerWrap.style.display = 'none';
  powerFill.style.width = '0%';
}

function showResult(text, color) {
  catchResult.textContent = text;
  catchResult.style.color = color || '#fff';
}

catchStage.addEventListener('pointerdown', onPointerDown);
catchStage.addEventListener('pointermove', onPointerMove);
catchStage.addEventListener('pointerup', onPointerUp);
catchStage.addEventListener('pointercancel', onPointerUp);

function onPointerDown(e) {
  if (catchState !== 'aim' || ballFlying) return;
  if (balls <= 0) { showResult('沒有精靈球了！去補給站橫掃補給', '#ff8a8a'); return; }

  const rect = catchStage.getBoundingClientRect();
  swipe.active = true;
  swipe.pointerId = e.pointerId;
  swipe.startX = e.clientX - rect.left;
  swipe.startY = e.clientY - rect.top;
  swipe.curX = swipe.startX;
  swipe.curY = swipe.startY;

  try { catchStage.setPointerCapture(e.pointerId); } catch(_) {}

  swipeHint.style.display = 'none';
  powerWrap.style.display = 'block';
  powerFill.style.width = '0%';
  ballFly.style.transition = 'none';
  e.preventDefault();
}

function onPointerMove(e) {
  if (!swipe.active || e.pointerId !== swipe.pointerId) return;
  const rect = catchStage.getBoundingClientRect();
  swipe.curX = e.clientX - rect.left;
  swipe.curY = e.clientY - rect.top;

  drawTrail();
  updatePowerBar();

  const dx = swipe.curX - swipe.startX;
  const dy = swipe.curY - swipe.startY;
  setBallTransform(ballHome.x + dx * 0.12, ballHome.y + dy * 0.12, dx * 0.25);
  e.preventDefault();
}

function onPointerUp(e) {
  if (!swipe.active || e.pointerId !== swipe.pointerId) return;
  swipe.active = false;
  trail.style.display = 'none';
  powerWrap.style.display = 'none';
  evaluateSwipe();
}

function drawTrail() {
  const dx = swipe.curX - swipe.startX;
  const dy = swipe.curY - swipe.startY;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;

  trail.style.display = 'block';
  trail.style.left = swipe.startX + 'px';
  trail.style.top  = (swipe.startY - 2) + 'px';
  trail.style.width = len + 'px';
  trail.style.transform = `rotate(${ang}deg)`;

  const absAng = Math.abs(ang + 90);
  const isCurve = absAng > 22 && absAng < 62;
  trail.style.background = isCurve
    ? 'linear-gradient(90deg,rgba(162,155,254,.2),rgba(162,155,254,.95))'
    : 'linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.9))';
}

function updatePowerBar() {
  const dx = swipe.curX - swipe.startX;
  const dy = swipe.curY - swipe.startY;
  const len = Math.hypot(dx, dy);
  const h = catchStage.clientHeight || 1;
  const p = Math.min(1, len / (h * 0.75));
  powerFill.style.width = (p * 100) + '%';
}

function evaluateSwipe() {
  if (catchState !== 'aim') return;

  const dx = swipe.curX - swipe.startX;
  const dy = swipe.curY - swipe.startY;
  const len = Math.hypot(dx, dy);

  const goHome = (msg) => {
    if (msg) showResult(msg, '#ffd166');
    ballFly.style.transition = 'transform .28s cubic-bezier(.3,.8,.4,1)';
    setBallTransform(ballHome.x, ballHome.y, 0);
    ballFlying = false;
  };

  if (len < 24) { goHome(); return; }
  if (dy >= -24) { goHome('請向上滑動投球 ↑'); return; }

  const angle = Math.atan2(Math.abs(dx), -dy) * 180 / Math.PI;
  if (angle > 62) { goHome('角度太斜了，請朝上方滑動'); return; }

  const ballType = angle <= 22 ? 'straight' : 'curve';
  const h = catchStage.clientHeight || 1;
  const power = len / h;

  let quality;
  if (power < 0.18)       quality = 'low';
  else if (power < 0.32)  quality = 'weak';
  else if (power <= 0.55) quality = 'perfect';
  else if (power <= 0.78) quality = 'strong';
  else                    quality = 'high';

  performThrow(ballType, quality, angle, power);
}

function performThrow(ballType, quality, angle, power) {
  catchState = 'flying';
  ballFlying = true;
  balls--;
  updateHUD();
  swipeHint.style.display = 'none';

  SFX.resume();
  SFX.throwBall();

  const stageRect = catchStage.getBoundingClientRect();
  const monRect = wildMon.getBoundingClientRect();
  const monCx = monRect.left - stageRect.left + monRect.width / 2;
  const monCy = monRect.top  - stageRect.top  + monRect.height / 2 - 14;

  const isMiss = (quality === 'low' || quality === 'high');

  const curveSlip = (ballType === 'curve' && !isMiss && Math.random() < CURVE_SLIP_CHANCE);
  const finalMiss = isMiss || curveSlip;

  let targetCx = monCx;
  let targetCy = monCy;

  if (curveSlip) {
    const side = Math.random() < 0.5 ? -1 : 1;
    targetCx = monCx + side * (110 + Math.random() * 90);
    targetCy = monCy + (Math.random() * 160 - 80);
  } else if (quality === 'low')        { targetCy = monCy + 150; targetCx = monCx + (Math.random()*70-35); }
  else if (quality === 'high')         { targetCy = monCy - 190; targetCx = monCx + (Math.random()*70-35); }
  else if (quality === 'weak')         { targetCy = monCy + 38; }
  else if (quality === 'strong')       { targetCy = monCy - 38; }

  const targetX = targetCx - BALL_SIZE / 2;
  const targetY = targetCy - BALL_SIZE / 2;

  const dirSign = Math.sign(swipe.curX - swipe.startX) || 1;
  let curveOffset = 0;
  if (ballType === 'curve') {
    const ddx = targetX - ballHome.x;
    const ddy = targetY - ballHome.y;
    const dist = Math.hypot(ddx, ddy) || 1;
    curveOffset = dirSign * dist * 0.38;
  }

  const spinDir = dirSign;
  const duration = 520;

  lastThrow = { ballType, quality, angle, power, targetX, targetY, spinDir };

  flyBall(targetX, targetY, spinDir, curveOffset, duration, () => {
    SFX.hit();

    if (finalMiss) {
      ballFly.style.transition = 'transform .32s ease-in, opacity .32s';
      setBallTransform(
        targetX + dirSign * 70,
        targetY + (curveSlip ? 130 : (quality === 'low' ? 140 : -140)),
        spinDir * 1080
      );
      ballFly.style.opacity = '0';
      showResult(
        curveSlip ? '🌀 旋轉球失手，球飛歪了…'
          : (quality === 'low' ? '力道太輕，球沒飛到…' : '力道過猛，球飛過頭了！'),
        '#ff8a8a'
      );
      setTimeout(() => {
        ballFlying = false;
        if (catchState === 'flying') {
          catchState = 'aim';
          swipeHint.style.display = '';
          resetBallPosition(true);
        }
      }, 340);
      return;
    }

    wildMon.classList.add('absorbed');
    setTimeout(() => {
      wobbleBall(targetX, targetY, spinDir * 720, () => {
        resolveCatch();
      });
    }, 240);
  });
}

function flyBall(targetX, targetY, spinDir, curveOffset, duration, onDone) {
  const startX = ballHome.x;
  const startY = ballHome.y;

  const midX = (startX + targetX) / 2;
  const midY = (startY + targetY) / 2;
  let cpX = midX, cpY = midY;

  if (curveOffset !== 0) {
    const dx = targetX - startX;
    const dy = targetY - startY;
    const len = Math.hypot(dx, dy) || 1;
    const perpX = -dy / len;
    const perpY =  dx / len;
    cpX = midX + perpX * curveOffset;
    cpY = midY + perpY * curveOffset;
  }

  ballFly.style.transition = 'none';
  const startTime = performance.now();

  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const ease = t * t * (3 - 2 * t);
    const om = 1 - ease;

    const x = om*om*startX + 2*om*ease*cpX + ease*ease*targetX;
    const y = om*om*startY + 2*om*ease*cpY + ease*ease*targetY;
    const rot = ease * 720 * spinDir;

    setBallTransform(x, y, rot);

    if (t < 1) requestAnimationFrame(step);
    else onDone();
  }
  requestAnimationFrame(step);
}

function wobbleBall(baseX, baseY, baseRot, onDone) {
  const TOTAL = 3;
  const WOBBLE_DUR = 480;
  const PAUSE_DUR  = 340;
  let count = 0;

  function doWobble() {
    if (count >= TOTAL) { onDone(); return; }
    SFX.wobble(count);

    const startTime = performance.now();
    const dir = (count % 2 === 0) ? 1 : -1;

    function step(now) {
      const t = Math.min(1, (now - startTime) / WOBBLE_DUR);
      const phase = t * Math.PI * 2;
      const damp = 1 - t * 0.4;

      const wobbleX = Math.sin(phase) * 12 * damp * dir;
      const tilt    = Math.sin(phase) * 18 * damp * dir;

      setBallTransform(baseX + wobbleX, baseY, baseRot + tilt);

      if (t < 1) requestAnimationFrame(step);
      else {
        setBallTransform(baseX, baseY, baseRot);
        count++;
        if (count < TOTAL) setTimeout(doWobble, PAUSE_DUR);
        else setTimeout(onDone, PAUSE_DUR + 180);
      }
    }
    requestAnimationFrame(step);
  }
  setTimeout(doWobble, 260);
}

function showCatchStars() {
  const stageRect = catchStage.getBoundingClientRect();
  const ballRect  = ballFly.getBoundingClientRect();

  const baseX = ballRect.right - stageRect.left - 4;
  const baseY = ballRect.top  - stageRect.top  + 4;

  const offsets = [
    { dx: 26, dy: -30 },
    { dx: 54, dy: -54 },
    { dx: 82, dy: -38 },
  ];

  offsets.forEach((o, i) => {
    const star = document.createElement('div');
    star.className = 'catch-star';
    star.textContent = '✦';
    star.style.left = baseX + 'px';
    star.style.top  = baseY + 'px';
    star.style.setProperty('--dx', o.dx + 'px');
    star.style.setProperty('--dy', o.dy + 'px');
    star.style.animationDelay = (i * 0.1) + 's';
    catchStage.appendChild(star);
    setTimeout(() => star.remove(), 1600);
  });
}

function resolveCatch() {
  if (!currentSpawn) return;
  const { p, marker, shiny } = currentSpawn;
  const info = lastThrow || { ballType:'straight', quality:'perfect', spinDir:1,
                              targetX: ballHome.x, targetY: ballHome.y };

  let mult = 1;
  if (info.quality === 'perfect') mult *= 1.25;
  else if (info.quality === 'weak' || info.quality === 'strong') mult *= 0.78;
  if (info.ballType === 'curve') mult *= CURVE_SUCCESS_MULT;

  const chance = Math.min(0.95, p.rate * mult);
  const success = Math.random() < chance;

  if (success) {
    catchState = 'caught';
    caughtCount++;
    const firstTime = dexState[p.name].caught === 0;
    dexState[p.name].caught++;
    if (shiny) dexState[p.name].shiny++;

    addCandy(p.name, 1);
    updateHUD();
    autoSave();

    SFX.caught();
    audio.stopCatch();
    showCatchStars();

    const candyMsg = `　🍬 +1 ${p.name} 糖果`;

    if (firstTime) {
      showResult(shiny
        ? `✨ 首次捕獲異色 ${p.name}！${candyMsg}`
        : `Gotcha！首次捕獲 ${p.name}！${candyMsg}`, '#ffd166');
    } else {
      showResult(shiny
        ? `✨ 異色 ${p.name}！${candyMsg}`
        : `Gotcha！${p.name}！${candyMsg}`, '#7CFC9A');
    }

    if (shiny) toast(`✨ 太幸運了！異色 ${p.name} 入手！`, 2800);

    if (map.hasLayer(marker)) map.removeLayer(marker);
    spawnMarkers = spawnMarkers.filter(m => m !== marker);

    ballFly.style.filter = shiny
      ? 'brightness(2) drop-shadow(0 0 20px #ffd166)'
      : 'brightness(1.8) drop-shadow(0 0 16px #ffd166)';
    setTimeout(() => { ballFly.style.filter = ''; }, 320);

    setTimeout(closeCatch, 1900);
  } else {
    catchState = 'fail';
    wildMon.classList.remove('absorbed');

    SFX.catchFail();

    ballFly.style.transition = 'transform .3s ease-in, opacity .3s';
    ballFly.style.opacity = '0';

    if (Math.random() < 0.35) {
      /* ===== 逃跑動畫 ===== */
      showResult(`可惜！${p.name} 逃走了…`, '#ff8a8a');
      wildMon.classList.add('fleeing');
      SFX.flee();
      setTimeout(() => {
        wildMon.classList.remove('fleeing');
        if (map.hasLayer(marker)) map.removeLayer(marker);
        spawnMarkers = spawnMarkers.filter(m => m !== marker);
        closeCatch();
      }, 900);
    } else {
      showResult('差一點！再試一次', '#ffd166');
      ballFly.style.transition = 'transform .32s ease-in, opacity .32s';
      setBallTransform(info.targetX, info.targetY + 240, info.spinDir * 1080);
      ballFly.style.opacity = '0';
      setTimeout(() => {
        ballFlying = false;
        if (catchState === 'fail') {
          catchState = 'aim';
          swipeHint.style.display = '';
          resetBallPosition(true);
        }
      }, 360);
    }
  }
}

document.getElementById('fleeBtn').addEventListener('click', () => {
  if (catchState === 'flying') return;
  closeCatch();
});

/* =========================================================
   12. 補給站
   ========================================================= */
const stopScreen = document.getElementById('stopScreen');
const stopStage  = document.getElementById('stopStage');
const stopDisc   = document.getElementById('stopDisc');
const stopHint   = document.getElementById('stopHint');
const stopReward = document.getElementById('stopReward');

const stopSwipe = { active:false, id:null, x0:0, y0:0, x:0, y:0 };

function coinTransform(deg) {
  return `rotateX(10deg) rotateY(${deg}deg)`;
}

function openStop(marker) {
  if (catchState !== 'idle') return;
  if (marker._used) { toast('這個補給站已經補給過了，等刷新吧'); return; }

  currentStopMarker = marker;
  stopReward.innerHTML = '';
  stopHint.textContent = '← 在硬幣上橫掃 →';
  stopHint.style.animation = '';
  stopDisc.style.transition = 'none';
  stopDisc.style.transform = coinTransform(discRot);
  stopScreen.classList.remove('hidden');
  SFX.init();
}

function markStopUsed(marker) {
  marker._used = true;
  const el = marker.getElement();
  if (el) {
    const d = el.querySelector('.stop');
    if (d) { d.classList.add('used'); d.textContent = '✓'; }
  }
}

function showBallBubble(gain) {
  SFX.bubble();
  const b = document.createElement('div');
  b.className = 'ball-bubble';
  b.innerHTML = `<span class="bub-txt">+${gain}</span>`;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 1750);
}

function spinStop() {
  if (spinning) return;
  const marker = currentStopMarker;
  if (!marker || marker._used) return;

  spinning = true;
  stopHint.textContent = '補給中…';
  SFX.spin();
  SFX.coinSpin();

  discRot += 1080 + Math.floor(Math.random() * 720);
  stopDisc.style.transition = 'transform 1.7s cubic-bezier(.15,.85,.3,1)';
  stopDisc.style.transform = coinTransform(discRot);

  setTimeout(() => {
    const gain = 1 + Math.floor(Math.random() * 3);
    balls += gain;
    updateHUD();
    autoSave();

    stopReward.innerHTML = `<span class="ball-mini"></span><span>×${gain}</span>`;
    stopReward.style.animation = 'none';
    void stopReward.offsetWidth;
    stopReward.style.animation = 'rewardIn .55s cubic-bezier(.3,1.4,.5,1) both';

    stopHint.textContent = '此補給站已使用';
    stopHint.style.animation = 'none';
    markStopUsed(marker);
    spinning = false;
    currentStopMarker = null;

    SFX.reward();
    showBallBubble(gain);
  }, 1700);
}

stopStage.addEventListener('pointerdown', e => {
  if (spinning) return;
  const marker = currentStopMarker;
  if (!marker || marker._used) return;

  stopSwipe.active = true;
  stopSwipe.id = e.pointerId;
  stopSwipe.x0 = e.clientX;
  stopSwipe.y0 = e.clientY;
  stopSwipe.x = e.clientX;
  stopSwipe.y = e.clientY;

  try { stopStage.setPointerCapture(e.pointerId); } catch(_) {}
  stopDisc.style.transition = 'none';
  e.preventDefault();
});

stopStage.addEventListener('pointermove', e => {
  if (!stopSwipe.active || e.pointerId !== stopSwipe.id) return;
  stopSwipe.x = e.clientX;
  stopSwipe.y = e.clientY;
  const dx = stopSwipe.x - stopSwipe.x0;
  stopDisc.style.transform = coinTransform(discRot + dx * 0.85);
  e.preventDefault();
});

function endStopSwipe(e) {
  if (!stopSwipe.active || e.pointerId !== stopSwipe.id) return;
  stopSwipe.active = false;
  stopDisc.style.transition = '';

  const dx = stopSwipe.x - stopSwipe.x0;
  const dy = stopSwipe.y - stopSwipe.y0;

  if (!spinning && Math.abs(dx) >= SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
    spinStop();
  } else {
    stopDisc.style.transform = coinTransform(discRot);
    if (!spinning && (Math.abs(dx) > 18 || Math.abs(dy) > 18)) {
      stopHint.textContent = '橫掃距離不夠，再試一次';
      setTimeout(() => {
        if (!spinning && currentStopMarker && !currentStopMarker._used)
          stopHint.textContent = '← 在硬幣上橫掃 →';
      }, 1400);
    }
  }
}
stopStage.addEventListener('pointerup', endStopSwipe);
stopStage.addEventListener('pointercancel', endStopSwipe);

function closeStopScreen() {
  stopScreen.classList.add('hidden');
  currentStopMarker = null;

  /* 關閉時重設金幣面向玩家（正面朝前） */
  discRot = 0;
  stopDisc.style.transition = 'none';
  stopDisc.style.transform = coinTransform(0);
}

document.getElementById('stopCloseBtn').addEventListener('click', () => {
  if (spinning) return;
  closeStopScreen();
});

/* =========================================================
   13. 圖鑑
   ========================================================= */
const dexScreen = document.getElementById('dexScreen');
const evoScreen = document.getElementById('evoScreen');

function renderDex() {
  const grid = document.getElementById('dexGrid');
  let caughtTotal = 0;
  let html = '';

  POKEDEX.forEach(p => {
    const st = dexState[p.name];
    if (!st) return;
    const isCaught = st.caught > 0;
    const isSeen = st.seen > 0 || isCaught;
    if (isCaught) caughtTotal++;

    let cls = 'dex-cell';
    if (isCaught) cls += ' caught';
    else if (isSeen) cls += ' seen';
    else cls += ' unknown';

    const hasEvo = EVOLUTIONS[p.name] && isCaught;
    const candy = getCandy(p.name);

    html += `
      <div class="${cls}">
        <div class="dex-icon" data-id="${p.id}" data-seen="${isSeen?1:0}" data-shiny="${st.shiny>0?1:0}" style="--c:${p.color}">
          <div class="dex-shadow"></div>
          ${isSeen ? '' : `<span style="font-size:30px;z-index:2">❓</span>`}
        </div>
        <div class="dex-name">${isSeen ? p.name : '？？？'}</div>
        ${isCaught ? `<div class="dex-count">捕獲 ${st.caught} 次</div>` : ''}
        ${(isCaught && hasEvo) ? `<div class="dex-candy"><span class="candy-mini" style="width:10px;height:10px"></span>${candy}</div>` : ''}
        ${st.shiny > 0 ? `<div class="dex-shiny">✨ 異色 ×${st.shiny}</div>` : ''}
        ${p.notWild ? `<div class="dex-evo-tag">🧬 僅能進化獲得</div>` : ''}
      </div>`;
  });

  grid.innerHTML = html;
  document.getElementById('dexProgress').textContent =
    `已捕獲 ${caughtTotal} / ${POKEDEX.length}`;

  grid.querySelectorAll('.dex-icon').forEach(box => {
    if (box.dataset.seen !== '1') return;
    const id = parseInt(box.dataset.id, 10);
    const p = POKEDEX.find(x => x.id === id);
    if (!p) return;
    const shiny = box.dataset.shiny === '1';

    const img = document.createElement('img');
    img.src = spriteUrl(p, shiny);
    img.alt = p.name;
    img.draggable = false;
    img.onerror = () => {
      img.remove();
      const s = document.createElement('span');
      s.className = 'dex-fallback';
      s.textContent = '❓';
      box.appendChild(s);
    };
    box.appendChild(img);
    if (shiny) img.style.filter = 'drop-shadow(0 0 8px #ffd166) drop-shadow(0 0 16px #ffb703)';
  });
}

document.getElementById('dexBtn').addEventListener('click', () => {
  renderDex();
  dexScreen.classList.remove('hidden');
});
document.getElementById('dexCloseBtn').addEventListener('click', () => {
  dexScreen.classList.add('hidden');
});

/* =========================================================
   14. 進化
   ========================================================= */
function canEvolve(name) {
  const evos = EVOLUTIONS[name];
  if (!evos) return false;
  if (!dexState[name] || dexState[name].caught <= 0) return false;
  const candy = getCandy(name);
  return evos.some(e => candy >= e.candy);
}

function renderEvoList() {
  const list = document.getElementById('evoList');
  const prog = document.getElementById('evoProgress');

  const sources = Object.keys(EVOLUTIONS).filter(n => dexState[n] && dexState[n].caught > 0);

  if (sources.length === 0) {
    list.innerHTML = `<div class="evo-empty">
      還沒有可以進化的寶可夢<br>
      先去捕捉寶可夢，收集足夠的糖果吧！
    </div>`;
    prog.textContent = '';
    return;
  }

  let readyCount = 0;
  let html = '';

  sources.forEach(srcName => {
    const evos = EVOLUTIONS[srcName];
    const src = POKEDEX.find(p => p.name === srcName);
    if (!src) return;

    const candy = getCandy(srcName);

    evos.forEach(evo => {
      const tgt = POKEDEX.find(p => p.name === evo.to);
      if (!tgt) return;

      const enough = candy >= evo.candy;
      if (enough) readyCount++;

      const targetKnown = dexState[tgt.name] && (dexState[tgt.name].caught > 0 || dexState[tgt.name].seen > 0);

      html += `
        <div class="evo-item ${enough ? 'ready' : ''}">
          <div class="evo-sprites">
            <img src="${spriteUrl(src,false)}" alt="${src.name}"
                 onerror="this.outerHTML='<span style=&quot;font-size:36px&quot;>❓</span>'">
            <span class="evo-arrow">➜</span>
            <img src="${spriteUrl(tgt,false)}" alt="${tgt.name}"
                 onerror="this.outerHTML='<span style=&quot;font-size:36px&quot;>❓</span>'">
          </div>
          <div class="evo-info">
            <div class="evo-title">${src.name} → ${tgt.name}${!targetKnown ? ' <span style="color:#7dd3fc">(新!)</span>' : ''}</div>
            <div class="evo-candy-line ${enough ? '' : 'lack'}">
              <span class="candy-mini" style="width:12px;height:12px"></span>
              ${candy} / ${evo.candy} 糖果
            </div>
          </div>
          <button class="evo-btn" ${enough ? '' : 'disabled'}
                  data-src="${srcName}" data-to="${evo.to}">進化</button>
        </div>`;
    });
  });

  list.innerHTML = html;
  prog.textContent = `可進化 ${readyCount} 個分支`;

  list.querySelectorAll('.evo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      tryEvolve(btn.dataset.src, btn.dataset.to);
    });
  });
}

function tryEvolve(srcName, toName) {
  const evos = EVOLUTIONS[srcName];
  if (!evos) return;
  const evo = evos.find(e => e.to === toName);
  if (!evo) return;
  if (!dexState[srcName] || dexState[srcName].caught <= 0) return;
  if (getCandy(srcName) < evo.candy) return;

  const src = POKEDEX.find(p => p.name === srcName);
  const tgt = POKEDEX.find(p => p.name === toName);
  if (!src || !tgt) return;

  const ov = document.getElementById('evoOverlay');
  const animImg = document.getElementById('evoAnimImg');
  animImg.src = spriteUrl(src, false);
  animImg.style.display = '';
  animImg.onerror = () => { animImg.style.display='none'; };
  ov.style.display = 'flex';

  SFX.evolve();

  setTimeout(() => {
    ov.style.display = 'none';
    animImg.style.display = '';

    candyBag[srcName] -= evo.candy;

    dexState[tgt.name].seen = 1;
    dexState[tgt.name].caught++;

    caughtCount++;
    updateHUD();
    autoSave();

    toast(`🧬 ${srcName} 進化成 ${tgt.name}！`, 2600);

    renderEvoList();
  }, 2200);
}

document.getElementById('evoBtn').addEventListener('click', () => {
  renderEvoList();
  evoScreen.classList.remove('hidden');
});
document.getElementById('evoCloseBtn').addEventListener('click', () => {
  evoScreen.classList.add('hidden');
});

/* =========================================================
   15. 全螢幕
   ========================================================= */
const fsBtn = document.getElementById('fsBtn');

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
            document.mozFullScreenElement || document.msFullscreenElement);
}

function toggleFullscreen() {
  const el = document.documentElement;
  try {
    if (!isFullscreen()) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                  el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) {
        const p = req.call(el);
        if (p && p.catch) p.catch(() => toast('此裝置不支援全螢幕'));
      } else {
        toast('此裝置不支援全螢幕');
      }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.mozCancelFullScreen || document.msExitFullscreen;
      if (exit) {
        const p = exit.call(document);
        if (p && p.catch) p.catch(()=>{});
      }
    }
  } catch (e) {
    toast('此裝置不支援全螢幕');
  }
}

fsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleFullscreen();
});

function syncFsBtn() {
  fsBtn.classList.toggle('on', isFullscreen());
  fsBtn.textContent = isFullscreen() ? '⤡' : '⛶';
  setTimeout(() => { if (map) map.invalidateSize(); }, 260);
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
  .forEach(ev => document.addEventListener(ev, syncFsBtn));

/* =========================================================
   16. 計時器
   ========================================================= */
function startTimers() {
  setInterval(() => {
    const left = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
    const m = Math.floor(left / 60);
    const s = left % 60;
    document.getElementById('timerChip').textContent =
      `⏱ ${m}:${String(s).padStart(2, '0')}`;

    if (left <= 0) {
      refreshSpawns();
    }
  }, 1000);

  setInterval(checkDeviceTime, 20000);
}

function refreshSpawns() {
  /* 先把計時器重置，避免任何例外導致卡在 0:00 */
  nextRefreshAt = Date.now() + REFRESH_MS;

  /* 交換介面開啟時不刷新世界，避免清掉正在交換的 NPC */
  if (npcScreen && !npcScreen.classList.contains('hidden')) {
    toast('交換進行中，稍後刷新');
    return;
  }

  rollWeather();
  renderEnvironment();

  const center = playerLatLng || spawnCenter || DEFAULT_CENTER;
  spawnCenter = center;
  spawnPokemon(center);
  if (stopMarkers.length === 0) spawnStops(center);
  else resetStops();
  maybeSpawnNPC(center);

  const w = WEATHERS.find(x => x.id === env.weather) || WEATHERS[0];
  const t = env.time === 'day' ? '☀️ 白天' : '🌙 夜晚';
  toast(`${t} · ${w.icon}${w.name}　地圖已刷新！`);
}

/* =========================================================
   17. 啟動
   ========================================================= */
function spawnWorld(center) {
  spawnCenter = center;
  spawnPokemon(center);
  spawnStops(center);
  maybeSpawnNPC(center);
  nextRefreshAt = Date.now() + REFRESH_MS;
}

async function startGame() {
  if (gameStarted) return;
  gameStarted = true;

  audio.init();
  audio.playMap(env.time);
  SFX.init();

  initMap();
  updateHUD();

  rollWeather();
  renderEnvironment();

  placePlayer(DEFAULT_CENTER, false);
  spawnWorld(DEFAULT_CENTER);

  /* 嘗試自動恢復瀏覽器記住的進度 */
  const restored = loadAutoSave();
  if (restored) {
    toast('📂 已恢復上次遊戲進度', 2600);
  } else {
    autoSave();
  }

  startTimers();
  startGPS();

  document.getElementById('locateBtn').addEventListener('click', () => {
    if (manualMode) {
      setManualMode(false);
      toast('🛰 已切回 GPS 定位模式');
      if (playerLatLng) map.setView(playerLatLng, 17, { animate: true });
    } else if (document.body.classList.contains('gps-live')) {
      setManualMode(true);
      toast('🚶 已切換手動模式，可使用方向鍵移動');
    } else {
      if (playerLatLng) map.setView(playerLatLng, 17, { animate: true });
      toast('📍 回到你的位置');
    }
  });

  /* 右下角：切換生成式地圖 */
  document.getElementById('mapModeBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (mapFallbackActive) activateOsm(true);
    else activateProcedural(true);
  });

  /* 右下角：顯示／隱藏方向鍵 */
  document.getElementById('dpadToggleBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    forceDpad = !forceDpad;
    document.body.classList.toggle('force-dpad', forceDpad);
    document.getElementById('dpadToggleBtn').classList.toggle('on', forceDpad);
    toast(forceDpad ? '🕹 已顯示方向鍵（手動移動）' : '🕹 已隱藏方向鍵');
  });

  window.addEventListener('resize', () => {
    if (catchState === 'aim') {
      resetBallPosition(false);
      updateGroundLine();
    }
    if (map) map.invalidateSize();
  });
}

async function boot() {
  env.time = getTimeOfDay();

  document.getElementById('copyrightYear').textContent = new Date().getFullYear();

  const splash = document.getElementById('splash');
  const loadingScreen = document.getElementById('loadingScreen');
  let entered = false;

  const enter = async () => {
    if (entered) return;
    entered = true;
    splash.classList.add('fade');
    setTimeout(() => splash.remove(), 600);

    loadingScreen.classList.remove('hidden');

    try {
      await loadAllData();
    } catch (e) {
      console.error('加載失敗:', e);
      document.getElementById('loadSub').textContent =
        '加載失敗，請重新整理頁面。' + (e.message || '');
      return;
    }

    loadingScreen.classList.add('hidden');
    audio.init();
    SFX.init();
    SFX.resume();
    await startGame();
  };

  splash.addEventListener('pointerdown', enter);
  splash.addEventListener('click', enter);

  document.addEventListener('gesturestart', e => e.preventDefault());
  setInterval(checkDeviceTime, 20000);
}

/* =========================================================
   GPS / 方向鍵
   ========================================================= */
function startGPS() {
  if (!navigator.geolocation) { toast('此裝置不支援 GPS，請用方向鍵移動'); return; }
  navigator.geolocation.watchPosition(onPos, onGeoError, {
    enableHighAccuracy: true, maximumAge: 3000, timeout: 20000,
  });
}

function onPos(pos) {
  if (manualMode) return;
  const ll = [pos.coords.latitude, pos.coords.longitude];
  const recenter = firstFix;
  placePlayer(ll, recenter);

  document.body.classList.add('gps-live');

  if (firstFix) {
    firstFix = false;
    if (!spawnCenter || map.distance(L.latLng(spawnCenter), L.latLng(ll)) > 800) spawnWorld(ll);
    toast('📍 已定位到你的位置');
  }
}

function onGeoError(err) {
  if (firstFix) {
    toast('⚠️ 無法取得 GPS，請使用左下方向鍵移動');
    setManualMode(true);
  }
  document.body.classList.remove('gps-live');
  console.warn('Geolocation error:', err.message);
}

function setManualMode(on) {
  manualMode = on;
  const btn = document.getElementById('locateBtn');
  btn.classList.toggle('manual', on);
  btn.title = on ? '手動模式中（點擊恢復 GPS）' : '回到 GPS 位置';
  if (on) document.body.classList.remove('gps-live');
}

const dpad = { up:false, down:false, left:false, right:false };
let dpadRaf = null;

function startDpadLoop() {
  if (dpadRaf) return;
  let last = performance.now();
  const SPEED = 28;

  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    let dx = 0, dy = 0;
    if (dpad.up)    dy -= 1;
    if (dpad.down)  dy += 1;
    if (dpad.left)  dx -= 1;
    if (dpad.right) dx += 1;

    if ((dx || dy) && playerLatLng) {
      const bearing = Math.atan2(dx, -dy) * 180 / Math.PI;
      const move = SPEED * dt;
      const [lat, lng] = offsetLatLng(playerLatLng[0], playerLatLng[1], move, bearing);
      const ll = [lat, lng];
      placePlayer(ll, false);
      map.panTo(ll, { animate: false });
    }
    dpadRaf = requestAnimationFrame(tick);
  }
  dpadRaf = requestAnimationFrame(tick);
}

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const press = (e) => {
    e.preventDefault();
    if (!manualMode) setManualMode(true);
    dpad[dir] = true;
    btn.classList.add('on');
    startDpadLoop();
  };
  const release = (e) => {
    e.preventDefault();
    dpad[dir] = false;
    btn.classList.remove('on');
  };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

/* ===== 存檔按鈕事件 ===== */
document.getElementById('saveBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  downloadSave();
});
document.getElementById('loadBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('loadFileInput').click();
});
document.getElementById('loadFileInput').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  handleLoadFile(file);
  e.target.value = '';
});
document.getElementById('resetBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  resetGame();
});

/* 頁面隱藏時自動儲存，避免進度丟失 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') autoSave();
});

window.addEventListener('load', boot);
</script>
