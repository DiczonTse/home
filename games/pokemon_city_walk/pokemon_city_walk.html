<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🎊寵物小精靈 City Walk</title>
<!-- PWA 核心 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="🎊Pokemon City Walk">
<!-- iOS 图标（至少提供一个 180×180 或 192×192） -->
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0d1117;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    user-select:none}

  #splash{position:fixed;inset:0;z-index:9000;
    background:linear-gradient(180deg,#4a90e2 0%,#87CEEB 40%,#7ab648 100%);
    display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  #splash::before{content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.18),transparent 60%)}
  .splash-frame{position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    border-radius:16px;overflow:hidden;background:#0d1117;
    box-shadow:0 22px 70px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.22);
    z-index:1}
  .splash-frame img{width:100%;height:100%;object-fit:cover;display:block}
  .splash-text{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
    color:#fff;font-size:17px;font-weight:900;letter-spacing:2px;
    text-shadow:0 0 20px rgba(255,255,255,.7),0 2px 12px rgba(0,0,0,.95);
    animation:splashBlink 1.4s ease-in-out infinite;white-space:nowrap;
    padding:9px 20px;border-radius:999px;background:rgba(0,0,0,.32);
    backdrop-filter:blur(4px)}
  .splash-copyright{position:absolute;left:0;right:0;bottom:10px;text-align:center;
    color:rgba(255,255,255,.9);font-size:11px;font-weight:700;letter-spacing:.5px;
    text-shadow:0 1px 8px rgba(0,0,0,.9);z-index:3;padding:0 10px}
  @keyframes splashBlink{0%,100%{opacity:.25}50%{opacity:1}}
  #splash.fade{opacity:0;pointer-events:none;transition:opacity .55s}

  #loadingScreen{position:fixed;inset:0;z-index:9500;
    background:rgba(10,15,25,.92);backdrop-filter:blur(10px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;color:#fff;font-family:inherit}
  #loadingScreen.hidden{display:none!important}
  .load-title{font-size:20px;font-weight:900;letter-spacing:2px;
    text-shadow:0 0 20px rgba(162,155,254,.7)}
  .load-sub{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);
    min-height:20px;text-align:center;padding:0 20px;max-width:320px}
  .load-bar-wrap{width:min(280px, 70vw);height:10px;border-radius:8px;
    background:rgba(255,255,255,.12);overflow:hidden;
    border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 20px rgba(0,0,0,.4)}
  #loadBar{height:100%;width:0%;border-radius:8px;
    background:linear-gradient(90deg,#a29bfe,#6c5ce7,#4285f4);
    transition:width .2s linear;box-shadow:0 0 16px rgba(108,92,231,.8)}
  #loadPct{font-size:15px;font-weight:800;color:#ffd166;letter-spacing:1px}
  .load-spinner{width:34px;height:34px;border-radius:50%;
    border:4px solid rgba(255,255,255,.2);border-top-color:#a29bfe;
    animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  #map{position:absolute;inset:0;background:#9ec9a3;z-index:1}
  .leaflet-tile-pane{filter:saturate(1.05) brightness(1.02)}
  .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.6)!important}

  #nightTint{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(circle at 50% 40%,rgba(20,30,70,.35),rgba(5,10,30,.62));
    opacity:0;transition:opacity .8s}
  #nightTint.on{opacity:1}

  .player-wrap{position:relative;width:44px;height:44px}
  .player-wrap .ring{position:absolute;inset:0;border-radius:50%;
    background:rgba(66,133,244,.45);animation:pulse 2s ease-out infinite}
  .player-wrap .dot{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;background:#4285f4;border:3px solid #fff;
    box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 18px #4285f4}
  @keyframes pulse{0%{transform:scale(.35);opacity:.95}100%{transform:scale(1.7);opacity:0}}

  .spawn{position:relative;width:64px;height:72px;cursor:pointer}
  .spawn-gif{position:absolute;left:50%;bottom:2px;width:56px;height:56px;margin-left:-28px;
	object-fit:contain;image-rendering:pixelated;z-index:2;
	animation:spawnIdle 2.6s ease-in-out infinite;pointer-events:none}
  .spawn-shadow{position:absolute;left:50%;bottom:1px;width:42px;height:11px;margin-left:-21px;
	border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.5),rgba(0,0,0,0) 78%);
	z-index:1;animation:shadowIdle 2.6s ease-in-out infinite;pointer-events:none}
  .spawn-fallback{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
	font-size:38px;line-height:1;z-index:2;animation:spawnIdle 2.6s ease-in-out infinite}
  @keyframes spawnIdle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.02)}}
  @keyframes shadowIdle{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.95);opacity:.42}}

  .spawn.shiny .spawn-gif{
	filter:drop-shadow(0 0 10px #ffd166) drop-shadow(0 0 22px #ffb703);
	animation:spawnIdle 2.6s ease-in-out infinite,shinyGlow 1.3s ease-in-out infinite alternate}
  @keyframes shinyGlow{from{filter:drop-shadow(0 0 8px #ffd166) drop-shadow(0 0 18px #ffb703)}
    to{filter:drop-shadow(0 0 16px #ffd166) drop-shadow(0 0 34px #ffb703) brightness(1.2)}}

  /* ===== NPC 圖標 ===== */
  .npc{position:relative;width:56px;height:64px;cursor:pointer}
  .npc-emoji{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font-size:40px;line-height:1;z-index:2;
    animation:bob 2s ease-in-out infinite;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.55))}
  .npc-ring{position:absolute;left:50%;bottom:2px;width:44px;height:10px;margin-left:-22px;
    border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,209,102,.55),rgba(255,209,102,0) 78%);
    z-index:1;animation:npcRing 2.4s ease-in-out infinite}
  @keyframes npcRing{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.3);opacity:.3}}
  .npc-badge{position:absolute;left:50%;top:-4px;transform:translateX(-50%);
    background:rgba(255,209,102,.95);color:#5a3d00;
    font-size:9px;font-weight:900;padding:2px 7px;border-radius:999px;
    white-space:nowrap;z-index:3;letter-spacing:.5px;
    box-shadow:0 2px 8px rgba(0,0,0,.4)}

  .stop{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:20px;color:#fff;cursor:pointer;
    background:conic-gradient(#6c5ce7 0 45deg,#a29bfe 45deg 90deg,#6c5ce7 90deg 135deg,#a29bfe 135deg 180deg,
      #6c5ce7 180deg 225deg,#a29bfe 225deg 270deg,#6c5ce7 270deg 315deg,#a29bfe 315deg 360deg);
    border:3px solid #fff;box-shadow:0 0 16px #6c5ce7;
    animation:spinSlow 7s linear infinite}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  .stop.used{animation:none;background:rgba(120,120,140,.9);box-shadow:none;filter:grayscale(1);
    opacity:.55;font-size:22px}

  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:62px;
    display:flex;gap:8px;z-index:1000;pointer-events:none;flex-wrap:wrap}
  .chip{background:rgba(15,20,32,.82);color:#fff;font-size:14px;font-weight:700;
    padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);
    backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.4);
    display:inline-flex;align-items:center;gap:6px}
  .chip-btn{pointer-events:auto;cursor:pointer;font-family:inherit;transition:transform .1s}
  .chip-btn:active{transform:scale(.94)}

  #fsBtn{position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;
    width:44px;height:44px;border-radius:50%;z-index:1600;
    background:rgba(15,20,32,.85);color:#fff;
    border:1.5px solid rgba(255,255,255,.25);
    font-size:19px;line-height:1;cursor:pointer;
    backdrop-filter:blur(8px);
    box-shadow:0 4px 14px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s,background .2s}
  #fsBtn:active{transform:scale(.9)}
  #fsBtn.on{background:rgba(66,133,244,.9);border-color:#fff}

  .ball-mini{display:inline-block;width:16px;height:16px;border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #fff 0 16%, #1a1a1a 16% 27%, transparent 27%),
      linear-gradient(#ee1515 0 45%,#1a1a1a 45% 55%,#ffffff 55% 100%);
    border:1.5px solid #1a1a1a;position:relative;flex:0 0 auto;
    box-shadow:0 0 6px rgba(238,21,21,.5)}

  .candy-mini{display:inline-block;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,#fff,#ffb703 70%);
    border:1.5px solid #b37400;flex:0 0 auto;box-shadow:0 0 5px rgba(255,183,3,.6)}

  #dpad{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);
    gap:3px;z-index:1000;opacity:.92;transition:opacity .25s}
  body.gps-live #dpad{display:none}
  .dpad-btn{background:rgba(15,20,32,.85);border:2px solid rgba(255,255,255,.2);
    color:#fff;border-radius:12px;font-size:16px;cursor:pointer;
    backdrop-filter:blur(8px);box-shadow:0 4px 12px rgba(0,0,0,.4);
    user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center}
  .dpad-btn[data-dir="up"]   {grid-area:1/2}
  .dpad-btn[data-dir="left"] {grid-area:2/1}
  .dpad-btn[data-dir="right"]{grid-area:2/3}
  .dpad-btn[data-dir="down"] {grid-area:3/2}
  .dpad-btn:active,.dpad-btn.on{background:rgba(66,133,244,.95);transform:scale(.94)}

  #rightStack{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    display:flex;flex-direction:column;align-items:center;gap:10px;z-index:1000}
  #rightStack button{border-radius:50%;border:2px solid rgba(255,255,255,.25);
    background:rgba(15,20,32,.85);color:#fff;cursor:pointer;
    backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s,background .2s}
  #rightStack button:active{transform:scale(.92)}
  #locateBtn{width:52px;height:52px;font-size:24px}
  #locateBtn.manual{background:rgba(66,133,244,.9);border-color:#fff}
  #mapModeBtn,#dpadToggleBtn{width:46px;height:46px;font-size:19px}
  #mapModeBtn.on{background:rgba(122,182,72,.92);border-color:#fff}
  #dpadToggleBtn.on{background:rgba(108,92,231,.92);border-color:#fff}
  body.force-dpad #dpad{display:grid !important}

  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);
    transform:translateX(-50%) translateY(-14px);
    background:rgba(15,20,32,.92);color:#fff;padding:10px 20px;border-radius:999px;
    font-size:14px;font-weight:600;border:1.5px solid rgba(255,255,255,.2);z-index:3000;
    opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .ball-bubble{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);
    background:rgba(255,255,255,.96);color:#1a1a1a;font-weight:900;font-size:22px;
    padding:14px 26px 14px 18px;border-radius:999px;
    box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 50px rgba(108,92,231,.65);
    z-index:4000;display:flex;align-items:center;gap:12px;
    animation:bubblePop 1.7s cubic-bezier(.3,1.4,.5,1) forwards;pointer-events:none}
  .ball-bubble::before{content:'';width:30px;height:30px;border-radius:50%;flex:0 0 auto;
    background:
      radial-gradient(circle at 50% 50%, #fff 0 16%, #1a1a1a 16% 27%, transparent 27%),
      linear-gradient(#ee1515 0 45%,#1a1a1a 45% 55%,#fff 55% 100%);
    border:2.5px solid #1a1a1a}
  .ball-bubble .bub-txt{color:#6c5ce7;font-size:24px;font-weight:900}
  @keyframes bubblePop{
    0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
    38%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    72%{opacity:1;transform:translate(-50%,-78%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-150%) scale(.9)}}

  .pokeball{border-radius:50%;
    background:linear-gradient(#ee1515 0 45%,#1a1a1a 45% 55%,#ffffff 55% 100%);
    border:3px solid #1a1a1a;position:relative}
  .pokeball::after{content:'';position:absolute;left:50%;top:50%;width:28%;height:28%;border-radius:50%;
    background:#fff;border:3px solid #1a1a1a;transform:translate(-50%,-50%)}

  .overlay{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
  .hidden{display:none!important}

  #catchScreen{overflow:hidden}
  #sceneBg{position:absolute;inset:0;z-index:0;pointer-events:none}
  #sceneBg .sky{position:absolute;left:0;right:0;top:0;
    height:var(--groundY,42%);transition:height .4s,background .4s}
  #sceneBg .ground{position:absolute;left:0;right:0;
    top:var(--groundY,42%);bottom:0;transition:top .4s,background .4s}

  #catchScreen.day #sceneBg .sky{background:linear-gradient(180deg,#3d7fd6 0%,#6db3e8 45%,#b8e0f0 100%)}
  #catchScreen.day #sceneBg .ground{background:linear-gradient(180deg,#a8d870 0%,#8fc850 12%,#7ab648 45%,#5a9a30 100%)}
  #catchScreen.night #sceneBg .sky{background:linear-gradient(180deg,#050820 0%,#0f1838 50%,#1a2545 100%)}
  #catchScreen.night #sceneBg .ground{background:linear-gradient(180deg,#2a4a2a 0%,#1a3520 30%,#0f2412 100%)}

  #stars{position:absolute;left:0;right:0;top:0;height:var(--groundY,42%);
    pointer-events:none;z-index:1;display:none;overflow:hidden}
  #catchScreen.night #stars{display:block}
  .star{position:absolute;background:#fff;border-radius:50%;
    box-shadow:0 0 4px rgba(255,255,255,.9);animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

  .catch-top{display:flex;justify-content:center;align-items:center;position:relative;
    min-height:44px;z-index:3}
  .catch-name{color:#fff;font-size:19px;font-weight:800;letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,.7);text-align:center;padding:0 46px}
  .catch-name.shiny{color:#ffd166;text-shadow:0 0 18px #ffb703,0 2px 10px rgba(0,0,0,.85)}
  #fleeBtn{position:absolute;right:0;top:0;background:rgba(0,0,0,.32);color:#fff;
    border:2px solid rgba(255,255,255,.3);
    width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}

  .catch-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    touch-action:none;overflow:hidden;z-index:3}

  .wild{position:relative;z-index:2}
  .mon{position:relative;width:190px;height:180px;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;
    transition:transform .28s cubic-bezier(.4,0,.9,.4),opacity .28s}
  .mon img{width:148px;height:148px;object-fit:contain;image-rendering:pixelated;
    position:relative;z-index:2;pointer-events:none;
    animation:monIdle 2.4s ease-in-out infinite}
  .mon-fallback{font-size:88px;line-height:1;position:relative;z-index:2;
    animation:monIdle 2.4s ease-in-out infinite}
  .mon::after{content:'';position:absolute;left:50%;bottom:16px;width:130px;height:26px;
    margin-left:-65px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.5) 0%,rgba(0,0,0,.25) 48%,rgba(0,0,0,0) 76%);
    z-index:1;pointer-events:none;
    animation:monShadowIdle 2.4s ease-in-out infinite}
  @keyframes monIdle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.015)}}
  @keyframes monShadowIdle{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(.96);opacity:.7}}

  .mon.shiny img{filter:drop-shadow(0 0 14px #ffd166) drop-shadow(0 0 30px #ffb703)
    drop-shadow(0 0 48px rgba(255,183,3,.45))}
  .mon.shiny::after{background:radial-gradient(ellipse at center,rgba(255,183,3,.55) 0%,rgba(255,183,3,.2) 50%,rgba(0,0,0,0) 78%)}

  .wild.absorbed .mon{transform:scale(.08);opacity:0}
  .wild.absorbed .mon img,
  .wild.absorbed .mon-fallback{animation-play-state:paused}

  /* ===== 精靈逃跑動畫 ===== */
  .wild.fleeing .mon{
    animation:monFlee .9s cubic-bezier(.4,0,.75,1) forwards;
  }
  @keyframes monFlee{
    0%   {transform:translate(0,0) scale(1) rotate(0deg);opacity:1}
    18%  {transform:translate(-12px,-10px) scale(1.06) rotate(-7deg);opacity:1}
    36%  {transform:translate(14px,-18px) scale(1.08) rotate(7deg);opacity:1}
    60%  {transform:translate(-8px,-32px) scale(1.05) rotate(-5deg);opacity:.95}
    100% {transform:translate(64px,-124px) scale(.12) rotate(24deg);opacity:0}
  }
  .wild.fleeing .mon::after{animation:none;opacity:0}

  #ballFly{position:absolute;left:0;top:0;width:56px;height:56px;
    display:block;z-index:6;pointer-events:none;will-change:transform}

  .catch-star{position:absolute;color:#ffd166;font-size:26px;font-weight:900;
    pointer-events:none;z-index:10;opacity:0;
    text-shadow:0 0 12px #ffd166,0 0 24px #ffb703,0 0 40px rgba(255,183,3,.6);
    transform:translate(0,0) scale(.3);
    animation:starPop 1.3s cubic-bezier(.25,1.3,.5,1) forwards}
  @keyframes starPop{
    0%{opacity:0;transform:translate(0,0) scale(.2) rotate(-30deg)}
    18%{opacity:1;transform:translate(var(--dx,0),var(--dy,-30px)) scale(1.3) rotate(0deg)}
    45%{opacity:1;transform:translate(var(--dx,0),var(--dy,-30px)) scale(1) rotate(20deg)}
    75%{opacity:1;transform:translate(calc(var(--dx,0px)*1.15),calc(var(--dy,-30px)*1.15)) scale(.95) rotate(40deg)}
    100%{opacity:0;transform:translate(calc(var(--dx,0px)*1.25),calc(var(--dy,-30px)*1.25 - 22px)) scale(.5) rotate(60deg)}}

  #trail{position:absolute;height:5px;border-radius:5px;
    background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.9));
    transform-origin:0 50%;pointer-events:none;display:none;z-index:20}

  .swipe-hint{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.9);font-size:13px;font-weight:800;letter-spacing:1px;
    pointer-events:none;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.85);
    animation:hintPulse 2s ease-in-out infinite;z-index:4}
  @keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:1}}

  #powerWrap{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);
    width:180px;height:10px;border-radius:6px;background:rgba(0,0,0,.35);
    overflow:hidden;display:none;z-index:15;border:1px solid rgba(255,255,255,.4)}
  #powerFill{height:100%;width:0%;border-radius:6px;transition:width .05s linear;
    background:linear-gradient(90deg,#4ade80,#facc15,#f87171)}

  .catch-result{min-height:34px;text-align:center;color:#fff;font-size:19px;font-weight:800;
    text-shadow:0 2px 12px rgba(0,0,0,.85);transition:.2s;z-index:3}

  .catch-footer{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
  .ball-tip{color:rgba(255,255,255,.92);font-size:14px;font-weight:800;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
    display:inline-flex;align-items:center;gap:6px}
  .ball-tip b{color:#ffd166;font-size:16px}
  .ball-tip.sub{font-size:12px;color:rgba(255,255,255,.72);font-weight:700;letter-spacing:.5px}

  /* ===== 補給站 ===== */

}

async function loadAllSpecies() {
  const speciesList = new Array(TOTAL_POKEMON).fill(null);
  const totalBatches = Math.ceil(TOTAL_POKEMON / BATCH_SIZE);

  for (let batch = 0; batch < totalBatches; batch++) {
    const start = batch * BATCH_SIZE + 1;
    const end = Math.min(start + BATCH_SIZE - 1, TOTAL_POKEMON);
    const urls = [];
    for (let id = start; id <= end; id++) {
      urls.push(`${API}/pokemon-species/${id}`);
    }

    const results = await Promise.allSettled(
      urls.map(url => fetch(url).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }))
    );

    results.forEach((res, idx) => {
      const id = start + idx;
      if (res.status === 'fulfilled') {
        speciesList[id - 1] = res.value;
      } else {
        console.warn(`Species #${id} failed:`, res.reason);
      }
    });

    const loaded = Math.min(end, TOTAL_POKEMON);
    updateProgress(loaded, TOTAL_POKEMON, `已載入 ${loaded} / ${TOTAL_POKEMON} 隻寶可夢資料…`);
    await new Promise(r => setTimeout(r, 50));
  }

  return speciesList;
}

function extractChineseName(species) {
  if (!species || !species.names) return null;
  const zhHant = species.names.find(n => n.language.name === 'zh-hant');
  if (zhHant) return zhHant.name;
  const zhHans = species.names.find(n => n.language.name === 'zh-hans');
  if (zhHans) return zhHans.name;
  return null;
}

function buildEvolutionsFromChains(speciesList) {
  const evolutions = {};
  const parentMap = {};

  speciesList.forEach(species => {
    if (!species) return;
    const childId = species.id;
    const parent = species.evolves_from_species;
    if (parent) {
      const parentId = parseInt(parent.url.split('/').filter(Boolean).pop());
      parentMap[childId] = parentId;
    }
  });

  const idToName = {};
  speciesList.forEach(species => {
    if (!species) return;
    const zh = extractChineseName(species);
    if (zh) {
      idToName[species.id] = zh;
      nameById[species.id] = zh;
    }
  });

  const childrenMap = {};
  Object.entries(parentMap).forEach(([childId, parentId]) => {
    if (!childrenMap[parentId]) childrenMap[parentId] = [];
    childrenMap[parentId].push(parseInt(childId));
  });

  function isMiddleStage(id) {
    return parentMap[id] !== undefined && childrenMap[id] && childrenMap[id].length > 0;
  }

  function isBaseStage(id) {
    if (parentMap[id] !== undefined) return false;
    if (!childrenMap[id] || childrenMap[id].length === 0) return false;
    return childrenMap[id].some(childId => childrenMap[childId] && childrenMap[childId].length > 0);
  }

  function getCandyCount(parentId, childId) {
    if ((parentId === 10 || parentId === 13 || parentId === 16) && childrenMap[parentId]?.includes(childId)) {
      return 12;
    }
    if ((parentId === 11 || parentId === 14 || parentId === 17)) {
      return 50;
    }
    if (parentId === 19) return 25;
    if (parentId === 129) return 400;
    if (parentId === 133) return 25;
    if (isBaseStage(parentId)) return 25;
    if (isMiddleStage(parentId)) return 100;
    return 50;
  }

  Object.entries(parentMap).forEach(([childIdStr, parentId]) => {
    const childId = parseInt(childIdStr);
    const parentName = idToName[parentId];
    const childName = idToName[childId];
    if (!parentName || !childName) return;

    if (!evolutions[parentName]) evolutions[parentName] = [];
    evolutions[parentName].push({
      to: childName,
      candy: getCandyCount(parentId, childId)
    });
  });

  return evolutions;
}

async function loadAllData() {
  updateProgress(0, TOTAL_POKEMON, '正在獲取寶可夢圖鑑資料…');
  const speciesList = await loadAllSpecies();

  const pokedex = [];
  speciesList.forEach((species, idx) => {
    const id = idx + 1;
    if (!species) return;
    const zhName = extractChineseName(species) || `#${id}`;
    nameById[id] = zhName;
    pokedex.push({
      id,
      name: zhName,
      emoji: '❓',
      color: '#888',
      rate: 0.35,
      w: 0,
      notWild: false,
    });
  });

  updateProgress(TOTAL_POKEMON, TOTAL_POKEMON, '正在構建進化鏈…');
  const evolutions = buildEvolutionsFromChains(speciesList);

  const parentExists = {};
  speciesList.forEach(species => {
    if (species && species.evolves_from_species) {
      parentExists[species.id] = true;
    }
  });

  pokedex.forEach(p => {
    if (parentExists[p.id]) {
      p.notWild = true;
      p.w = 0;
    } else {
      p.notWild = false;
      p.w = 10;
      if (p.id === 129) p.w = 12;
      if (p.id === 10 || p.id === 13 || p.id === 16) p.w = 11;
      if (p.id === 133) p.w = 6;
      if (p.id === 147) p.w = 3;
      if (p.id === 150) p.w = 1;
      if (p.id === 151) p.w = 1;
    }
  });

  POKEDEX = pokedex;
  EVOLUTIONS = evolutions;

  POKEDEX.forEach(p => {
    dexState[p.name] = { seen: 0, caught: 0, shiny: 0 };
    candyBag[p.name] = 0;
  });

  POKEDEX.forEach(p => { p.emoji = '❓'; });

  console.log(`✅ 全圖鑑載入完成：${POKEDEX.length} 隻寶可夢，${Object.keys(EVOLUTIONS).length} 組進化鏈`);
}

const audio = {
  mapDay:null, mapNight:null, catchDay:null, catchNight:null, trade:null,
  current:null, ready:false, inited:false,

  init() {
    if (this.inited) return;
    this.inited = true;
    try {
      this.mapDay     = new Audio('Pokemon City Walk - Sun Walk.mp3');     this.mapDay.loop = true;     this.mapDay.volume = 1.0;
      this.mapNight   = new Audio('Pokemon City Walk - Moon Walk.mp3');   this.mapNight.loop = true;   this.mapNight.volume = 1.0;

      this.ready = true;
    } catch (e) { console.warn('Audio init failed:', e); }
  },

  _stopAll() {
    [this.mapDay, this.mapNight, this.catchDay, this.catchNight, this.trade].forEach(a => {
      if (a) { try { a.pause(); a.currentTime = 0; } catch(_){} }
    });
    this.current = null;
  },

  playMap(time) {
    if (!this.ready) return;
    this._stopAll();
    const track = (time === 'day') ? this.mapDay : this.mapNight;
    if (track) { track.play().catch(()=>{}); this.current = track; }
  },

  playCatch(time) {
    if (!this.ready) return;
    this._stopAll();
    const track = (time === 'day') ? this.catchDay : this.catchNight;
    if (track) { track.play().catch(()=>{}); this.current = track; }
  },

  playTrade() {
    if (!this.ready) return;
    this._stopAll();
    if (this.trade) { this.trade.play().catch(()=>{}); this.current = this.trade; }
  },

  stopCatch() {
    if (!this.ready) return;
    try { this.catchDay.pause(); this.catchDay.currentTime = 0; } catch(_){}
    try { this.catchNight.pause(); this.catchNight.currentTime = 0; } catch(_){}
    this.current = null;
  },
};

   ========================================================= */
const SFX = {
  ctx:null, master:null, _nb:null,

  init() {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 1.0;
      this.master.connect(this.ctx.destination);
    } catch(e) { console.warn('SFX init failed:', e); }
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
  },

  _noiseBuf() {
    if (this._nb) return this._nb;
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * 0.7);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._nb = buf;
    return buf;
  },

  tone(o) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + (o.delay || 0);
    const dur = o.dur || 0.15;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, o.freq), t0);
    if (o.freq2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freq2), t0 + dur);
    const peak = (o.gain == null) ? 0.2 : o.gain;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },

  noise(o) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + (o.delay || 0);
    const dur = o.dur || 0.2;
    const src = ctx.createBufferSource();
    src.buffer = this._noiseBuf();
    const flt = ctx.createBiquadFilter();
    flt.type = o.type || 'bandpass';
    flt.Q.value = (o.q == null) ? 1 : o.q;
    flt.frequency.setValueAtTime(Math.max(20, o.f0 || 800), t0);
    if (o.f1) flt.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
    const g = ctx.createGain();
    const peak = (o.gain == null) ? 0.2 : o.gain;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },

  throwBall() {
    this.noise({ dur:0.22, gain:1.0, type:'bandpass', f0:500, f1:2600, q:1.2 });
    this.tone({ freq:260, freq2:720, type:'triangle', dur:0.18, gain:1.0 });
  },
  hit() {
    this.noise({ dur:0.10, gain:0.32, type:'lowpass', f0:1600, f1:260, q:0.8 });
    this.tone({ freq:200, freq2:70, type:'sine', dur:0.16, gain:0.22 });
  },
  wobble(n) {
    const base = 460 + (n || 0) * 70;
    this.tone({ freq:base, freq2:base * 0.7, type:'triangle', dur:0.12, gain:0.14 });
    this.tone({ freq:base * 2, type:'sine', dur:0.07, gain:0.05 });
  },
  caught() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      this.tone({ freq:f, type:'triangle', dur:0.26, gain:0.16, delay:i * 0.10 });
      this.tone({ freq:f * 2, type:'sine', dur:0.18, gain:0.05, delay:i * 0.10 });
    });
    this.noise({ dur:0.5, gain:0.05, type:'highpass', f0:3000, delay:0.32 });
  },
  catchFail() {
    [392, 329.63, 246.94].forEach((f, i) => {
      this.tone({ freq:f, freq2:f * 0.9, type:'sawtooth', dur:0.28, gain:0.10, delay:i * 0.13 });
    });
    this.tone({ freq:110, freq2:68, type:'sine', dur:0.5, gain:0.12, delay:0.26 });
  },
  spin() {
    this.noise({ dur:0.85, gain:0.12, type:'bandpass', f0:350, f1:2400, q:2.2 });
    this.tone({ freq:300, freq2:900, type:'triangle', dur:0.8, gain:0.06 });
  },
  reward() {
    [880, 1174.66, 1567.98].forEach((f, i) => {
      this.tone({ freq:f, type:'sine', dur:0.18, gain:0.12, delay:i * 0.07 });
    });
  },
  evolve() {
    this.noise({ dur:1.6, gain:0.10, type:'bandpass', f0:400, f1:4200, q:1.5 });
    [261.63, 329.63, 392.0, 523.25, 659.25].forEach((f, i) => {
      this.tone({ freq:f, type:'triangle', dur:0.5, gain:0.10, delay:0.22 + i * 0.18 });
    });
    this.noise({ dur:0.6, gain:0.08, type:'highpass', f0:5200, delay:1.3 });
  },
  bubble() {
    this.tone({ freq:700, freq2:1500, type:'sine', dur:0.10, gain:0.16 });
    this.tone({ freq:1400, freq2:2200, type:'sine', dur:0.08, gain:0.08, delay:0.06 });
  },
  npcAppear() {
    this.tone({ freq:660, freq2:990, type:'sine', dur:0.12, gain:0.12 });
    this.tone({ freq:990, freq2:1320, type:'sine', dur:0.10, gain:0.08, delay:0.10 });
  },
  tradeStart() {
    this.noise({ dur:0.5, gain:0.10, type:'bandpass', f0:600, f1:1800, q:1.5 });
    this.tone({ freq:523.25, type:'triangle', dur:0.2, gain:0.12 });

  },
  tradeWhoosh() {
    this.noise({ dur:0.6, gain:0.14, type:'bandpass', f0:300, f1:2800, q:2 });
  },
  coinSpin() {
    [1318.5, 1567.98, 1760, 2093, 1567.98, 1318.5].forEach((f, i) => {
      this.tone({ freq:f, type:'sine', dur:0.18, gain:0.055, delay:0.10 + i * 0.115 });
      this.tone({ freq:f * 1.5, type:'sine', dur:0.10, gain:0.022, delay:0.10 + i * 0.115 });
    });
    this.noise({ dur:1.5, gain:0.04, type:'highpass', f0:4200 });
  },
  flee() {
    this.noise({ dur:0.5, gain:0.15, type:'bandpass', f0:2200, f1:260, q:1.4 });

      this.tone({ freq:f, freq2:f * 0.55, type:'triangle', dur:0.14, gain:0.10, delay:i * 0.075 });
    });
    this.tone({ freq:170, freq2:70, type:'sine', dur:0.42, gain:0.11, delay:0.18 });
  },
};

function getTimeOfDay() {

function toast(msg, ms = 2200) {
  const el = document.getElementById('toast');

  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);

function offsetLatLng(lat, lng, distM, bearingDeg) {
  const R = 6371000;
  const brng = bearingDeg * Math.PI / 180;
  const lat1 = lat * Math.PI / 180;
  const lng1 = lng * Math.PI / 180;
  const lat2 = Math.asin(
    Math.sin(lat1) * Math.cos(distM / R) +
    Math.cos(lat1) * Math.sin(distM / R) * Math.cos(brng)
  );
  const lng2 = lng1 + Math.atan2(
    Math.sin(brng) * Math.sin(distM / R) * Math.cos(lat1),
    Math.cos(distM / R) - Math.sin(lat1) * Math.sin(lat2)
  );
  return [lat2 * 180 / Math.PI, lng2 * 180 / Math.PI];
}

function pickPokemon() {
  const pool = POKEDEX.filter(p => {
    if (p.notWild) return false;
    if (p.w <= 0) return false;
    if (p.time && p.time !== 'any' && p.time !== env.time) return false;
    if (p.weather && p.weather !== 'any' && !p.weather.includes(env.weather)) return false;
    return true;
  });
  const list = pool.length ? pool : POKEDEX.filter(p => !p.notWild && p.w > 0);
  if (!list.length) return null;
  const total = list.reduce((s, p) => s + p.w, 0);
  let r = Math.random() * total;
  for (const p of list) { r -= p.w; if (r <= 0) return p; }
  return list[0];
}

function collectSaveData() {
  const dex = {};
  Object.keys(dexState).forEach(k => {
    const s = dexState[k];
    if (s.seen || s.caught || s.shiny) {
      dex[k] = { seen: s.seen, caught: s.caught, shiny: s.shiny };
    }
  });
  const candy = {};
  Object.keys(candyBag).forEach(k => {
    if (candyBag[k] > 0) candy[k] = candyBag[k];
  });
  return {
    version: 1,
    savedAt: new Date().toISOString(),
    balls,
    caughtCount,
    dexState: dex,
    candyBag: candy,
  };
}

function applySaveData(data) {
  if (!data || typeof data !== 'object') return false;

  if (typeof data.balls === 'number') balls = Math.max(0, data.balls | 0);
  if (typeof data.caughtCount === 'number') caughtCount = Math.max(0, data.caughtCount | 0);

  Object.keys(dexState).forEach(k => { dexState[k] = { seen:0, caught:0, shiny:0 }; });
  if (data.dexState && typeof data.dexState === 'object') {
    Object.keys(data.dexState).forEach(k => {
      if (!dexState[k]) return;
      const s = data.dexState[k] || {};
      dexState[k].seen = s.seen || 0;
      dexState[k].caught = s.caught || 0;
      dexState[k].shiny = s.shiny || 0;
    });
  }

  Object.keys(candyBag).forEach(k => { candyBag[k] = 0; });
  if (data.candyBag && typeof data.candyBag === 'object') {
    Object.keys(data.candyBag).forEach(k => {
      if (k in candyBag && typeof data.candyBag[k] === 'number') {
        candyBag[k] = Math.max(0, data.candyBag[k] | 0);
      }
    });
  }

  updateHUD();
  return true;
}

function autoSave() {
  if (!gameStarted) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(collectSaveData()));
  } catch (e) {
    console.warn('autoSave failed:', e);
  }
}

function loadAutoSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    return applySaveData(data);
  } catch (e) {
    console.warn('loadAutoSave failed:', e);
    return false;
  }
}

function downloadSave() {
  const data = collectSaveData();
  const text = JSON.stringify(data, null, 2);
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  a.href = url;
  a.download = `pokemon_city_walk_save_${ts}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  autoSave();
  toast('💾 已匯出存檔 .txt');
}

function handleLoadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!applySaveData(data)) {
        toast('❌ 存檔格式錯誤');
        return;
      }
      autoSave();
      toast('📂 存檔已載入');
      if (!dexScreen.classList.contains('hidden')) renderDex();
      if (!evoScreen.classList.contains('hidden')) renderEvoList();
      const center = playerLatLng || spawnCenter || DEFAULT_CENTER;
      spawnWorld(center);
    } catch (e) {
      console.warn('load file failed:', e);
      toast('❌ 無法讀取存檔');
    }
  };
  reader.readAsText(file);
}

function resetGame() {
  if (!confirm('確定要重設所有遊戲進度嗎？此操作無法復原。')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  balls = 20;
  caughtCount = 0;
  Object.keys(dexState).forEach(k => { dexState[k] = { seen:0, caught:0, shiny:0 }; });
  Object.keys(candyBag).forEach(k => { candyBag[k] = 0; });
  updateHUD();
  const center = playerLatLng || spawnCenter || DEFAULT_CENTER;
  spawnWorld(center);
  toast('🗑 遊戲進度已重設');
  autoSave();
}

/* =========================================================
   7. 程序化地圖
   ========================================================= */
function _rand2(ix, iy, seed) {
  let h = (Math.imul(ix | 0, 374761393)
         + Math.imul(iy | 0, 668265263)
         + Math.imul(seed | 0, 1013904223)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = (h ^ (h >>> 16)) >>> 0;
  return h / 4294967296;
}

function _vnoise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx);
  const v = fy * fy * (3 - 2 * fy);
  const a = _rand2(ix, iy, seed);
  const b = _rand2(ix + 1, iy, seed);
  const c = _rand2(ix, iy + 1, seed);
  const d = _rand2(ix + 1, iy + 1, seed);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}

function _fbm(x, y, seed) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 4; i++) {
    val += _vnoise(x * freq, y * freq, seed + i) * amp;
    amp *= 0.5; freq *= 2;
  }
  return val;
}

const MAP_REF_ZOOM = 17;

const ProgMapLayer = L.GridLayer.extend({
  options: { tileSize: 256, keepBuffer: 4, updateWhenIdle: false, noWrap: true },
  createTile: function(coords, done) {
    const size = this.options.tileSize;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');

    const N = 24;
    const cell = size / N;
    const scale = Math.pow(2, MAP_REF_ZOOM - coords.z);
    const wx0 = coords.x * size * scale;
    const wy0 = coords.y * size * scale;
    const wcell = cell * scale;

    const img = ctx.createImageData(N, N);

    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const wx = wx0 + (i + 0.5) * wcell;
        const wy = wy0 + (j + 0.5) * wcell;

        const elev = _fbm(wx / 700, wy / 700, 1);
        let r, g, b;

        if (elev < 0.42) {
          const depth = _fbm(wx / 320, wy / 320, 5);
          r = 46 + depth * 34;
          g = 112 + depth * 44;
          b = 172 + depth * 48;
        } else {
          const river = _fbm(wx / 380, wy / 380, 9);
          const onRiver = Math.abs(river - 0.5) < 0.020;
          const rx = ((wx % 768) + 768) % 768;
          const ry = ((wy % 768) + 768) % 768;
          const onRoadX = rx < 30;
          const onRoadY = ry < 30;
          const onRoad = onRoadX || onRoadY;

          if (onRiver) {
            r = 76; g = 158; b = 214;
          } else if (onRoad) {
            const isCenterX = rx < 5 || rx > 763;
            const isCenterY = ry < 5 || ry > 763;
            if (isCenterX || isCenterY) { r = 246; g = 214; b = 78; }
            else { r = 232; g = 227; b = 214; }
          } else {
            const vary = (_fbm(wx / 150, wy / 150, 3) - 0.5) * 46;
            r = 138 + vary;
            g = 190 + vary;
            b = 108 + vary;
          }
        }

        const idx = (j * N + i) * 4;
        img.data[idx]     = Math.max(0, Math.min(255, r));
        img.data[idx + 1] = Math.max(0, Math.min(255, g));
        img.data[idx + 2] = Math.max(0, Math.min(255, b));
        img.data[idx + 3] = 255;
      }
    }

    const tmp = document.createElement('canvas');
    tmp.width = N; tmp.height = N;
    tmp.getContext('2d').putImageData(img, 0, 0);

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(tmp, 0, 0, N, N, 0, 0, size, size);

    if (typeof done === 'function') setTimeout(done, 0);
    return canvas;
  }
});

/* =========================================================
   8. 地圖
   ========================================================= */
function createOsmLayer() {
  if (osmTileLayer) return osmTileLayer;
  osmTileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    opacity: 1,
  });
  osmTileLayer.on('tileload', () => { tileLoadCount++; });
  osmTileLayer.on('tileerror', (e) => {
    const st = e && e.error && (e.error.status || e.error.code);
    console.warn('[map] tileerror', st || '');
    if (!mapFallbackActive) activateProcedural(false);
  });
  return osmTileLayer;
}

function initMap() {
  map = L.map('map', {
    zoomControl: false, attributionControl: false, tap: false,
  }).setView(DEFAULT_CENTER, 17);

  createOsmLayer().addTo(map);

  attributionCtrl = L.control.attribution({ position: 'bottomright', prefix: false })
    .addTo(map)
    .addAttribution('© OpenStreetMap');

  probeTile();

  /* 8 秒內完全沒有圖磚載入成功 → 視為被封鎖 */
  setTimeout(() => {
    if (!mapFallbackActive && tileLoadCount === 0) {
      console.warn('[map] 逾時未載入任何圖磚');
      activateProcedural(false);
    }
  }, 8000);

  updateMapModeBtn();
}

/* 用 <img> 探測，不受 CORS 影響，403 錯誤頁會觸發 onerror */
function probeTile() {
  const z = 17, n = Math.pow(2, z);
  const latRad = DEFAULT_CENTER[0] * Math.PI / 180;
  const tx = Math.floor((DEFAULT_CENTER[1] + 180) / 360 * n);
  const ty = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
  const img = new Image();
  img.onerror = () => {
    console.warn('[map] 圖磚探測失敗（Access Blocked / 403）');
    activateProcedural(false);
  };
  img.onload = () => {};
  img.src = `https://tile.openstreetmap.org/${z}/${tx}/${ty}.png?probe=${Date.now()}`;
}

function activateProcedural(manual) {
  if (!map) return;
  if (mapFallbackActive) {
    if (manual) toast('🗺️ 目前已是生成式地圖');
    return;
  }
  mapFallbackActive = true;

  if (osmTileLayer) {
    try { map.removeLayer(osmTileLayer); } catch(_) {}
    osmTileLayer = null;
  }

  if (!fallbackLayer) fallbackLayer = new ProgMapLayer();
  fallbackLayer.addTo(map);

  if (attributionCtrl) {
    try {
      attributionCtrl._attributions = {};
      attributionCtrl.addAttribution('Procedural Map');
    } catch(_) {}
  }

  updateMapModeBtn();
  toast(manual
    ? '🗺️ 已切換為生成式地圖'
    : '🚫 地圖被阻擋（Access Blocked / 403），已自動切換為生成式地圖', 3400);
}

function activateOsm(manual) {
  if (!map) return;
  if (!mapFallbackActive) {
    if (manual) toast('🌐 目前已是 OpenStreetMap');
    return;
  }
  mapFallbackActive = false;

  if (fallbackLayer) {
    try { map.removeLayer(fallbackLayer); } catch(_) {}
  }

  tileLoadCount = 0;
  createOsmLayer().addTo(map);
  if (osmTileLayer) osmTileLayer.setOpacity(1);

  if (attributionCtrl) {
    try {
      attributionCtrl._attributions = {};
      attributionCtrl.addAttribution('© OpenStreetMap');
    } catch(_) {}
  }

  updateMapModeBtn();
  if (manual) toast('🌐 已切換回 OpenStreetMap', 2400);
}

function updateMapModeBtn() {
  const btn = document.getElementById('mapModeBtn');
  if (!btn) return;
  btn.classList.toggle('on', mapFallbackActive);
  btn.textContent = mapFallbackActive ? '🗺' : '🌐';
  btn.title = mapFallbackActive ? '切換回 OpenStreetMap' : '切換為生成式地圖';
}

const PLAYER_ICON = L.divIcon({
  className: '',
  html: '<div class="player-wrap"><div class="ring"></div><div class="dot"></div></div>',
  iconSize: [44, 44], iconAnchor: [22, 22],
});

function placePlayer(latlng, recenter) {
  playerLatLng = latlng;
  if (!playerMarker) {
    playerMarker = L.marker(latlng, { icon: PLAYER_ICON, zIndexOffset: 1000, interactive: false }).addTo(map);
  } else {
    playerMarker.setLatLng(latlng);
  }
  if (recenter) map.setView(latlng, 17, { animate: true });
  checkMoveRespawn();
}

function checkMoveRespawn() {
  if (!playerLatLng) return;
  const now = Date.now();
  if (now - lastRespawnAt < MOVE_RESPAWN_COOL) return;

  const ref = spawnCenter || playerLatLng;
  const dist = map.distance(L.latLng(ref), L.latLng(playerLatLng));
  if (dist < MOVE_RESPAWN_DIST) return;

  lastRespawnAt = now;
  spawnCenter = playerLatLng;

  spawnPokemon(spawnCenter);
  spawnStops(spawnCenter);
  maybeSpawnNPC(spawnCenter);

  toast('🌿 來到新地方，出現了新的寶可夢與補給站！');
}

/* =========================================================
   9. 生成寶可夢 / 補給站 / NPC
   ========================================================= */
function clearSpawns() { spawnMarkers.forEach(m => map.removeLayer(m)); spawnMarkers = []; }
function clearStops()  { stopMarkers.forEach(m => map.removeLayer(m));  stopMarkers = []; }
function clearNPC() {
  if (npcMarker) { try { map.removeLayer(npcMarker); } catch(_) {} npcMarker = null; }
  currentNPC = null;
}

function addSpawn(p, lat, lng) {
  dexState[p.name].seen = 1;
  const shiny = Math.random() < SHINY_RATE;

  const icon = L.divIcon({
    className: '',
    html: `<div class="spawn ${shiny ? 'shiny' : ''}">
             <div class="spawn-shadow"></div>
             <img class="spawn-gif" src="${spriteUrl(p, shiny)}" alt="${p.name}" draggable="false"
                  onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;spawn-fallback&quot;>❓</div>')">
           </div>`,
    iconSize: [64, 72], iconAnchor: [32, 66],
  });

  const marker = L.marker([lat, lng], { icon, riseOnHover: true }).addTo(map);
  marker._shiny = shiny;
  marker.on('click', () => openCatch(p, marker, shiny));
  spawnMarkers.push(marker);
}

function spawnPokemon(center) {
  clearSpawns();
  const count = 4 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    const p = pickPokemon();
    if (!p) continue;
    const dist = 55 + Math.random() * 300;
    const bearing = Math.random() * 360;
    const [lat, lng] = offsetLatLng(center[0], center[1], dist, bearing);
    addSpawn(p, lat, lng);
  }
}

function spawnStops(center) {
  clearStops();
  for (let i = 0; i < 5; i++) {
    const dist = 65 + Math.random() * 280;
    const bearing = Math.random() * 360;
    const [lat, lng] = offsetLatLng(center[0], center[1], dist, bearing);
    const icon = L.divIcon({
      className: '',
      html: '<div class="stop">P</div>',
      iconSize: [46, 46], iconAnchor: [23, 23],
    });
    const marker = L.marker([lat, lng], { icon }).addTo(map);
    marker._used = false;
    marker.on('click', () => openStop(marker));
    stopMarkers.push(marker);
  }
}

function resetStops() {
  stopMarkers.forEach(marker => {
    marker._used = false;
    const el = marker.getElement();
    if (el) {
      const d = el.querySelector('.stop');
      if (d) { d.classList.remove('used'); d.textContent = 'P'; }
    }
  });
}

/* ===== NPC 生成 ===== */
function maybeSpawnNPC(center) {
  if (npcScreen && !npcScreen.classList.contains('hidden')) return;
  clearNPC();
  if (Math.random() > NPC_SPAWN_CHANCE) return;

  const emoji = NPC_EMOJIS[Math.floor(Math.random() * NPC_EMOJIS.length)];
  const trade = TRADE_EVOLUTIONS[Math.floor(Math.random() * TRADE_EVOLUTIONS.length)];

  const dist = 80 + Math.random() * 220;
  const bearing = Math.random() * 360;
  const [lat, lng] = offsetLatLng(center[0], center[1], dist, bearing);

  const icon = L.divIcon({
    className: '',
    html: `<div class="npc">
             <div class="npc-badge">交換</div>
             <div class="npc-ring"></div>
             <div class="npc-emoji">${emoji}</div>
           </div>`,
    iconSize: [56, 64], iconAnchor: [28, 56],
  });

  npcMarker = L.marker([lat, lng], { icon, zIndexOffset: 900 }).addTo(map);
  currentNPC = { emoji, trade, candySource: null };

  npcMarker.on('click', () => openNPCExchange(currentNPC));
  SFX.npcAppear();
}

/* =========================================================
   10. NPC 交換畫面
   ========================================================= */
const npcScreen      = document.getElementById('npcScreen');
const npcTitle       = document.getElementById('npcTitle');
const npcSub         = document.getElementById('npcSub');
const npcCardImg     = document.getElementById('npcCardImg');
const npcCardFallback= document.getElementById('npcCardFallback');
const npcCardName    = document.getElementById('npcCardName');
const playerCardImg  = document.getElementById('playerCardImg');
const playerCardFallback = document.getElementById('playerCardFallback');
const playerCardName = document.getElementById('playerCardName');
const npcCostLabel   = document.getElementById('npcCostLabel');
const npcOwnLabel    = document.getElementById('npcOwnLabel');
const npcEvoLabel    = document.getElementById('npcEvoLabel');
const npcConfirmBtn  = document.getElementById('npcConfirmBtn');
const npcCancelBtn   = document.getElementById('npcCancelBtn');

/* 從玩家擁有的糖果中，隨機挑一隻（排除與交換方同名的精靈） */
function pickRandomCandySource(excludeName) {
  const names = Object.keys(candyBag).filter(n => n !== excludeName && (candyBag[n] || 0) > 0);
  if (!names.length) return null;
  const name = names[Math.floor(Math.random() * names.length)];
  return { name, amount: candyBag[name] };
}

function openNPCExchange(npc) {
  if (catchState !== 'idle') return;
  if (npcExchangeLocked) return;

  const { emoji, trade } = npc;
  const npcMon = POKEDEX.find(p => p.name === trade.npcName);
  const candySource = pickRandomCandySource(trade.npcName);
  npc.candySource = candySource;

  npcTitle.textContent = `${emoji} 交換進化`;
  npcSub.textContent = 'NPC 願意與你交換寶可夢（消耗隨機精靈的糖果）';

  /* NPC 卡片 */
  npcCardName.textContent = trade.npcName;
  if (npcMon) {
    npcCardImg.src = spriteUrl(npcMon, false);
    npcCardImg.style.display = '';
    npcCardFallback.style.display = 'none';
    npcCardImg.onerror = () => {
      npcCardImg.style.display = 'none';
      npcCardFallback.style.display = '';
      npcCardFallback.textContent = '❓';
    };
  } else {
    npcCardImg.style.display = 'none';
    npcCardFallback.style.display = '';
    npcCardFallback.textContent = '❓';
  }

  /* 玩家糖果卡片（隨機精靈） */
  if (candySource) {
    const srcMon = POKEDEX.find(p => p.name === candySource.name);
    playerCardName.textContent = `${candySource.name}糖果`;
    if (srcMon) {
      playerCardImg.src = spriteUrl(srcMon, false);
      playerCardImg.style.display = '';
      playerCardFallback.style.display = 'none';
      playerCardImg.onerror = () => {
        playerCardImg.style.display = 'none';
        playerCardFallback.style.display = '';
        playerCardFallback.textContent = '🍬';
      };
    } else {
      playerCardImg.style.display = 'none';
      playerCardFallback.style.display = '';
      playerCardFallback.textContent = '🍬';
    }
    npcOwnLabel.textContent = `${candySource.amount} 顆`;
    npcOwnLabel.classList.toggle('ok', candySource.amount >= trade.candyCost);
    npcOwnLabel.classList.toggle('lack', candySource.amount < trade.candyCost);
  } else {
    playerCardName.textContent = '沒有可交換的糖果';
    playerCardImg.style.display = 'none';
    playerCardFallback.style.display = '';
    playerCardFallback.textContent = '🍬';
    npcOwnLabel.textContent = '0 顆';
    npcOwnLabel.classList.remove('ok');
    npcOwnLabel.classList.add('lack');
  }

  npcCostLabel.textContent = `${trade.candyCost} 顆`;
  npcEvoLabel.textContent = trade.to;

  const enough = !!candySource && candySource.amount >= trade.candyCost;
  npcConfirmBtn.disabled = !enough;
  npcConfirmBtn.textContent = enough
    ? '確認交換'
    : (candySource ? `糖果不足（需要 ${trade.candyCost} 顆）` : '沒有可交換的糖果');

  npcScreen.classList.remove('hidden');
  SFX.init();
  audio.init();
  audio.playTrade();
}

npcCancelBtn.addEventListener('click', () => {
  npcScreen.classList.add('hidden');
  if (gameStarted) audio.playMap(env.time);
});

npcConfirmBtn.addEventListener('click', () => {
  if (!currentNPC) return;
  const { trade, candySource } = currentNPC;
  if (!candySource || candySource.amount < trade.candyCost) return;
  if (npcExchangeLocked) return;

  npcExchangeLocked = true;
  npcScreen.classList.add('hidden');

  const npcMon = POKEDEX.find(p => p.name === trade.npcName);
  const playerMon = POKEDEX.find(p => p.name === candySource.name);

  playTradeAnimation(npcMon, playerMon, trade, candySource, () => {
    candyBag[candySource.name] -= trade.candyCost;
    if (candyBag[candySource.name] < 0) candyBag[candySource.name] = 0;

    clearNPC();

    playNPCEvolutionAnimation(trade.to, () => {
      if (dexState[trade.to]) {
        dexState[trade.to].seen = 1;
        dexState[trade.to].caught++;
      }
      if (dexState[trade.npcName]) {
        dexState[trade.npcName].seen = 1;
      }
      caughtCount++;
      updateHUD();
      autoSave();

      toast(`🔄 交換成功！${trade.npcName} 進化成 ${trade.to}！`, 3000);
      npcExchangeLocked = false;

      if (gameStarted) audio.playMap(env.time);
    });
  });
});

/* ===== 交換動畫 ===== */
const tradeOverlay = document.getElementById('tradeAnimOverlay');
const tradeMonA    = document.getElementById('tradeMonA');
const tradeMonB    = document.getElementById('tradeMonB');
const tradeImgA    = document.getElementById('tradeImgA');
const tradeImgB    = document.getElementById('tradeImgB');
const tradeFallbackA = document.getElementById('tradeFallbackA');
const tradeFallbackB = document.getElementById('tradeFallbackB');
const tradeLabelA  = document.getElementById('tradeLabelA');
const tradeLabelB  = document.getElementById('tradeLabelB');
const tradeFlash   = document.getElementById('tradeFlash');

function setTradeMon(elImg, elFallback, elLabel, mon, labelText, fallbackText) {
  elLabel.textContent = labelText;
  if (mon) {
    elImg.src = spriteUrl(mon, false);
    elImg.style.display = '';
    elFallback.style.display = 'none';
    elImg.onerror = () => {
      elImg.style.display = 'none';
      elFallback.style.display = '';
      elFallback.textContent = fallbackText;
    };
  } else {
    elImg.style.display = 'none';
    elFallback.style.display = '';
    elFallback.textContent = fallbackText;
  }
}

function playTradeAnimation(npcMon, playerMon, trade, candySource, onDone) {
  tradeOverlay.classList.add('on');
  tradeMonA.classList.remove('swapped');
  tradeMonB.classList.remove('swapped');
  tradeFlash.classList.remove('flash');

  setTradeMon(tradeImgA, tradeFallbackA, tradeLabelA, npcMon, trade.npcName, '❓');

  if (playerMon && candySource) {
    setTradeMon(tradeImgB, tradeFallbackB, tradeLabelB, playerMon, `${candySource.name}糖果`, '🍬');
  } else {
    tradeImgB.style.display = 'none';
    tradeFallbackB.style.display = '';
    tradeFallbackB.textContent = '🍬';
    tradeLabelB.textContent = candySource ? `${candySource.name}糖果` : '糖果';
  }

  SFX.tradeStart();

  setTimeout(() => {
    tradeFlash.classList.add('flash');
    SFX.tradeWhoosh();
    tradeMonA.classList.add('swapped');
    tradeMonB.classList.add('swapped');
  }, 200);

  setTimeout(() => {
    tradeOverlay.classList.remove('on');
    tradeFlash.classList.remove('flash');
    onDone();
  }, 1400);
}

/* ===== NPC 進化動畫 ===== */
function playNPCEvolutionAnimation(toName, onDone) {
  const tgt = POKEDEX.find(p => p.name === toName);
  if (!tgt) { onDone(); return; }

  const ov = document.getElementById('evoOverlay');
  const animImg = document.getElementById('evoAnimImg');
  animImg.src = spriteUrl(tgt, false);
  animImg.style.display = '';
  animImg.onerror = () => { animImg.style.display = 'none'; };
  ov.style.display = 'flex';

  setTimeout(() => {
    ov.style.display = 'none';
    animImg.style.display = '';
    onDone();
