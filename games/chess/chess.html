<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西洋棋 · 奢華版 · PvP / PvAI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background:
      radial-gradient(circle at 15% 10%, rgba(80, 50, 20, 0.35), transparent 50%),
      radial-gradient(circle at 85% 90%, rgba(50, 30, 15, 0.4), transparent 55%),
      radial-gradient(circle at 50% 50%, #1a222c 0%, #0c1218 55%, #05080b 100%);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #e6eef4;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.4s ease, visibility 0.4s;
    overflow-y: auto;
  }

  .screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    z-index: -1;
  }

  /* ============================================================
     封面
     ============================================================ */
  .cover-frame {
    position: relative;
    width: min(92vw, calc(88vh * 0.75));
    aspect-ratio: 3 / 4;
    background: url('chess.jpg') center/cover no-repeat,
                linear-gradient(135deg, #1a2a3a 0%, #0a1218 100%);
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 40px 90px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(212, 175, 55, 0.55),
      0 0 0 6px rgba(15, 10, 5, 0.9),
      0 0 0 7px rgba(212, 175, 55, 0.25),
      0 0 120px rgba(212, 175, 55, 0.1);
    animation: coverIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes coverIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .cover-overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 30%, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.65) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.95) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .cover-content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px 110px;
    text-align: center;
  }

  .cover-title {
    font-size: clamp(2rem, 7.5vw, 3.6rem);
    font-weight: 900;
    background: linear-gradient(135deg, #f5c542 0%, #ffe9a8 40%, #d4af37 70%, #b8860b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.9));
    letter-spacing: 6px;
    margin-bottom: 6px;
    line-height: 1.1;
  }

  .cover-subtitle {
    font-size: clamp(0.65rem, 2vw, 0.85rem);
    color: rgba(255, 235, 180, 0.75);
    letter-spacing: 4px;
    margin-bottom: 26px;
    font-weight: 500;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  }

  .cover-chess-icon {
    font-size: clamp(2.6rem, 10vw, 4.4rem);
    line-height: 1;
    margin-bottom: 20px;
    color: #f5e6c8;
    -webkit-text-stroke: 1.5px #8a6a2f;
    text-shadow:
      0 1px 0 #d4b878,
      0 2px 0 #b89858,
      0 3px 0 #8a6a2f,
      0 4px 0 #5a4418,
      0 8px 20px rgba(0, 0, 0, 0.9),
      0 0 40px rgba(245, 197, 66, 0.4);
    animation: floatIcon 4s ease-in-out infinite;
  }

  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* ✨ 封面獎盃徽章（右上角） */
  .cover-trophy {
    position: absolute;
    top: 18px;
    right: 18px;
    z-index: 8;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: linear-gradient(135deg, rgba(20, 12, 5, 0.85), rgba(40, 26, 10, 0.85));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid rgba(212, 175, 55, 0.7);
    border-radius: 50px;
    box-shadow:
      0 4px 16px rgba(0, 0, 0, 0.6),
      0 0 25px rgba(212, 175, 55, 0.2);
    font-weight: 800;
    color: #f5c542;
    font-size: 1rem;
    animation: floatBtn 3.6s ease-in-out infinite;
  }

  .cover-trophy .trophy-icon {
    font-size: 1.3rem;
    filter: drop-shadow(0 0 8px rgba(245, 197, 66, 0.6));
  }

  .cover-start-btn {
    padding: 15px 52px;
    border: none;
    border-radius: 50px;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 3px;
    cursor: pointer;
    color: #1a1208;
    background: linear-gradient(135deg, #f5c542 0%, #ffe9a8 50%, #d4af37 100%);
    box-shadow:
      0 12px 30px rgba(245, 197, 66, 0.4),
      0 4px 12px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.4) inset,
      0 0 30px rgba(245, 197, 66, 0.25);
    transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
    font-family: inherit;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    margin-bottom: 18px;
  }

  .cover-start-btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow:
      0 18px 45px rgba(245, 197, 66, 0.55),
      0 6px 16px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.5) inset,
      0 0 45px rgba(245, 197, 66, 0.45);
  }

  .cover-start-btn:active { transform: translateY(-1px) scale(1.01); }

  /* ✨ 封面存檔按鈕列 */
  .cover-data-row {
    display: flex;
    gap: 8px;
    z-index: 4;
  }

  .data-btn {
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    background: rgba(15, 10, 5, 0.85);
    color: #e8dcc0;
    border: 1px solid rgba(212, 175, 55, 0.4);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    transition: all 0.18s ease;
    letter-spacing: 0.5px;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .data-btn:hover {
    background: linear-gradient(135deg, #3a2f1f, #241a0e);
    border-color: rgba(245, 197, 66, 0.8);
    color: #f5c542;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.25);
  }

  .cover-copyright {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(0.58rem, 1.7vw, 0.7rem);
    color: rgba(255, 235, 180, 0.65);
    z-index: 5;
    padding: 0 76px;
    letter-spacing: 0.4px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    line-height: 1.5;
    pointer-events: none;
  }

  /* ============================================================
     浮動按鈕
     ============================================================ */
  .float-btn {
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(212, 175, 55, 0.5);
    color: #f5e6c8;
    font-size: 1.15rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    z-index: 20;
    padding: 0;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.4);
    animation: floatBtn 3.2s ease-in-out infinite;
    font-family: inherit;
  }

  @keyframes floatBtn {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .float-btn:hover {
    background: linear-gradient(135deg, #f5c542, #d4af37);
    color: #1a1208;
    transform: scale(1.12) translateY(-3px);
    animation-play-state: paused;
    box-shadow: 0 6px 22px rgba(245, 197, 66, 0.55), 0 0 0 1px rgba(255, 235, 150, 0.6);
  }

  .float-btn-bl { bottom: 18px; left: 18px; }
  .float-btn-br { bottom: 18px; right: 18px; }

  .board-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding: 0 4px;
  }

  .board-footer .float-btn {
    position: relative;
    bottom: auto;
    left: auto;
    right: auto;
    background: linear-gradient(145deg, #2c2418, #1a1209);
    border: 1px solid rgba(212, 175, 55, 0.35);
  }

  /* ============================================================
     設定畫面
     ============================================================ */
  .setup-frame {
    width: min(92vw, 420px);
    background: linear-gradient(160deg, rgba(34, 26, 16, 0.98), rgba(15, 10, 5, 0.98));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 22px;
    padding: 30px 26px;
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(212, 175, 55, 0.45),
      0 0 0 5px rgba(0, 0, 0, 0.6),
      0 0 60px rgba(212, 175, 55, 0.08);
    border: 1px solid rgba(255, 220, 150, 0.08);
    animation: coverIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  .setup-title {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #f5c542, #ffe9a8, #d4af37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
    text-align: center;
  }

  .control-group { margin-bottom: 20px; }

  .control-group label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #b89858;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    flex: 1 1 auto;
    padding: 11px 14px;
    border: none;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    background: linear-gradient(145deg, #2c2418, #1a1209);
    color: #e8dcc0;
    border: 1px solid rgba(212, 175, 55, 0.2);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
    font-family: inherit;
  }

  .btn:hover {
    background: linear-gradient(145deg, #3a2f1f, #241a0e);
    border-color: rgba(212, 175, 55, 0.5);
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.5), 0 0 12px rgba(212, 175, 55, 0.15);
  }

  .btn:active { transform: translateY(0); }

  .btn.active {
    background: linear-gradient(135deg, #d4af37, #f5c542, #ffe9a8);
    border-color: rgba(255, 235, 150, 0.7);
    box-shadow: 0 0 20px rgba(245, 197, 66, 0.5), 0 3px 8px rgba(0, 0, 0, 0.5);
    color: #1a1208;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  .difficulty-row .btn {
    flex: 1 1 28%;
    padding: 10px 4px;
    font-size: 0.82rem;
  }

  .setup-actions {
    display: flex;
    gap: 10px;
    margin-top: 26px;
  }

  .btn-back {
    flex: 0 0 auto;
    background: linear-gradient(145deg, #1a1611, #0d0a05);
  }

  .btn-start {
    flex: 1;
    background: linear-gradient(135deg, #d4af37, #f5c542, #ffe9a8);
    color: #1a1208;
    font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 0 6px 22px rgba(245, 197, 66, 0.4), 0 2px 8px rgba(0, 0, 0, 0.5);
    border-color: rgba(255, 235, 150, 0.6);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  .btn-start:hover {
    background: linear-gradient(135deg, #f5c542, #ffe9a8, #fff2c8);
    box-shadow: 0 10px 32px rgba(245, 197, 66, 0.6), 0 3px 10px rgba(0, 0, 0, 0.5);
  }

  /* ============================================================
     遊戲畫面
     ============================================================ */
  .app {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1150px;
    width: 100%;
  }

  .board-side {
    flex: 1 1 500px;
    max-width: 580px;
    width: 100%;
  }

  .board-frame {
    position: relative;
    background: linear-gradient(145deg, #2c1f12 0%, #1a1209 40%, #0d0805 100%);
    padding: 20px;
    border-radius: 16px;
    box-shadow:
      0 45px 90px rgba(0, 0, 0, 0.9),
      0 15px 35px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(212, 175, 55, 0.6),
      0 0 0 5px rgba(20, 12, 6, 1),
      0 0 0 6px rgba(212, 175, 55, 0.35),
      0 0 80px rgba(212, 175, 55, 0.12);
  }

  .board-frame::before {
    content: '';
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 11px;
    pointer-events: none;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.6) inset,
      0 0 12px rgba(212, 175, 55, 0.15) inset;
  }

  .board-frame::after {
    content: '';
    position: absolute;
    inset: 9px;
    border-radius: 11px;
    pointer-events: none;
    background:
      radial-gradient(circle at 0% 0%,     rgba(245, 220, 130, 0.95) 0%, rgba(212, 175, 55, 0.9) 2.5px, transparent 4px),
      radial-gradient(circle at 100% 0%,   rgba(245, 220, 130, 0.95) 0%, rgba(212, 175, 55, 0.9) 2.5px, transparent 4px),
      radial-gradient(circle at 0% 100%,   rgba(245, 220, 130, 0.95) 0%, rgba(212, 175, 55, 0.9) 2.5px, transparent 4px),
      radial-gradient(circle at 100% 100%, rgba(245, 220, 130, 0.95) 0%, rgba(212, 175, 55, 0.9) 2.5px, transparent 4px);
    filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.6));
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1 / 1;
    width: 100%;
    border-radius: 4px;
    overflow: hidden;
    box-shadow:
      0 0 0 2px rgba(212, 175, 55, 0.75),
      0 0 0 3px rgba(0, 0, 0, 0.9),
      0 12px 30px rgba(0, 0, 0, 0.85) inset,
      0 0 40px rgba(0, 0, 0, 0.5) inset;
  }

  .square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: box-shadow 0.2s;
  }

  .square.light {
    background:
      radial-gradient(ellipse at 28% 22%, rgba(255, 255, 255, 0.6), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(200, 170, 120, 0.25), transparent 60%),
      linear-gradient(145deg, #f8eccf 0%, #efe0bc 45%, #e0cda2 100%);
    box-shadow:
      1px 1px 2px rgba(255, 255, 255, 0.5) inset,
      -1px -1px 2px rgba(140, 105, 55, 0.18) inset;
  }

  .square.dark {
    background:
      radial-gradient(ellipse at 72% 78%, rgba(245, 220, 130, 0.08), transparent 55%),
      radial-gradient(ellipse at 25% 20%, rgba(255, 255, 255, 0.06), transparent 55%),
      linear-gradient(145deg, #3a2a17 0%, #2a1d0f 45%, #1a1108 100%);
    box-shadow:
      1px 1px 2px rgba(255, 220, 160, 0.08) inset,
      -1px -1px 3px rgba(0, 0, 0, 0.7) inset;
  }

  .square.last-move {
    background:
      radial-gradient(circle at 50% 50%, rgba(245, 220, 130, 0.35), transparent 70%),
      linear-gradient(145deg, #7a5a20 0%, #4a3512 100%) !important;
    box-shadow:
      0 0 0 1px rgba(245, 220, 130, 0.6) inset,
      0 0 25px rgba(245, 197, 66, 0.25);
  }

  .square.selected {
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 245, 200, 0.4), transparent 70%),
      linear-gradient(145deg, #d4af37 0%, #a8842a 100%) !important;
    box-shadow:
      0 0 0 2px rgba(255, 245, 200, 0.9) inset,
      0 0 30px rgba(245, 197, 66, 0.7);
  }

  .square.in-check {
    background: radial-gradient(circle at 50% 50%, #ff5757 0%, #8a0e0e 80%) !important;
    box-shadow:
      0 0 0 2px rgba(255, 220, 130, 0.7) inset,
      0 0 35px rgba(255, 60, 60, 0.75);
    animation: checkPulse 1.1s ease-in-out infinite;
  }

  @keyframes checkPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255, 220, 130, 0.7) inset, 0 0 35px rgba(255, 60, 60, 0.75); }
    50%      { box-shadow: 0 0 0 2px rgba(255, 220, 130, 0.9) inset, 0 0 50px rgba(255, 60, 60, 0.95); }
  }

  .square.legal-move::before {
    content: '';
    position: absolute;
    width: 32%;
    height: 32%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d8ffe0 0%, #4ad46a 40%, #1a7a2e 100%);
    box-shadow: 0 0 12px rgba(74, 212, 106, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.4) inset;
    pointer-events: none;
    z-index: 3;
    animation: gemPulse 2s ease-in-out infinite;
  }

  @keyframes gemPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }

  .square.capture::before {
    content: '';
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    border: 4px solid #d43c3c;
    pointer-events: none;
    z-index: 3;
    box-shadow:
      0 0 16px rgba(212, 60, 60, 0.85),
      0 0 0 1px rgba(255, 220, 130, 0.5) inset,
      0 0 0 1px rgba(255, 255, 255, 0.3);
    animation: gemPulse 1.6s ease-in-out infinite;
  }

  .piece {
    font-size: clamp(30px, 7.5vw, 58px);
    line-height: 1;
    font-family: 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols 2', 'Symbola', 'DejaVu Sans', 'Arial Unicode MS', sans-serif;
    pointer-events: none;
    z-index: 2;
    position: relative;
    transition: transform 0.18s ease, filter 0.18s ease, text-shadow 0.18s ease;
    will-change: transform;
  }

  .piece.w {
    color: #fbf3dd;
    -webkit-text-stroke: 1.4px #6b4f1f;
    text-shadow:
      0 -1px 0 rgba(255, 255, 255, 0.95),
      0 1px 0 #e8d5a8,
      0 2px 0 #d4b878,
      0 3px 0 #b89858,
      0 4px 0 #9a7a3f,
      0 5px 0 #7a5c28,
      0 6px 0 #5a4418,
      0 7px 0 #3a2c0e,
      0 10px 14px rgba(0, 0, 0, 0.75),
      0 14px 24px rgba(0, 0, 0, 0.45),
      0 0 10px rgba(245, 197, 66, 0.25);
  }

  .piece.b {
    color: #161616;
    -webkit-text-stroke: 1.4px #d4af37;
    text-shadow:
      0 -1px 0 rgba(140, 140, 160, 0.55),
      0 1px 0 #3a3a3a,
      0 2px 0 #2c2c2c,
      0 3px 0 #202020,
      0 4px 0 #171717,
      0 5px 0 #0e0e0e,
      0 6px 0 #050505,
      0 7px 0 #000000,
      0 10px 14px rgba(0, 0, 0, 0.95),
      0 14px 24px rgba(0, 0, 0, 0.55),
      0 0 12px rgba(212, 175, 55, 0.4),
      0 0 2px rgba(245, 220, 130, 0.6);
  }

  .square:hover .piece {
    transform: translateY(-5px) scale(1.1);
    filter: drop-shadow(0 0 14px rgba(245, 197, 66, 0.55));
  }

  .piece.flying {
    pointer-events: none;
    filter: drop-shadow(0 25px 18px rgba(0, 0, 0, 0.75));
  }

  /* ============================================================
     對局面板
     ============================================================ */
  .panel {
    flex: 1 1 300px;
    max-width: 340px;
    background: linear-gradient(160deg, rgba(34, 26, 16, 0.96), rgba(15, 10, 5, 0.96));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 18px;
    padding: 24px;
    box-shadow:
      0 30px 60px rgba(0, 0, 0, 0.7),
      0 0 0 1px rgba(212, 175, 55, 0.35),
      0 0 0 5px rgba(0, 0, 0, 0.5),
      0 0 40px rgba(212, 175, 55, 0.06);
    border: 1px solid rgba(255, 220, 150, 0.08);
  }

  .panel h2 {
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #f5c542, #ffe9a8, #d4af37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  /* ✨ 遊戲中獎盃顯示 */
  .game-trophy {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;

<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';

// ============================================================
// 棋子符號
// ============================================================
const SYM = {
  w: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' },
  b: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
};

// ============================================================
// 狀態
// ============================================================
const chess = new Chess();
let mode = 'pvp';
let aiDepth = 2;
let playerColor = 'w';
let aiThinking = false;
let animating = false;
let selectedSquare = null;
let lastMove = null;
let orientation = 'w';
let soundOn = true;
let trophies = 0;
let gameResultHandled = false;

// ============================================================
// DOM
// ============================================================
const boardEl = document.getElementById('board');
const statusText = document.getElementById('statusText');
const turnDot = document.getElementById('turnDot');
const aiBadge = document.getElementById('aiBadge');
const moveHistoryEl = document.getElementById('moveHistory');
const resultModal = document.getElementById('resultModal');

// ============================================================
// 持久化（localStorage）
// ============================================================
const STORAGE_KEY = 'chessLuxurySettings_v1';

function saveSettings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      soundOn, mode, aiDepth, playerColor, trophies,
      savedAt: new Date().toISOString()
    }));
  } catch (e) {}
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (typeof s.soundOn === 'boolean') soundOn = s.soundOn;
    if (s.mode === 'pvp' || s.mode === 'pvai') mode = s.mode;
    if (typeof s.aiDepth === 'number' && s.aiDepth >= 1 && s.aiDepth <= 3) aiDepth = s.aiDepth;
    if (s.playerColor === 'w' || s.playerColor === 'b') playerColor = s.playerColor;
    if (typeof s.trophies === 'number' && s.trophies >= 0) trophies = s.trophies;
  } catch (e) {}
}

// ============================================================
// 將設定套用到 UI 按鈕狀態
// ============================================================
function applySettingsToUI() {
  // 模式
  if (mode === 'pvp') {
    document.getElementById('modePvP').classList.add('active');
    document.getElementById('modePvAI').classList.remove('active');
  } else {
    document.getElementById('modePvAI').classList.add('active');
    document.getElementById('modePvP').classList.remove('active');
  }
  updateModeUI();

  // 難度
  document.querySelectorAll('#difficultyGroup .btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.depth, 10) === aiDepth);
  });

  // 顏色
  if (playerColor === 'w') {
    document.getElementById('playWhite').classList.add('active');
    document.getElementById('playBlack').classList.remove('active');
  } else {
    document.getElementById('playBlack').classList.add('active');
    document.getElementById('playWhite').classList.remove('active');
  }

  updateTrophyDisplay();
  updateMuteUI();
}

// ============================================================
// 獎盃顯示
// ============================================================
function updateTrophyDisplay() {
  document.getElementById('coverTrophyCount').textContent = trophies;
  document.getElementById('gameTrophyCount').textContent = trophies;
}

function getTrophyReward(depth) {
  if (depth === 1) return 10;
  if (depth === 2) return 50;
  if (depth === 3) return 100;
  return 0;
}

// ============================================================
// 存檔 / 載入 / 重設
// ============================================================
function exportSettings() {
  const data = {
    _comment: '☕迪遜咖啡廳 西洋棋存檔 — 可用記事本編輯，但請保持 JSON 格式',
    version: 1,
    soundOn, mode, aiDepth, playerColor, trophies,
    exportedAt: new Date().toISOString()
  };
  const text = JSON.stringify(data, null, 2);
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '西洋棋設定檔.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  sfx.start();
  alert('✅ 設定已匯出為「西洋棋設定檔.txt」\n\n可存放在任何位置作為備份。');
}

function importSettingsFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (typeof data.soundOn === 'boolean') soundOn = data.soundOn;
      if (data.mode === 'pvp' || data.mode === 'pvai') mode = data.mode;
      if (typeof data.aiDepth === 'number' && data.aiDepth >= 1 && data.aiDepth <= 3) aiDepth = data.aiDepth;
      if (data.playerColor === 'w' || data.playerColor === 'b') playerColor = data.playerColor;
      if (typeof data.trophies === 'number' && data.trophies >= 0) trophies = data.trophies;

      saveSettings();
      applySettingsToUI();
      sfx.start();
      alert(`✅ 設定載入成功！\n\n🏆 獎盃：${trophies}\n模式：${mode === 'pvp' ? '玩家 vs 玩家' : '玩家 vs AI'}\n難度：${['', '簡單', '中等', '困難'][aiDepth]}\n執棋：${playerColor === 'w' ? '白棋' : '黑棋'}\n音效：${soundOn ? '開' : '關'}`);
    } catch (err) {
      alert('❌ 檔案格式錯誤，請確認是正確的 .txt 存檔。\n\n' + err.message);
    }
  };
  reader.onerror = () => alert('❌ 讀取檔案失敗。');
  reader.readAsText(file, 'utf-8');
}

function resetAllData() {
  if (!confirm('⚠️ 確定要重設所有設定和獎盃嗎？\n\n此動作無法復原，建議先「儲存」備份。')) return;
  soundOn = true;
  mode = 'pvp';
  aiDepth = 2;
  playerColor = 'w';
  trophies = 0;
  saveSettings();
  applySettingsToUI();
  sfx.start();
  alert('✅ 已重設為預設值。');
}

// ============================================================
// 音效
// ============================================================
let audioCtx = null;

function ensureAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function playTone(freq, dur, type, vol, delay) {
  if (!soundOn) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime + (delay || 0);
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  } catch (e) {}
}

const sfx = {
  click()  { playTone(1100, 0.05, 'sine', 0.05); },
  select() { playTone(720, 0.06, 'sine', 0.06); playTone(1080, 0.05, 'sine', 0.04, 0.03); },
  move()   { playTone(520, 0.08, 'triangle', 0.09); playTone(780, 0.09, 'triangle', 0.06, 0.04); },
  capture(){ playTone(260, 0.09, 'sawtooth', 0.09); playTone(170, 0.13, 'sawtooth', 0.07, 0.05); },
  check()  { playTone(880, 0.08, 'square', 0.07); playTone(1180, 0.1, 'square', 0.07, 0.09); },
  checkmate() {
    playTone(523, 0.12, 'sine', 0.1);
    playTone(659, 0.12, 'sine', 0.1, 0.13);
    playTone(784, 0.12, 'sine', 0.1, 0.26);
    playTone(1047, 0.45, 'sine', 0.13, 0.4);
  },
  lose() {
    playTone(440, 0.15, 'sine', 0.08);
    playTone(349, 0.15, 'sine', 0.08, 0.16);
    playTone(262, 0.4, 'sine', 0.09, 0.32);
  },
  start() {
    playTone(523, 0.1, 'sine', 0.09);
    playTone(659, 0.1, 'sine', 0.09, 0.1);
    playTone(784, 0.2, 'sine', 0.1, 0.2);
  }
};

// ============================================================
// 背景音樂
// ============================================================
let bgMusic = null;
try {
  bgMusic = new Audio('Chess - Jazz Board.mp3');
  bgMusic.loop = true;
  bgMusic.volume = 0.35;
  bgMusic.preload = 'auto';
} catch (e) {}

function tryPlayMusic() {
  if (!bgMusic || !soundOn) return;
  bgMusic.play().catch(() => {});
}

function updateMuteUI() {
  const icon = soundOn ? '🔊' : '🔇';
  document.querySelectorAll('.mute-btn').forEach(b => { b.textContent = icon; });
}

function toggleSound() {
  soundOn = !soundOn;
  updateMuteUI();
  saveSettings();
  if (soundOn) {
    ensureAudioCtx();
    tryPlayMusic();
    sfx.click();
  } else {
    if (bgMusic) bgMusic.pause();
  }
}

document.querySelectorAll('.mute-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleSound();
  });
});

['click', 'touchstart', 'keydown'].forEach(evt => {
  document.addEventListener(evt, () => {
    if (soundOn) tryPlayMusic();
  }, { once: true, passive: true });
});

// ============================================================
// 全屏
// ============================================================
function toggleFullscreen() {
  const doc = document;
  const el = doc.documentElement;
  const isFs = doc.fullscreenElement || doc.webkitFullscreenElement;
  if (!isFs) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) { try { req.call(el); } catch (e) {} }
  } else {
    const exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
    if (exit) { try { exit.call(doc); } catch (e) {} }
  }
}

// ============================================================
// 棋盤工具
// ============================================================
function isDarkSquare(sq) {
  const f = sq.charCodeAt(0) - 97;
  const r = parseInt(sq[1], 10) - 1;
  return (f + r) % 2 === 0;
}

function buildBoard() {
  boardEl.innerHTML = '';
  const files = ['a','b','c','d','e','f','g','h'];
  const ranks = [1,2,3,4,5,6,7,8];
  const renderFiles = orientation === 'w' ? files : [...files].reverse();
  const renderRanks = orientation === 'w' ? [...ranks].reverse() : ranks;

  for (const rank of renderRanks) {
    for (const file of renderFiles) {
      const sq = file + rank;
      const div = document.createElement('div');
      div.className = 'square ' + (isDarkSquare(sq) ? 'dark' : 'light');
      div.dataset.square = sq;
      const piece = document.createElement('span');
      piece.className = 'piece';
      div.appendChild(piece);
      boardEl.appendChild(div);
    }
  }
}

// ============================================================
// 渲染
// ============================================================
function render() {
  const legalDests = new Set();
  if (selectedSquare) {
    const moves = chess.moves({ verbose: true });
    for (const m of moves) {
      if (m.from === selectedSquare) legalDests.add(m.to);
    }
  }

  let checkSquare = null;
  if (chess.isCheck()) {
    const turn = chess.turn();
    const board = chess.board();
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = board[r][c];
        if (p && p.type === 'k' && p.color === turn) {
          checkSquare = 'abcdefgh'[c] + (8 - r);
        }
      }
    }
  }

  const boardArr = chess.board();

  document.querySelectorAll('.square').forEach(el => {
    const sq = el.dataset.square;
    el.className = 'square ' + (isDarkSquare(sq) ? 'dark' : 'light');

    const file = sq.charCodeAt(0) - 97;
    const rank = parseInt(sq[1], 10);
    const row = 8 - rank;
    const col = file;
    const piece = boardArr[row][col];
    const pieceEl = el.firstElementChild;

    pieceEl.style.visibility = '';

    if (piece) {
      pieceEl.textContent = SYM[piece.color][piece.type];
      pieceEl.className = 'piece ' + piece.color;
    } else {
      pieceEl.textContent = '';
      pieceEl.className = 'piece';
    }

    if (lastMove && (lastMove.from === sq || lastMove.to === sq)) {
      el.classList.add('last-move');
    }
    if (selectedSquare === sq) {
      el.classList.add('selected');
    }
    if (legalDests.has(sq)) {
      el.classList.add(piece ? 'capture' : 'legal-move');
    }
    if (checkSquare === sq) {
      el.classList.add('in-check');
    }
  });
}

// ============================================================
// 帶 AB 點移動動畫的走棋
// ============================================================
function performMove(from, to, promotion, callback) {
  const fromEl = boardEl.querySelector(`[data-square="${from}"]`);
  const toEl = boardEl.querySelector(`[data-square="${to}"]`);
  const movingPiece = chess.get(from);

  if (!fromEl || !toEl || !movingPiece) {
    const m = chess.move({ from, to, promotion: promotion || 'q' });
    if (m) lastMove = { from, to };
    if (callback) callback(m);
    return;
  }

  const targetPiece = chess.get(to);
  const isCapture = !!targetPiece;

  const fromRect = fromEl.getBoundingClientRect();
  const toRect = toEl.getBoundingClientRect();
  const pieceEl = fromEl.firstElementChild;

  const move = chess.move({ from, to, promotion: promotion || 'q' });
  if (!move) {
    if (callback) callback(null);
    return;
  }
  lastMove = { from, to };

  const clone = document.createElement('span');
  clone.className = 'piece ' + movingPiece.color + ' flying';
  clone.textContent = SYM[movingPiece.color][movingPiece.type];
  clone.style.cssText = `
    position: fixed;
    left: ${fromRect.left}px;
    top: ${fromRect.top}px;
    width: ${fromRect.width}px;
    height: ${fromRect.height}px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    pointer-events: none;
    margin: 0;
    padding: 0;
    transition: left 0.34s cubic-bezier(0.33, 1.2, 0.5, 1),
                top 0.34s cubic-bezier(0.33, 1.2, 0.5, 1);
    will-change: left, top;
  `;
  document.body.appendChild(clone);

  if (pieceEl) pieceEl.style.visibility = 'hidden';
  if (isCapture && toEl.firstElementChild) {
    toEl.firstElementChild.style.visibility = 'hidden';
  }

  clone.getBoundingClientRect();

  clone.style.left = toRect.left + 'px';
  clone.style.top = toRect.top + 'px';

  if (isCapture) sfx.capture();
  else sfx.move();

  setTimeout(() => {
    clone.remove();
    if (callback) callback(move);
  }, 360);
}

// ============================================================
// 點擊格子
// ============================================================
function onSquareClick(sq) {
  if (animating || aiThinking) return;
  if (chess.isGameOver()) return;

  const turn = chess.turn();
  if (mode === 'pvai' && turn !== playerColor) return;

  if (selectedSquare && selectedSquare !== sq) {
    const legal = chess.moves({ verbose: true }).filter(
      m => m.from === selectedSquare && m.to === sq
    );
    if (legal.length > 0) {
      animating = true;
      const from = selectedSquare;
      selectedSquare = null;
      performMove(from, sq, 'q', () => {
        animating = false;
        afterMove();
      });
      return;
    }
  }

  const piece = chess.get(sq);
  if (piece && piece.color === turn) {
    const wasSelected = selectedSquare === sq;
    selectedSquare = wasSelected ? null : sq;
    if (!wasSelected) sfx.select();
  } else {
    if (selectedSquare) sfx.click();
    selectedSquare = null;
  }
  render();
}

// ============================================================
// 走棋後
// ============================================================
function afterMove() {
  render();
  updateStatus();
  updateHistory();

  if (chess.isGameOver()) {
    handleGameOver();
    return;
  }

  if (chess.isCheck()) sfx.check();

  if (mode === 'pvai' && chess.turn() !== playerColor) {
    triggerAI();
  }
}

// ============================================================
// ✨ 遊戲結束處理（含獎盃發放 + 彈窗）
// ============================================================
function handleGameOver() {
  if (gameResultHandled) return;
  gameResultHandled = true;

  const turn = chess.turn();       // 走棋方（被將死的一方，或和棋的輪方）

  // --- 將死 ---
  if (chess.isCheckmate()) {
    const winnerColor = turn === 'w' ? 'b' : 'w';
    const winnerName = winnerColor === 'w' ? '白方' : '黑方';

    // 判斷是否發獎盃：PvAI 且玩家獲勝
    if (mode === 'pvai' && winnerColor === playerColor) {
      const earned = getTrophyReward(aiDepth);
      if (earned > 0) {
        trophies += earned;
        saveSettings();
        updateTrophyDisplay();
      }
      sfx.checkmate();
      showResultModal('victory', `恭喜您擊敗了${['', '簡單', '中等', '困難'][aiDepth]} AI！`, earned);
    } else if (mode === 'pvai') {
      // 玩家輸了
      sfx.lose();
      showResultModal('defeat', `${winnerName}獲勝，再接再厲！`, 0);
    } else {
      // PvP
      sfx.checkmate();
      showResultModal('pvp', `${winnerName}將死獲勝！`, 0);
    }
    return;
  }

  // --- 逼和 ---
  if (chess.isStalemate()) {
    sfx.check();
    showResultModal('draw', '逼和（無子可動），雙方平手。', 0);
    return;
  }

  // --- 其他和棋 ---
  if (chess.isDraw()) {
    sfx.check();
    showResultModal('draw', '和棋（50 步 / 三次重複 / 子力不足）。', 0);
    return;
  }

  // --- 保險 ---
  sfx.check();
  showResultModal('draw', '遊戲結束。', 0);
}

function updateStatus() {
  const turn = chess.turn();

  if (chess.isGameOver()) {
    aiBadge.classList.add('hidden');
    turnDot.className = 'turn-indicator ' + (turn === 'w' ? 'turn-white' : 'turn-black');
    if (chess.isCheckmate()) {
      const winner = turn === 'w' ? '黑方' : '白方';
      statusText.textContent = `♚ 將死！${winner}勝利`;
    } else if (chess.isStalemate()) {
      statusText.textContent = '🤝 和棋（逼和）';
    } else if (chess.isDraw()) {
      statusText.textContent = '🤝 和棋';
    } else {
      statusText.textContent = '遊戲結束';
    }
    return;
  }

  const turnName = turn === 'w' ? '白方' : '黑方';
  turnDot.className = 'turn-indicator ' + (turn === 'w' ? 'turn-white' : 'turn-black');

  if (mode === 'pvai') {
    if (aiThinking) {
      statusText.textContent = `${turnName}（AI）思考中...`;
      aiBadge.classList.remove('hidden');
    } else if (turn === playerColor) {
      statusText.textContent = `輪到您（${turnName}）走棋`;
      aiBadge.classList.add('hidden');
    } else {
      statusText.textContent = `${turnName}（AI）走棋`;
      aiBadge.classList.add('hidden');
    }
  } else {
    statusText.textContent = `輪到${turnName}走棋`;
    aiBadge.classList.add('hidden');
  }

  if (chess.isCheck()) statusText.textContent += ' ⚠️ 將軍！';
}

// ============================================================
// AI 評估
// ============================================================
const VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

const PAWN_POS = [
  [0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],
  [10,10,20,30,30,20,10,10],[5,5,10,25,25,10,5,5],
  [0,0,0,20,20,0,0,0],[5,-5,-10,0,0,-10,-5,5],
  [5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]
];
const KNIGHT_POS = [
  [-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,0,0,0,-20,-40],
  [-30,0,10,15,15,10,0,-30],[-30,5,15,20,20,15,5,-30],
  [-30,0,15,20,20,15,0,-30],[-30,5,10,15,15,10,5,-30],
  [-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]
];
const BISHOP_POS = [
  [-20,-10,-10,-10,-10,-10,-10,-20],[-10,0,0,0,0,0,0,-10],
  [-10,0,5,10,10,5,0,-10],[-10,5,5,10,10,5,5,-10],
  [-10,0,10,10,10,10,0,-10],[-10,10,10,10,10,10,10,-10],
  [-10,5,0,0,0,0,5,-10],[-20,-10,-10,-10,-10,-10,-10,-20]
];
const ROOK_POS = [
  [0,0,0,0,0,0,0,0],[5,10,10,10,10,10,10,5],
  [-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],
  [-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],
  [-5,0,0,0,0,0,0,-5],[0,0,0,5,5,0,0,0]
];
const QUEEN_POS = [
  [-20,-10,-10,-5,-5,-10,-10,-20],[-10,0,0,0,0,0,0,-10],
  [-10,0,5,5,5,5,0,-10],[-5,0,5,5,5,5,0,-5],
  [0,0,5,5,5,5,0,-5],[-10,5,5,5,5,5,0,-10],
  [-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]
];
const KING_POS = [
  [-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],
  [-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],
  [-20,-30,-30,-40,-40,-30,-30,-20],[-10,-20,-20,-20,-20,-20,-20,-10],
  [20,20,0,0,0,0,20,20],[20,30,10,0,0,10,30,20]
];
const POS = { p: PAWN_POS, n: KNIGHT_POS, b: BISHOP_POS, r: ROOK_POS, q: QUEEN_POS, k: KING_POS };

function evaluateBoard(game) {
  if (game.isCheckmate()) return game.turn() === 'w' ? -Infinity : Infinity;
  if (game.isDraw() || game.isStalemate()) return 0;

  let score = 0;
  const board = game.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (!p) continue;
      const val = VAL[p.type];
      const posTable = POS[p.type];
      const posVal = p.color === 'w' ? posTable[r][c] : posTable[7 - r][c];
      score += (p.color === 'w' ? 1 : -1) * (val + posVal);
    }
  }
  return score;
}

function minimax(game, depth, alpha, beta, isMax) {
  if (depth === 0 || game.isGameOver()) return evaluateBoard(game);
  const moves = game.moves({ verbose: true });

  if (isMax) {
    let best = -Infinity;
    for (const m of moves) {
      game.move(m);
      const s = minimax(game, depth - 1, alpha, beta, false);
      game.undo();
      if (s > best) best = s;
      if (best > alpha) alpha = best;
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const m of moves) {
      game.move(m);
      const s = minimax(game, depth - 1, alpha, beta, true);
      game.undo();
      if (s < best) best = s;
      if (best < beta) beta = best;
      if (beta <= alpha) break;
    }
    return best;
  }
}

function getBestMove(game, depth) {
  const moves = game.moves({ verbose: true });
  if (moves.length === 0) return null;

  const isMax = game.turn() === 'w';
  let bestScore = isMax ? -Infinity : Infinity;
  let bestMoves = [];
  const randomness = depth === 1 ? 60 : 0;

  for (const m of moves) {
    game.move(m);
    let s = minimax(game, depth - 1, -Infinity, Infinity, !isMax);
    game.undo();
    if (randomness) s += (Math.random() - 0.5) * randomness;

    if (isMax) {
      if (s > bestScore) { bestScore = s; bestMoves = [m]; }
      else if (s === bestScore) bestMoves.push(m);
    } else {
      if (s < bestScore) { bestScore = s; bestMoves = [m]; }
      else if (s === bestScore) bestMoves.push(m);
    }
  }
  return bestMoves.length ? bestMoves[Math.floor(Math.random() * bestMoves.length)] : moves[0];
}

// ============================================================
// AI 行動
// ============================================================
function triggerAI() {
  if (aiThinking) return;
  if (chess.isGameOver()) return;

  aiThinking = true;
  updateStatus();

  setTimeout(() => {
    if (mode !== 'pvai' || chess.turn() === playerColor || chess.isGameOver()) {
      aiThinking = false;
      updateStatus();
      return;
    }

    const bestMove = getBestMove(chess, aiDepth);
    aiThinking = false;

    if (bestMove) {
      animating = true;
      performMove(bestMove.from, bestMove.to, bestMove.promotion || 'q', () => {
        animating = false;
        afterMove();
      });
    } else {
      afterMove();
    }
  }, 60);
}

// ============================================================
function undoMove() {
  if (aiThinking || animating) return;
  if (chess.history().length === 0) return;

  if (mode === 'pvai') {
    chess.undo();
    if (chess.turn() !== playerColor && chess.history().length > 0) chess.undo();
  } else {
    chess.undo();
  }

  const hist = chess.history({ verbose: true });
  lastMove = hist.length > 0 ? { from: hist[hist.length-1].from, to: hist[hist.length-1].to } : null;

  selectedSquare = null;
  gameResultHandled = false;
  hideResultModal();
  render();
  updateStatus();
  updateHistory();
  sfx.click();
}
