<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🌼 ICQ 包剪揼</title>
    <style>
        /* ===== 全域 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        :root {
            --bg-dark: #1a2a1a;
            --bg-board: #0f2a1a;
            --green-dark: #2d5a3d;
            --green-mid: #3a7a52;
            --green-light: #5cb883;
            --gold: #ffd966;
            --text-light: #f5ffe0;
            --shadow-heavy: 0 20px 30px rgba(0, 0, 0, 0.8);
            --radius-lg: 40px;
            --radius-md: 24px;
            --radius-sm: 10px;
            --checker-cyan: rgba(107, 201, 160, 0.55);
            --checker-pinkgreen: rgba(200, 230, 200, 0.50);
            --player-blue: rgba(58, 122, 189, 0.80);
            --player-blue-light: rgba(90, 154, 221, 0.75);
            --player-blue-dark: rgba(42, 90, 141, 0.85);
            --computer-red: rgba(200, 80, 50, 0.80);
            --computer-red-light: rgba(220, 120, 80, 0.75);
            --computer-red-dark: rgba(150, 50, 30, 0.85);
        }
        body {
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang HK', Arial, sans-serif;
            padding: 12px;
            position: relative;
        }
        .game-container {
            background: var(--green-dark);
            border-radius: var(--radius-lg);
            padding: 20px 22px 18px;
            box-shadow: var(--shadow-heavy), inset 0 0 0 3px var(--green-light);
            border: 1px solid #7ed9a3;
            max-width: 840px;
            width: 100%;
            position: relative;
        }

        /* ===== 頂欄 ===== */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .game-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-light);
            text-shadow: 0 2px 8px rgba(0, 40, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .game-title .icon {
            font-size: 28px;
        }
        .game-title .sub {
            font-size: 13px;
            font-weight: 400;
            color: #bbebcc;
            opacity: 0.85;
            margin-left: 2px;
            background: rgba(0, 0, 0, 0.25);
            padding: 0 12px;
            border-radius: 30px;
            line-height: 1.8;
        }
        .trophy-area {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 16px 4px 12px;
            border-radius: 40px;
            border: 1px solid #ffd96688;
            font-weight: 600;
            color: #ffd966;
            font-size: 18px;
        }
        .trophy-area .num {
            font-size: 22px;
            min-width: 32px;
            text-align: center;
            color: #fff3b0;
        }
        .turn-indicator {
            background: #1f4d30;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #d4f5dc;
            border: 1px solid var(--green-light);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .turn-indicator .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #88dd88;
            box-shadow: 0 0 12px #88ff88;
            transition: 0.25s;
            flex-shrink: 0;
        }
        .turn-indicator .dot.computer {
            background: #ff8866;
            box-shadow: 0 0 12px #ff8866;
        }
        .turn-indicator .dot.idle {
            background: #aaa;
            box-shadow: none;
        }
        .turn-indicator .dot.selecting {
            background: #ffdd44;
            box-shadow: 0 0 12px #ffdd44;
        }

        /* ===== 棋盤 ===== */
        .board-wrapper {
            background: var(--bg-board);
            border-radius: var(--radius-md);
            padding: 10px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7), 0 8px 20px rgba(0, 0, 0, 0.6);
            border: 2px solid #4d8f66;
            margin-bottom: 8px;
            position: relative;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            aspect-ratio: 7 / 6;
            min-height: 300px;
            padding: 5px;
            box-shadow: inset 0 0 20px rgba(0, 20, 0, 0.5);
            border-radius: 16px;
            position: relative;
            background: var(--bg-board);
        }
        .cell {
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            cursor: default;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.2), inset 0 0 10px rgba(0, 30, 0, 0.2);
            aspect-ratio: 1 / 1;
            min-height: 44px;
            border: 1px solid #3a7a52;
            position: relative;
        }
        .cell.cyan {
            background: var(--checker-cyan);
        }
        .cell.pinkgreen {
            background: var(--checker-pinkgreen);
        }
        .cell.empty {
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.2);
            border-color: #2a5a3a;
        }
        .cell.highlight {
            box-shadow: 0 0 20px #66dd88, inset 0 0 12px #88ff88;
            cursor: pointer;
            transform: scale(1.03);
            z-index: 2;
        }
        .cell.targetable {
            box-shadow: 0 0 28px #88dd88, inset 0 0 16px #88ff88;
            cursor: pointer;
            transform: scale(1.06);
            z-index: 3;
            border-color: #88ff88;
        }
        .cell .piece {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-sm);
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            transition: 0.15s;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.15);
            will-change: transform, opacity;
            background: rgba(60, 60, 60, 0.30);
            backdrop-filter: blur(2px);
        }
        .cell .piece.player-blue {
            color: #fff;
            background: radial-gradient(circle at 35% 30%, rgba(90, 154, 221, 0.70), rgba(42, 90, 141, 0.80));
            border-color: rgba(122, 184, 230, 0.60);
            box-shadow: 0 0 16px rgba(60, 130, 220, 0.20), inset 0 0 24px rgba(100, 180, 255, 0.06);
        }
        .cell .piece.player-red {
            color: #fff5e0;
            background: radial-gradient(circle at 35% 30%, rgba(220, 120, 80, 0.70), rgba(150, 50, 30, 0.80));
            border-color: rgba(255, 150, 120, 0.60);
            box-shadow: 0 0 16px rgba(255, 100, 60, 0.20), inset 0 0 24px rgba(255, 120, 80, 0.06);
        }
        .cell .piece.computer-blue {
            color: #d0ecff;
            background: radial-gradient(circle at 35% 30%, rgba(70, 140, 210, 0.60), rgba(30, 70, 130, 0.70));
            border-color: rgba(100, 180, 255, 0.50);
            box-shadow: 0 0 16px rgba(60, 130, 220, 0.15), inset 0 0 24px rgba(100, 180, 255, 0.05);
        }
        .cell .piece.computer-red {
            color: #ffd5b0;
            background: radial-gradient(circle at 35% 30%, rgba(200, 100, 70, 0.60), rgba(130, 40, 20, 0.70));
            border-color: rgba(255, 150, 120, 0.50);
            box-shadow: 0 0 16px rgba(255, 120, 80, 0.15), inset 0 0 24px rgba(255, 120, 80, 0.05);
        }
        .cell .piece.exposed {
            border-color: #ff4444 !important;
            box-shadow: 0 0 24px #ff4444, inset 0 0 20px rgba(255, 68, 68, 0.15);
        }
        .cell .piece.flag {
            border-color: #ffdd88 !important;
            box-shadow: 0 0 28px #ffdd88, inset 0 0 24px rgba(255, 220, 100, 0.15);
        }
        .cell .piece.trap {
            border-color: #ffaa44 !important;
            box-shadow: 0 0 20px #ffaa44, inset 0 0 20px rgba(255, 170, 68, 0.15);
        }
        .piece .body {
            font-size: 34px;
            line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
            position: relative;
            z-index: 1;
        }
        .piece .weapon {
            position: absolute;
            bottom: 0px;
            right: 2px;
            font-size: 16px;
            line-height: 1;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6));
            z-index: 2;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 50%;
            padding: 1px 3px;
            min-width: 22px;
            text-align: center;
        }
        .piece .eye {
            position: absolute;
            bottom: 0px;
            left: 2px;
            font-size: 16px;
            line-height: 1;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6));
            z-index: 2;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 50%;
            padding: 1px 3px;
            min-width: 22px;
            text-align: center;
        }
        .piece .hidden-body {
            font-size: 34px;
            opacity: 0.6;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
        }
        .piece.selected {
            animation: pulse-glow 0.8s ease-in-out infinite alternate;
            border-color: #ffff88 !important;
            box-shadow: 0 0 40px #ffff88, inset 0 0 30px rgba(255, 255, 120, 0.15) !important;
            z-index: 5;
        }
        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 20px #ffff88, inset 0 0 20px rgba(255, 255, 120, 0.08);
            }
            100% {
                box-shadow: 0 0 50px #ffffaa, inset 0 0 40px rgba(255, 255, 120, 0.20);
            }
        }

        /* ===== fly-in 動畫 ===== */
        @keyframes fly-in {
            0% {
                transform: scale(2.0) translate(0, -30px);
                opacity: 0;
            }
            50% {
                transform: scale(1.15) translate(8px, -10px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
        }
        @keyframes fly-out {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(0.1) rotate(80deg) translate(120px, -120px);
                opacity: 0;
            }
        }
        .cell .piece.moving {
            animation: fly-in 0.45s ease-out forwards;
            z-index: 10;
            opacity: 0;
        }
        .cell .piece.attacking {
            animation: fly-in 0.45s ease-out forwards;
            z-index: 10;
            opacity: 0;
        }
        .cell .piece.defeated {
            animation: fly-out 0.45s ease-in forwards;
            z-index: 10;
        }
        .cell .piece.selectable {
            cursor: pointer;
            border-color: #88ddff !important;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.30);
        }
        .cell .piece.selectable:hover {
            transform: scale(1.06);
        }
        .cell .piece.trap-select {
            border-color: #ffaa44 !important;
            box-shadow: 0 0 30px #ffaa44, inset 0 0 20px rgba(255, 170, 68, 0.20);
        }
        .cell .piece.king-select {
            border-color: #ffdd88 !important;
            box-shadow: 0 0 30px #ffdd88, inset 0 0 20px rgba(255, 220, 100, 0.20);
        }
        .cell .piece.chosen-trap {
            border-color: #ff8800 !important;
            box-shadow: 0 0 40px #ff8800, inset 0 0 30px rgba(255, 136, 0, 0.25);
        }
        .cell .piece.chosen-king {
            border-color: #ffdd44 !important;
            box-shadow: 0 0 40px #ffdd44, inset 0 0 30px rgba(255, 220, 68, 0.25);
        }

        /* ===== 底部 ===== */
        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 4px 0;
            color: #d0f0d8;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .score-area {
            display: flex;
            gap: 18px;
            font-size: 14px;
            font-weight: 500;
        }
        .score-area span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .score-area .num {
            font-weight: 700;
            font-size: 19px;
            color: var(--text-light);
            min-width: 18px;
        }
        .score-area .num.player-score {
            color: #88ddff;
        }
        .score-area .num.computer-score {
            color: #ffaa88;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            background: #1f4d30;
            border: 1px solid var(--green-light);
            color: #e0ffe8;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 0 #0f2a18;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .btn:hover {
            background: #2a6a40;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #0f2a18;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f2a18;
        }
        .btn-primary {
            background: #3a8a5a;
            border-color: #7ed9a3;
            box-shadow: 0 3px 0 #1a4a2a;
        }
        .btn-primary:hover {
            background: #4aaa6a;
        }
        .btn-gold {
            background: #8a7a3a;
            border-color: #ffd966;
            color: #fff3c0;
            box-shadow: 0 3px 0 #4a3a1a;
        }
        .btn-gold:hover {
            background: #aa9a4a;
        }
        .btn-red {
            background: #7a3a2a;
            border-color: #ff8866;
            color: #ffe0d0;
            box-shadow: 0 3px 0 #4a1a0a;
        }
        .btn-red:hover {
            background: #9a4a3a;
        }
        .btn-blue {
            background: #2a4a7a;
            border-color: #6688ff;
            color: #d0e0ff;
            box-shadow: 0 3px 0 #0a1a4a;
        }
        .btn-blue:hover {
            background: #3a5a9a;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .copyright {
            font-size: 11px;
            color: #7a9a82;
            text-align: center;
            padding-top: 6px;
            border-top: 1px solid #3a5a42;
            margin-top: 6px;
            letter-spacing: 0.3px;
            width: 100%;
        }

        /* ===== 覆蓋層 ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 0, 0.82);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fade-in 0.3s;
        }
        .overlay.active {
            display: flex;
        }
        @keyframes fade-in {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== 標題畫面 - 封面背景 + 磨砂層優化 ===== */
        #titleOverlay {
            backdrop-filter: none;
            background: rgba(0, 20, 0, 0.70);
        }
        #titleOverlay .modal {
            background: rgba(10, 30, 15, 0.78);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(126, 217, 163, 0.6);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 0 60px rgba(0, 60, 30, 0.15);
            position: relative;
            overflow: hidden;
            padding: 0;
        }
        /* 背景圖片滾動層 */
        #titleOverlay .modal .bg-scroll-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        #titleOverlay .modal .bg-scroll-wrap img {
            width: 100%;
            height: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
            transition: none;
        }
        /* 內容層 - 降低背景不透明度與模糊，讓圖片更清晰 */
        #titleOverlay .modal .modal-content {
            position: relative;
            z-index: 1;
            padding: 28px 30px 32px;
            background: rgba(10, 30, 15, 0.25);
            /* 更透明 */
            backdrop-filter: blur(0px);
            /* 更輕微模糊 */
            border-radius: var(--radius-lg);
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #titleOverlay .modal .big-icon {
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
        }
        #titleOverlay .modal .title {
            color: #f5ffe0;
            text-shadow: 0 0 30px rgba(0, 80, 40, 0.6);
        }
        #titleOverlay .modal .sub {
            color: #d4f5dc;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .modal {
            background: #1f4d30;
            border-radius: var(--radius-lg);
            max-width: 480px;
            width: 92%;
            text-align: center;
            border: 2px solid #7ed9a3;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            padding: 0;
        }
        .modal .modal-content {
            padding: 28px 30px 32px;
            position: relative;
            z-index: 1;
            border-radius: var(--radius-lg);
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .modal .big-icon {
            font-size: 68px;
            margin-bottom: 2px;
        }
        .modal .title {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-light);
        }
        .modal .sub {
            font-size: 16px;
            color: #c0e8cc;
            margin-bottom: 12px;
        }
        .modal .btn-big {
            background: #3a8a5a;
            border: none;
            color: #fff;
            padding: 10px 40px;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #1a4a2a;
            margin: 4px 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .modal .btn-big:hover {
            background: #4aaa6a;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1a4a2a;
        }
        .modal .btn-big:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a4a2a;
        }
        .modal .btn-big.gold {
            background: #8a7a3a;
            box-shadow: 0 4px 0 #4a3a1a;
        }
        .modal .btn-big.gold:hover {
            background: #aa9a4a;
        }
        .modal .btn-big.red {
            background: #8a3a2a;
            box-shadow: 0 4px 0 #4a1a0a;
            border: 1px solid #ff8866;
        }
        .modal .btn-big.red:hover {
            background: #aa4a3a;
        }
        .modal .btn-big.blue {
            background: #2a4a8a;
            box-shadow: 0 4px 0 #0a1a5a;
            border: 1px solid #6688ff;
        }
        .modal .btn-big.blue:hover {
            background: #3a5aaa;
        }
        .modal .btn-big.muted {
            background: #4a4a4a;
            box-shadow: 0 4px 0 #2a2a2a;
        }
        .modal .btn-big.muted:hover {
            background: #5a5a5a;
        }
        .modal .btn-big.small {
            padding: 6px 20px;
            font-size: 14px;
            min-width: 80px;
        }
        .title-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }
        .title-buttons .row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .title-buttons .btn-big {
            min-width: 120px;
            justify-content: center;
        }
        .music-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 6px 0 4px;
            font-size: 15px;
            color: #d0f0d8;
        }
        .music-toggle .btn-icon {
            background: none;
            border: 2px solid var(--green-light);
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
            color: #d0f0d8;
            background: rgba(0, 0, 0, 0.2);
        }
        .music-toggle .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }
        .music-toggle .btn-icon.off {
            opacity: 0.4;
            border-color: #666;
        }
        .music-toggle .label {
            font-weight: 500;
        }
        .title-footer-trophy {
            margin-top: 10px;
            font-size: 14px;
            color: #ffd966;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 16px;
            border-radius: 30px;
            display: inline-block;
        }
        .color-preview {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }
        .color-preview .preview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0, 0, 0, 0.20);
        }
        .color-preview .preview-item:hover {
            transform: scale(1.04);
            background: rgba(255, 255, 255, 0.08);
        }
