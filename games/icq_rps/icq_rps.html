    <script>
        // ================================================================
        //  🌼 ICQ 包剪揼 · 紅藍對決版 (v2.3.1)
        //  修復：音樂不中斷｜封面磨砂調淡
        // ================================================================

        (function() {
            'use strict';

            // ---- 常數 ----
            const ROWS = 6,
                COLS = 7;
            const TYPES = ['rock', 'scissors', 'paper'];
            const EMOJI = { rock: '🗻', scissors: '✂️', paper: '📄', king: '🚩', trap: '⚠️' };
            const BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
            const BEAT_BY = { rock: 'paper', scissors: 'rock', paper: 'scissors' };

            // ---- DOM ----
            const boardEl = document.getElementById('board');
            const turnDot = document.getElementById('turnDot');
            const turnText = document.getElementById('turnText');
            const playerScoreEl = document.getElementById('playerScore');
            const computerScoreEl = document.getElementById('computerScore');
            const trophyCountEl = document.getElementById('trophyCount');
            const titleTrophyFooter = document.getElementById('titleTrophyFooter');
            const btnStartReset = document.getElementById('btnStartReset');
            const btnReroll = document.getElementById('btnReroll');
            const btnTitleStart = document.getElementById('btnTitleStart');
            const btnTitleSave = document.getElementById('btnTitleSave');
            const btnTitleLoad = document.getElementById('btnTitleLoad');
            const btnMusicToggle = document.getElementById('musicToggleBtn');
            const musicToggleLabel = document.getElementById('musicToggleLabel');
            const titleOverlay = document.getElementById('titleOverlay');
            const gameoverOverlay = document.getElementById('gameoverOverlay');
            const gameoverIcon = document.getElementById('gameoverIcon');
            const gameoverTitle = document.getElementById('gameoverTitle');
            const gameoverSub = document.getElementById('gameoverSub');
            const gameoverConfirm = document.getElementById('gameoverConfirm');
            const gameoverTrophy = document.getElementById('gameoverTrophy');
            const copyrightEl = document.getElementById('copyright');
            const bgAudio = document.getElementById('bgMusic');
            const rematchOverlay = document.getElementById('rematchOverlay');
            const rematchSub = document.getElementById('rematchSub');
            const rematchResult = document.getElementById('rematchResult');
            const rematchAttempt = document.getElementById('rematchAttempt');
            const rematchChoices = document.getElementById('rematchChoices');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const fsIcon = document.getElementById('fsIcon');
            const playerLabel = document.getElementById('playerLabel');
            const computerLabel = document.getElementById('computerLabel');
            const previewBlue = document.getElementById('previewBlue');
            const previewRed = document.getElementById('previewRed');
            const bgScrollImg = document.getElementById('bgScrollImg');
            const bgScrollWrap = document.getElementById('bgScrollWrap');

            // ---- 遊戲狀態 ----
            let board = [];
            let allPieces = [];
            let playerPieces = [];
            let computerPieces = [];
            let selectedPos = null;
            let currentTurn = 'player';
            let gameOver = false;
            let isProcessing = false;
            let gameStarted = false;
            let animating = false;
            let playerColor = 'blue';
            let gamePhase = 'TITLE';
            let selectPhase = 'trap';
            let trapPos = null;
            let kingPos = null;
            let normalPieces = [];

            // ---- 獎盃 ----
            let trophyCount = 0;
            const TROPHY_KEY = 'icq_trophy_count';
            const SETTINGS_KEY = 'icq_game_settings';

            // ---- 音樂管理 (修改：不中斷) ----
            let isMusicOn = true;
            let audioCtx = null;
            let currentMusicPhase = 'TITLE';
            const MUSIC_FORMATION = 'ICQ RPS - Formation.mp3';
            const MUSIC_FIGHT = 'ICQ RPS - Fight.mp3';

            // ---- 移動動畫 ----
            let _moveTarget = null;
            let _moveAnimPending = false;

            // ---- 封面滾動 ----
            let scrollAnimId = null;
            let scrollPaused = false;

            // ---- 全屏 ----
            let isFullscreen = false;

            // ---- 初始化獎盃 ----
            function loadTrophy() {
                const saved = localStorage.getItem(TROPHY_KEY);
                trophyCount = saved ? parseInt(saved, 10) || 0 : 0;
                updateTrophyDisplay();
            }

            function saveTrophy() {
                localStorage.setItem(TROPHY_KEY, String(trophyCount));
            }

            function updateTrophyDisplay() {
                trophyCountEl.textContent = trophyCount;
                if (titleTrophyFooter) {
                    titleTrophyFooter.textContent = `🏆 ${trophyCount}`;
                }
            }

            function addTrophy(amount) {
                trophyCount += amount;
                saveTrophy();
                updateTrophyDisplay();
            }

            // ---- 儲存／載入 ----
            function saveSettings() {
                const data = {
                    trophy: trophyCount,
                    musicOn: isMusicOn,
                    timestamp: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icq_save_${new Date().toISOString().slice(0,10)}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('💾 已儲存 (.txt)');
            }

            function loadSettings() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.txt,.json';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (data.trophy !== undefined) {
                                trophyCount = data.trophy;
                                saveTrophy();
                                updateTrophyDisplay();
                            }
                            if (data.musicOn !== undefined) {
                                isMusicOn = data.musicOn;
                                updateMusicUI();
                                if (gameStarted || gamePhase === 'SELECT' || gamePhase === 'PLAYING') {
                                    if (isMusicOn) startBackgroundMusic();
                                    else stopBackgroundMusic();
                                }
                            }
                            showToast('📁 設定已載入 (.txt)');
                        } catch (err) {
                            showToast('❌ 載入失敗');
                            console.warn(err);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

            function showToast(msg) {
                const old = document.querySelector('.toast-msg');
                if (old) old.remove();
                const div = document.createElement('div');
                div.className = 'toast-msg';
                div.textContent = msg;
                document.body.appendChild(div);
                setTimeout(() => { div.style.opacity = '0';
                    setTimeout(() => div.remove(), 500); }, 1800);
            }

            // ---- 音樂核心 (確保不中斷) ----
            function updateMusicUI() {
                if (isMusicOn) {
                    btnMusicToggle.textContent = '🔊';
                    btnMusicToggle.className = 'btn-icon';
                    musicToggleLabel.textContent = '播放中';
                } else {
                    btnMusicToggle.textContent = '🔇';
                    btnMusicToggle.className = 'btn-icon off';
                    musicToggleLabel.textContent = '靜音';
                }
            }

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            }

            /** 設定音樂階段，若目標相同且正在播放則不做任何事（不中斷） */
            function setMusicPhase(phase) {
                const oldPhase = currentMusicPhase;
                currentMusicPhase = phase;
                if (!isMusicOn) return;
                const targetSrc = (phase === 'PLAYING') ? MUSIC_FIGHT : MUSIC_FORMATION;
                try {
                    const currentSrc = bgAudio.src || '';
                    // 如果目標與當前相同
                    if (currentSrc.indexOf(targetSrc) !== -1) {
                        // 若已暫停則恢復播放，否則不做任何事
                        if (bgAudio.paused) {
                            bgAudio.play().catch(() => {});
                        }
                        return;
                    }
                    // 目標不同，切換
                    bgAudio.src = targetSrc;
                    bgAudio.load();
                    bgAudio.play().catch(() => {});
                } catch (e) {}
            }

            function startBackgroundMusic() {
                if (!isMusicOn) return;
                try {
                    const targetSrc = (currentMusicPhase === 'PLAYING') ? MUSIC_FIGHT : MUSIC_FORMATION;
                    const currentSrc = bgAudio.src || '';
                    if (currentSrc.indexOf(targetSrc) === -1) {
                        bgAudio.src = targetSrc;
                        bgAudio.load();
                    }
                    if (bgAudio.paused) {
                        bgAudio.play().catch(() => {});
                    }
                } catch (e) {}
            }

            function stopBackgroundMusic() {
                try { if (!bgAudio.paused) bgAudio.pause(); } catch (e) {}
            }

            function playSound(type) {
                if (!isMusicOn) return;
                try {
                    const ctx = initAudio();
                    const now = ctx.currentTime;
                    switch (type) {
                        case 'wind': {
                            const buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
                            const d = buf.getChannelData(0);
                            for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / d.length *
                            4);
                            const s = ctx.createBufferSource();
                            s.buffer = buf;
                            const f = ctx.createBiquadFilter();
                            f.type = 'lowpass';
                            f.frequency.value = 600 + Math.random() * 400;
                            const g = ctx.createGain();
                            g.gain.value = 1.0;
                            s.connect(f);
                            f.connect(g);
                            g.connect(ctx.destination);
                            s.start(now);
                            s.stop(now + 0.35);
                            break;
                        }
                        case 'levelDown': {
                            const o = ctx.createOscillator();
                            const g = ctx.createGain();
                            o.type = 'sawtooth';
                            o.frequency.setValueAtTime(600, now);
                            o.frequency.exponentialRampToValueAtTime(150, now + 0.35);
                            g.gain.setValueAtTime(0.15, now);
                            g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                            o.connect(g);
                            g.connect(ctx.destination);
                            o.start(now);
                            o.stop(now + 0.38);
                            break;
                        }
                        case 'levelUp': {
                            const o = ctx.createOscillator();
                            const g = ctx.createGain();
                            o.type = 'sine';
                            o.frequency.setValueAtTime(300, now);
                            o.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                            g.gain.setValueAtTime(0.18, now);
                            g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                            o.connect(g);
                            g.connect(ctx.destination);
                            o.start(now);
                            o.stop(now + 0.42);
                            const o2 = ctx.createOscillator();
                            const g2 = ctx.createGain();
                            o2.type = 'sine';
                            o2.frequency.setValueAtTime(400, now);
                            o2.frequency.exponentialRampToValueAtTime(1000, now + 0.35);
                            g2.gain.setValueAtTime(0.08, now);
                            g2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                            o2.connect(g2);
                            g2.connect(ctx.destination);
                            o2.start(now);
                            o2.stop(now + 0.38);
                            break;
                        }
                        default:
                            break;
                    }
                } catch (e) {}
            }

            // ---- 全屏 ----
            function toggleFullscreen() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement &&
                    !document.mozFullScreenElement && !document.msFullscreenElement) {
                    const el = document.documentElement;
                    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
                    else if (el.msRequestFullscreen) el.msRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                }
            }

            function updateFullscreenIcon() {
                const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement ||
                    document.mozFullScreenElement || document.msFullscreenElement);
                fsIcon.textContent = '⛶';
                fullscreenBtn.style.borderColor = isFS ? '#ffd966' : '#7ed9a3';
            }

            document.addEventListener('fullscreenchange', updateFullscreenIcon);
            document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
            document.addEventListener('mozfullscreenchange', updateFullscreenIcon);
            document.addEventListener('MSFullscreenChange', updateFullscreenIcon);

            // ---- 封面背景滾動 ----
            function startBgScroll() {
                if (!bgScrollImg.complete) {
                    bgScrollImg.onload = function() {
                        doBgScroll();
                    };
                    return;
                }
                doBgScroll();
            }

            function doBgScroll() {
                const wrap = bgScrollWrap;
                const img = bgScrollImg;
                const wrapRect = wrap.getBoundingClientRect();
                const imgRect = img.getBoundingClientRect();
                const imgH = imgRect.height;
                const wrapH = wrapRect.height;
                if (imgH <= wrapH) return;
                const maxOffset = -(imgH - wrapH);
                let currentOffset = 0;
                let direction = 1;
                let paused = false;
                let pauseTimer = null;

                function animateScroll() {
                    if (paused) return;
                    const speed = 0.5;
                    currentOffset += direction * speed;
                    if (direction === 1 && currentOffset >= 0) {
                        currentOffset = 0;
                        direction = -1;
                        paused = true;
                        if (pauseTimer) clearTimeout(pauseTimer);
                        pauseTimer = setTimeout(() => { paused = false;
                            pauseTimer = null; }, 2000);
                    } else if (direction === -1 && currentOffset <= maxOffset) {
                        currentOffset = maxOffset;
                        direction = 1;
                        paused = true;
                        if (pauseTimer) clearTimeout(pauseTimer);
                        pauseTimer = setTimeout(() => { paused = false;
                            pauseTimer = null; }, 2000);
                    }
                    img.style.transform = `translateY(${currentOffset}px)`;
                    scrollAnimId = requestAnimationFrame(animateScroll);
                }

                img.style.transform = 'translateY(0px)';
                currentOffset = 0;
                direction = 1;
                paused = true;
                if (pauseTimer) clearTimeout(pauseTimer);
                pauseTimer = setTimeout(() => {
                    paused = false;
                    pauseTimer = null;
                    scrollAnimId = requestAnimationFrame(animateScroll);
                }, 2000);
            }

            function stopBgScroll() {
                if (scrollAnimId) {
                    cancelAnimationFrame(scrollAnimId);
                    scrollAnimId = null;
                }
            }

            // ---- 工具 ----
            function isInBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

            function getAdjacent(r, c) {
                const dirs = [
                    [-1, 0],
                    [1, 0],
                    [0, -1],
                    [0, 1]
                ];
                const res = [];
                for (const d of dirs) {
                    const nr = r + d[0],
                        nc = c + d[1];
                    if (isInBounds(nr, nc)) res.push({ r: nr, c: nc });
                }
                return res;
            }

            function getPieces(owner) { return owner === 'player' ? playerPieces : computerPieces; }

            function removePiece(r, c) {
                const piece = board[r][c];
                if (!piece) return null;
                board[r][c] = null;
                const list = piece.owner === 'player' ? playerPieces : computerPieces;
                const idx = list.indexOf(piece);
                if (idx !== -1) list.splice(idx, 1);
                const allIdx = allPieces.indexOf(piece);
                if (allIdx !== -1) allPieces.splice(allIdx, 1);
                return piece;
            }

            function movePiece(fromR, fromC, toR, toC) {
                const piece = board[fromR][fromC];
                if (!piece) return null;
                board[fromR][fromC] = null;
                piece.row = toR;
                piece.col = toC;
                board[toR][toC] = piece;
                _moveTarget = { r: toR, c: toC };
                return piece;
            }

            function getValidMoves(r, c) {
                const piece = board[r][c];
                if (!piece) return [];
                if (piece.type === 'trap') return [];
                const adj = getAdjacent(r, c);
                const result = [];
                for (const pos of adj) {
                    const target = board[pos.r][pos.c];
                    if (!target) {
                        result.push({ r: pos.r, c: pos.c, action: 'move' });
                    } else if (target.owner !== piece.owner) {
                        result.push({ r: pos.r, c: pos.c, action: 'battle' });
                    }
                }
                return result;
            }

            // ---- 戰鬥解析 ----
            function resolveBattleBasic(attacker, defender) {
                if (attacker.type === 'king' && defender.type === 'king') return { result: 'win', winner: 'attacker' };
                if (attacker.type === 'king' && defender.type === 'trap') return { result: 'disarm', winner: 'attacker' };
                if (defender.type === 'trap') return { result: 'trap', winner: 'defender' };
                if (defender.type === 'king') return { result: 'king', winner: 'attacker' };
                const aType = attacker.type,
                    dType = defender.type;
                if (aType === dType) return { result: 'draw', winner: null };
                if (BEATS[aType] === dType) return { result: 'win', winner: 'attacker' };
                return { result: 'lose', winner: 'defender' };
            }

            // ---- 重猜彈窗 ----
            function showRematch(attempt) {
                return new Promise((resolve) => {
                    rematchOverlay.classList.add('active');
                    rematchResult.textContent = '';
                    rematchAttempt.textContent = `第 ${attempt} 次重猜`;
                    rematchSub.textContent = '請選擇你的武器';

                    const btns = rematchChoices.querySelectorAll('.choice-btn');
                    btns.forEach(b => {
                        b.onclick = null;
                        b.disabled = false;
                    });

                    const handler = (e) => {
                        const choice = e.currentTarget.dataset.choice;
                        const playerChoice = choice;
                        const aiChoice = TYPES[Math.floor(Math.random() * TYPES.length)];
                        rematchResult.textContent = `你：${EMOJI[playerChoice]}  vs  🤖：${EMOJI[aiChoice]}`;
                        rematchSub.textContent = '比較中...';

                        if (playerChoice === aiChoice) {
                            rematchSub.textContent = '又平手！再選一次！';
                            btns.forEach(b => { b.onclick = null; });
                            setTimeout(() => {
                                showRematch(attempt + 1).then(resolve);
                            }, 600);
                            return;
                        }

                        const winner = BEATS[playerChoice] === aiChoice ? 'player' : 'computer';
                        rematchSub.textContent = winner === 'player' ? '🎉 你贏了！' : '🤖 電腦贏了！';
                        rematchResult.textContent += `  → ${winner === 'player' ? '✅ 你勝出！' : '❌ 電腦勝出！'}`;
                        btns.forEach(b => { b.disabled = true; });

                        setTimeout(() => {
                            rematchOverlay.classList.remove('active');
                            btns.forEach(b => { b.disabled = false; });
                            resolve({ winner, playerChoice, aiChoice });
                        }, 800);
                    };

                    btns.forEach(b => {
                        b.onclick = handler;
                    });
                });
            }

            // ---- 戰鬥完整流程 ----
            async function resolveBattleWithRematch(attacker, defender) {
                let battle = resolveBattleBasic(attacker, defender);
                let attempt = 1;
                while (battle.result === 'draw') {
                    const result = await showRematch(attempt);
                    if (attacker.owner === 'player') {
                        attacker.type = result.playerChoice;
                        defender.type = result.aiChoice;
                    } else {
                        attacker.type = result.aiChoice;
                        defender.type = result.playerChoice;
                    }
                    battle = resolveBattleBasic(attacker, defender);
                    attempt++;
                }
                return battle;
            }

            // ---- 執行戰鬥 ----
            async function executeBattleWithAnimation(attacker, defender, callback) {
                if (animating) return;
                animating = true;

                attacker.revealed = true;
                defender.revealed = true;
                if (defender.owner === 'player') defender.exposed = true;
                if (attacker.owner === 'player') attacker.exposed = true;

                const fromR = attacker.row,
                    fromC = attacker.col;
                const toR = defender.row,
                    toC = defender.col;

                const battle = await resolveBattleWithRematch(attacker, defender);

                let attackerWins = false,
                    defenderWins = false,
                    bothDie = false,
                    disarm = false;

                const result = battle.result;
                if (result === 'win') attackerWins = true;
                else if (result === 'lose') defenderWins = true;
                else if (result === 'draw') bothDie = true;
                else if (result === 'trap') defenderWins = true;
                else if (result === 'king') attackerWins = true;
                else if (result === 'disarm') disarm = true;

                if (attackerWins) {
                    removePiece(toR, toC);
                    movePiece(fromR, fromC, toR, toC);
                } else if (defenderWins) {
                    removePiece(fromR, fromC);
                } else if (bothDie) {
                    removePiece(fromR, fromC);
                    removePiece(toR, toC);
                } else if (disarm) {
                    removePiece(toR, toC);
                    movePiece(fromR, fromC, toR, toC);
                }

                if (attackerWins || result === 'king') playSound('levelUp');
                else if (defenderWins || result === 'trap' || bothDie) playSound('levelDown');

                renderBoard();
                if (_moveTarget) {
                    _moveAnimPending = true;
                    playMoveAnimationOnBoard();
                }

                const cells = boardEl.querySelectorAll('.cell');
                let winnerCell = null;
                if (attackerWins || disarm || result === 'king') {
                    for (const cell of cells) {
                        const r = parseInt(cell.dataset.r);
                        const c = parseInt(cell.dataset.c);
                        if (r === toR && c === toC) { winnerCell = cell; break; }
                    }
                }
                if (winnerCell) {
                    const piece = winnerCell.querySelector('.piece');
                    if (piece) {
                        piece.classList.add('attacking');
                        setTimeout(() => {
                            piece.classList.remove('attacking');
                            animating = false;
                            callback(battle);
                        }, 500);
                        return;
                    }
                }
                animating = false;
                callback(battle);
            }

            // ---- 移動動畫 ----
            function playMoveAnimationOnBoard() {
                if (!_moveTarget || _moveAnimPending === false) return;
                _moveAnimPending = false;
                const { r, c } = _moveTarget;
                requestAnimationFrame(() => {
                    const cells = boardEl.querySelectorAll('.cell');
                    for (const cell of cells) {
                        if (parseInt(cell.dataset.r) === r && parseInt(cell.dataset.c) === c) {
                            const piece = cell.querySelector('.piece');
                            if (piece) {
                                piece.style.opacity = '0';
                                piece.classList.add('moving');
                                void piece.offsetWidth;
                                piece.style.opacity = '';
                                const onAnimEnd = () => {
                                    piece.classList.remove('moving');
                                    piece.removeEventListener('animationend', onAnimEnd);
                                    _moveTarget = null;
                                };
                                piece.addEventListener('animationend', onAnimEnd);
                                setTimeout(() => {
                                    if (_moveTarget) {
                                        piece.classList.remove('moving');
                                        piece.style.opacity = '';
                                        _moveTarget = null;
                                    }
                                }, 2000);
                            } else {
                                _moveTarget = null;
                            }
                            break;
                        }
                    }
                });
            }

            // ---- 玩家移動 ----
            async function playerMove(fromR, fromC, toR, toC) {
                if (isProcessing || gameOver || !gameStarted || currentTurn !== 'player' || animating) return false;
                const piece = board[fromR][fromC];
                if (!piece || piece.owner !== 'player' || piece.type === 'trap') return false;
                const moves = getValidMoves(fromR, fromC);
                const target = moves.find(m => m.r === toR && m.c === toC);
                if (!target) return false;

                isProcessing = true;
                selectedPos = null;

                if (target.action === 'move') {
                    movePiece(fromR, fromC, toR, toC);
                    playSound('wind');
                    _moveAnimPending = true;
                    afterPlayerAction();
                    return true;
                } else {
                    const defender = board[toR][toC];
                    await executeBattleWithAnimation(piece, defender, (battle) => {
                        if (battle.result === 'king' || battle.result === 'win') {
                            if (checkGameOver()) { isProcessing = false; return; }
                        }
                        afterPlayerAction();
                    });
                    return true;
                }
            }

            function afterPlayerAction() {
                updateUI();
                if (_moveAnimPending) {
                    playMoveAnimationOnBoard();
                }
                if (checkGameOver()) { isProcessing = false; return; }
                currentTurn = 'computer';
                updateTurnUI();
                isProcessing = false;
                setTimeout(() => computerTurn(), 400);
            }

            // ---- 電腦 AI ----
            async function computerTurn() {
                if (gameOver || !gameStarted || currentTurn !== 'computer' || animating) return;
                if (isProcessing) return;
                isProcessing = true;

                const pieces = getPieces('computer');
                if (pieces.length === 0) { isProcessing = false;
                    checkGameOver(); return; }

                let moves = [];
                for (const p of pieces) {
                    if (p.type === 'trap') continue;
                    const valid = getValidMoves(p.row, p.col);
                    for (const m of valid) {
                        moves.push({
                            piece: p,
                            fromR: p.row,
                            fromC: p.col,
                            toR: m.r,
                            toC: m.c,
                            action: m.action,
                            target: board[m.r][m.c]
                        });
                    }
                }
                if (moves.length === 0) {
                    isProcessing = false;
                    if (checkGameOver()) return;
                    currentTurn = 'player';
                    updateTurnUI();
                    isProcessing = false;
                    return;
                }

                const knownPlayer = playerPieces.filter(p => p.revealed === true);
                let bestMoves = [];
                if (knownPlayer.length > 0) {
                    for (const known of knownPlayer) {
                        const counterType = BEAT_BY[known.type];
                        const candidates = moves.filter(m => m.piece.type === counterType);
                        const direct = candidates.filter(m => m.action === 'battle' && m.target === known);
                        if (direct.length > 0) bestMoves = bestMoves.concat(direct);
                        else {
                            const near = candidates.filter(m => {
                                const adj = getAdjacent(known.row, known.col);
                                return adj.some(pos => pos.r === m.toR && pos.c === m.toC);
                            });
                            if (near.length > 0) bestMoves = bestMoves.concat(near);
                        }
                    }
                    if (bestMoves.length > 0) {
                        const direct = bestMoves.filter(m => m.action === 'battle' && m.target && m.target.owner ===
                            'player');
                        if (direct.length > 0) bestMoves = direct;
                        else {
                            const near = bestMoves.filter(m => m.action === 'move');
                            if (near.length > 0) bestMoves = near;
                        }
                    }
                }
                if (bestMoves.length === 0) bestMoves = moves;

                const pick = bestMoves[Math.floor(Math.random() * bestMoves.length)];

                if (pick.action === 'move') {
                    movePiece(pick.fromR, pick.fromC, pick.toR, pick.toC);
                    playSound('wind');
                    _moveAnimPending = true;
                    afterComputerAction();
                } else {
                    const defender = board[pick.toR][pick.toC];
                    await executeBattleWithAnimation(pick.piece, defender, (battle) => {
                        if (battle.result === 'king' || battle.result === 'win') {
                            if (checkGameOver()) { isProcessing = false; return; }
                        }
                        afterComputerAction();
                    });
                }
            }

            function afterComputerAction() {
                updateUI();
                if (_moveAnimPending) {
                    playMoveAnimationOnBoard();
                }
                if (checkGameOver()) { isProcessing = false; return; }
                currentTurn = 'player';
                updateTurnUI();
                isProcessing = false;
            }

            // ---- 檢查遊戲結束 ----
            function checkGameOver() {
                if (!gameStarted) return false;
                const pKing = playerPieces.find(p => p.type === 'king');
                const cKing = computerPieces.find(p => p.type === 'king');
                if (!pKing) {
                    gameOver = true;
                    showGameOver('🤖', '電腦 獲勝！', '你的君主被擊敗了！', false);
                    updateUI();
                    updateTurnUI();
                    updateButtons();
                    return true;
                }
                if (!cKing) {
                    gameOver = true;
                    showGameOver('🏆', '你贏了！', '擊敗了對方的君主！', true);
                    updateUI();
                    updateTurnUI();
                    updateButtons();
                    return true;
                }
                if (playerPieces.length === 0) {
                    gameOver = true;
                    showGameOver('🤖', '電腦 獲勝！', '你的所有棋子被消滅！', false);
                    updateUI();
                    updateTurnUI();
                    updateButtons();
                    return true;
                }
                if (computerPieces.length === 0) {
                    gameOver = true;
                    showGameOver('🏆', '你贏了！', '消滅了所有電腦棋子！', true);
                    updateUI();
                    updateTurnUI();
                    updateButtons();
                    return true;
                }
                return false;
            }

            function showGameOver(icon, title, sub, playerWon) {
                gameoverIcon.textContent = icon;
                gameoverTitle.textContent = title;
                gameoverSub.textContent = sub;
                if (playerWon) {
                    addTrophy(50);
                    gameoverTrophy.textContent = '🏆 獲得 50 個獎盃！';
                    playSound('levelUp');
                } else {
                    gameoverTrophy.textContent = '';
                    playSound('levelDown');
                }
                gameoverConfirm.textContent = '🏠 回到標題';
                gameoverOverlay.classList.add('active');
                gamePhase = 'GAMEOVER';
                setMusicPhase('TITLE');
            }

            // ---- 棋子顏色 ----
            function getPieceClass(owner, color) {
                if (owner === 'player') {
                    return color === 'blue' ? 'player-blue' : 'player-red';
                } else {
                    return color === 'blue' ? 'computer-blue' : 'computer-red';
                }
            }

            function getPlayerColor() { return playerColor; }

            function getComputerColor() { return playerColor === 'blue' ? 'red' : 'blue'; }

            // ---- UI ----
            function updateUI() {
                renderBoard();
                playerScoreEl.textContent = playerPieces.length;
                computerScoreEl.textContent = computerPieces.length;
                updateTrophyDisplay();
                updateButtons();
                updateLabels();
            }

            function updateLabels() {
                const pColor = playerColor === 'blue' ? '🔵 藍方' : '🔴 紅方';
                const cColor = playerColor === 'blue' ? '🔴 紅方' : '🔵 藍方';
                playerLabel.innerHTML = `${pColor} <span class="num player-score" id="playerScore">${playerPieces.length}</span>`;
                computerLabel.innerHTML =
                    `${cColor} <span class="num computer-score" id="computerScore">${computerPieces.length}</span>`;
                document.getElementById('playerScore').textContent = playerPieces.length;
                document.getElementById('computerScore').textContent = computerPieces.length;
            }

            function renderBoard() {
                boardEl.innerHTML = '';
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.r = r;
                        cell.dataset.c = c;

                        const isCyan = (r + c) % 2 === 0;
                        cell.classList.add(isCyan ? 'cyan' : 'pinkgreen');

                        const piece = board[r][c];
                        if (piece) {
                            const div = document.createElement('div');
                            const pClass = getPieceClass(piece.owner, piece.color);
                            div.className = `piece ${pClass}`;

                            if (piece.owner === 'player' && piece.exposed) div.classList.add('exposed');

                            const bodySpan = document.createElement('span');
                            bodySpan.className = 'body';
                            bodySpan.textContent = '🧍‍♂️';
                            div.appendChild(bodySpan);

                            const isVisible = (piece.owner === 'player' || piece.revealed);

                            if (isVisible) {
                                if (piece.type === 'trap') div.classList.add('trap');
                                if (piece.type === 'king') div.classList.add('flag');
                                const weaponSpan = document.createElement('span');
                                weaponSpan.className = 'weapon';
                                weaponSpan.textContent = EMOJI[piece.type] || '❓';
                                div.appendChild(weaponSpan);
                            }

                            if (piece.owner === 'player' && piece.exposed) {
                                const eyeSpan = document.createElement('span');
                                eyeSpan.className = 'eye';
                                eyeSpan.textContent = '👁';
                                div.appendChild(eyeSpan);
                            }

                            if (gamePhase === 'SELECT') {
                                if (trapPos && trapPos.r === r && trapPos.c === c) {
                                    div.classList.add('chosen-trap');
                                }
                                if (kingPos && kingPos.r === r && kingPos.c === c) {
                                    div.classList.add('chosen-king');
                                }
                                if (piece.owner === 'player' && !trapPos && !kingPos) {
                                    div.classList.add('selectable');
                                }
                                if (piece.owner === 'player' && trapPos && !kingPos && !(trapPos.r === r && trapPos.c ===
                                        c)) {
                                    div.classList.add('selectable');
                                }
                            }

                            if (selectedPos && selectedPos.r === r && selectedPos.c === c) {
                                div.classList.add('selected');
                            }

                            if (_moveTarget && _moveTarget.r === r && _moveTarget.c === c) {
                                div.style.opacity = '0';
                                div.dataset.moveTarget = '1';
                            }

                            cell.appendChild(div);

                            cell.addEventListener('click', () => onCellClick(r, c));
                        } else {
                            cell.classList.add('empty');
                            cell.addEventListener('click', () => onCellClick(r, c));
                        }

                        if (selectedPos && !gameOver && gameStarted && currentTurn === 'player' && gamePhase === 'PLAYING') {
                            const moves = getValidMoves(selectedPos.r, selectedPos.c);
                            const isTarget = moves.some(m => m.r === r && m.c === c);
                            if (isTarget) cell.classList.add('targetable');
                        }

                        boardEl.appendChild(cell);
                    }
                }
                if (_moveTarget && _moveAnimPending) {
                    playMoveAnimationOnBoard();
                }
            }

            // ---- 點擊 ----
            function onCellClick(r, c) {
                if (gamePhase === 'SELECT') {
                    handleSelectClick(r, c);
                    return;
                }

                if (!gameStarted || gameOver || isProcessing || currentTurn !== 'player' || animating || gamePhase !==
                    'PLAYING') return;
                const piece = board[r][c];

                if (piece && piece.owner === 'player' && piece.type !== 'trap') {
                    if (selectedPos && selectedPos.r === r && selectedPos.c === c) {
                        selectedPos = null;
                        renderBoard();
                        return;
                    }
                    const moves = getValidMoves(r, c);
                    if (moves.length === 0) return;
                    selectedPos = { r, c };
                    renderBoard();
                    return;
                }

                if (selectedPos) {
                    const fromR = selectedPos.r,
                        fromC = selectedPos.c;
                    const fromPiece = board[fromR][fromC];
                    if (!fromPiece || fromPiece.owner !== 'player') {
                        selectedPos = null;
                        renderBoard();
                        return;
                    }
                    const moves = getValidMoves(fromR, fromC);
                    const target = moves.find(m => m.r === r && m.c === c);
                    if (target) {
                        playerMove(fromR, fromC, r, c);
                        selectedPos = null;
                        return;
                    } else {
                        selectedPos = null;
                        renderBoard();
                        return;
                    }
                }
            }

            // ---- 選擇階段 ----
            function handleSelectClick(r, c) {
                const piece = board[r][c];
                if (!piece || piece.owner !== 'player') return;
                if (trapPos && trapPos.r === r && trapPos.c === c) return;
                if (kingPos && kingPos.r === r && kingPos.c === c) return;

                if (selectPhase === 'trap') {
                    trapPos = { r, c };
                    piece.type = 'trap';
                    piece.revealed = true;
                    selectPhase = 'king';
                    renderBoard();
                    updateSelectStatus();
                    playSound('wind');
                    showToast('⚠️ 已選陷阱，請選棋手');
                } else if (selectPhase === 'king') {
                    if (trapPos && trapPos.r === r && trapPos.c === c) return;
                    kingPos = { r, c };
                    piece.type = 'king';
                    piece.revealed = true;
                    selectPhase = 'done';
                    renderBoard();
                    updateSelectStatus();
                    playSound('levelUp');
                    showToast('🚩 已選棋手！準備分配棋子...');
                    assignNormalPieces();
                    renderBoard();
                    updateSelectStatus();
                    showToast('✅ 已分配包剪揼，可重抽或開始遊戲');
                    btnReroll.style.display = 'inline-flex';
                }
            }

            function assignNormalPieces() {
                normalPieces = [];
                const playerCells = [];
                for (let r = 4; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const p = board[r][c];
                        if (p && p.owner === 'player') {
                            const isTrap = trapPos && trapPos.r === r && trapPos.c === c;
                            const isKing = kingPos && kingPos.r === r && kingPos.c === c;
                            if (!isTrap && !isKing) {
                                normalPieces.push(p);
                                playerCells.push({ r, c });
                            }
                        }
                    }
                }

                const types = [];
                for (let i = 0; i < 4; i++) types.push('rock');
                for (let i = 0; i < 4; i++) types.push('scissors');
                for (let i = 0; i < 4; i++) types.push('paper');
                shuffleArray(types);

                for (let i = 0; i < normalPieces.length && i < types.length; i++) {
                    normalPieces[i].type = types[i];
                    normalPieces[i].revealed = true;
                }
                normalPieces = normalPieces.filter(p => p !== undefined);
            }

            function rerollNormalPieces() {
                if (gamePhase === 'SELECT') {
                    const types = [];
                    for (let i = 0; i < 4; i++) types.push('rock');
                    for (let i = 0; i < 4; i++) types.push('scissors');
                    for (let i = 0; i < 4; i++) types.push('paper');
                    shuffleArray(types);

                    normalPieces = [];
                    for (let r = 4; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            const p = board[r][c];
                            if (p && p.owner === 'player') {
                                const isTrap = trapPos && trapPos.r === r && trapPos.c === c;
                                const isKing = kingPos && kingPos.r === r && kingPos.c === c;
                                if (!isTrap && !isKing) {
                                    normalPieces.push(p);
                                }
                            }
                        }
                    }

                    for (let i = 0; i < normalPieces.length && i < types.length; i++) {
                        normalPieces[i].type = types[i];
                        normalPieces[i].revealed = true;
                    }
                    renderBoard();
                    showToast('🎲 已重抽！');
                    playSound('wind');
                } else if (gamePhase === 'PLAYING') {
                    const aliveNormals = [];
                    const positions = [];
                    for (let r = 0; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            const p = board[r][c];
                            if (p && p.owner === 'player') {
                                const isTrap = p.type === 'trap';
                                const isKing = p.type === 'king';
                                if (!isTrap && !isKing) {
                                    aliveNormals.push(p);
                                    positions.push({ r, c });
                                }
                            }
                        }
                    }
                    if (aliveNormals.length === 0) {
                        showToast('❌ 沒有普通棋子可重抽');
                        return;
                    }
                    const types = [];
                    const count = aliveNormals.length;
                    const rockCount = Math.min(4, Math.floor(count / 3) + (count % 3 > 0 ? 1 : 0));
                    const scissorsCount = Math.min(4, Math.floor(count / 3) + (count % 3 > 1 ? 1 : 0));
                    const paperCount = count - rockCount - scissorsCount;
                    for (let i = 0; i < rockCount; i++) types.push('rock');
                    for (let i = 0; i < scissorsCount; i++) types.push('scissors');
                    for (let i = 0; i < paperCount; i++) types.push('paper');
                    shuffleArray(types);
                    for (let i = 0; i < aliveNormals.length && i < types.length; i++) {
                        aliveNormals[i].type = types[i];
                        aliveNormals[i].revealed = true;
                    }
                    renderBoard();
                    showToast(`🎲 已重抽 ${aliveNormals.length} 隻棋子！`);
                    playSound('wind');
                }
            }

            function updateSelectStatus() {
                const status = document.querySelector('.select-status');
                if (status) {
                    if (selectPhase === 'trap') {
                        status.innerHTML = '👆 點選一隻棋子當 <span class="highlight-trap">⚠️ 陷阱</span>';
                    } else if (selectPhase === 'king') {
                        status.innerHTML = '👆 點選一隻棋子當 <span class="highlight-king">🚩 棋手</span>';
                    } else if (selectPhase === 'done') {
                        const trapEmoji = trapPos ? '⚠️' : '❌';
                        const kingEmoji = kingPos ? '🚩' : '❌';
                        status.innerHTML =
                            `✅ 已選 ${trapEmoji} 陷阱 和 ${kingEmoji} 棋手 ｜ 12隻棋子已分配包剪揼`;
                    }
                }
            }

            // ---- 開始遊戲 ----
            function startGameFromSelect() {
                if (selectPhase !== 'done') {
                    showToast('❌ 請先選好陷阱和棋手！');
                    return;
                }
                const playerFirst = playerColor === 'blue';
                currentTurn = playerFirst ? 'player' : 'computer';
                gameStarted = true;
                gamePhase = 'PLAYING';
                gameOver = false;
                isProcessing = false;
                selectedPos = null;

                for (const p of computerPieces) {
                    p.revealed = false;
                }
                for (const p of playerPieces) {
                    p.revealed = true;
                }

                const selectPhaseEl = document.querySelector('.select-phase');
                if (selectPhaseEl) selectPhaseEl.remove();
                btnReroll.style.display = 'none';

                titleOverlay.classList.remove('active');
                gameoverOverlay.classList.remove('active');

                setMusicPhase('PLAYING');

                updateUI();
                updateTurnUI();
                updateButtons();
                updateLabels();

                if (currentTurn === 'computer') {
                    setTimeout(() => computerTurn(), 600);
                }

                showToast('🎮 遊戲開始！');
            }

            // ---- 更新Turn ----
            function updateTurnUI() {
                if (!gameStarted || gamePhase !== 'PLAYING') {
                    if (gamePhase === 'SELECT') {
                        turnDot.className = 'dot selecting';
                        turnText.textContent = '選擇陷阱與棋手';
                        return;
                    }
                    turnDot.className = 'dot idle';
                    turnText.textContent = '等待開始';
                    return;
                }
                if (gameOver) {
                    turnDot.className = 'dot idle';
                    turnText.textContent = '已結束';
                    return;
                }
                if (currentTurn === 'player') {
                    turnDot.className = 'dot';
                    turnText.textContent = '你的回合';
                } else {
                    turnDot.className = 'dot computer';
                    turnText.textContent = '電腦思考中...';
                }
            }

            // ---- 更新按鈕 ----
            function updateButtons() {
                if (gamePhase === 'TITLE') {
                    btnStartReset.textContent = '🎮 開始';
                    btnStartReset.className = 'btn btn-primary';
                    btnReroll.style.display = 'none';
                    return;
                }
                if (gamePhase === 'SELECT') {
                    btnStartReset.textContent = '▶️ 開始遊戲';
                    btnStartReset.className = 'btn btn-gold';
                    btnReroll.style.display = selectPhase === 'done' ? 'inline-flex' : 'none';
                    return;
                }
                if (gamePhase === 'PLAYING') {
                    if (gameOver) {
                        btnStartReset.textContent = '🏠 回到標題';
                        btnStartReset.className = 'btn btn-gold';
                        btnReroll.style.display = 'none';
                    } else {
                        btnStartReset.textContent = '🔄 重開';
                        btnStartReset.className = 'btn btn-primary';
                        btnReroll.style.display = 'none';
                    }
                    btnReroll.style.display = 'none';
                    return;
                }
                if (gamePhase === 'GAMEOVER') {
                    btnStartReset.textContent = '🏠 回到標題';
                    btnStartReset.className = 'btn btn-gold';
                    btnReroll.style.display = 'none';
                    return;
                }
            }

            // ---- 初始化棋盤 ----
            function initBoardForSelect() {
                board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
                allPieces = [];
                playerPieces = [];
                computerPieces = [];
                trapPos = null;
                kingPos = null;
                normalPieces = [];
                selectPhase = 'trap';
                _moveTarget = null;
                _moveAnimPending = false;

                const playerList = [];
                for (let i = 0; i < 14; i++) {
                    playerList.push({
                        type: 'unknown',
                        owner: 'player',
                        color: playerColor,
                        revealed: true,
                        exposed: false,
                        row: -1,
                        col: -1
                    });
                }
                shuffleArray(playerList);

                const computerList = [];
                const compTypes = [];
                for (let i = 0; i < 4; i++) compTypes.push('rock');
                for (let i = 0; i < 4; i++) compTypes.push('scissors');
                for (let i = 0; i < 4; i++) compTypes.push('paper');
                compTypes.push('king');
                compTypes.push('trap');
                shuffleArray(compTypes);
                for (let i = 0; i < 14; i++) {
                    computerList.push({
                        type: compTypes[i] || 'rock',
                        owner: 'computer',
                        color: getComputerColor(),
                        revealed: false,
                        exposed: false,
                        row: -1,
                        col: -1
                    });
                }
                shuffleArray(computerList);

                const playerCells = [];
                for (let r = 4; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) playerCells.push({ r, c });
                }
                shuffleArray(playerCells);
                for (let i = 0; i < playerList.length && i < playerCells.length; i++) {
                    const pos = playerCells[i];
                    const piece = playerList[i];
                    piece.row = pos.r;
                    piece.col = pos.c;
                    board[pos.r][pos.c] = piece;
                    playerPieces.push(piece);
                    allPieces.push(piece);
                }

                const computerCells = [];
                for (let r = 0; r < 2; r++) {
                    for (let c = 0; c < COLS; c++) computerCells.push({ r, c });
                }
                shuffleArray(computerCells);
                for (let i = 0; i < computerList.length && i < computerCells.length; i++) {
                    const pos = computerCells[i];
                    const piece = computerList[i];
                    piece.row = pos.r;
                    piece.col = pos.c;
                    board[pos.r][pos.c] = piece;
                    computerPieces.push(piece);
                    allPieces.push(piece);
                }

                selectedPos = null;
                gameOver = false;
                isProcessing = false;
                animating = false;
                gameStarted = false;
                gamePhase = 'SELECT';
                gameoverOverlay.classList.remove('active');
                rematchOverlay.classList.remove('active');

                setMusicPhase('SELECT');

                addSelectPhaseUI();

                renderBoard();
                updateSelectStatus();
                updateTurnUI();
                updateButtons();
                updateLabels();
            }

            // ---- 添加選擇UI ----
            function addSelectPhaseUI() {
                const old = document.querySelector('.select-phase');
                if (old) old.remove();

                const div = document.createElement('div');
                div.className = 'select-phase';
                div.innerHTML = `
                    <div class="select-status">👆 點選一隻棋子當 <span class="highlight-trap">⚠️ 陷阱</span></div>
                    <div class="select-hint">先選陷阱（⚠️），再選棋手（🚩）</div>
                    <div class="select-buttons">
                        <button class="btn btn-primary" id="selectStartBtn">▶️ 開始遊戲</button>
                        <button class="btn btn-gold" id="selectRerollBtn" style="display:none;">🎲 重抽</button>
                    </div>
                `;
                const boardWrapper = document.querySelector('.board-wrapper');
                boardWrapper.parentNode.insertBefore(div, boardWrapper.nextSibling);

                document.getElementById('selectStartBtn').addEventListener('click', startGameFromSelect);
                document.getElementById('selectRerollBtn').addEventListener('click', () => {
                    rerollNormalPieces();
                });

                const observer = new MutationObserver(() => {
                    const rerollBtn = document.getElementById('selectRerollBtn');
                    if (rerollBtn) {
                        rerollBtn.style.display = selectPhase === 'done' ? 'inline-flex' : 'none';
                    }
                    const startBtn = document.getElementById('selectStartBtn');
                    if (startBtn) {
                        startBtn.disabled = selectPhase !== 'done';
                        startBtn.style.opacity = selectPhase === 'done' ? '1' : '0.5';
                    }
                });
                observer.observe(document.querySelector('.select-phase'), { childList: true, subtree: true });

                window._selectObserver = observer;
            }

            // ---- 回到標題 ----
            function goToTitle() {
                gameoverOverlay.classList.remove('active');
                rematchOverlay.classList.remove('active');
                titleOverlay.classList.add('active');
                gamePhase = 'TITLE';
                gameStarted = false;
                gameOver = false;
                board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
                playerPieces = [];
                computerPieces = [];
                allPieces = [];
                selectedPos = null;
                isProcessing = false;
                currentTurn = 'player';
                animating = false;
                trapPos = null;
                kingPos = null;
                normalPieces = [];
                selectPhase = 'trap';
                _moveTarget = null;
                _moveAnimPending = false;
                setMusicPhase('TITLE');
                updateUI();
                updateTurnUI();
                updateButtons();
                btnStartReset.textContent = '🎮 開始';
                btnStartReset.className = 'btn btn-primary';
                btnReroll.style.display = 'none';
                updateTrophyDisplay();
                const selectPhaseEl = document.querySelector('.select-phase');
                if (selectPhaseEl) selectPhaseEl.remove();
                if (window._selectObserver) {
                    window._selectObserver.disconnect();
                    window._selectObserver = null;
                }
                updateLabels();
                stopBgScroll();
                setTimeout(startBgScroll, 100);
            }

            // ---- 開始遊戲（從標題） ----
            function startGame() {
                initAudio();
                titleOverlay.classList.remove('active');
                gamePhase = 'SELECT';
                initBoardForSelect();
                if (isMusicOn) startBackgroundMusic();
                else stopBackgroundMusic();
                updateUI();
                updateTurnUI();
                updateButtons();
                updateLabels();
                showToast('👆 請選擇陷阱和棋手');
            }

            function resetGame() {
                if (!gameStarted && gamePhase !== 'PLAYING') return;
                if (confirm('確定要重開遊戲嗎？進度將會遺失。')) {
                    stopBackgroundMusic();
                    goToTitle();
                    setTimeout(() => {
                        titleOverlay.classList.remove('active');
                        gamePhase = 'SELECT';
                        initBoardForSelect();
                        if (isMusicOn) startBackgroundMusic();
                        updateUI();
                        updateTurnUI();
                        updateButtons();
                        updateLabels();
                        showToast('🔄 已重開，請選擇陷阱和棋手');
                    }, 100);
                }
            }

            // ---- 初始化標題 ----
            function initTitle() {
                gamePhase = 'TITLE';
                gameStarted = false;
                board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
                playerPieces = [];
                computerPieces = [];
                allPieces = [];
                selectedPos = null;
                gameOver = false;
                isProcessing = false;
                currentTurn = 'player';
                animating = false;
                trapPos = null;
                kingPos = null;
                normalPieces = [];
                selectPhase = 'trap';
                _moveTarget = null;
                _moveAnimPending = false;
                btnStartReset.textContent = '🎮 開始';
                btnStartReset.className = 'btn btn-primary';
                btnReroll.style.display = 'none';
                updateUI();
                updateTurnUI();
                updateButtons();
                titleOverlay.classList.add('active');
                setMusicPhase('TITLE');
                if (isMusicOn) startBackgroundMusic();
                else stopBackgroundMusic();
                updateMusicUI();
                updateTrophyDisplay();
                updateLabels();
                playerColor = 'blue';
                previewBlue.classList.add('selected');
                previewRed.classList.remove('selected');
                setTimeout(startBgScroll, 300);
            }

            // ---- 事件綁定 ----
            btnStartReset.addEventListener('click', () => {
                if (gamePhase === 'TITLE') {
                    titleOverlay.classList.add('active');
                } else if (gamePhase === 'SELECT') {
                    startGameFromSelect();
                } else if (gamePhase === 'PLAYING' && gameOver) {
                    goToTitle();
                } else if (gamePhase === 'PLAYING') {
                    resetGame();
                } else if (gamePhase === 'GAMEOVER') {
                    goToTitle();
                } else {
                    goToTitle();
                }
            });

            btnReroll.addEventListener('click', () => {
                rerollNormalPieces();
            });

            btnTitleStart.addEventListener('click', () => {
                if (playerColor) {
                    startGame();
                } else {
                    showToast('請先選擇紅方或藍方');
                }
            });

            btnTitleSave.addEventListener('click', saveSettings);
            btnTitleLoad.addEventListener('click', () => {
                loadSettings();
                if (gameStarted || gamePhase === 'SELECT' || gamePhase === 'PLAYING') {
                    if (isMusicOn) startBackgroundMusic();
                    else stopBackgroundMusic();
                }
                updateUI();
                updateButtons();
                updateTrophyDisplay();
            });

            btnMusicToggle.addEventListener('click', () => {
                isMusicOn = !isMusicOn;
                updateMusicUI();
                if (gameStarted || gamePhase === 'SELECT' || gamePhase === 'PLAYING' || gamePhase === 'TITLE') {
                    if (isMusicOn) {
                        startBackgroundMusic();
                        if (gamePhase === 'PLAYING') setMusicPhase('PLAYING');
                        else setMusicPhase('TITLE');
                    } else {
                        stopBackgroundMusic();
                    }
                }
            });

            gameoverConfirm.addEventListener('click', goToTitle);

            previewBlue.addEventListener('click', () => {
                playerColor = 'blue';
                previewBlue.classList.add('selected');
                previewRed.classList.remove('selected');
                showToast('🔵 已選藍方，先走');
            });
            previewRed.addEventListener('click', () => {
                playerColor = 'red';
                previewRed.classList.add('selected');
                previewBlue.classList.remove('selected');
                showToast('🔴 已選紅方，後走');
            });

            fullscreenBtn.addEventListener('click', toggleFullscreen);
            updateFullscreenIcon();

            // ---- 版權 ----
            function setCopyright() {
                const year = new Date().getFullYear();
                copyrightEl.textContent = `v2.3.1 © ${year} ☕迪遜咖啡廳，版權所有。`;
            }

            // ---- 洗牌 ----
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // ---- 初始化 ----
            loadTrophy();
            setCopyright();
            updateMusicUI();
            initTitle();

            document.addEventListener('click', () => {
                if (!audioCtx) { try { initAudio(); } catch (e) {} }
                if (isMusicOn && (gameStarted || gamePhase === 'SELECT' || gamePhase === 'PLAYING' || gamePhase ===
                        'TITLE') && bgAudio.paused) startBackgroundMusic();
            }, { once: false });

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && isMusicOn && (gameStarted || gamePhase === 'SELECT' || gamePhase ===
                        'PLAYING' || gamePhase === 'TITLE') && bgAudio.paused) startBackgroundMusic();
            });

            console.log('🌼 ICQ 包剪揼 · 紅藍對決版 (v2.3.1) 已載入');
            console.log(`🏆 當前獎盃: ${trophyCount}`);
            console.log(`🎨 當前選色: ${playerColor}`);
            console.log(`🎵 音樂階段: ${currentMusicPhase}`);

            window.__game = {
                addTrophy,
                trophyCount: () => trophyCount,
                isMusicOn: () => isMusicOn,
                toggleMusic: () => { isMusicOn = !isMusicOn;
                    updateMusicUI(); },
                saveSettings,
                loadSettings,
                goToTitle,
                startGame,
                resetGame,
                toggleFullscreen,
                reroll: rerollNormalPieces,
                getState: () => ({ phase: gamePhase, color: playerColor, musicPhase: currentMusicPhase })
            };

        })();
    </script>
</body>
</html>
