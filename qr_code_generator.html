<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📎二維碼生成器</title>
    <style>
        /* ----- CSS Variables for Theming ----- */
        :root {
            --bg-body: #f0f5fa;
            --bg-card: rgba(255, 255, 255, 0.85);
            --border-card: rgba(255, 255, 255, 0.5);
            --text-primary: #0b2b3b;
            --text-secondary: #2c4e5e;
            --text-muted: #5e7e8e;
            --bg-input: #ffffff;
            --border-input: rgba(150, 190, 210, 0.3);
            --bg-grid: rgba(255, 255, 255, 0.3);
            --border-grid: rgba(255, 255, 255, 0.5);
            --bg-item: #ffffff;
            --shadow-item: 0 6px 18px rgba(0, 20, 30, 0.06);
            --border-item: rgba(200, 220, 235, 0.3);
            --badge-bg: #d9eaf3;
            --badge-text: #13566b;
            --badge-border: #b5d4e3;
            --status-bg: #e7f0f6;
            --status-text: #1f5b72;
            --btn-bg: rgba(0, 0, 0, 0.02);
            --btn-border: #b6cedc;
            --btn-text: #1c586e;
            --btn-hover-bg: #cde0eb;
            --btn-hover-border: #3f7f97;
            --counter-bg: #1d647e;
            --counter-text: white;
            --qr-container-bg: #ffffff;
            --copyright-border: rgba(180, 205, 220, 0.3);
            --copyright-text: #5e7e8e;
            --version-text: #3f6f82;
            --error-bg: #fef6f6;
            --error-border: #f5c2c2;
            --error-text: #a94442;
            --success-bg: #e0f5ea;
            --success-border: #8ed4b0;
            --success-text: #1a7a4a;
            --placeholder-color: #8baec2;
            --sub-border: #3f8da7;
            --label-bg: #e1eff7;
            --label-text: #1b5770;
        }

        [data-theme="dark"] {
            --bg-body: #1a2630;
            --bg-card: rgba(30, 45, 58, 0.92);
            --border-card: rgba(80, 120, 150, 0.3);
            --text-primary: #e6edf2;
            --text-secondary: #b0c8d6;
            --text-muted: #7a9aaa;
            --bg-input: #22323f;
            --border-input: rgba(80, 120, 150, 0.3);
            --bg-grid: rgba(30, 50, 65, 0.5);
            --border-grid: rgba(80, 120, 150, 0.2);
            --bg-item: #1e3342;
            --shadow-item: 0 6px 18px rgba(0, 0, 0, 0.3);
            --border-item: rgba(80, 120, 150, 0.2);
            --badge-bg: #2a4050;
            --badge-text: #b0d0e0;
            --badge-border: #3a5a6e;
            --status-bg: #2a3f50;
            --status-text: #b0c8d6;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-border: #3a5a6e;
            --btn-text: #b0c8d6;
            --btn-hover-bg: #2a4a5e;
            --btn-hover-border: #5a8aaa;
            --counter-bg: #2a5a7a;
            --counter-text: #e6edf2;
            --qr-container-bg: #1a2e3e;
            --copyright-border: rgba(80, 120, 150, 0.2);
            --copyright-text: #7a9aaa;
            --version-text: #8ab0c8;
            --error-bg: #3a1e1e;
            --error-border: #6a3a3a;
            --error-text: #e6a0a0;
            --success-bg: #1a3a2a;
            --success-border: #3a7a5a;
            --success-text: #80d0a0;
            --placeholder-color: #5a7a8a;
            --sub-border: #5a8aaa;
            --label-bg: #2a4a5e;
            --label-text: #b0d0e0;
        }

        /* ----- General Styles ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 1rem;
            transition: background 0.3s ease;
        }
        .card {
            max-width: 850px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 30, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-card);
            transition: background 0.3s ease, border 0.3s ease;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem 1rem;
            margin-bottom: 0.3rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.3s ease;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            font-size: 1.6rem;
            cursor: pointer;
            border-radius: 50%;
            padding: 0.2rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, border 0.3s ease;
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            background: var(--btn-hover-bg);
        }
        .lang-selector {
            background: var(--bg-input);
            border-radius: 40px;
            padding: 0.2rem 0.2rem 0.2rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            border: 1px solid var(--border-input);
            font-size: 0.9rem;
            transition: background 0.3s ease, border 0.3s ease;
        }
        .lang-selector select {
            background: transparent;
            border: none;
            padding: 0.4rem 0.8rem 0.4rem 0.2rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            min-width: 100px;
        }
        .lang-selector select option {
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .lang-selector .globe-icon {
            font-size: 1.2rem;
            opacity: 0.7;
        }

        .sub {
            font-size: 0.95rem;
            color: var(--text-secondary);
            opacity: 0.8;
            margin-bottom: 1.8rem;
            border-left: 3px solid var(--sub-border);
            padding-left: 1rem;
            font-weight: 400;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .input-area {
            background: var(--bg-input);
            border-radius: 30px;
            padding: 0.3rem 0.3rem 0.3rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 8px 20px -8px rgba(0, 40, 60, 0.12);
            border: 1px solid var(--border-input);
            transition: background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
        }
        .input-area:focus-within {
            box-shadow: 0 8px 24px -6px #1f6e8c40;
            border-color: #2a7f9e;
        }
        .input-area input {
            flex: 1;
            min-width: 180px;
            border: none;
            padding: 1rem 0.2rem;
            font-size: 1rem;
            background: transparent;
            outline: none;
            color: var(--text-primary);
            font-weight: 450;
            transition: color 0.3s ease;
        }
        .input-area input::placeholder {
            color: var(--placeholder-color);
            font-weight: 350;
        }

        .word-limit-badge {
            background: var(--badge-bg);
            border-radius: 60px;
            padding: 0.35rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--badge-text);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid var(--badge-border);
            transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
        }
        .word-limit-badge span {
            font-weight: 700;
            color: var(--badge-text);
        }

        .qr-grid {
            margin-top: 2.2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.8rem 2.5rem;
            background: var(--bg-grid);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 2rem 1.5rem;
            border-radius: 40px;
            border: 1px solid var(--border-grid);
            min-height: 100px;
            transition: background 0.3s ease, border 0.3s ease;
        }

        .qr-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-item);
            padding: 1.2rem 1.2rem 0.8rem;
            border-radius: 28px;
            box-shadow: var(--shadow-item);
            border: 1px solid var(--border-item);
            transition: background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
            max-width: 380px;
        }
        .qr-item:hover {
            transform: translateY(-3px);
        }

        .qr-item .label {
            margin-top: 0.6rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--label-text);
            background: var(--label-bg);
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            opacity: 0.9;
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .qr-item .qr-status {
            margin-top: 0.4rem;
            font-size: 0.65rem;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 500;
            transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
        }
        .qr-item .qr-status.success {
            color: var(--success-text);
            background: var(--success-bg);
            border: 1px solid var(--success-border);
        }
        .qr-item .qr-status.error {
            color: var(--error-text);
            background: var(--error-bg);
            border: 1px solid var(--error-border);
        }

        .qr-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            padding: 1.2rem 0.8rem;
            width: 100%;
            gap: 0.3rem;
            transition: color 0.3s ease;
        }
        .qr-placeholder small {
            opacity: 0.6;
            font-size: 0.8rem;
        }

        .footer {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .limit-indicator {
            background: var(--status-bg);
            border-radius: 60px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            color: var(--status-text);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .reset-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 60px;
            padding: 0.4rem 1.3rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--btn-text);
            cursor: pointer;
            transition: all 0.15s;
            backdrop-filter: blur(4px);
        }
        .reset-btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
            color: var(--text-primary);
        }
        .counter-badge {
            background: var(--counter-bg);
            color: var(--counter-text);
            border-radius: 60px;
            padding: 0.1rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--qr-container-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            padding: 8px;
            transition: background 0.3s ease;
        }
        .qr-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .qr-container.error-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--error-bg);
            border-radius: 12px;
            border: 1px solid var(--error-border);
            padding: 0.5rem;
            text-align: center;
            transition: background 0.3s ease, border 0.3s ease;
        }
        .qr-container.error-placeholder .icon {
            font-size: 1.8rem;
        }
        .qr-container.error-placeholder .msg {
            font-size: 0.7rem;
            color: var(--error-text);
            margin-top: 0.2rem;
            transition: color 0.3s ease;
        }

        .copyright {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: var(--copyright-text);
            border-top: 1px solid var(--copyright-border);
            padding-top: 1rem;
            letter-spacing: 0.3px;
            transition: color 0.3s ease, border-color 0.3s ease;
        }
        .copyright .version {
            font-weight: 500;
            color: var(--version-text);
            transition: color 0.3s ease;
        }

        @media (max-width: 600px) {
            .card {
                padding: 1.5rem;
            }
            .input-area {
                padding-left: 1rem;
            }
            .qr-grid {
                gap: 1.2rem;
                padding: 1.5rem 0.8rem;
            }
            .header-row {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: flex-end;
            }
            .qr-item {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-row">
            <h1 id="mainTitle">📎 二維碼生成器</h1>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="切換深色/淺色模式">🌙</button>
                <div class="lang-selector">
                    <span class="globe-icon">🌐</span>
                    <select id="languageSwitcher">
                        <option value="zh-Hant" selected>繁體中文</option>
                        <option value="zh-Hans">简体中文</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="sub" id="subTitle">即時生成 · 自動分割 · 穩定可靠</div>
        <div class="input-area">
            <input type="text" id="textInput" placeholder="請輸入文字…" autofocus>
            <span class="word-limit-badge">📄 <span id="byteCountDisplay">0</span> / <span id="limitNumber">250</span> <span id="byteUnit">位元組</span></span>
        </div>
        <div id="qrGridContainer" class="qr-grid">
            <div class="qr-placeholder" id="placeholderMsg">
                <span style="font-size: 2rem; opacity: 0.3;">⊞</span>
                <span id="placeholderMain">您的 QR Code 將顯示於此</span>
                <small id="placeholderSub">輸入文字即時更新</small>
            </div>
        </div>
        <div class="footer">
            <div class="limit-indicator" id="statusMessage">⚡ 輸入中 …</div>
            <div style="display: flex; gap: 0.6rem; align-items: center;">
                <span class="counter-badge" id="qrCounter">0</span>
                <button class="reset-btn" id="clearBtn">⟲ 清空</button>
            </div>
        </div>

        <!-- 版權資訊（動態年份 + 多語言） -->
        <div class="copyright">
            <span class="version">v1.0</span> &nbsp;<span id="copyrightText"></span>
        </div>
    </div>

    <script>
        (function() {
            // ---- 設定 ----
            const BYTE_LIMIT = 250;
            const QR_SIZE = 300;
            const CURRENT_YEAR = new Date().getFullYear(); // 自動取得當前年份

            // ---- 多語言（含版權，使用 {year} 佔位符） ----
            const LANG = {
                'zh-Hant': {
                    title: '📎 二維碼生成器',
                    sub: '即時生成 · 自動分割 · 穩定可靠',
                    placeholder: '請輸入文字…',
                    byteUnit: '位元組',
                    placeholderMain: '您的 QR Code 將顯示於此',
                    placeholderSub: '輸入文字即時更新',
                    statusEmpty: '✎ 等待輸入文字 …',
                    statusSingle: (bytes) => `✓ ${bytes} 位元組 · 1 個 QR Code`,
                    statusMulti: (bytes, count) => `✓ ${bytes} 位元組 · ${count} 個 QR Code (自動分割)`,
                    statusWaiting: '✎ 開始輸入 …',
                    clearBtn: '⟲ 清空',
                    partLabel: (index, preview) => `第 ${index} 部分  ·  ${preview}`,
                    qrError: '⚠️ 無法生成',
                    qrSuccess: '✓ 可掃描',
                    copyright: `© {year} ☕迪遜咖啡廳，版權所有。`
                },
                'zh-Hans': {
                    title: '📎 二维码生成器',
                    sub: '实时生成 · 自动分割 · 稳定可靠',
                    placeholder: '请输入文字…',
                    byteUnit: '字节',
                    placeholderMain: '您的 QR Code 将显示于此',
                    placeholderSub: '输入文字实时更新',
                    statusEmpty: '✎ 等待输入文字 …',
                    statusSingle: (bytes) => `✓ ${bytes} 字节 · 1 个 QR Code`,
                    statusMulti: (bytes, count) => `✓ ${bytes} 字节 · ${count} 个 QR Code (自动分割)`,
                    statusWaiting: '✎ 开始输入 …',
                    clearBtn: '⟲ 清空',
                    partLabel: (index, preview) => `第 ${index} 部分  ·  ${preview}`,
                    qrError: '⚠️ 无法生成',
                    qrSuccess: '✓ 可扫描',
                    copyright: `© {year} ☕迪逊咖啡厅，版权所有。`
                },
                'en': {
                    title: '📎 QR Code Generator',
                    sub: 'Real‑time · auto‑split · stable & reliable',
                    placeholder: 'Type your text…',
                    byteUnit: 'bytes',
                    placeholderMain: 'Your QR Code(s) appear here',
                    placeholderSub: 'text updates in real time',
                    statusEmpty: '✎ waiting for text …',
                    statusSingle: (bytes) => `✓ ${bytes} byte${bytes > 1 ? 's' : ''} · 1 QR code`,
                    statusMulti: (bytes, count) => `✓ ${bytes} bytes · ${count} QR codes (auto‑split)`,
                    statusWaiting: '✎ start typing …',
                    clearBtn: '⟲ clear',
                    partLabel: (index, preview) => `part ${index}  ·  ${preview}`,
                    qrError: '⚠️ failed',
                    qrSuccess: '✓ scannable',
                    copyright: `© {year} ☕Diczon's Cafe, All Rights Reserved.`
                },
                'ja': {
                    title: '📎 QRコードジェネレーター',
                    sub: 'リアルタイム生成 · 自動分割 · 安定稼働',
                    placeholder: 'テキストを入力…',
                    byteUnit: 'バイト',
                    placeholderMain: 'QRコードがここに表示されます',
                    placeholderSub: '入力するとリアルタイム更新',
                    statusEmpty: '✎ テキストを待っています …',
                    statusSingle: (bytes) => `✓ ${bytes} バイト · 1 つの QRコード`,
                    statusMulti: (bytes, count) => `✓ ${bytes} バイト · ${count} つの QRコード (自動分割)`,
                    statusWaiting: '✎ 入力を開始 …',
                    clearBtn: '⟲ クリア',
                    partLabel: (index, preview) => `パート ${index}  ·  ${preview}`,
                    qrError: '⚠️ 生成失敗',
                    qrSuccess: '✓ スキャン可能',
                    copyright: `© {year} ☕ディクソンカフェ，無断転載を禁じます。`
                },
                'ko': {
                    title: '📎 QR 코드 생성기',
                    sub: '실시간 생성 · 자동 분할 · 안정적',
                    placeholder: '텍스트를 입력하세요…',
                    byteUnit: '바이트',
                    placeholderMain: 'QR 코드가 여기에 표시됩니다',
                    placeholderSub: '입력하면 실시간 업데이트',
                    statusEmpty: '✎ 텍스트 입력 대기 중 …',
                    statusSingle: (bytes) => `✓ ${bytes} 바이트 · 1 개의 QR 코드`,
                    statusMulti: (bytes, count) => `✓ ${bytes} 바이트 · ${count} 개의 QR 코드 (자동 분할)`,
                    statusWaiting: '✎ 입력 시작 …',
                    clearBtn: '⟲ 지우기',
                    partLabel: (index, preview) => `파트 ${index}  ·  ${preview}`,
                    qrError: '⚠️ 생성 실패',
                    qrSuccess: '✓ 스캔 가능',
                    copyright: `© {year} ☕딕슨 카페，판권 소유.`
                }
            };

            // ---- DOM 元素 ----
            const mainTitle = document.getElementById('mainTitle');
            const textInput = document.getElementById('textInput');
            const qrGrid = document.getElementById('qrGridContainer');
            const byteCountDisplay = document.getElementById('byteCountDisplay');
            const limitNumberSpan = document.getElementById('limitNumber');
            const statusMessage = document.getElementById('statusMessage');
            const qrCounterSpan = document.getElementById('qrCounter');
            const clearBtn = document.getElementById('clearBtn');
            const subTitle = document.getElementById('subTitle');
            const byteUnitSpan = document.getElementById('byteUnit');
            const placeholderMain = document.getElementById('placeholderMain');
            const placeholderSub = document.getElementById('placeholderSub');
            const langSelect = document.getElementById('languageSwitcher');
            const copyrightText = document.getElementById('copyrightText');
            const themeToggle = document.getElementById('themeToggle');

            // ---- 深色模式 ----
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
                // 強制重繪
                document.body.style.display = 'none';
                requestAnimationFrame(() => {
                    document.body.style.display = '';
                });
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme') || 'light';
                setTheme(current === 'light' ? 'dark' : 'light');
            }

            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
            themeToggle.addEventListener('click', toggleTheme);

            // ---- 工具函數 ----
            const encoder = new TextEncoder();

            function getByteLength(text) {
                return encoder.encode(text).length;
            }

            let currentLang = 'zh-Hant';

            function getDict() {
                return LANG[currentLang] || LANG['zh-Hant'];
            }

            // ---- 更新版權（動態年份 + 多語言） ----
            function updateCopyright() {
                const dict = getDict();
                // 用當前年份替換 {year}
                const copyrightWithYear = dict.copyright.replace(/\{year\}/g, CURRENT_YEAR);
                copyrightText.textContent = copyrightWithYear;
            }

            // ---- 更新所有 UI 文字 ----
            function updateUIText() {
                const dict = getDict();
                mainTitle.textContent = dict.title;
                subTitle.textContent = dict.sub;
                textInput.placeholder = dict.placeholder;
                byteUnitSpan.textContent = dict.byteUnit;
                placeholderMain.textContent = dict.placeholderMain;
                placeholderSub.textContent = dict.placeholderSub;
                clearBtn.textContent = dict.clearBtn;
                limitNumberSpan.textContent = BYTE_LIMIT;
                updateCopyright(); // 更新版權（含動態年份）
                updateQRCodes();
            }

            // ---- 按位元組分割 ----
            function splitTextIntoChunks(text, limit) {
                if (!text || text.trim() === '') return [];
                const chunks = [];
                let current = '';
                let currentBytes = 0;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const charBytes = getByteLength(char);
                    if (currentBytes + charBytes > limit) {
                        if (current) chunks.push(current);
                        current = char;
                        currentBytes = charBytes;
                    } else {
                        current += char;
                        currentBytes += charBytes;
                    }
                }
                if (current) chunks.push(current);
                return chunks;
            }

            function countBytes(text) {
                return getByteLength(text);
            }

            // ---- 使用 API 生成 QR Code ----
            function generateQRCode(container, text, size) {
                return new Promise((resolve, reject) => {
                    try {
                        if (!text || text.length === 0) {
                            reject(new Error('內容為空'));
                            return;
                        }

                        container.innerHTML = '';
                        container.style.width = size + 'px';
                        container.style.height = size + 'px';
                        container.style.display = 'flex';
                        container.style.alignItems = 'center';
                        container.style.justifyContent = 'center';
                        container.style.overflow = 'hidden';
                        container.style.padding = '8px';
                        container.style.background = 'var(--qr-container-bg)';
                        container.style.borderRadius = '12px';

                        const apiUrl =
                            `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(text)}`;

                        const img = document.createElement('img');
                        img.src = apiUrl;
                        img.alt = 'QR Code';
                        img.style.maxWidth = '100%';
                        img.style.height = 'auto';
                        img.style.display = 'block';

                        img.onload = function() {
                            resolve(true);
                        };
                        img.onerror = function() {
                            reject(new Error('圖片載入失敗'));
                        };

                        container.appendChild(img);
                    } catch (e) {
                        reject(e);
                    }
                });
            }

            // ---- 遞迴處理區塊 ----
            async function processChunk(text, indexCounter, dict) {
                const qrItem = document.createElement('div');
                qrItem.className = 'qr-item';

                const qrContainer = document.createElement('div');
                qrContainer.className = 'qr-container';
                qrContainer.style.width = QR_SIZE + 'px';
                qrContainer.style.height = QR_SIZE + 'px';

                const label = document.createElement('div');
                label.className = 'label';
                const preview = text.length > 30 ? text.slice(0, 27) + '…' : text;
                label.textContent = dict.partLabel(indexCounter, preview);

                qrItem.appendChild(qrContainer);
                qrItem.appendChild(label);

                let success = false;
                try {
                    await generateQRCode(qrContainer, text, QR_SIZE);
                    success = true;
                } catch (err) {
                    console.warn('API 生成失敗 (長度 ' + text.length + '):', err.message);
                }

                if (!success && text.length > 3) {
                    const mid = Math.floor(text.length / 2);
                    const left = text.slice(0, mid);
                    const right = text.slice(mid);
                    const resultLeft = await processChunk(left, indexCounter, dict);
                    const resultRight = await processChunk(right, resultLeft.index, dict);
                    return resultRight;
                } else {
                    if (success) {
                        const statusBadge = document.createElement('div');
                        statusBadge.className = 'qr-status success';
                        statusBadge.textContent = dict.qrSuccess;
                        qrItem.appendChild(statusBadge);
                    } else {
                        qrContainer.className = 'qr-container error-placeholder';
                        qrContainer.style.width = QR_SIZE + 'px';
                        qrContainer.style.height = QR_SIZE + 'px';
                        qrContainer.innerHTML = `
                                <span class="icon">⚠️</span>
                                <span class="msg">${dict.qrError}</span>
                            `;
                        const statusBadge = document.createElement('div');
                        statusBadge.className = 'qr-status error';
                        statusBadge.textContent = dict.qrError;
                        qrItem.appendChild(statusBadge);
                    }
                    qrGrid.appendChild(qrItem);
                    return { index: indexCounter + 1 };
                }
            }

            // ---- 主渲染 ----
            async function renderQRCodes(chunks) {
                qrGrid.innerHTML = '';
                const dict = getDict();

                if (!chunks || chunks.length === 0) {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'qr-placeholder';
                    placeholder.id = 'placeholderMsg';
                    placeholder.innerHTML = `
                            <span style="font-size: 2rem; opacity: 0.3;">⊞</span>
                            <span id="placeholderMain">${dict.placeholderMain}</span>
                            <small id="placeholderSub">${dict.placeholderSub}</small>
                        `;
                    qrGrid.appendChild(placeholder);
                    qrCounterSpan.textContent = '0';
                    return;
                }

                let idx = 1;
                for (let chunk of chunks) {
                    const result = await processChunk(chunk, idx, dict);
                    idx = result.index;
                }

                const items = qrGrid.querySelectorAll('.qr-item');
                qrCounterSpan.textContent = items.length;
            }

            // ---- 核心更新 ----
            async function updateQRCodes() {
                const rawText = textInput.value;
                const byteCount = countBytes(rawText);
                byteCountDisplay.textContent = byteCount;

                const chunks = splitTextIntoChunks(rawText, BYTE_LIMIT);
                await renderQRCodes(chunks);

                const dict = getDict();
                const chunkCount = chunks.length;
                let status = '';
                if (rawText.trim() === '') {
                    status = dict.statusEmpty;
                } else if (chunkCount === 1) {
                    status = dict.statusSingle(byteCount);
                } else {
                    status = dict.statusMulti(byteCount, chunkCount);
                }
                statusMessage.textContent = status;
            }

            // ---- 清空 ----
            function clearAll() {
                textInput.value = '';
                updateQRCodes();
                textInput.focus();
            }

            // ---- 語言切換 ----
            function setLanguage(langCode) {
                if (LANG[langCode]) {
                    currentLang = langCode;
                    langSelect.value = langCode;
                    updateUIText();
                }
            }

            // ---- 事件綁定 ----
            let debounceTimer = null;
            textInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    updateQRCodes();
                }, 300);
            });

            clearBtn.addEventListener('click', clearAll);

            textInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(debounceTimer);
                    updateQRCodes();
                }
            });

            textInput.addEventListener('focus', function() {
                this.select();
            });

            langSelect.addEventListener('change', function(e) {
                setLanguage(e.target.value);
            });

            // ---- 初始化 ----
            limitNumberSpan.textContent = BYTE_LIMIT;
            byteCountDisplay.textContent = '0';
            qrCounterSpan.textContent = '0';
            setLanguage('zh-Hant');

            // 確保初始化後版權正確顯示
            setTimeout(() => {
                if (textInput.value.trim() === '') {
                    renderQRCodes([]);
                    const dict = getDict();
                    statusMessage.textContent = dict.statusWaiting;
                    byteCountDisplay.textContent = '0';
                    qrCounterSpan.textContent = '0';
                }
                // 再次確保版權已更新（防止 race condition）
                updateCopyright();
            }, 10);

            window.__qrDebug = { updateQRCodes, splitTextIntoChunks, countBytes, BYTE_LIMIT, setLanguage };
        })();
    </script>
</body>
</html>
